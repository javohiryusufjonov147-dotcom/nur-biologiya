<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1b21">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nur biologiya">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Nur biologiya</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#0d1b21; --surface:#15272e; --surface2:#1c333b; --line:#27434d;
  --text:#eef3ef; --muted:#93aab0; --accent:#5cc2a4; --accent-ink:#06231b;
  --gold:#f0bd52; --danger:#ef7b6c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:17px;line-height:1.45}
body{min-height:100vh;padding-top:env(safe-area-inset-top,0px)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
h1{font-size:28px}h2{font-size:22px}h3{font-size:18px}
p{margin:0}
.muted{color:var(--muted)}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 120px}
.hidden{display:none!important}

/* tugmalar */
.btn{display:block;width:100%;min-height:54px;padding:14px 18px;border:0;border-radius:14px;
  background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px;cursor:pointer}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.55}
.btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line)}
.btn.small{min-height:42px;padding:8px 14px;font-size:15px;width:auto;display:inline-block}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* maydonlar */
label{display:block;margin:16px 0 6px;color:var(--muted);font-size:15px}
input,select,textarea{width:100%;min-height:54px;padding:12px 14px;border-radius:14px;
  background:var(--surface);border:1.5px solid var(--line);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:100px;resize:vertical}

/* kirish */
.auth{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:28px 20px}
.auth .box{max-width:460px;width:100%;margin:0 auto}
.logo{width:64px;height:64px;border-radius:20px;background:var(--surface2);display:grid;place-items:center;
  margin-bottom:18px;border:1.5px solid var(--line)}
.tabs2{display:flex;gap:8px;margin:22px 0 4px;background:var(--surface);padding:5px;border-radius:14px}
.tabs2 button{flex:1;min-height:46px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-weight:600}
.tabs2 button.on{background:var(--surface2);color:var(--text)}
.err{color:var(--danger);margin-top:14px;min-height:22px;font-size:15px}
.hint{font-size:14px;color:var(--muted);margin-top:6px}

/* kartalar */
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:18px;margin-top:14px}
.card.flat{border-color:transparent}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stat{flex:1}
.stat b{display:block;font-size:34px;line-height:1.1}
.stat.pts b{color:var(--gold)}
.stat span{color:var(--muted);font-size:14px}
.stats{display:flex;gap:12px;margin-top:16px}
.stats .card{margin-top:0;flex:1}
.empty{padding:26px 18px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:18px;margin-top:14px}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:13px;background:var(--surface2);color:var(--muted)}
.badge.g{background:rgba(92,194,164,.15);color:var(--accent)}
.news-item{padding:14px 0;border-top:1px solid var(--line)}
.news-item:first-child{border-top:0;padding-top:0}
.news-item small{color:var(--muted)}

/* roʻyxat */
.list{margin-top:14px}
.li{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;background:var(--surface);margin-bottom:8px}
.li .n{width:34px;height:34px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.li.me{border:1.5px solid var(--accent)}
.li .grow{flex:1;min-width:0}
.li .grow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .grow small{color:var(--muted)}
.li .p{font-weight:700;color:var(--gold)}
.student{background:var(--surface);border-radius:14px;padding:14px;margin-bottom:10px}
.student .top{display:flex;justify-content:space-between;gap:10px}
.student select{min-height:46px;width:auto;padding:8px 12px;margin-top:10px}

/* pastki menyu */
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(13,27,33,.96);backdrop-filter:blur(10px);
  border-top:1.5px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
.nav button{flex:1;border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;
  align-items:center;gap:3px;padding:8px 0;font-size:11.5px;min-height:56px;border-radius:12px}
.nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--surface2);border:1.5px solid var(--line);padding:12px 18px;border-radius:14px;z-index:40;max-width:90%}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.back{border:0;background:var(--surface);width:44px;height:44px;border-radius:12px;font-size:20px}
.spin{display:inline-block;width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s 0.8s linear infinite;vertical-align:-3px}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}

/* ===== yangi boʻlimlar ===== */
.tile{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:16px;margin-top:12px;color:var(--text);cursor:pointer;min-height:68px}
.tile b{display:block;font-size:18px}.tile small{color:var(--muted)}
.tile .ic{width:46px;height:46px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;font-size:22px;flex:none}
.tile .grow{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chip{min-height:46px;padding:8px 16px;border-radius:23px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);font-weight:600}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;min-height:56px;padding:13px 14px;margin-top:10px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);cursor:pointer;color:var(--text)}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:700;font-size:14px}
.opt.ok{border-color:var(--accent);background:rgba(92,194,164,.14)}
.opt.bad{border-color:var(--danger);background:rgba(239,123,108,.12)}
.bar{height:8px;border-radius:6px;background:var(--surface2);overflow:hidden;margin:10px 0 16px}.bar i{display:block;height:100%;background:var(--accent)}
.qcard{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}
.qcard.miss{border-color:var(--danger)}
.qcard textarea{min-height:70px}
.orow{display:flex;align-items:center;gap:8px;margin-top:8px}
.orow input[type=radio]{width:26px;height:26px;min-height:0;padding:0;flex:none;accent-color:var(--accent)}
.orow input[type=text]{min-height:46px}
.fb{margin-top:16px;padding:14px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line)}
.fb.ok{border-color:var(--accent)}.fb.bad{border-color:var(--danger)}
.imgbox{position:relative;border-radius:14px;overflow:hidden;background:var(--surface);margin:12px 0;-webkit-user-select:none;user-select:none}
.imgbox img{display:block;width:100%;height:auto}
.mk{position:absolute;border-radius:50%;border:3px solid var(--accent);transform:translate(-50%,-50%);pointer-events:none;aspect-ratio:1;background:rgba(92,194,164,.18)}
.mk.bad{border-color:var(--danger);background:rgba(239,123,108,.2)}
.pgbox{position:relative;background:#fff;border-radius:10px;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:pan-y;min-height:200px}
.pgbox canvas{display:block;width:100%;height:auto}
.rnav{display:flex;gap:10px;align-items:center;margin:12px 0}
.rnav .btn{width:auto;flex:1}
.rnav input{width:72px;text-align:center;min-height:50px;padding:6px}
.solcard{padding:26px 18px;text-align:center;font-size:21px;font-weight:700;margin-top:6px}
.two{display:flex;gap:10px;margin-top:12px}.two .btn{flex:1}
.thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:none;background:var(--surface2)}
.big{font-size:44px;font-weight:800;line-height:1.1}
@media print{body{display:none!important}}
</style>
</head>
<body>

<!-- KIRISH -->
<section id="auth" class="auth hidden">
  <div class="box">
    <div class="logo">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#5cc2a4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21c-4.5 0-8-3.4-8-7.7C4 8 8 4 14 3c1 5-1 7-3 9"/><path d="M9 21c0-4 2-7 6-9"/></svg>
    </div>
    <h1>Nur biologiya</h1>
    <p class="muted" style="margin-top:6px">Biologiyani tushunib oʻrgan.</p>

    <div class="tabs2">
      <button id="tabReg" class="on" type="button">Roʻyxatdan oʻtish</button>
      <button id="tabLog" type="button">Kirish</button>
    </div>

    <div id="fName">
      <label for="name">Ism va familiya</label>
      <input id="name" autocomplete="name" placeholder="Masalan: Aziz Karimov">
    </div>
    <label for="phone">Telefon raqam</label>
    <input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="90 123 45 67">
    <label for="pass">Parol</label>
    <input id="pass" type="password" autocomplete="current-password" placeholder="Kamida 6 ta belgi">
    <p class="hint" id="passHint">Parolni eslab qoling: u bilan keyin kirasiz.</p>

    <div class="err" id="authErr" role="alert"></div>
    <button class="btn" id="authBtn" type="button" style="margin-top:6px">Roʻyxatdan oʻtish</button>
  </div>
</section>

<!-- ASOSIY -->
<main id="app" class="hidden">
  <div class="wrap" id="view"></div>
  <nav class="nav" id="nav" aria-label="Asosiy menyu"></nav>
</main>

<div id="toast" class="toast hidden" role="status"></div>

<script>
const SUPABASE_URL = "https://myshvnnmkpbcwtpbgezd.supabase.co";
const SUPABASE_KEY = "sb_publishable_hM-PmNVzbhNn3qyhfNThOA_m_Odi50s";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = (id)=>document.getElementById(id);
const esc = (s)=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = (x)=>{const n=Math.round(Number(x||0)*10)/10;return String(n).replace(".",",")};

let state = { user:null, me:null, isTeacher:false, tab:"home", sub:null, ctx:{}, board:[], news:[], students:[], timer:null };
let mode = "reg";

/* ---------- yordamchilar ---------- */
function toast(t){const e=$("toast");e.textContent=t;e.classList.remove("hidden");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add("hidden"),2800)}
const GR=[6,7,8,9,10,11];
const shuffle=(a)=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=(a)=>a[Math.floor(Math.random()*a.length)];
const SPIN='<p class="muted" style="padding:40px 0;text-align:center"><span class="spin"></span></p>';
const head=(title)=>`<div class="top"><button class="back" id="bk" type="button" aria-label="Orqaga">‹</button><h1 style="flex:1;margin-left:6px;font-size:24px">${esc(title)}</h1></div>`;
const gradeChips=(cur)=>`<div class="chips">`+GR.map(g=>`<button class="chip ${g===cur?"on":""}" type="button" data-g="${g}">${g}-sinf</button>`).join("")+`</div>`;
const gradeOpts=(cur)=>GR.map(g=>`<option value="${g}" ${g===cur?"selected":""}>${g}-sinf</option>`).join("");
const LET=["A","B","C","D","E","F"];
const OKS=["Barakalla!","Zoʻr, toʻgʻri!","Miya ishlayapti!","Mana bu gap!"];
const BADS=["Oshqovoq, bir oʻylab koʻr!","Miyang qursin, yana urinib koʻr!","Kitobni ochib koʻr, javob oʻsha yerda."];
const imgUrl=(p)=>sb.storage.from("images").getPublicUrl(p).data.publicUrl;
function msgErr(box,e){box.innerHTML=`<div class="empty">Yuklab boʻlmadi.<br><small>${esc(e&&e.message||e)}</small><br><small>Agar “relation ... does not exist” yozilgan boʻlsa, yangi SQL kodni Supabase’da ishga tushiring.</small></div>`}

function normPhone(raw){
  let d=String(raw||"").replace(/\D/g,"");
  if(d.length===9) d="998"+d;
  if(d.length!==12||!d.startsWith("998")) return null;
  return d;
}
const fakeEmail = (d)=>`p${d}@nurbio.uz`;
const prettyPhone = (d)=>`+${d.slice(0,3)} ${d.slice(3,5)} ${d.slice(5,8)} ${d.slice(8,10)} ${d.slice(10)}`;
function dateUz(s){const d=new Date(s);return d.toLocaleDateString("uz-UZ",{day:"numeric",month:"long"})}

/* ---------- ilovani oʻrnatish ---------- */
let installEv=null;
window.addEventListener("beforeinstallprompt",(e)=>{e.preventDefault();installEv=e;const c=$("instCard");if(c)c.classList.remove("hidden")});
const isStandalone=()=>window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent);
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}

/* ---------- kirish / roʻyxatdan oʻtish ---------- */
function setMode(m){
  mode=m;
  $("tabReg").classList.toggle("on",m==="reg");
  $("tabLog").classList.toggle("on",m==="log");
  $("fName").classList.toggle("hidden",m!=="reg");
  $("passHint").classList.toggle("hidden",m!=="reg");
  $("authBtn").textContent = m==="reg" ? "Roʻyxatdan oʻtish" : "Kirish";
  $("pass").autocomplete = m==="reg" ? "new-password" : "current-password";
  $("authErr").textContent="";
}
$("tabReg").onclick=()=>setMode("reg");
$("tabLog").onclick=()=>setMode("log");
$("authBtn").onclick=submitAuth;
["name","phone","pass"].forEach(id=>$(id).addEventListener("keydown",e=>{if(e.key==="Enter")submitAuth()}));

async function submitAuth(){
  const err=$("authErr"), btn=$("authBtn");
  err.textContent="";
  const name=$("name").value.trim().replace(/\s+/g," ");
  const phone=normPhone($("phone").value);
  const pass=$("pass").value;
  if(mode==="reg" && name.split(" ").length<2){err.textContent="Ism va familiyani toʻliq yozing.";return}
  if(!phone){err.textContent="Telefon raqamni toʻgʻri yozing. Masalan: 90 123 45 67";return}
  if(pass.length<6){err.textContent="Parol kamida 6 ta belgidan iborat boʻlsin.";return}
  btn.disabled=true; const old=btn.textContent; btn.innerHTML='<span class="spin"></span>';
  try{
    if(mode==="reg"){
      const {data,error}=await sb.auth.signUp({email:fakeEmail(phone),password:pass});
      if(error){
        err.textContent = /already|registered/i.test(error.message)
          ? "Bu raqam bilan oldin roʻyxatdan oʻtilgan. “Kirish” ni bosing."
          : "Roʻyxatdan oʻtib boʻlmadi: "+error.message;
        return;
      }
      if(!data.session){err.textContent="Hisob yaratildi, lekin kirish yopiq. Ustozga xabar bering.";return}
      const {error:e2}=await sb.from("students").insert({id:data.user.id,full_name:name,phone});
      if(e2){err.textContent="Maʼlumot saqlanmadi: "+e2.message;return}
    }else{
      const {error}=await sb.auth.signInWithPassword({email:fakeEmail(phone),password:pass});
      if(error){err.textContent="Telefon yoki parol xato.";return}
    }
    await boot();
  }catch(e){
    err.textContent="Internet bilan muammo. Qayta urinib koʻring.";
  }finally{
    btn.disabled=false; btn.textContent=old;
  }
}

async function logout(){
  clearInterval(state.timer);
  await sb.auth.signOut();
  state={user:null,me:null,isTeacher:false,tab:"home",sub:null,ctx:{},board:[],news:[],students:[],timer:null};
  $("app").classList.add("hidden"); $("auth").classList.remove("hidden");
  $("pass").value="";
}

/* ---------- yuklash ---------- */
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ $("app").classList.add("hidden"); $("auth").classList.remove("hidden"); setMode("reg"); return }
  state.user=session.user;
  const [m,t]=await Promise.all([
    sb.from("students").select("*").eq("id",state.user.id).maybeSingle(),
    sb.rpc("is_teacher")
  ]);
  state.me=m.data; state.isTeacher=t.data===true;
  if(!state.me && !state.isTeacher){
    toast("Profil topilmadi. Qaytadan kiring.");
    await logout(); return;
  }
  $("auth").classList.add("hidden"); $("app").classList.remove("hidden");
  buildNav(); await go("home");
}

async function loadCommon(){
  const [b,n]=await Promise.all([
    sb.rpc("leaderboard"),
    sb.from("news").select("*").order("created_at",{ascending:false}).limit(20)
  ]);
  state.board=b.data||[]; state.news=n.data||[];
  if(state.me){
    const {data}=await sb.from("students").select("*").eq("id",state.user.id).maybeSingle();
    if(data) state.me=data;
  }
}

/* ---------- pastki menyu ---------- */
const ICONS={
  home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
  lessons:'<path d="M4 5h7a3 3 0 013 3v12a2 2 0 00-2-2H4z"/><path d="M20 5h-7"/><path d="M20 5v13h-6"/>',
  tests:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4v2h6V4"/><path d="M9 12l2 2 4-4"/>',
  library:'<path d="M5 4v16"/><path d="M10 4v16"/><path d="M15 5l4 1-3.5 14-4-1z"/>',
  images:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 9"/>',
  rooms:'<path d="M5 21V4h9v17"/><path d="M14 8h5v13"/><circle cx="11" cy="13" r=".8"/>'
};
const TABS=[["home","Bosh"],["lessons","Darslar"],["tests","Testlar"],["library","Kutubxona"],["images","Mashqlar"],["rooms","Xonalar"]];
function buildNav(){
  $("nav").innerHTML=TABS.map(([k,l])=>`<button data-k="${k}" type="button"><svg viewBox="0 0 24 24">${ICONS[k]}</svg>${l}</button>`).join("");
  $("nav").querySelectorAll("button").forEach(b=>b.onclick=()=>go(b.dataset.k));
}
async function go(tab,sub=null,ctx={}){
  state.tab=tab; state.sub=sub; state.ctx=ctx||{};
  $("nav").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.k===tab && sub!=="teacher"));
  $("view").innerHTML=SPIN;
  window.scrollTo(0,0);
  try{ await loadCommon(); }catch(e){}
  render();
}

/* ---------- koʻrinishlar ---------- */
function render(){
  if(state.sub==="teacher") return renderTeacher();
  const T={home:renderHome,
    lessons:()=>soon("Darslar","Nazariy va amaliy darslar keyingi bosqichda qoʻshiladi."),
    tests:renderTests, library:renderLibrary, images:renderImages,
    rooms:()=>soon("Xonalar","Guruh xonalari keyingi bosqichda qoʻshiladi.")};
  T[state.tab]();
}

function soon(title,text){
  $("view").innerHTML=`<h1>${title}</h1><div class="empty">${text}</div>`+logoutBlock();
  bindLogout();
}
function logoutBlock(){
  return `<div style="margin-top:34px"><button class="btn ghost" id="outBtn" type="button">Chiqish</button></div>`;
}
function bindLogout(){const b=$("outBtn");if(b)b.onclick=logout}

function rankOf(){
  if(!state.me) return "–";
  const mine=Number(state.me.points||0);
  return state.board.filter(r=>Number(r.points)>mine).length+1;
}

function renderHome(){
  const me=state.me;
  const first=me?esc(me.full_name.split(" ")[0]):"Ustoz";
  let h=`<div class="top"><div><p class="muted">Salom,</p><h1>${first}</h1></div>

/* ================= PDF yordamchilari ================= */
let pdfjsReady=null;
function loadPdfJs(){
  if(window.pdfjsLib) return Promise.resolve();
  if(pdfjsReady) return pdfjsReady;
  pdfjsReady=new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    s.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";res()};
    s.onerror=()=>{pdfjsReady=null;rej(new Error("PDF oʻqish kutubxonasi yuklanmadi"))};
    document.head.appendChild(s);
  });
  return pdfjsReady;
}

async function pdfText(buf){
  await loadPdfJs();
  const doc=await pdfjsLib.getDocument({data:buf}).promise;
  let out="";
  for(let p=1;p<=doc.numPages;p++){
    const pg=await doc.getPage(p), tc=await pg.getTextContent();
    let lastY=null, prevEnd=null, line="";
    for(const it of tc.items){
      if(typeof it.str!=="string") continue;
      const y=it.transform[5], x=it.transform[4];
      if(lastY!==null && Math.abs(y-lastY)>3){ out+=line+"\n"; line=""; prevEnd=null; }
      if(line && prevEnd!==null && x-prevEnd>(it.height||10)*0.12 && !line.endsWith(" ") && !it.str.startsWith(" ")) line+=" ";
      line+=it.str; prevEnd=x+(it.width||0); lastY=y;
      if(it.hasEOL){ out+=line+"\n"; line=""; lastY=null; prevEnd=null; }
    }
    out+=line+"\n";
  }
  doc.destroy();
  return out;
}

function parseQuestions(raw){
  const LM={"А":"A","В":"B","С":"C","Е":"E"};
  const L=(ch)=>LM[ch]||ch.toUpperCase();
  let text=String(raw||"").replace(/\r/g,"").replace(/[\u00A0\u2007\u202F]/g," ").replace(/[ \t]+/g," ");
  // javoblar kaliti boʻlimi
  let body=text, key="";
  const km=[...text.matchAll(/\n\s*(javoblar|javob\s+kalit\w*|kalitlar|kalit|toʻgʻri\s+javoblar|to['ʻ’‘`]?g['ʻ’‘`]?ri\s+javoblar|answers?|ответы)\b[^\n]*/gi)].filter(m=>m.index>text.length*0.3);
  if(km.length){const m=km[km.length-1]; body=text.slice(0,m.index); key=text.slice(m.index);}
  const keyMap={};
  if(key){
    for(const m of key.matchAll(/(\d{1,3})\s*[-–—.):=]?\s*([A-FАВСЕa-f])(?![A-Za-zА-Яа-я])/g)){
      const n=+m[1]; if(!(n in keyMap)) keyMap[n]=L(m[2]);
    }
  }
  // savol boshlari
  const starts=[]; let last=0;
  for(const m of body.matchAll(/(?:^|\n)[ ]*(\d{1,3})[ ]*[.)][ ]+(?=\S)/g)){
    const n=+m[1];
    if(starts.length===0 || (n>last && n<=last+3)){ starts.push({n,idx:m.index,end:m.index+m[0].length}); last=n; }
  }
  const items=[];
  starts.forEach((s,k)=>{
    const blk=body.slice(s.end, k+1<starts.length?starts[k+1].idx:body.length);
    // variant belgilari
    const mk=(letter,from)=>{
      const cls=letter==="A"?"[AА]":letter==="B"?"[BВ]":letter==="C"?"[CС]":letter==="E"?"[EЕ]":letter;
      const re=new RegExp("(^|\\s)([*+✔✓=]?)("+cls+")[ ]?[.)]","g"); re.lastIndex=from;
      const m=re.exec(blk); if(!m) return null;
      const start=m.index+m[1].length;
      return {start, end:m.index+m[0].length, mark:!!m[2]};
    };
    let best=null;
    const reA=/(^|\s)([*+✔✓=]?)([AА])[ ]?[.)]/g; let am;
    while((am=reA.exec(blk))){
      const chain=[{start:am.index+am[1].length,end:am.index+am[0].length,mark:!!am[2]}];
      for(const lt of ["B","C","D","E","F"]){
        const nx=mk(lt,chain[chain.length-1].end); if(!nx) break; chain.push(nx);
      }
      if(chain.length>=2){best=chain;break}
    }
    if(!best){ return; }
    const q=blk.slice(0,best[0].start).replace(/\s+/g," ").trim();
    const opts=[]; let ans=-1; const marks=[];
    best.forEach((c,j)=>{
      let t=blk.slice(c.end, j+1<best.length?best[j+1].start:blk.length).replace(/\s+/g," ").trim();
      let mkd=c.mark;
      if(/^[*+✔✓=]\s*/.test(t)){mkd=true;t=t.replace(/^[*+✔✓=]\s*/,"")}
      if(/\s*[*✔✓]$/.test(t)){mkd=true;t=t.replace(/\s*[*✔✓]$/,"")}
      if(/\((?:to['ʻ’‘`]?g['ʻ’‘`]?ri|\+)\)\s*$/i.test(t)){mkd=true;t=t.replace(/\s*\((?:to['ʻ’‘`]?g['ʻ’‘`]?ri|\+)\)\s*$/i,"")}
      opts.push(t); if(mkd) marks.push(j);
    });
    if(marks.length===1) ans=marks[0];
    else if(keyMap[s.n]){const j=LET_IDX(keyMap[s.n]); if(j>=0&&j<opts.length) ans=j}
    if(q && opts.length>=2) items.push({n:s.n,q,opts,ans});
  });
  return items;
}
function LET_IDX(ch){return "ABCDEF".indexOf(ch)}
/*PARSE_END*/

let rd={doc:null,page:1,busy:false,pend:null};
function drawMark(c,w,h){
  const t=state.me?`${state.me.full_name} · +${state.me.phone}`:"Nur biologiya · ustoz";
  const fs=Math.max(16,w/24);
  c.save();
  c.font=`600 ${fs}px sans-serif`; c.textAlign="center"; c.textBaseline="middle";
  c.translate(w/2,h/2); c.rotate(-0.5);
  const tw=c.measureText(t).width+fs*3, step=fs*4.2, R=Math.hypot(w,h)/2+tw;
  let row=0;
  for(let y=-R;y<R;y+=step,row++){
    for(let x=-R+(row%2?tw/2:0);x<R;x+=tw){
      c.fillStyle="rgba(80,80,80,0.17)"; c.fillText(t,x,y);
      c.strokeStyle="rgba(255,255,255,0.10)"; c.lineWidth=1; c.strokeText(t,x,y);
    }
  }
  c.restore();
}
async function showPage(n){
  if(!rd.doc||!$("pg")) return;
  n=Math.max(1,Math.min(rd.doc.numPages,n));
  if(rd.busy){rd.pend=n;return}
  rd.busy=true; rd.page=n;
  try{
    const page=await rd.doc.getPage(n);
    const cv=$("pg"); if(!cv) return;
    const cssW=$("pgBox").clientWidth||360;
    const v1=page.getViewport({scale:1}), dpr=Math.min(window.devicePixelRatio||1,2.5);
    const vp=page.getViewport({scale:cssW*dpr/v1.width});
    cv.width=vp.width; cv.height=vp.height;
    const cx=cv.getContext("2d");
    await page.render({canvasContext:cx,viewport:vp}).promise;
    drawMark(cx,vp.width,vp.height);
    document.querySelectorAll(".pn").forEach(i=>i.value=n);
    document.querySelectorAll(".pt").forEach(i=>i.textContent="/ "+rd.doc.numPages);
  }catch(e){ if($("pgBox")) toast("Varaq chizilmadi") }
  finally{ rd.busy=false; if(rd.pend){const p=rd.pend;rd.pend=null;showPage(p)} }
}

  $("pg").oncontextmenu=(e)=>e.preventDefault();
  $("pgBox").innerHTML='<p class="muted" style="padding:60px 0;text-align:center"><span class="spin"></span></p><canvas id="pg" class="hidden"></canvas>';
  try{
    await loadPdfJs();

  $("pgBox").innerHTML='<canvas id="pg"></canvas>';
  $("pg").oncontextmenu=(e)=>e.preventDefault();
  document.querySelectorAll(".pv").forEach(b=>b.onclick=()=>{showPage(rd.page-1);window.scrollTo(0,0)});
  document.querySelectorAll(".nx").forEach(b=>b.onclick=()=>{showPage(rd.page+1);window.scrollTo(0,0)});
  document.querySelectorAll(".pn").forEach(i=>i.onchange=()=>showPage(parseInt(i.value)||1));
  let sx=null; const box=$("pgBox");
  box.addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});

  showPage(1);
}

function renderReview(){
  const d=state.draft, v=$("view");
  const miss=d.items.filter(x=>x.ans<0).length;
  v.innerHTML=head(d.title)+`<div class="card"><b style="font-size:26px">${d.items.length}</b> <span class="muted">ta savol topildi</span>
    <p class="${miss?"":"muted"}" style="margin-top:6px;${miss?"color:var(--danger)":""}" id="missTxt">${miss?`${miss} tasida toʻgʻri javob belgilanmagan. Oʻzingiz belgilang.`:"Hammasida toʻgʻri javob belgilangan."}</p>
    <div class="two"><button class="btn ghost small" id="onlyM" type="button">${d.onlyMiss?"Hammasini koʻrsat":"Faqat javobsizlar"}</button>
    <button class="btn" id="saveSet" type="button">Saqlash</button></div></div><div id="qs"></div>`;
  $("bk").onclick=()=>{ if(confirm("Bekor qilasizmi? Oʻqilgan savollar yoʻqoladi.")) go("tests",null,{grade:d.grade}) };
  const draw=()=>{
    $("qs").innerHTML=d.items.map((x,i)=>({x,i})).filter(o=>!d.onlyMiss||o.x.ans<0).map(({x,i})=>`
      <div class="qcard ${x.ans<0?"miss":""}" data-i="${i}">
        <div class="row"><b>${i+1}-savol</b><button class="btn danger small" data-del type="button">Oʻchirish</button></div>
        <textarea data-f="q" aria-label="Savol">${esc(x.q)}</textarea>
        ${x.opts.map((o,j)=>`<div class="orow"><input type="radio" name="a${i}" data-f="r" data-j="${j}" ${x.ans===j?"checked":""} aria-label="Toʻgʻri javob ${LET[j]}">
          <span class="muted" style="width:20px">${LET[j]}</span><input type="text" data-f="o" data-j="${j}" value="${esc(o)}"></div>`).join("")}
      </div>`).join("")||`<div class="empty">Hammasi belgilangan.</div>`;
  };
  draw();
  const upd=()=>{const m=d.items.filter(x=>x.ans<0).length;$("missTxt").textContent=m?`${m} tasida toʻgʻri javob belgilanmagan. Oʻzingiz belgilang.`:"Hammasida toʻgʻri javob belgilangan."};
  $("qs").addEventListener("input",e=>{
    const t=e.target, card=t.closest("[data-i]"); if(!card)return; const x=d.items[+card.dataset.i];
    if(t.dataset.f==="q") x.q=t.value; else if(t.dataset.f==="o") x.opts[+t.dataset.j]=t.value;
  });
  $("qs").addEventListener("change",e=>{
    const t=e.target, card=t.closest("[data-i]"); if(!card||t.dataset.f!=="r")return;
    d.items[+card.dataset.i].ans=+t.dataset.j; card.classList.remove("miss"); upd();
  });
  $("qs").addEventListener("click",e=>{
    if(!e.target.closest("[data-del]"))return;
    const i=+e.target.closest("[data-i]").dataset.i; d.items.splice(i,1); renderReview();
  });
  $("onlyM").onclick=()=>{d.onlyMiss=!d.onlyMiss;renderReview()};
  $("saveSet").onclick=saveSet;
}

async function saveSet(){
  const d=state.draft;
  const clean=d.items.map(x=>{
    const opts=[]; let ans=-1;
    x.opts.forEach((o,j)=>{ if(o.trim()){ if(j===x.ans) ans=opts.length; opts.push(o.trim()) } });
    return {q:x.q.trim(),opts,ans};
  });
  const bad=clean.findIndex(x=>!x.q||x.opts.length<2||x.ans<0);
  if(bad>=0){
    toast(`${bad+1}-savolni tekshiring: toʻgʻri javobni belgilang`);
    d.onlyMiss=true; renderReview(); return;
  }
  const btn=$("saveSet"); btn.disabled=true; btn.innerHTML='<span class="spin"></span>';
  const {data:set,error}=await sb.from("question_sets").insert({title:d.title,grade:d.grade,per_try:d.per_try,qcount:clean.length}).select().single();
  if(error){toast("Saqlanmadi: "+error.message);btn.disabled=false;btn.textContent="Saqlash";return}
  for(let i=0;i<clean.length;i+=100){
    const rows=clean.slice(i,i+100).map(x=>({set_id:set.id,q:x.q,opts:x.opts,ans:x.ans}));
    const {error:e2}=await sb.from("questions").insert(rows);
    if(e2){await sb.from("question_sets").delete().eq("id",set.id);toast("Saqlanmadi: "+e2.message);btn.disabled=false;btn.textContent="Saqlash";return}
  }
  toast(`${clean.length} ta savol saqlandi`); state.draft=null; go("tests",null,{grade:d.grade});
}

/* ---------- oʻquvchi: testni ishlash ---------- */
const STICKY=/yuqoridagi|barcha|hammasi|hech biri|va\s+[A-F]\b|[A-F]\s*va\s*[A-F]/i;
async function startTest(set){
  $("view").innerHTML=SPIN;
  const {data,error}=await sb.rpc("get_questions",{p_set:set.id});
  if(error||!data||!data.length){ $("view").innerHTML=head(set.title)+`<div class="empty">Savollarni yuklab boʻlmadi.<br><small>${esc(error&&error.message||"")}</small></div>`; $("bk").onclick=()=>go("tests",null,{grade:set.grade}); return }
  let qs=shuffle(data); if(set.per_try>0) qs=qs.slice(0,set.per_try);
  qs=qs.map(q=>{
    const o=q.opts.map((t,i)=>({t,i}));
    return {id:q.id,q:q.q,view:o.some(x=>STICKY.test(x.t))?o:shuffle(o)};
  });
  state.run={set,qs,i:0,ok:0,wrong:[]};
  drawQ();
}
function drawQ(){
  const r=state.run, v=$("view"); if(!r) return;
  if(r.i>=r.qs.length) return drawResult();
  const q=r.qs[r.i];
  v.innerHTML=head(r.set.title)+`<div class="bar"><i style="width:${Math.round(r.i/r.qs.length*100)}%"></i></div>
    <p class="muted">${r.i+1} / ${r.qs.length}</p>
    <h2 style="margin-top:6px;font-size:20px;line-height:1.4">${esc(q.q)}</h2>
    <div id="opts">${q.view.map((o,k)=>`<button class="opt" type="button" data-k="${k}"><span class="l">${LET[k]}</span><span>${esc(o.t)}</span></button>`).join("")}</div>
    <div id="fb"></div>`;
  $("bk").onclick=()=>{ if(r.i>0&&!confirm("Testni toʻxtatasizmi?"))return; state.run=null; go("tests",null,{grade:r.set.grade}) };
  v.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answerQ(+b.dataset.k));
}
async function answerQ(k){
  const r=state.run, q=r.qs[r.i]; if(r.lock) return; r.lock=true;
  const {data:right,error}=await sb.rpc("check_answer",{p_q:q.id});
  if(error){r.lock=false;toast("Tekshirib boʻlmadi, qayta bosing");return}
  const rk=q.view.findIndex(o=>o.i===right), good=(k===rk);
  const btns=$("opts").querySelectorAll(".opt"); btns.forEach(b=>b.disabled=true);
  btns[rk].classList.add("ok"); if(!good) btns[k].classList.add("bad");
  if(good) r.ok++; else r.wrong.push({q:q.q,mine:q.view[k].t,right:q.view[rk].t});
  const last=r.i+1>=r.qs.length;
  $("fb").innerHTML=`<div class="fb ${good?"ok":"bad"}"><b>${good?pick(OKS):pick(BADS)}</b></div>
    <button class="btn" id="nxt" type="button" style="margin-top:14px">${last?"Natijani koʻrish":"Keyingisi"}</button>`;
  $("nxt").onclick=()=>{r.i++;r.lock=false;drawQ()};
}
function drawResult(){
  const r=state.run, v=$("view"), n=r.qs.length, pc=Math.round(r.ok/n*100);
  v.innerHTML=head("Natija")+`<div class="card" style="text-align:center"><div class="big">${r.ok} / ${n}</div>
    <p class="muted" style="margin-top:6px">${pc}% toʻgʻri</p></div>
    <div class="two"><button class="btn" id="again" type="button">Qayta ishlash</button><button class="btn ghost" id="toList" type="button">Testlarga</button></div>`
    +(r.wrong.length?`<h3 style="margin-top:24px">Xatolar</h3>`+r.wrong.map(w=>`<div class="qcard"><b>${esc(w.q)}</b>
      <p style="margin-top:8px;color:var(--danger)">Sizning javobingiz: ${esc(w.mine)}</p>
      <p style="color:var(--accent)">Toʻgʻrisi: ${esc(w.right)}</p></div>`).join(""):"");
  $("bk").onclick=$("toList").onclick=()=>{state.run=null;go("tests",null,{grade:r.set.grade})};
  $("again").onclick=()=>startTest(r.set);
}

/* ================= MASHQLAR (rasmli) ================= */
const EK={rasmli:["🖼️","Rasmli savollar","Rasmga qarab javob tanlang"],solishtirish:["⚖️","Solishtirish","Qaysi biriga tegishli?"],qismi:["🎯","Qismini top","Rasmda toʻgʻri joyni bosing"]};

async function shrinkImage(file,maxW=1400){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error("Rasm ochilmadi"));i.src=url});
    const k=Math.min(1,maxW/img.naturalWidth), w=Math.round(img.naturalWidth*k), h=Math.round(img.naturalHeight*k);
    const cv=document.createElement("canvas"); cv.width=w; cv.height=h; cv.getContext("2d").drawImage(img,0,0,w,h);
    const wb=await new Promise(r=>cv.toBlob(r,"image/webp",0.88));
    if(wb&&wb.type==="image/webp") return {blob:wb,ext:"webp"};
    return {blob:await new Promise(r=>cv.toBlob(r,"image/png")),ext:"png"};
  }finally{URL.revokeObjectURL(url)}
}

    v.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>go("images",null,{kind:b.dataset.k,grade:state.me?state.me.grade:6}));
    const a=$("addEx"); if(a) a.onclick=()=>go("images",null,{view:"add"});
    bindLogout(); return;
  }
  const grade=c.grade||6;
  const {data,error}=await sb.from("exercises").select("*").eq("kind",c.kind).eq("grade",grade).order("created_at",{ascending:false});
  v.innerHTML=head(EK[c.kind][1])+gradeChips(grade)+`<div id="exl"></div>`;
  $("bk").onclick=()=>go("images");
  v.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>go("images",null,{kind:c.kind,grade:+b.dataset.g}));
  const box=$("exl");
  if(error){msgErr(box,error);return}
  const list=data||[];
  if(!list.length){box.innerHTML=`<div class="empty">Bu sinfda hali mashq yoʻq.</div>`;return}
  box.innerHTML=`<button class="btn" id="go15" type="button">Boshlash</button>
    ${state.isTeacher?`<h3 style="margin-top:22px">${list.length} ta mashq</h3>`+list.map(e=>`<div class="li">${e.image_path?`<img class="thumb" src="${esc(imgUrl(e.image_path))}" alt="">`:""}
      <div class="grow"><b>${esc(e.title)}</b></div><button class="btn danger small" data-x="${e.id}" type="button">Oʻchirish</button></div>`).join(""):""}`;
  $("go15").onclick=()=>startRun(list,{kind:c.kind,grade});
  box.querySelectorAll("[data-x]").forEach(b=>b.onclick=async()=>{
    const e=list.find(x=>String(x.id)===b.dataset.x);
    if(!confirm(`“${e.title}” ni oʻchirasizmi?`))return;
    if(e.image_path) await sb.storage.from("images").remove([e.image_path]);
    const {error}=await sb.from("exercises").delete().eq("id",e.id);
    toast(error?"Oʻchmadi":"Oʻchirildi"); go("images",null,{kind:c.kind,grade});
  });
}

  $("bk").onclick=()=>go("images");

  $("ei").onchange=async()=>{
    const f=$("ei").files[0]; if(!f)return;

/* ---------- oʻquvchi: mashq ishlash ---------- */
function startRun(list,back){
  let steps=[];
  list.forEach(e=>{
    const d=e.data||{};
    if(e.kind==="solishtirish"){
      d.a.items.forEach(t=>steps.push({type:"sol",e,t,side:0}));
      d.b.items.forEach(t=>steps.push({type:"sol",e,t,side:1}));
    }else if(e.kind==="rasmli"){
      steps.push({type:"rasmli",e,view:shuffle(d.opts.map((t,i)=>({t,i})))});
    }else steps.push({type:"qismi",e});
  });
  state.ex={steps:shuffle(steps).slice(0,15),i:0,ok:0,back};
  state.ctx={view:"run"};
  drawStep();
}
function drawStep(){
  const r=state.ex, v=$("view"); if(!r) return;
  if(r.i>=r.steps.length) return drawExEnd();
  const s=r.steps[r.i], e=s.e, d=e.data||{};
  let body="";
  if(s.type==="rasmli"){
    body=(e.image_path?`<div class="imgbox"><img src="${esc(imgUrl(e.image_path))}" alt="" draggable="false"></div>`:"")
      +`<h2 style="font-size:20px;line-height:1.4">${esc(d.q)}</h2><div id="opts">`
      +s.view.map((o,k)=>`<button class="opt" type="button" data-k="${k}"><span class="l">${LET[k]}</span><span>${esc(o.t)}</span></button>`).join("")+`</div>`;
  }else if(s.type==="sol"){
    body=(e.image_path?`<div class="imgbox"><img src="${esc(imgUrl(e.image_path))}" alt="" draggable="false"></div>`:"")
      +`<div class="card solcard">${esc(s.t)}</div><div class="two" id="opts"><button class="btn ghost" data-k="0" type="button">${esc(d.a.label)}</button><button class="btn ghost" data-k="1" type="button">${esc(d.b.label)}</button></div>`;
  }else{
    body=`<h2 style="font-size:20px">Rasmda toping: <span style="color:var(--gold)">${esc(d.target)}</span></h2>
      <div class="imgbox" id="ib" style="cursor:pointer"><img src="${esc(imgUrl(e.image_path))}" alt="" draggable="false"></div>`;
  }
  v.innerHTML=head(e.title)+`<div class="bar"><i style="width:${Math.round(r.i/r.steps.length*100)}%"></i></div><p class="muted">${r.i+1} / ${r.steps.length}</p>`+body+`<div id="fb"></div>`;
  $("bk").onclick=()=>{ if(r.i>0&&!confirm("Mashqni toʻxtatasizmi?"))return; state.ex=null; go("images",null,r.back) };
  const fin=(good)=>{
    if(r.lock)return; r.lock=true; if(good) r.ok++;
    const last=r.i+1>=r.steps.length;
    $("fb").innerHTML=`<div class="fb ${good?"ok":"bad"}"><b>${good?pick(OKS):pick(BADS)}</b></div><button class="btn" id="nxt" type="button" style="margin-top:14px">${last?"Natijani koʻrish":"Keyingisi"}</button>`;
    $("nxt").onclick=()=>{r.i++;r.lock=false;drawStep()};
  };
  if(s.type==="rasmli"){
    v.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      if(r.lock)return; const k=+b.dataset.k, rk=s.view.findIndex(o=>o.i===d.ans);
      v.querySelectorAll(".opt").forEach(x=>x.disabled=true);
      v.querySelectorAll(".opt")[rk].classList.add("ok"); if(k!==rk) b.classList.add("bad");
      fin(k===rk);
    });
  }else if(s.type==="sol"){
    v.querySelectorAll("#opts button").forEach(b=>b.onclick=()=>{
      if(r.lock)return; const k=+b.dataset.k, good=(k===s.side);
      v.querySelectorAll("#opts button").forEach(x=>x.disabled=true);
      v.querySelector(`#opts [data-k="${s.side}"]`).style.cssText="border-color:var(--accent);background:rgba(92,194,164,.14)";
      if(!good) b.style.cssText="border-color:var(--danger);background:rgba(239,123,108,.12)";
      fin(good);
    });
  }else{
    $("ib").onclick=(ev)=>{
      if(r.lock)return; const box=$("ib"), rc=box.getBoundingClientRect();
      const px=ev.clientX-rc.left, py=ev.clientY-rc.top;
      const good=Math.hypot(px-d.x/100*rc.width,py-d.y/100*rc.height)<=d.r/100*rc.width;
      setMarker(box,d.x,d.y,d.r,""); 
      if(!good){const m=document.createElement("div");m.className="mk bad";m.style.left=(px/rc.width*100)+"%";m.style.top=(py/rc.height*100)+"%";m.style.width="6%";box.appendChild(m)}
      fin(good);
    };
  }
}
function drawExEnd(){
  const r=state.ex, v=$("view"); if(!r) return;
  const n=r.steps.length;
  v.innerHTML=head("Natija")+`<div class="card" style="text-align:center"><div class="big">${r.ok} / ${n}</div><p class="muted" style="margin-top:6px">${Math.round(r.ok/n*100)}% toʻgʻri</p></div>
    <div class="two"><button class="btn" id="again" type="button">Qayta ishlash</button><button class="btn ghost" id="back2" type="button">Mashqlarga</button></div>`;
  const back=r.back;
  $("bk").onclick=$("back2").onclick=()=>{state.ex=null;go("images",null,back)};
  $("again").onclick=()=>go("images",null,back);
}

/* ---------- ustoz paneli ---------- */
async function renderTeacher(){
  const v=$("view");
  v.innerHTML=`<div class="top"><button class="back" id="bk" type="button" aria-label="Orqaga">‹</button>
    <h1 style="flex:1;margin-left:6px">Ustoz paneli</h1></div>
    <div class="tabs2"><button id="tS" class="on" type="button">Oʻquvchilar</button><button id="tN" type="button">Yangilik</button></div>
    <div id="tBody"></div>`;
  $("bk").onclick=()=>{clearInterval(state.timer);go("home")};
  $("tS").onclick=()=>{$("tS").classList.add("on");$("tN").classList.remove("on");drawStudents(true)};
  $("tN").onclick=()=>{$("tN").classList.add("on");$("tS").classList.remove("on");clearInterval(state.timer);drawNewsForm()};
  await drawStudents(true);
  clearInterval(state.timer);
  state.timer=setInterval(()=>{ if(state.sub==="teacher" && $("tS")?.classList.contains("on")) drawStudents(false) },10000);
}

async function drawStudents(showLoader){
  const body=$("tBody"); if(!body) return;
  if(showLoader) body.innerHTML='<p class="muted" style="padding:30px 0;text-align:center"><span class="spin"></span></p>';
  const {data,error}=await sb.from("students").select("*").order("created_at",{ascending:false});
  if(error){body.innerHTML=`<div class="empty">Roʻyxatni yuklab boʻlmadi.</div>`;return}
  state.students=data||[];
  const g={A:0,B:0,C:0,none:0};
  state.students.forEach(s=>{g[s.grp||"none"]++});
  let h=`<div class="card"><div class="row"><div><b style="font-size:26px">${state.students.length}</b>
    <span class="muted"> ta oʻquvchi</span></div>
    <button class="btn ghost small" id="rf" type="button">Yangilash</button></div>
    <p class="muted" style="margin-top:8px;font-size:14px">A: ${g.A} · B: ${g.B} · C: ${g.C} · guruhsiz: ${g.none}</p></div>`;
  if(!state.students.length) h+=`<div class="empty">Hali oʻquvchi roʻyxatdan oʻtmagan.</div>`;
  h+=`<div style="margin-top:14px">`+state.students.map(s=>`
    <div class="student" data-id="${s.id}">
      <div class="top"><div><b>${esc(s.full_name)}</b><br><a class="muted" href="tel:+${esc(s.phone)}" style="text-decoration:none">${prettyPhone(s.phone)}</a></div>
        <div style="text-align:right"><span class="badge">${s.grade}-sinf</span><br><b style="color:var(--gold)">${num(s.points)}</b></div></div>
      <select data-grp aria-label="Guruh">
        <option value="" ${!s.grp?"selected":""}>Guruhsiz</option>
        ${["A","B","C"].map(x=>`<option value="${x}" ${s.grp===x?"selected":""}>${x} guruh</option>`).join("")}
      </select>
      <span class="muted" style="font-size:13px;margin-left:8px">${dateUz(s.created_at)}</span>
    </div>`).join("")+`</div>`;
  // tanlash oynasi ochiq boʻlsa, avtoyangilash xalaqit bermasin
  if(!showLoader && document.activeElement && document.activeElement.tagName==="SELECT") return;
  body.innerHTML=h;
  $("rf").onclick=()=>drawStudents(true);
  body.querySelectorAll("[data-grp]").forEach(sel=>sel.onchange=async()=>{
    const id=sel.closest("[data-id]").dataset.id;
    const {error}=await sb.from("students").update({grp:sel.value||null}).eq("id",id);
    toast(error?"Saqlanmadi":"Guruh saqlandi");
  });
}

function drawNewsForm(){
  $("tBody").innerHTML=`<div class="card">
    <label for="nt" style="margin-top:0">Sarlavha</label><input id="nt" placeholder="Masalan: Yakshanba kuni imtihon">
    <label for="nb">Matn (ixtiyoriy)</label><textarea id="nb"></textarea>
    <button class="btn" id="nsend" type="button" style="margin-top:16px">Eʼlon qilish</button></div>
    <h3 style="margin-top:24px">Eʼlon qilinganlar</h3>
    <div id="nlist">${state.news.length?"":'<div class="empty">Hali yangilik yoʻq.</div>'}</div>`;
  const draw=()=>{ $("nlist").innerHTML=state.news.map(n=>`<div class="li"><div class="grow"><b>${esc(n.title)}</b><small>${dateUz(n.created_at)}</small></div>
    <button class="btn danger small" data-del="${n.id}" type="button">Oʻchirish</button></div>`).join("")||'<div class="empty">Hali yangilik yoʻq.</div>';
    $("nlist").querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
      if(!confirm("Bu yangilikni oʻchirasizmi?"))return;
      const {error}=await sb.from("news").delete().eq("id",b.dataset.del);
      if(error){toast("Oʻchmadi");return}
      state.news=state.news.filter(x=>String(x.id)!==b.dataset.del);draw();
    })};
  draw();
  $("nsend").onclick=async()=>{
    const title=$("nt").value.trim(), body=$("nb").value.trim();
    if(!title){toast("Sarlavhani yozing");return}
    const {data,error}=await sb.from("news").insert({title,body:body||null}).select().single();
    if(error){toast("Saqlanmadi");return}
    state.news.unshift(data);$("nt").value="";$("nb").value="";draw();toast("Eʼlon qilindi");
  };
}

/* ---------- boshlash ---------- */
setMode("reg");
boot();

</script>
</body>
</html>
