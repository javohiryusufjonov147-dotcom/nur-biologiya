<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nur Biology — fayl yuklash</title>
<link rel="icon" type="image/png" href="favicon.png">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#000; --panel:#141210; --line:#2a2622; --text:#f4efe6; --muted:#a59d92;
  --sun:#f6d860; --coral:#f2795e; --ok:#7fd49a; --bad:#ff6b6b;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:16px/1.5 Georgia,"Times New Roman",serif;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 60px}
.brand{display:flex;align-items:baseline;gap:10px;margin:8px 0 22px}
.brand b{font-size:34px;letter-spacing:.5px;background:linear-gradient(90deg,var(--sun),var(--coral));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:400}
.brand span{color:var(--muted);font-size:15px}
h2{font-weight:400;font-size:22px;margin:0 0 14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}
label{display:block;color:var(--muted);font:14px system-ui,sans-serif;margin:14px 0 6px}
input[type=text],input[type=tel],input[type=password]{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:#000;color:var(--text);font:17px system-ui,sans-serif}
input:focus,button:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{flex:1 1 auto;min-width:52px;padding:12px 10px;border-radius:12px;border:1px solid var(--line);background:#000;color:var(--text);font:16px system-ui,sans-serif;cursor:pointer}
.chip[aria-pressed=true]{border-color:var(--sun);background:linear-gradient(90deg,rgba(246,216,96,.18),rgba(242,121,94,.18))}
.file{display:block;border:1.5px dashed var(--line);border-radius:14px;padding:22px 14px;text-align:center;color:var(--muted);font:15px system-ui,sans-serif;cursor:pointer}
.file input{display:none}
.file.has{border-color:var(--sun);color:var(--text)}
.btn{width:100%;margin-top:18px;padding:16px;border:0;border-radius:14px;font:600 17px system-ui,sans-serif;color:#1a0f08;background:linear-gradient(90deg,var(--sun),var(--coral));cursor:pointer}
.btn:disabled{opacity:.45}
.ghost{background:none;border:1px solid var(--line);color:var(--muted);padding:8px 12px;border-radius:10px;font:14px system-ui,sans-serif;cursor:pointer}
.msg{margin-top:12px;font:15px system-ui,sans-serif;min-height:1.2em}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.tabs{display:flex;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:5;margin-bottom:10px}
.tabs button{flex:1;padding:13px 6px;border-radius:12px;border:1px solid var(--line);background:#000;color:var(--muted);font:15px system-ui,sans-serif;cursor:pointer}
.tabs button[aria-selected=true]{color:var(--text);border-color:var(--coral)}
.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item img{width:56px;height:56px;object-fit:cover;border-radius:10px;background:#222}
.item .ico{width:56px;height:56px;border-radius:10px;display:grid;place-items:center;background:#1e1a16;font-size:24px}
.item .t{flex:1;min-width:0}
.item .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item small{color:var(--muted);font:13px system-ui,sans-serif}
.empty{color:var(--muted);font:15px system-ui,sans-serif}
.top{display:flex;justify-content:space-between;align-items:center}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><b>NUR</b><span>Ustoz: fayl yuklash</span></div>
    <button class="ghost" id="logout" hidden>Chiqish</button>
  </div>

  <!-- KIRISH -->
  <section id="login" class="card" hidden>
    <h2>Ustoz sifatida kiring</h2>
    <label for="ph">Telefon raqam</label>
    <input id="ph" type="tel" inputmode="numeric" placeholder="90 123 45 67" autocomplete="username">
    <label for="pw">Parol</label>
    <input id="pw" type="password" autocomplete="current-password">
    <button class="btn" id="doLogin">Kirish</button>
    <div class="msg" id="loginMsg"></div>
  </section>

  <section id="denied" class="card" hidden>
    <h2>Bu sahifa faqat ustoz uchun</h2>
    <p class="empty">Siz oʻquvchi hisobi bilan kirgansiz. Ustoz hisobi bilan qayta kiring.</p>
  </section>

  <!-- ASOSIY -->
  <main id="app" hidden>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="kitob" aria-selected="true">Kitob</button>
      <button role="tab" data-tab="rasm" aria-selected="false">Rasm</button>
      <button role="tab" data-tab="royxat" aria-selected="false">Yuklanganlar</button>
    </div>

    <section id="kitob" class="card">
      <h2>Kutubxonaga kitob qoʻshish</h2>
      <label>Boʻlim</label>
      <div class="chips" data-group="bkind">
        <button class="chip" data-v="oddiy" aria-pressed="true">Oddiy darslik</button>
        <button class="chip" data-v="ai_darslik" aria-pressed="false">AI darslik</button>
        <button class="chip" data-v="ai_qollanma" aria-pressed="false">AI qoʻllanma</button>
      </div>
      <label>Sinf</label>
      <div class="chips" data-group="bgrade"></div>
      <label for="btitle">Nomi</label>
      <input id="btitle" type="text" placeholder="Masalan: Botanika 6-sinf">
      <label>PDF fayl</label>
      <label class="file" id="bfileBox"><input id="bfile" type="file" accept="application/pdf"><span>PDF tanlash uchun bosing</span></label>
      <button class="btn" id="bsend">Kitobni yuklash</button>
      <div class="msg" id="bmsg"></div>
    </section>

    <section id="rasm" class="card" hidden>
      <h2>Mashq uchun rasm qoʻshish</h2>
      <label>Mashq turi</label>
      <div class="chips" data-group="ekind">
        <button class="chip" data-v="rasmli" aria-pressed="true">3D tushuntirish</button>
        <button class="chip" data-v="solishtirish" aria-pressed="false">Solishtirish</button>
        <button class="chip" data-v="qismi" aria-pressed="false">Qismini topish</button>
      </div>
      <label>Sinf</label>
      <div class="chips" data-group="egrade"></div>
      <label for="etitle">Nomi</label>
      <input id="etitle" type="text" placeholder="Masalan: Hayvon hujayrasi">
      <label>Rasm</label>
      <label class="file" id="efileBox"><input id="efile" type="file" accept="image/*"><span>Rasm tanlash uchun bosing</span></label>
      <button class="btn" id="esend">Rasmni yuklash</button>
      <div class="msg" id="emsg"></div>
    </section>

    <section id="royxat" hidden>
      <div class="card"><h2>Kitoblar</h2><div id="blist"></div></div>
      <div class="card"><h2>Rasmlar</h2><div id="elist"></div></div>
    </section>
  </main>
</div>

<script>
const sb = window.supabase.createClient(
  "https://myshvnnmkpbcwtpbgezd.supabase.co",
  "sb_publishable_hM-PmNVzbhNn3qyhfNThOA_m_Odi50s"
);
const $ = id => document.getElementById(id);
const KIND_B = {oddiy:"Oddiy darslik", ai_darslik:"AI darslik", ai_qollanma:"AI qoʻllanma"};
const KIND_E = {rasmli:"3D tushuntirish", solishtirish:"Solishtirish", qismi:"Qismini topish"};
const MAX = 50 * 1024 * 1024;

// Sinf tugmalari
document.querySelectorAll('[data-group$="grade"]').forEach(g => {
  for (let s = 6; s <= 11; s++) {
    const b = document.createElement('button');
    b.className = 'chip'; b.dataset.v = s; b.textContent = s;
    b.setAttribute('aria-pressed', s === 6 ? 'true' : 'false');
    g.appendChild(b);
  }
});
document.querySelectorAll('.chips').forEach(g => g.addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  g.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
}));
const pick = name => document.querySelector(`[data-group="${name}"] [aria-pressed="true"]`).dataset.v;

// Fayl tanlanganda nomini koʻrsatish
[['bfile','bfileBox'],['efile','efileBox']].forEach(([i,box]) => {
  $(i).addEventListener('change', () => {
    const f = $(i).files[0];
    $(box).classList.toggle('has', !!f);
    $(box).querySelector('span').textContent = f ? `${f.name} (${(f.size/1048576).toFixed(1)} MB)` : 'Tanlash uchun bosing';
  });
});

// Boʻlimlar
document.querySelector('.tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('.tabs button').forEach(x => x.setAttribute('aria-selected', x === b ? 'true' : 'false'));
  ['kitob','rasm','royxat'].forEach(t => $(t).hidden = t !== b.dataset.tab);
  if (b.dataset.tab === 'royxat') loadLists();
});

function say(el, text, kind) { $(el).textContent = text; $(el).className = 'msg ' + (kind || ''); }
function fmt(d) { return new Date(d).toLocaleDateString('uz-UZ', {day:'2-digit', month:'2-digit', year:'numeric'}); }
function ext(name) { const m = /\.([a-z0-9]{2,5})$/i.exec(name); return m ? m[1].toLowerCase() : 'bin'; }

// Kirish
async function start() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $('login').hidden = false; return; }
  $('logout').hidden = false;
  const { data: t, error } = await sb.rpc('is_teacher');
  if (error || !t) { $('denied').hidden = false; return; }
  $('app').hidden = false;
}
$('doLogin').onclick = async () => {
  let d = $('ph').value.replace(/\D/g, '');
  if (d.length === 9) d = '998' + d;
  if (d.length !== 12) return say('loginMsg', 'Telefon raqamni toʻliq yozing: 90 123 45 67', 'bad');
  say('loginMsg', 'Tekshirilmoqda…');
  const { error } = await sb.auth.signInWithPassword({ email: `p${d}@nurbio.uz`, password: $('pw').value });
  if (error) return say('loginMsg', 'Telefon yoki parol notoʻgʻri.', 'bad');
  $('login').hidden = true; start();
};
$('logout').onclick = async () => { await sb.auth.signOut(); location.reload(); };

// Kitob yuklash
$('bsend').onclick = async () => {
  const f = $('bfile').files[0], title = $('btitle').value.trim();
  if (!title) return say('bmsg', 'Kitob nomini yozing.', 'bad');
  if (!f) return say('bmsg', 'PDF faylni tanlang.', 'bad');
  if (f.type !== 'application/pdf') return say('bmsg', 'Faqat PDF fayl yuklanadi.', 'bad');
  if (f.size > MAX) return say('bmsg', 'Fayl 50 MB dan katta. Kichikroq PDF tanlang.', 'bad');
  const kind = pick('bkind'), grade = +pick('bgrade');
  const path = `${kind}/${grade}/${Date.now()}.pdf`;
  $('bsend').disabled = true; say('bmsg', 'Yuklanmoqda… sahifani yopmang.');
  const up = await sb.storage.from('library').upload(path, f, { contentType: 'application/pdf' });
  if (up.error) { $('bsend').disabled = false; return say('bmsg', 'Yuklab boʻlmadi: ' + up.error.message, 'bad'); }
  const ins = await sb.from('books').insert({ kind, grade, title, path });
  $('bsend').disabled = false;
  if (ins.error) { await sb.storage.from('library').remove([path]); return say('bmsg', 'Saqlab boʻlmadi: ' + ins.error.message, 'bad'); }
  say('bmsg', `Yuklandi: ${title} (${grade}-sinf, ${KIND_B[kind]})`, 'ok');
  $('btitle').value = ''; $('bfile').value = ''; $('bfile').dispatchEvent(new Event('change'));
};

// Rasm yuklash
$('esend').onclick = async () => {
  const f = $('efile').files[0], title = $('etitle').value.trim();
  if (!title) return say('emsg', 'Rasm nomini yozing.', 'bad');
  if (!f) return say('emsg', 'Rasmni tanlang.', 'bad');
  if (!f.type.startsWith('image/')) return say('emsg', 'Faqat rasm yuklanadi.', 'bad');
  if (f.size > MAX) return say('emsg', 'Rasm 50 MB dan katta.', 'bad');
  const kind = pick('ekind'), grade = +pick('egrade');
  const path = `${kind}/${grade}/${Date.now()}.${ext(f.name)}`;
  $('esend').disabled = true; say('emsg', 'Yuklanmoqda…');
  const up = await sb.storage.from('images').upload(path, f, { contentType: f.type });
  if (up.error) { $('esend').disabled = false; return say('emsg', 'Yuklab boʻlmadi: ' + up.error.message, 'bad'); }
  const ins = await sb.from('exercises').insert({ kind, grade, title, image_path: path });
  $('esend').disabled = false;
  if (ins.error) { await sb.storage.from('images').remove([path]); return say('emsg', 'Saqlab boʻlmadi: ' + ins.error.message, 'bad'); }
  say('emsg', `Yuklandi: ${title} (${grade}-sinf, ${KIND_E[kind]})`, 'ok');
  $('etitle').value = ''; $('efile').value = ''; $('efile').dispatchEvent(new Event('change'));
};

// Roʻyxat va oʻchirish
async function loadLists() {
  $('blist').innerHTML = $('elist').innerHTML = '<p class="empty">Yuklanmoqda…</p>';
  const [b, e] = await Promise.all([
    sb.from('books').select('*').order('created_at', { ascending: false }),
    sb.from('exercises').select('*').order('created_at', { ascending: false })
  ]);
  render('blist', b.data || [], 'library', r => `<div class="ico">📘</div>`, r => `${r.grade}-sinf, ${KIND_B[r.kind]}`, 'path', 'books');
  render('elist', e.data || [], 'images',
    r => `<img alt="" src="${sb.storage.from('images').getPublicUrl(r.image_path).data.publicUrl}">`,
    r => `${r.grade}-sinf, ${KIND_E[r.kind]}`, 'image_path', 'exercises');
}
function render(box, rows, bucket, thumb, sub, pathKey, table) {
  const el = $(box);
  if (!rows.length) { el.innerHTML = '<p class="empty">Hali hech narsa yuklanmagan.</p>'; return; }
  el.innerHTML = '';
  rows.forEach(r => {
    const d = document.createElement('div'); d.className = 'item';
    d.innerHTML = `${thumb(r)}<div class="t"><div></div><small>${sub(r)}, ${fmt(r.created_at)}</small></div><button class="ghost">Oʻchirish</button>`;
    d.querySelector('.t div').textContent = r.title;
    d.querySelector('button').onclick = async () => {
      if (!confirm(`"${r.title}" oʻchirilsinmi?`)) return;
      if (r[pathKey]) await sb.storage.from(bucket).remove([r[pathKey]]);
      const { error } = await sb.from(table).delete().eq('id', r.id);
      if (error) alert('Oʻchirib boʻlmadi: ' + error.message); else d.remove();
    };
    el.appendChild(d);
  });
}

start();
</script>
</body>
</html>
