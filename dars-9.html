oziq-ovqat va kiyim ham koʻproq kerak."},{"board":{"title":"Biologiyaning roli","steps":[{"k":"chain","rows":[["Aholi koʻpayadi","y"],["Oziq-ovqat va kiyim koʻproq kerak","g"],["Hosildor nav va zotlar yaratiladi","b"],["Biologiya muammoni hal qiladi","p"]]}]}}]},{"title":"Tirik va jonsiz","items":[{"who":"nur","text":"Endi asosiy savol: tirik nima? Mana tosh va mushuk."},{"board":{"title":"Tirik va jonsiz","steps":[{"k":"pic","pic":"livenon"}]}},{"who":"nur","text":"Tosh yotibdi. Yomgʻir yogʻsa faqat hoʻl boʻladi. Mushuk esa ovqatlanadi, oʻsadi, koʻpayadi."},{"who":"ali","text":"Ustoz, olov-chi? U ham yonadi, harakatlanadi, kattalashadi!"},{"who":"nur","text":"Zoʻr savol, Ali. Olovda hujayra yoʻq, irsiyat yoʻq, oʻzini tiklay olmaydi. Yonish — kimyoviy jarayon, hayot emas."},{"who":"ali","text":"Demak, tiriklik — bir nechta xususiyatning birgalikda boʻlishi."},{"who":"nur","text":"Aynan. Jadvalda solishtiramiz."},{"board":{"title":"Mushuk va tosh","steps":[{"k":"table","head":["Belgi","Mushuk (ti­rik)","Tosh (jon­siz)"],"rows":[["Tuzi­lish","hujay­ralar­dan iborat","hujay­rasi yoʻq"],["Oziq­lanish","ovqat yeydi","ovqat kerak emas"],["Nafas olish","kis­lorod kerak","kerak emas"],["Oʻsish","kichik­dan kat­taga","oʻzi oʻs­maydi"],["Koʻ­payish","bola tugʻadi","koʻ­pay­maydi"],["Taʼ­sirga javob","qoʻrqsa qochadi","tashqi kuchga boʻy­sunadi"]],"w":[28,36,36]}]}},{"who":"nur","text":"Barcha tirik organizmlar — oʻsimlik, hayvon, odam — hujayraviy tuzilishga ega va oʻxshash kimyoviy elementlardan iborat."},{"board":{"title":"Hujayra","steps":[{"k":"big","t":"HUJAYRA","s":"tiriklikning eng kichik birligi","c":"y"},{"k":"note","t":"hamma xossa shu yerda mujassam","c":"g"}]}},{"ask":{"q":"Ali, tiriklikning barcha xossalarini oʻzida saqlagan eng kichik birlik nima?","o":["Molekula","Hujayra","Atom"],"a":1,"ok":"Qoyil! 👏","no":"Bu hujayra. Molekula undan kichik, lekin tirik emas."}},{"joke":true}]},{"title":"Tiriklikning 8 xususiyati","items":[{"who":"nur","text":"Tiriklikning xususiyatlari sakkizta. Koʻp tuyulsa-da, hammasi sening kundalik hayotingda bor."},{"board":{"title":"8 xususiyat","steps":[{"k":"pic","pic":"eightrows"}]}},{"who":"nur","text":"Birinchisi — moddalar almashinuvi: organizm muhitdan modda oladi, keraksizini chiqaradi. Telefonga oʻxshatamiz: zaryad qilasan (modda olasan), telefon ishlaydi va qiziydi (energiya sarflaydi)."},{"who":"ali","text":"Mening telefonim tez zaryadsizlanadi, ustoz 😄 ish koʻp-da"},{"who":"nur","text":"Moddalar almashinuvining ikki tomoni bor."},{"board":{"title":"Ikki tomon","steps":[{"k":"pic","pic":"assimdis"}]}},{"who":"nur","text":"Assimilyatsiya — qurish: ovqatdan tanangga kerakli murakkab moddalarni yasash, energiya sarflanadi. Dissimilyatsiya — buzish: moddani parchalab energiya olish."},{"who":"nur","text":"Mushak oʻsishi — assimilyatsiya. Yugurganda quvvat olish — dissimilyatsiya."},{"board":{"title":"Assimilyatsiya va dissimilyatsiya","steps":[{"k":"table","head":["Belgi","Assi­mil­yat­siya","Dis­simil­yat­siya"],"rows":[["Mohi­yati","modda yasash","modda par­cha­lash"],["Ener­giya","sarf­lanadi","ajra­lib chi­qadi"],["Misol","mushak oʻsi­shi","yugu­rishda quvvat"],["Natija","hujayra tik­lanadi","hayot uchun quvvat"]],"w":[26,37,37]}]}},{"who":"ali","text":"Ular bir-biriga bogʻliq boʻlsa kerak?"},{"who":"nur","text":"Albatta: yasash uchun energiya kerak, energiyani esa parchalanishdan olamiz. Ikkalasi birga — metabolizm."},{"ask":{"q":"Ali, mushak oʻsishida qaysi jarayon ustun?","o":["Assimilyatsiya","Dissimilyatsiya","Ajratish"],"a":0,"ok":"Barakalla! 🎉","no":"Yangi modda yasalsa — bu assimilyatsiya."}},{"who":"nur","text":"Oziqlanish va nafas olish. Ovqat — qurilish materiali va yoqilgʻi. Nafas olganda ozuqa moddalari asosan kislorod taʼsirida parchalanadi va energiya ajraladi."},{"who":"ali","text":"Yaʼni biz ham sekin «yonamiz»? 🔥"},{"who":"nur","text":"Maʼlum maʼnoda ha, juda sekin va tartibli. Shuning uchun tanamiz issiq. Modda almashinuvidan chiqqan keraksiz, zaharli moddalar esa ajratish orqali chiqariladi: ter, siydik, nafas."},{"who":"nur","text":"Endi tana haroratini koʻramiz."},{"board":{"title":"Gomeostaz","steps":[{"k":"pic","pic":"thermo"}]}},{"who":"nur","text":"Sovuqda titraymiz: mushaklar issiqlik ishlab chiqaradi. Issiqda terlaymiz: ter bugʻlanib tanani sovutadi. Harorat deyarli oʻzgarmaydi. Bu — gomeostaz: ichki muhitni meʼyorda ushlab turish."},{"who":"ali","text":"Demak, tana oʻzi «termostat» ekan! Konditsioner kabi."},{"who":"nur","text":"Zoʻr oʻxshatish, Ali."},{"board":{"title":"Qoʻzgʻaluvchanlik","steps":[{"k":"pic","pic":"sunturn"}]}},{"who":"nur","text":"Qoʻzgʻaluvchanlik — tashqi taʼsirga javob. Kungaboqar quyoshga qarab buriladi. Oʻsimlik ham harakatlanadi, faqat juda sekin, shuning uchun sezmaymiz. Hayvonlar esa ovqat topish va xavfdan qochish uchun tez harakatlanadi."},{"ask":{"q":"Ali, issiqda terlab tana haroratining bir xil qolishi nima deyiladi?","o":["Gomeostaz","Assimilyatsiya","Koʻpayish"],"a":0,"ok":"Ana endi gap boshqa! 🔥","no":"Ichki muhitni meʼyorda ushlab turish — gomeostaz."}},{"joke":true},{"who":"nur","text":"Koʻpayish — tiriklik davom etishining eng muhim sharti. Koʻpayganda irsiyat va oʻzgaruvchanlik namoyon boʻladi."},{"board":{"title":"Irsiyat","steps":[{"k":"pic","pic":"heredity"}]}},{"who":"nur","text":"Bola ota-onasiga oʻxshaydi — bu irsiyat. Lekin aynan oʻxshamaydi, oʻziga xos tomonlari bor — bu oʻzgaruvchanlik. Irsiyat turni saqlaydi, oʻzgaruvchanlik tur xilma-xilligini oshiradi."},{"who":"ali","text":"Men dadamga oʻxshayman, ukam esa onamga. Bu ham irsiyatmi?"},{"who":"nur","text":"Ha, ikkalasi ham irsiyat: har bolada belgilar turlicha birikadi. Buni genetikada chuqur koʻramiz."},{"who":"nur","text":"Oʻsish va rivojlanish — organizmning kattalashishi va yangi sifatlar olishi. U ozuqa hisobiga amalga oshadi. Sen ham yil sayin boʻyingni choʻzyapsan."},{"who":"nur","text":"Va energiyaning yoʻli: Quyosh → oʻsimlik → hayvon → boshqa hayvon. Energiya organik moddalar bilan oʻtadi."},{"board":{"title":"Energiya oqimi","steps":[{"k":"pic","pic":"energyflow"}]}},{"who":"ali","text":"Quyon oʻtni yeydi, tulki quyonni. Men esa palovni yeyman 😄"},{"who":"nur","text":"Sen ham zanjirning bir halqasisan. Endi sakkiz xususiyatni jadvalga yigʻamiz."},{"board":{"title":"Tiriklik xususiyatlari","steps":[{"k":"table","head":["Xusu­siyat","Mohi­yati","Hayo­tiy misol"],"rows":[["Mod­dalar alma­shi­nuvi","modda olish va chi­qarish","ovqat → quvvat"],["Oziq­lanish","ozu­qani oʻz­lash­tirish","non, meva yeyish"],["Nafas olish","kis­lorod bilan ener­giya olish","yugur­ganda tez nafas"],["Ajra­tish","kerak­siz mod­dani chi­qarish","ter, siydik"],["Qoʻz­gʻa­luv­chan­lik","taʼ­sirga javob berish","kun­gabo­qar buri­lishi"],["Hara­kat­lanish","joyni oʻz­gar­tirish","yugu­rish, suzish"],["Koʻ­payish","oʻziga oʻx­shashni yara­tish","urugʻ­dan oʻsim­lik"],["Oʻsish, rivoj­lanish","kat­tala­shish va oʻz­garish","bola­ning ulgʻa­yishi"]],"w":[34,34,32]}]}},{"ask":{"q":"Ali, oʻsimlik ildizining suv tomonga oʻsishi qaysi xususiyatga misol?","o":["Qoʻzgʻaluvchanlik","Ajratish","Koʻpayish"],"a":0,"ok":"Barakalla, davom et!","no":"Tashqi taʼsirga (suvga) javob — qoʻzgʻaluvchanlik."}}]},{"title":"Tuzilish darajalari","items":[{"who":"nur","text":"Hayotni olimlar oltita darajada oʻrganadi: eng kichigidan eng kattasigacha."},{"board":{"title":"Tuzilish darajalari","steps":[{"k":"pic","pic":"levels6"}]}},{"who":"nur","text":"Eslab qolish uchun shahar qurilishiga oʻxshatamiz: gʻisht, xona, uy, mahalla, shahar, butun mamlakat."},{"board":{"title":"Shahar oʻxshatishi","steps":[{"k":"table","head":["Daraja","Sha­harda","Tabiatda"],"rows":[["Mole­kula","gʻisht","oqsil, DNK"],["Hujayra","xona","teri, qon hujay­rasi"],["Orga­nizm","uy","mushuk, daraxt"],["Popul­yat­siya-tur","mahalla","koʻl­dagi sazan­lar"],["Bio­geot­senoz","shahar","koʻl, oʻrmon"],["Bios­fera","butun mam­lakat","Yer­dagi butun hayot"]],"w":[34,24,42]}]}},{"who":"ali","text":"Molekula darajasida nima sodir boʻladi, ustoz?"},{"who":"nur","text":"Bu yerda oqsil, nuklein kislota, lipid va uglevod bor. Quyosh energiyasi organik moddalarda kimyoviy energiyaga aylanadi, modda va energiya almashinuvi hamda irsiy axborot berilishi boshlanadi."},{"who":"nur","text":"Hujayra — tuzilish, rivojlanish va vazifa birligi. Hujayra soniga qarab organizm bir hujayrali yoki koʻp hujayrali boʻladi."},{"who":"ali","text":"Amyoba bir hujayrali, odam koʻp hujayrali-a?"},{"who":"nur","text":"Toʻgʻri. Organizm — mustaqil yashaydigan yaxlit tirik tizim, birligi — individ. Populyatsiya — bir tur arealida uzoq yashab, erkin chatishib, serpusht nasl beradigan individlar yigʻindisi. Dastlabki evolutsion oʻzgarishlar shu yerda koʻrinadi."},{"who":"nur","text":"Masalan, bitta koʻldagi sazanlar — populyatsiya. Endi koʻlning oʻzini koʻraylik."},{"board":{"title":"Biogeotsenoz","steps":[{"k":"pic","pic":"biogeo"}]}},{"who":"nur","text":"Biogeotsenoz — turli turlar va ularning yashash sharoiti birgalikda: koʻl, oʻrmon, dala. Unda anorganik va organik moddalar, oʻz ozuqasini oʻzi yaratuvchi (avtotrof) va tayyor ozuqa yeydigan (geterotrof) organizmlar bor. Vazifasi — energiyani toʻplash va taqsimlash."},{"who":"nur","text":"Hamma biogeotsenozlarning yigʻindisi — biosfera."},{"board":{"title":"Biosfera","steps":[{"k":"pic","pic":"biosphere"}]}},{"who":"nur","text":"Biosfera — Yerdagi hayotning barcha koʻrinishini qamrab olgan eng yuqori daraja. Moddalar va energiyaning davriy aylanishi shu yerda koʻrinadi."},{"board":{"title":"6 daraja jadvali","steps":[{"k":"table","head":["Daraja","Bir­ligi","Nima sodir boʻ­ladi"],"rows":[["Mole­kula","mak­romo­lekula","modda-ener­giya alma­shi­nuvi bosh­lanadi"],["Hujayra","hujayra","irsiy axbo­rot beri­ladi"],["Orga­nizm","indi­vid","toʻ­qima va organ­lar ish­laydi"],["Popul­yat­siya-tur","popul­yat­siya","dast­labki evo­lut­sion oʻz­garish"],["Bio­geot­senoz","turlar va sha­roit","ener­giya toʻp­lanadi va taq­sim­lanadi"],["Bios­fera","bio­geot­senoz­lar","mod­dalar davriy ayla­nadi"]],"w":[34,24,42]}]}},{"ask":{"q":"Ali, dastlabki evolutsion oʻzgarishlar qaysi darajada kuzatiladi?","o":["Hujayra","Populyatsiya-tur","Molekula"],"a":1,"ok":"Mana bu boshqa gap! 🎉","no":"Evolutsion oʻzgarishlar populyatsiya-tur darajasida boshlanadi."}},{"joke":true}]},{"title":"Xulosa","items":[{"who":"nur","text":"Umumlashtiramiz. Tiriklikni jonsizdan ajratadigan belgilarni zanjir qilib eslab qol."},{"board":{"title":"Tirik organizm","steps":[{"k":"chain","rows":[["Hujayradan tuzilgan","y"],["Modda va energiya almashinuvi","g"],["Oziqlanadi, nafas oladi, ajratadi","b"],["Taʼsirga javob beradi, harakatlanadi","p"],["Koʻpayadi: irsiyat + oʻzgaruvchanlik","y"],["Oʻsadi va rivojlanadi","g"]]}]}},{"who":"nur","text":"Va oltita daraja: molekula, hujayra, organizm, populyatsiya-tur, biogeotsenoz, biosfera."},{"who":"ali","text":"Shahar oʻxshatishi juda yordam berdi, ustoz. Endi eslab qolaman!"},{"who":"nur","text":"Ana xolos! Oxirgi savol, keyin testda bilimingni sinaymiz."},{"ask":{"q":"Ali, Yerdagi barcha biogeotsenozlar yigʻindisi nima deyiladi?","o":["Populyatsiya","Biosfera","Organizm"],"a":1,"ok":"Qoyil! 👏","no":"Barcha biogeotsenozlar yigʻindisi — biosfera."}},{"joke":true}]}],"jokes":["Ali: «Ustoz, tosh ham tirik emasmi? Hech qayoqqa ketmaydi, oʻzi sabrli!» Ustoz: «Sabrli, lekin ovqatlanmaydi va koʻpaymaydi, Ali» 🪨","Telefon: «Menga zaryad kerak — men ham modda almashinuvini qilyapman!» Ali: «Sen hujayrasiz-ku, telefon 😄»","Ali: «Men ovqatlanaman, nafas olaman, lekin koʻpaymayman. Yarim tirikmanmi?» Ustoz: «Koʻpayish butun tur uchun shart, yakka odamga emas 😄»","Kungaboqar: «Quyoshga qarab burilaman — qoʻzgʻaluvchanlik!» Ali: «Men esa oshxonaga qarab burilaman, palov hidi kelsa 🍲»","Hujayra: «Men eng kichik tirik birlikman!» Molekula: «Men seni yasayman, a?» 🔬","Tulki: «Quyonni yeb energiya oldim!» Quyon: «Men oʻtni yedim, oʻt esa Quyoshni 🌞»","Ali: «Ustoz, gomeostaz — bu konditsionerga oʻxshaydi-ku?» Ustoz: «Tananing oʻz konditsioneri — ter!» 🥵","Biosfera: «Men hamma biogeotsenozni oʻz ichimga olaman!» Koʻl: «Men kichkinaman, lekin hammasi menda bor!» 🌍","Ali: «Olov ham yonadi, harakatlanadi — tirikmi?» Olov: «Men yeyman, lekin hujayram yoʻq 🔥»","Assimilyatsiya: «Men qurdim!» Dissimilyatsiya: «Men energiya berdim, ikkimiz bir jamoamiz!» 🤝","Ali: «Ustoz, 5 daqiqa oʻqidim, miyamda qaysi daraja ishlayapti?» Ustoz: «Hujayra darajasi, Ali — neyronlar!» 🧠","DNK: «Men irsiy axborotni saqlayman!» Ali: «Men esa unutaman, lekin test oldidan eslayman 😅»","Ali: «Ibn Sino tajriba usulini boshlagan. Men ham tajriba qilaman: oʻqimay testga kirsam nima boʻlarkan?» Ustoz: «Natija oldindan maʼlum: xato!» 😏","Biolog: «Hayot — ajoyib!» Ali: «Ha, faqat testsiz boʻlsa 😄»"],"questions":[{"t":"choice","q":"«Biologiya» soʻzi qaysi tildan olingan va nima maʼno beradi?","o":["Yunoncha: bios — hayot, logos — fan","Lotincha: bio — suv, logos — soʻz","Arabcha: hayot haqida kitob","Yunoncha: gen — irsiyat, logos — fan"],"a":0,"w":"Bios — hayot, logos — fan (taʼlimot)."},{"t":"choice","q":"Biologiya atamasi fanga qachon kiritilgan?","o":["1702-yil","1802-yil","1902-yil","1602-yil"],"a":1,"w":"1802-yilda Lamark va Treviranus kiritgan."},{"t":"choice","q":"Biologiya atamasini fanga kimlar kiritgan?","o":["Lamark va Treviranus","Darvin va Mendel","Ibn Sino va Beruniy","Pavlov va Mechnikov"],"a":0,"w":"Fransuz olimi Lamark va nemis olimi Treviranus."},{"t":"choice","q":"Hayvonlar haqidagi fan qaysi?","o":["Botanika","Zoologiya","Sitologiya","Genetika"],"a":1,"w":"Hayvonlarni zoologiya oʻrganadi."},{"t":"choice","q":"Irsiyat va oʻzgaruvchanlikni qaysi fan oʻrganadi?","o":["Genetika","Ekologiya","Botanika","Anatomiya"],"a":0,"w":"Genetika — irsiyat va oʻzgaruvchanlik haqidagi fan."},{"t":"choice","q":"Organizm va muhit aloqasini qaysi fan oʻrganadi?","o":["Ekologiya","Sitologiya","Genetika","Botanika"],"a":0,"w":"Bu ekologiya."},{"t":"choice","q":"Eng dastlabki tadqiqot usullaridan biri qaysi?","o":["Kuzatish","Tajriba","Tarixiy usul","Hujayra nazariyasi"],"a":0,"w":"Kuzatish -tur","dastlabki evolutsion oʻzgarish"],["Biogeotsenoz","energiyani toʻplash va taqsimlash"],["Biosfera","moddalarning davriy aylanishi"]],"w":"Har bir darajaning oʻz vazifasi bor."}]},"9-02":{"id":"9-02","grade":9,"no":2,"title":"Organizmlarning xilma-xilligi","subtitle":"3–7-§ · Viruslar, prokariotlar, oʻsimlik, zamburugʻ, hayvon","sticker":"🦠","stickerName":"Tirik dunyo sayyohi","sections":[{"title":"Viruslar","items":[{"who":"nur","text":"Ali, oldin tirik dunyoni oʻsimlik va hayvonga boʻlardik. Hozir olimlar uni kengroq koʻradi."},{"board":{"title":"Tirik dunyo","steps":[{"k":"pic","pic":"kingdoms"}]}},{"who":"nur","text":"Uchta katta guruh bor: viruslar, prokariotlar (yadrosizlar) va eukariotlar (yadroli). Bugun hammasini koʻramiz."},{"who":"ali","text":"Virus nima, ustoz? Shamollaganda eshitaman 🤧"},{"who":"nur","text":"Virus — hujayrasiz shakl. 1892-yilda D. Ivanovskiy tamaki bargidagi mozaika kasalligini oʻrganib, kasallik qoʻzgʻatuvchi filtrdan ham oʻtib ketishini topdi. Viruslarni oʻrganadigan fan — virusologiya."},{"board":{"title":"Virus tuzilishi","steps":[{"k":"pic","pic":"virusstruct"}]}},{"who":"nur","text":"Virus juda sodda: ichida DNK yoki RNK bor, tashqarida oqsil qobiq — kapsid. Hujayra, ribosoma, moddalar almashinuvi yoʻq."},{"who":"ali","text":"Demak, virus yolgʻiz oʻzi koʻpaymaydi-da?"},{"who":"nur","text":"Toʻgʻri. U hujayra ichi parazitidir. Telefondagi kompyuter virusiga oʻxshatamiz: u oʻzi hech narsa qilolmaydi, lekin telefon ichiga tushsa, uni oʻz ishiga majburlaydi."},{"board":{"title":"Viruslar guruhlari","steps":[{"k":"table","head":["Virus","Asos","Misol"],"rows":[["DNK virus­lari","DNK","bak­terio­fag, ade­novi­rus"],["RNK virus­lari","RNK","gripp, qiza­miq, qutu­rish, ense­falit"]],"w":[32,22,46]}]}},{"ask":{"q":"Ali, virusning oqsil qobigʻi nima deyiladi?","o":["Kapsid","Ribosoma","Vakuola"],"a":0,"ok":"Barakalla! 🎉","no":"Oqsil qobiq — kapsid."}},{"joke":true},{"who":"nur","text":"Virus hujayraga qanday kiradi? Hujayra yuzasida retseptor-oqsil bor, virus unga «kalit»dek mos tushadi."},{"board":{"title":"Virus yoʻli","steps":[{"k":"pic","pic":"viruscycle"}]}},{"who":"nur","text":"Kirgach, hujayra virusning nusxalarini yasay boshlaydi. Nusxalar koʻpayganda hujayra portlaydi va oʻladi, yoki virus kurtaklanib chiqadi."},{"who":"ali","text":"Nega A va B gepatit faqat jigarni zararlaydi?"},{"who":"nur","text":"Chunki ularning retseptori faqat jigar hujayralarida bor. Kalit faqat oʻz qulfiga mos keladi."},{"who":"nur","text":"Bakteriyani yeydigan virus — bakteriofag. Uni 1917-yilda F. de Erell topgan."},{"board":{"title":"Bakteriofag","steps":[{"k":"pic","pic":"phage"}]}},{"who":"nur","text":"Bakteriofag shpritsga oʻxshaydi: ichi boʻsh tayoqchasi orqali DNKsini bakteriya ichiga yuboradi. Boʻsh kapsid tashqarida qoladi. Bakteriya esa oʻladi."},{"who":"ali","text":"Bu foydali-ku, ustoz — bakteriyani yoʻq qiladi!"},{"who":"nur","text":"Ha, viruslar genetik injeneriyada ham ishlatiladi."},{"ask":{"q":"Ali, bakteriofag nimaga kiritadi DNKsini?","o":["Bakteriyaga","Oʻsimlikka","Toshga"],"a":0,"ok":"Qoyil! 👏","no":"Bakteriofag bakteriyani zararlaydi."}}]},{"title":"Prokariotlar","items":[{"who":"nur","text":"Endi prokariotlar. «Pro» — oldin, «karion» — yadro: yadrodan oldingi organizmlar."},{"board":{"title":"Prokariot hujayra","steps":[{"k":"pic","pic":"bactcell"}]}},{"who":"nur","text":"Ularda haqiqiy yadro yoʻq. DNK halqasimon, mitoxondriya va plastida ham yoʻq. Qobigʻi — murein. Jinsiy koʻpaymaydi, oddiy boʻlinadi."},{"who":"ali","text":"Yadrosiz hujayra? Bosh kiyimsiz odamga oʻxshaydi 😄"},{"who":"nur","text":"Yadro bor, faqat u pardasiz — DNK toʻgʻridan-toʻgʻri sitoplazmada yotadi. Prokariotlarga bakteriyalar va koʻk-yashil suvoʻtlar kiradi."},{"who":"nur","text":"Bakteriyalar shakli boʻyicha uch xil."},{"board":{"title":"Bakteriya shakllari","steps":[{"k":"pic","pic":"bactshapes"}]}},{"board":{"title":"Shakllar jadvali","steps":[{"k":"table","head":["Shakl","Koʻ­rini­shi","Misol"],"rows":[["Kokk­lar","shar­simon","sta­filo­kokk"],["Bat­sil­lalar","tayoq­simon","kuy­dir­gi, sil"],["Vib­rion","ver­gul­simon","vabo"],["Spi­rilla","bural­gan","spi­ril­lalar"]],"w":[28,32,40]}]}},{"who":"nur","text":"Noqulay sharoitda bakteriya spora hosil qiladi — qalin qobiqli «uyqu» holati."},{"board":{"title":"Spora","steps":[{"k":"pic","pic":"bactspore"}]}},{"who":"nur","text":"Telefon «uyqu rejimi»ga oʻxshaydi: quvvat tejaydi. Sharoit yaxshilansa, spora yana faol bakteriyaga aylanadi."},{"ask":{"q":"Ali, bakteriyaning noqulay sharoitda hosil qiladigan holati nima?","o":["Spora","Kapsid","Mitselliy"],"a":0,"ok":"Barakalla!","no":"Noqulay sharoitda spora hosil boʻladi."}},{"joke":true},{"who":"nur","text":"Kasallik tarqatuvchi bakteriyalar: sil — sekin, oʻlat, vabo, kuydirgi — tez rivojlanadi. Oʻlatni sichqon va kalamush burgalari tarqatadi."},{"who":"ali","text":"Ulardan qanday saqlanamiz?"},{"who":"nur","text":"Emlash (ichburugʻ, boʻgʻma, qoqshol), dezinfeksiya, filtrdan oʻtgan toza suv. Qoʻlni yuvish ham!"},{"who":"nur","text":"Lekin bakteriyalarning koʻpi foydali. Chirish va achish ularning ishi, sut mahsulotlari, bodring-karam konservasi, silos, sirka — hammasi bakteriyalar hisobiga."},{"who":"nur","text":"Eng qiziq foydalisi — tugunak bakteriyalar."},{"board":{"title":"Tugunak bakteriyalar","steps":[{"k":"pic","pic":"nodules"}]}},{"who":"nur","text":"Ular dukkakli oʻsimlik ildizida yashab, havo azotini oʻzlashtiradi. Bir gektarga yiliga 200 kg gacha azot beradi. Bu tabiatda azot aylanishini taʼminlaydi."},{"board":{"title":"Bakteriyalar roli","steps":[{"k":"table","head":["Foy­dasi","Zarari"],"rows":[["chi­rish, achish","kasal­lik qoʻz­gʻa­tadi"],["sut mah­sulot­lari","ozu­qani buzadi"],["azot toʻp­lani­shi","para­zit yashaydi"]],"w":[50,50]}]}},{"who":"nur","text":"Koʻk-yashil suvoʻtlar ham prokariot. Ularda xlorofill bilan birga koʻk pigment fikotsian bor."},{"board":{"title":"Koʻk-yashil suvoʻtlar","steps":[{"k":"pic","pic":"bluegreen"}]}},{"who":"nur","text":"Xrokokk — bir hujayrali, ossillatoriya — ipsimon, nostok — koloniya. Ular azotni ham oʻzlashtiradi, choʻllarda tuproq hosil boʻlishida qatnashadi. Yaponiya va Xitoyda nostok isteʼmol qilinadi."},{"ask":{"q":"Ali, koʻk-yashil suvoʻtlarning qoʻshimcha pigmenti qaysi?","o":["Fikotsian","Insulin","Gemoglobin"],"a":0,"ok":"Qoyil! 👏","no":"Fikotsian — koʻk pigment."}}]},{"title":"Oʻsimliklar","items":[{"who":"nur","text":"Eukariotlardan birinchisi — oʻsimliklar. Ular ikki katta guruhga boʻlinadi."},{"board":{"title":"Oʻsimliklar","steps":[{"k":"pic","pic":"plantgroups"}]}},{"who":"nur","text":"Tuban oʻsimliklar — suvoʻtlar. Ularning tanasi tallom (qattana), organlari yoʻq. Yuksak oʻsimliklarda poya, barg, ildiz va toʻqimalar bor."},{"who":"ali","text":"Suvoʻti bir hujayrali ham boʻladimi?"},{"who":"nur","text":"Ha: bir hujayrali, koloniya va koʻp hujayrali boʻladi."},{"board":{"title":"Tuban va yuksak","steps":[{"k":"table","head":["Belgi","Tuban","Yuksak"],"rows":[["Tana","tallom","poya, barg, ildiz"],["Toʻ­qima","yoʻq","bor"],["Misol","suvoʻt­lar","gul, daraxt"]],"w":[30,32,38]}]}},{"who":"nur","text":"Oʻsimliklarning tabiatdagi roli juda katta. Ular kislorod beradi, suv muvozanatini saqlaydi, iqlimni yumshatadi, tuproq hosil qiladi va barcha ozuqa zanjirining boshlanishi."},{"who":"ali","text":"Yaʼni bitta daraxt — kichik fabrika!"},{"who":"nur","text":"Aynan. Ular xomashyo ham beradi: yogʻoch, paxta, dori. Shuning uchun tabiatni muhofaza qilish kerak."},{"ask":{"q":"Ali, suvoʻtlarning tanasi nima deyiladi?","o":["Tallom","Mitselliy","Kapsid"],"a":0,"ok":"Barakalla! 🎉","no":"Suvoʻtlar tanasi — tallom."}},{"joke":true}]},{"title":"Zamburugʻlar","items":[{"who":"nur","text":"Zamburugʻlar — alohida dunyo. Ularda xlorofill ham, plastida ham yoʻq."},{"who":"nur","text":"Bunga sabab — geterotrof oziqlanishi: tayyor organik modda yeydi. Baʼzilari parazit, baʼzilari saprofit (oʻlik qoldiq ustida). Taxminan 100 000 tur bor."},{"board":{"title":"Mitselliy","steps":[{"k":"pic","pic":"hyphae"}]}},{"who":"nur","text":"Tanasi — mitselliy, u ingichka ipchalar — gifalardan iborat. Tuban zamburugʻlarda (oq poʻpanak) toʻsiq yoʻq. Yuksaklarida (penitsill) toʻsiq bor."},{"who":"ali","text":"Oq poʻpanak — nonda oʻsadigan mogʻorlarmi?"},{"who":"nur","text":"Ha, Ali! Non uzoq yotsa, shu paydo boʻladi. Penitsill esa antibiotik beradi."},{"who":"nur","text":"Achitqi — bir hujayrali zamburugʻ. Kurtaklanib koʻpayadi."},{"board":{"title":"Achitqi","steps":[{"k":"pic","pic":"yeast"}]}},{"who":"nur","text":"Achitqi shakarni spirt va gazga parchalaydi. Xamir shu gaz hisobiga koʻpchiydi — non yumshoq boʻladi."},{"ask":{"q":"Ali, achitqi shakarni nimaga aylantiradi?","o":["Spirt va gaz","Kislorod","Oqsil"],"a":0,"ok":"Qoyil! 👏","no":"Spirt va karbonat angidrid gazi hosil boʻladi."}},{"who":"nur","text":"Qalpoqchali zamburugʻlar: oyoqcha, qalpoqcha va yer ostida mitselliy. Qalpoqcha ostida sporalar yetiladi."},{"board":{"title":"Qoʻziqorin","steps":[{"k":"pic","pic":"mushroom"}]}},{"who":"ali","text":"Shamolda sporalar tarqaladimi?"},{"who":"nur","text":"Ha. Zararli zamburugʻlar ham bor. Ular oʻsimlikni kasallantiradi."},{"board":{"title":"Zang zamburugʻi","steps":[{"k":"pic","pic":"rust"}]}},{"who":"nur","text":"Zang zamburugʻi bahorda zirkda, yozda bugʻdoyda yashaydi. Zirk — oraliq xoʻjayin. Gʻoʻzani esa vertisill kasalligi (vilt) quritadi. Kurash: chidamli navlar va almashlab ekish."},{"joke":true},{"who":"nur","text":"Zamburugʻ va oʻsimlik hamkorligi ham bor — mikoriza."},{"board":{"title":"Mikoriza","steps":[{"k":"pic","pic":"mycorrhiza"}]}},{"who":"nur","text":"Zamburugʻ ildizga suv va tuz beradi, oʻsimlik unga uglevod beradi. Qayin va emanda — ektotrof, oʻt oʻsimliklarda endotrof mikoriza boʻladi. Bu — simbioz."},{"who":"nur","text":"Eng qiziq hamkorlik — lishayniklar."},{"board":{"title":"Lishaynik","steps":[{"k":"pic","pic":"lichen"}]}},{"who":"nur","text":"Lishaynik — zamburugʻ va suvoʻtining simbiozi. Zamburugʻ ipchalari suv va tuz ushlaydi, suvoʻti fotosintez qiladi. Ularning 26 000 ga yaqin turi bor."},{"who":"ali","text":"Ular qayerda oʻsadi?"},{"who":"nur","text":"Toshda, daraxt poʻstlogʻida. Kladoniya shimol bugʻusining ozigʻi. Lishayniklar havo toza joyda oʻsadi — shuning uchun havo ifloslanishining koʻrsatkichi. Ular toshda tuproq hosil boʻlishini boshlaydi."},{"board":{"title":"Zamburugʻlar jadvali","steps":[{"k":"table","head":["Guruh","Xusu­siyati","Misol"],"rows":[["Achitqi","kur­tak­lanadi","non, pivo"],["Qoʻ­ziqo­rin","qal­poq­chali","sham­pinon"],["Mogʻor","mit­sel­liyli","oq poʻ­panak"],["Para­zit","kasal­lik beradi","zang, vilt"],["Lishay­nik","zam­burugʻ + suvoʻti","kla­doniya"]],"w":[34,36,30]}]}},{"ask":{"q":"Ali, lishaynik qaysi ikki organizmning hamkorligi?","o":["Zamburugʻ va suvoʻti","Bakteriya va virus","Hayvon va oʻsimlik"],"a":0,"ok":"Barakalla! 🎉","no":"Zamburugʻ va suvoʻti simbiozi."}}]},{"title":"Hayvonlar","items":[{"who":"nur","text":"Oxirgi guruh — hayvonlar. Ular oʻsimlikka oʻxshab hujayradan tuzilgan, moddalar almashinuvi va irsiyati bor."},{"who":"ali","text":"Unda farqi nima, ustoz?"},{"who":"nur","text":"Hayvon geterotrof: tayyor ovqat yeydi. Hujayrasida sellyuloza qobiq va vakuola yoʻq."},{"board":{"title":"Hayvonlar","steps":[{"k":"pic","pic":"animaltree"}]}},{"who":"nur","text":"Hayvonlar bir hujayrali va koʻp hujayralilarga boʻlinadi. Koʻp hujayralilar yana umurtqasizlar va umurtqalilarga ajraladi."},{"board":{"title":"Sodda hayvonlar","steps":[{"k":"pic","pic":"protozoa"}]}},{"who":"nur","text":"Amyoba soxta oyoq, tufelka kiprikchalar bilan harakatlanadi. Ular yorugʻlik, ovqat tomon yoʻnaladi — bu taksis. Noqulay paytda sista hosil qiladi."},{"who":"ali","text":"Sista — bu spora kabimi?"},{"who":"nur","text":"Juda oʻxshash, Ali: qopqoqli «uyqu» holati."},{"who":"nur","text":"Hayvonlar tabiatda ham katta rol oʻynaydi: changlatadi, urugʻ tarqatadi, ozuqa zanjirini tuzadi, tuproqni yumshatadi. Baʼzilari biofiltr: suvni tozalaydi."},{"who":"nur","text":"Zararlisi ham bor: chivin, burga kasallik tarqatadi, baʼzi yirtqichlar ekinga zarar yetkazadi."},{"board":{"title":"Hayvonlar roli","steps":[{"k":"table","head":["Foy­dasi","Zarari"],"rows":[["chang­latish","kasal­lik tar­qatadi"],["urugʻ tar­qatish","ekinni yeydi"],["tuproq hosil boʻ­ladi","yirt­qich zarari"]],"w":[50,50]}]}},{"ask":{"q":"Ali, amyobaning harakat organi qaysi?","o":["Soxta oyoq","Kiprikcha","Qanot"],"a":0,"ok":"Qoyil! 👏","no":"Amyoba soxta oyoq bilan harakatlanadi."}},{"joke":true}]}],"jokes":["Virus: «Men kompyuterga kirdim!» Antivirus: «Men esa hujayraga kirmoqchi edim 😄»","Ali: «Ustoz, virus tirikmi?» Ustoz: «Hujayradan tashqarida oʻzi koʻpaymaydi, Ali!» 🦠","Bakteriofag: «Men shprits kabiman!» Bakteriya: «Menga injeksiya kerak emas edi 💉»","Prokariot: «Yadrom yoʻq.» Eukariot: «Mening yadrom bor, lekin soch yoʻq 😄»","Spora: «Uyquda yotibman, tegmang!» Bakteriya: «Sharoit yaxshilansa, uygʻonaman ⏰»","Tugunak bakteriya: «Men havodan azot olaman!» Dukkakli: «Menga bepul oʻgʻit 😎»","Ali: «Ustoz, achitqi xamirni nega koʻpchitadi?» Ustoz: «Gaz chiqaradi — non yumshoq boʻladi 🍞»","Zirk: «Men zang zamburugʻiga mehmonman.» Bugʻdoy: «Meni-chi, meni?» 🌾","Zamburugʻ: «Men fotosintez qilolmayman.» Suvoʻti: «Men qilaman — bir uyda yashaymizmi?» Lishaynik 🤝","Ali: «Qoʻziqorin oʻsimlikmi?» Ustoz: «Yoʻq, u alohida dunyo!» 🍄","Amyoba: «Men shaklimni tez oʻzgartiraman!» Tufelka: «Men esa kiprikchamni silkitaman 👁️»","Chivin: «Men ham biologiya darsida ishtirok etaman!» Ali: «Faqat kasallik tarqatuvchi sifatida 🦟»","Ali: «Ustoz, lishayniklar toza havo sevadi.» Ustoz: «Shuning uchun ular koʻrsatkich!» 🌿","Ali: «Bakteriyalar faqat zararli-ku?» Ustoz: «Yoʻq, sutdan qatiq ham ular yasaydi 🥛»"],"questions":[{"t":"choice","q":"Virusologiya nimani oʻrganadi?","o":["Viruslarni","Bakteriyalarni","Zamburugʻlarni","Suvoʻtlarni"],"a":0,"w":"Virusologiya — viruslar haqidagi fan."},{"t":"choice","q":"Viruslarni kim kashf etgan?","o":["D. Ivanovskiy","Ch. Darvin","G. Mendel","I. Pavlov"],"a":0,"w":"1892-yilda D. Ivanovskiy tamaki mozaikasini oʻrganib kashf etgan."},{"t":"choice","q":"Viruslar qaysi tur parazitlar?","o":["Hujayra ichi","Hujayra tashqarisi","Faqat oʻsimlik tanasi","Faqat suv"],"a":0,"w":"Viruslar — hujayra ichi parazitlari."},{"t":"choice","q":"Virusning oqsil qobigʻi nima deyiladi?","o":["Kapsid","Tallom","Mitselliy","Spora"],"a":0,"w":"Kapsid."},{"t":"choice","q":"Viruslar tarkibida nima boʻladi?","o":["DNK yoki RNK","Faqat DNK","Faqat oqsil","DNK va RNK birga"],"a":0,"w":"Virusda DNK yoki RNK boʻladi."},{"t":"choice","q":"Bakteriofagni kim topgan?","o":["F. de Erell","D. Ivanovskiy","Lamark","R. Mendel"],"a":0,"w":"1917-yilda F. de Erell."},{"t":"choice","q":"Qaysi kasallik DNK saqlovchi virusdan?","o":["Adenovirus kasalligi","Gripp","Qizamiq","Quturish"],"a":0,"w":"Adenovirus — DNK saqlovchi."},{"t":"choice","q":"Gripp virusi qaysi irsiy moddaga ega?","o":["RNK","DNK","DNK va RNK","Oqsil"],"a":0,"w":"Gripp — RNK saqlovchi."},{"t":"choice","q":"Bakteriofag hujayraga nimani kiritadi?","o":["DNKsini","Kapsidini","Hammasini","Dum ipchalarini"],"a":0,"w":"Faqat DNK kiradi, kapsid tashqarida qoladi."},{"t":"choice","q":"Prokariotlarda nima yoʻq?","o":["Haqiqiy yadro","DNK","Sitoplazma","Qobiq"],"a":0,"w":"Prokariotlarda yadro pardasi yoʻq."},{"t":"choice","q":"Prokariot DNKsi qanday shaklda?","o":["Halqasimon","Chiziqsimon","Spiral","Tarmoqsimon"],"a":0,"w":"Halqasimon."},{"t":"choice","q":"Bakteriya qobigʻi nimadan iborat?","o":["Murein","Sellyuloza","Xitin","Kapsid"],"a":0,"w":"Murein."},{"t":"choice","q":"Tayoqsimon bakteriyalar qanday ataladi?","o":["Batsillalar","Kokklar","Vibrionlar","Spirillalar"],"a":0,"w":"Batsillalar."},{"t":"choice","q":"Oʻlatni qaysi hayvonlar tarqatadi?","o":["Burgalar","Qushlar","Baliqlar","Qurbaqalar"],"a":0,"w":"Sichqon va kalamush burgalari."},{"t":"choice","q":"Dukkaklilar ildizida qaysi bakteriyalar yashaydi?","o":["Tugunak","Sut","Sirka","Chirituvchi"],"a":0,"w":"Tugunak bakteriyalar havo azotini oʻzlashtiradi."},{"t":"cho anoidlar","sticker":"🔬","stickerName":"Hujayra kashfiyotchisi","sections":[{"title":"Hujayra tarixi","items":[{"who":"nur","text":"Ali, bugun hujayra dunyosiga kiramiz. Avval savol: hujayrani birinchi boʻlib kim koʻrgan?"},{"who":"ali","text":"Bilmayman, ustoz. Mikroskop kerak boʻlgandir?"},{"who":"nur","text":"Toʻgʻri. 1665-yilda ingliz olimi Robert Guk daraxt poʻstlogʻining poʻkagidan yupqa kesma qilib, mikroskopda qaradi."},{"board":{"title":"Guk kashfiyoti","steps":[{"k":"pic","pic":"cork"}]}},{"who":"nur","text":"U poʻkak bir butun emas, mayda boʻshliqlardan — katakchalardan iborat ekanini koʻrdi va «sellula» (katakcha) deb atadi. «Hujayra» soʻzi ham shu maʼnoni beradi."},{"who":"ali","text":"Asalarining chuqurchalariga oʻxshar ekan 🐝"},{"who":"nur","text":"Yaxshi oʻxshatish. Keyin boshqa olimlar ham kashfiyot qildi. Hammasini yilma-yil jadvalga yozaman."},{"board":{"title":"Hujayra tarixi","steps":[{"k":"table","head":["Yil","Olim","Kash­fiyot"],"rows":[["1665","R. Guk","katak­cha­larni koʻrdi"],["1671","Mal­pigi, Gryu","oʻsim­lik hujay­rasi tuzi­lishi"],["1680","Leven­guk","erit­rot­sit, bak­teriya"],["1831","R. Braun","hujay­rada yadro bor"],["1839","Pur­kine","pro­top­lazma nomi"],["1838","Shley­den, Shvann","hujayra naza­riyasi"]],"w":[24,30,46]}]}},{"ask":{"q":"Ali, hujayrada yadro borligini kim aniqlagan?","o":["R. Braun","R. Guk","Levenguk"],"a":0,"ok":"Barakalla! 🎉","no":"Yadroni 1831-yilda ingliz botanigi R. Braun topgan."}},{"who":"nur","text":"1838–1839-yillarda nemis olimlari — botanik Shleyden va zoolog Shvann — hujayra nazariyasini yaratdi. Keyin Virxov hujayra faqat hujayradan koʻpayishini isbotladi, K. Ber esa koʻp hujayrali organizm bitta zigotadan rivojlanishini koʻrsatdi."},{"who":"ali","text":"Zigota nima, ustoz?"},{"who":"nur","text":"Urugʻlangan tuxum hujayra. Sen ham bir paytlar bitta zigota boʻlgansan 😄 Endi nazariyaning besh qoidasini yozaman."},{"board":{"title":"Hujayra nazariyasi","steps":[{"k":"chain","rows":[["Barcha tirik tana hujayradan iborat","y"],["Yangi hujayra faqat boʻlinishdan paydo boʻladi","g"],["Hamma organizmning kelib chiqishi bir xil","b"],["Hujayra — tuzilish va vazifa birligi","p"],["Har hujayra mustaqil yashay oladi","y"]]}]}},{"who":"nur","text":"Bu nazariya hamma organizm bir xil asosga ega ekanini isbotladi. Bizning olimlarimiz — akademik K. Zuparov va J. Hamidov ham hujayra sohasida katta ish qilgan."},{"ask":{"q":"Ali, yangi hujayralar qanday paydo boʻladi?","o":["Faqat boʻlinishdan","Oʻzidan-oʻzi","Tosh ichidan"],"a":0,"ok":"Ana xolos! 👏","no":"Yangi hujayra faqat avvalgi hujayra boʻlinishidan hosil boʻladi."}},{"joke":true}]},{"title":"Oʻrganish usullari","items":[{"who":"nur","text":"Hujayra juda kichik. Uni qanday oʻrganamiz? Birinchisi — mikroskop."},{"board":{"title":"Mikroskoplar","steps":[{"k":"pic","pic":"microscopes"}]}},{"who":"nur","text":"Yorugʻlik mikroskopida obyektiv va okulyar bor. Obyektiv predmetni kattalashtiradi, okulyar tasvirni yana kattalashtiradi. U 2000 martagacha kattalashtiradi. Dastlabki mikroskoplar esa atigi 10–40 marta kattalashtirgan."},{"who":"ali","text":"2000 marta! Telefon kamerasidan zoʻrmi?"},{"who":"nur","text":"Telefon kamerasi taxminan 2–5 marta yaqinlashtiradi 😄 Muhimi kattalashtirish emas, koʻrish kuchi: yaqin ikki nuqtani alohida koʻra olish."},{"who":"nur","text":"Elektron mikroskopda esa yorugʻlik emas, elektronlar oqimi ishlaydi. U 200 000 martagacha kattalashtiradi va ribosoma, endoplazmatik toʻr, mikronaychalarni koʻrsatdi."},{"who":"nur","text":"Yana ikkita usul bor. Sitokimyoviy usulda hujayra boʻyoq bilan boʻyaladi: qaysi modda qayerda ekani koʻrinadi. Sentrifugalashda esa toʻqima maydalanib, aylantirib organoidlar bir-biridan ajratiladi."},{"who":"ali","text":"Sentrifuga kir yuvish mashinasining quritgichiga oʻxshaydi-ku!"},{"who":"nur","text":"Aynan! U ham aylantirib ogʻirini chetga uloqtiradi. Jadvalga yigʻamiz."},{"board":{"title":"Tadqiqot usullari","steps":[{"k":"table","head":["Usul","Nima beradi","Misol"],"rows":[["Yorugʻ­lik mik­ros­kop","2000 mar­taga­cha","hujayra shakli"],["Elekt­ron mik­ros­kop","200 000 mar­taga­cha","ribo­soma"],["Sito­kim­yoviy","modda joyini koʻr­satadi","boʻyoq bilan"],["Sent­rifu­galash","orga­noid­larni ajra­tadi","yadro, mito­xond­riya"]],"w":[30,36,34]}]}},{"ask":{"q":"Ali, hujayra organoidlarini bir-biridan ajratish usuli qaysi?","o":["Sentrifugalash","Kuzatish","Sovutish"],"a":0,"ok":"Qoyil! 👏","no":"Maydalangan toʻqimani aylantirib organoidlar ajratiladi — sentrifugalash."}},{"joke":true}]},{"title":"Eukariot hujayra","items":[{"who":"nur","text":"Endi eukariot hujayra. «Eu» — haqiqiy, «karion» — yadro: yadrosi haqiqiy hujayralar. Ularga sodda hayvon, zamburugʻ, oʻsimlik va hayvon kiradi."},{"who":"ali","text":"Hujayralar hammasi bir xilmi?"},{"who":"nur","text":"Yoʻq, vazifasiga qarab shakli boshqa."},{"board":{"title":"Hujayra shakllari","steps":[{"k":"pic","pic":"cellshapes"}]}},{"who":"nur","text":"Tuxum hujayra yumaloq, nerv hujayrasi uzun oʻsimtali (telefon simiga oʻxshaydi), biriktiruvchi toʻqima hujayrasi yulduzsimon, leykotsit esa amyobadek shaklini oʻzgartiradi."},{"who":"nur","text":"Kattaligi ham har xil. Koʻpi 10–100 mikrometr. Tarvuz hujayrasini oddiy koʻz bilan koʻrish mumkin. Eng kattasi — qush tuxumi: tuyaqush tuxumi 100 grammdan 1,5 kilogrammgacha. Eritrotsit esa bor-yoʻgʻi 10⁻⁹ gramm."},{"who":"ali","text":"Tuxum ham bitta hujayra ekanmi? Nonushtada yeyman-ku 🍳"},{"who":"nur","text":"Ha, sarigʻi bitta katta hujayra! Har eukariot hujayra uch qismdan iborat: tashqi membrana, sitoplazma va yadro. Endi ikki hujayrani ichidan koʻramiz."},{"board":{"title":"Hayvon hujayrasi","steps":[{"k":"pic","pic":"animalcell"}]}},{"board":{"title":"Oʻsimlik hujayrasi","steps":[{"k":"pic","pic":"plantcell"}]}},{"who":"nur","text":"Oʻsimlik hujayrasida qalin sellyuloza qobiq, vakuola va plastidalar bor. Hayvon hujayrasi qobigʻi yupqa va elastik, shuning uchun tayanch vazifasini bajarmaydi. Zamburugʻ qobigʻi esa sellyulozadan emas, xitinsimon moddadan."},{"board":{"title":"Hujayralarni solishtirish","steps":[{"k":"table","head":["Belgi","Hayvon","Oʻsim­lik"],"rows":[["Qobiq","yupqa","sell­yulo­za, qalin"],["Plas­tida","yoʻq","bor"],["Vakuola","kichik yoki yoʻq","katta"],["Sent­riola","bor","koʻ­pida yoʻq"]],"w":[30,30,40]}]}},{"ask":{"q":"Ali, qaysi hujayrada xloroplast bor?","o":["Oʻsimlik","Hayvon","Ikkalasida ham"],"a":0,"ok":"Barakalla! 🎉","no":"Plastidalar faqat oʻsimlik hujayrasiga xos."}},{"joke":true}]},{"title":"Membrana","items":[{"who":"nur","text":"Hujayra tashqi muhitdan nima bilan ajralgan? Plazmatik membrana bilan. Uni darvozaboni bor eshikka oʻxshatamiz."},{"board":{"title":"Membrana","steps":[{"k":"pic","pic":"membrane"}]}},{"who":"nur","text":"Membrana himoya qiladi, kerakli moddani oʻtkazadi, keraksizini toʻxtatadi. Bu — yarim oʻtkazuvchanlik. Unda maxsus kanallar bor."},{"who":"ali","text":"Nega Na+ tashqariga, K+ ichkariga oʻtkaziladi?"},{"who":"nur","text":"Hujayra ichida K+ koʻp, tashqarisida Na+ koʻp boʻlishi kerak. Na+ ni tashqariga chiqarish esa «oqimga qarshi» suzishga oʻxshaydi: kuch kerak, yaʼni ATF energiyasi. Bu faol transport."},{"who":"nur","text":"Katta zarrachalar ham oʻtadi: ikki yoʻl bor."},{"board":{"title":"Endositoz","steps":[{"k":"pic","pic":"phago"}]}},{"who":"nur","text":"Fagositoz — qattiq zarrachani «yutish». Amyoba shunday oziqlanadi, leykotsit esa bakteriyani yutib bizni himoya qiladi. Pinositoz — suyuqlik tomchilarini «ichish». Oʻsimlik va bakteriya devori qalin, shuning uchun ularda fagositoz yoʻq."},{"who":"nur","text":"Ikkalasi endositoz. Teskarisi — ektositoz: hazm boʻlmagan qoldiq tashqariga chiqariladi."},{"board":{"title":"Membrana orqali oʻtish","steps":[{"k":"table","head":["Jara­yon","Nima oʻtadi","Misol"],"rows":[["Fago­sitoz","qattiq zarra","amyo­ba, ley­kot­sit"],["Pino­sitoz","suyuq­lik tom­chisi","bak­teri­ya, zam­burugʻ"],["Ekto­sitoz","qoldiq chi­qadi","hazm boʻl­magan modda"],["Faol trans­port","ion, ATF kerak","Na+, K+"]],"w":[26,36,38]}]}},{"ask":{"q":"Ali, amyoba qattiq ovqatni qanday yutadi?","o":["Fagositoz","Pinositoz","Ektositoz"],"a":0,"ok":"Qoyil! 👏","no":"Qattiq zarrachani yutish — fagositoz."}},{"joke":true}]},{"title":"Organoidlar","items":[{"who":"nur","text":"Endi hujayra ichidagi organoidlar. Hujayrani fabrikaga oʻxshatamiz: har organoidning oʻz sexi bor."},{"who":"nur","text":"Sitoplazma — yarim suyuq muhit, hamma organoidni birlashtiradi. Asosiy modda almashinuvi shu yerda ketadi. Undagi mayda naychalar va iplar — hujayra skeleti."},{"who":"nur","text":"Birinchi sex — endoplazmatik toʻr: hujayraning ichki yoʻllari. U ikki xil."},{"board":{"title":"Endoplazmatik toʻr","steps":[{"k":"pic","pic":"er"}]}},{"who":"nur","text":"Donador toʻrda ribosomalar dona-dona yopishgan, u oqsil yasaydi va tashiydi. Silliq toʻr yogʻ va uglevod yasaydi. Jigar hujayralarida glikogen shu yerda sintezlanadi."},{"who":"ali","text":"Ribosoma nima, ustoz?"},{"who":"nur","text":"Oqsil sintez qiluvchi mayda organoid: katta va kichik ikki boʻlakdan iborat, membranasi yoʻq. Ribosomani yadrochada yasaladi, keyin sitoplazmaga chiqadi. Oqsilni bir necha oʻnta ribosoma birga yasaydi — ularni poliribosoma deymiz."},{"who":"nur","text":"Yoʻllar orqali kelgan mahsulot Golji majmuasiga boradi."},{"board":{"title":"Golji majmuasi","steps":[{"k":"pic","pic":"golgi"}]}},{"who":"nur","text":"Golji — qadoqlash va pochta sexi. Oqsil, yogʻ kelib oʻzgaradi, pufakchaga oʻraladi va kerakli joyga joʻnatiladi. Membrananing yangilanishi ham shu majmua hisobiga."},{"ask":{"q":"Ali, hujayrada oqsilni kim yasaydi?","o":["Ribosoma","Lizosoma","Vakuola"],"a":0,"ok":"Barakalla!","no":"Oqsil sintezi — ribosoma vazifasi."}},{"joke":true},{"who":"nur","text":"Eng muhim sex — energiya stansiyasi, mitoxondriya."},{"board":{"title":"Mitoxondriya","steps":[{"k":"pic","pic":"mito"}]}},{"who":"nur","text":"Mitoxondriyaning ikki membranasi bor: tashqisi silliq, ichkisi burmali — kristalar. Kristalarda energiya ishlab chiqaruvchi fermentlar joylashgan. Asosiy vazifasi — ATF sintezi."},{"who":"ali","text":"Qaysi hujayrada koʻp boʻladi?"},{"who":"nur","text":"Faol ishlaydigan hujayrada. Uchuvchi qushning koʻkrak mushagida uchmaydigan qushnikidan ancha koʻp. Mitoxondriya yarim mustaqil: oʻzining DNK, RNK va ribosomasi bor va boʻlinib koʻpayadi."},{"who":"nur","text":"Endi faqat oʻsimlikka xos organoidlar: plastidalar."},{"board":{"title":"Plastidalar","steps":[{"k":"pic","pic":"plastids"}]}},{"who":"nur","text":"Leykoplast — rangsiz, ildiz va tugunakda kraxmal toʻplaydi. Xloroplast — yashil, bargda fotosintez qiladi. Xromoplast — sariq, qizil, zargʻaldoq ranglar: gul va meva rangi."},{"who":"ali","text":"Kuzda barg sargʻayishi shundanmi?"},{"who":"nur","text":"Yaxshi kuzatuv! Plastidalar bir-biriga aylanadi: xloroplast xromoplastga, leykoplast xloroplastga. Sariq barg va pishgan pomidor — shu oʻzgarish."},{"ask":{"q":"Ali, fotosintez qaysi plastidada kechadi?","o":["Xloroplast","Leykoplast","Xromoplast"],"a":0,"ok":"Qoyil! 👏","no":"Fotosintez xloroplastda ketadi."}},{"joke":true},{"who":"nur","text":"Lizosoma — hujayraning chiqindi va hazm qilish sexi."},{"board":{"title":"Lizosoma","steps":[{"k":"pic","pic":"lysosome"}]}},{"who":"nur","text":"Lizosomada 40 ga yaqin hazm qiluvchi ferment bor, bir membrana bilan oʻralgan. U ovqatni hazm qiladi va halok boʻlgan qismlarni yoʻqotadi. Itbaliqning dumi shunday yoʻqoladi."},{"who":"nur","text":"Vakuola esa oʻsimlik hujayrasida suv ombori."},{"board":{"title":"Vakuola","steps":[{"k":"pic","pic":"vacuole"}]}},{"who":"nur","text":"Vakuola shirasi suvni tortadi, hujayra tarang — turgor holatida boʻladi. Tarang hujayralar oʻsimlikni tik tutadi. Suv yetishmasa oʻsimlik soʻliydi, xuddi shari puflanmagan balon kabi."},{"who":"nur","text":"Oxirgi organoid — hujayra markazi."},{"board":{"title":"Sentriola","steps":[{"k":"pic","pic":"centriole"}]}},{"who":"nur","text":"Hujayra markazi ikki sentrioladan iborat, ular oʻzaro toʻgʻri burchak ostida. Devori 9 ta bogʻlamdan, har birida 3 tadan mikronaycha. Hujayra boʻlinganda boʻlinish urchugʻini hosil qiladi. Koʻp oʻsimlikda sentriola yoʻq."},{"who":"nur","text":"Harakat organoidlari — kiprikcha va xivchin: tufelka kiprikcha bilan, spermatozoid xivchin bilan suzadi. Kiritmalar esa doimiy emas: oziq, pigment, sekret toʻplanadi va yoʻqoladi."},{"board":{"title":"Hujayra fabrikasi","steps":[{"k":"table","head":["Orga­noid","Vazi­fasi","Fab­rikada"],"rows":[["Mito­xond­riya","ATF — ener­giya","elektr stan­siya"],["Ribo­soma","oqsil sin­tezi","stanok"],["Endop­laz­matik toʻr","mod­dalar tashish","yoʻl­lar"],["Golji maj­muasi","oʻrab joʻ­natish","qadoq­lash sexi"],["Lizo­soma","hazm qilish","chi­qindi sexi"],["Vakuola","suv saq­lash","suv ombori"]],"w":[34,34,32]}]}},{"ask":{"q":"Ali, hujayrada energiyani qaysi organoid beradi?","o":["Mitoxondriya","Golji","Sentriola"],"a":0,"ok":"Barakalla! 🎉","no":"ATF sintezi mitoxondriyada ketadi."}},{"joke":true}]}],"jokes":["Guk: «Men poʻkakda katakcha koʻrdim!» Asalari: «Menda ham shunaqa uyim bor 🐝»","Ali: «Ustoz, tuxum ham hujayrami?» Ustoz: «Sarigʻi — bitta katta hujayra, nonushtada yegan 🍳»","Mikroskop: «2000 marta kattalashtiraman!» Elektron mikroskop: «Men 200 000 marta, chunki yengilmasman 😎»","Sentrifuga: «Aylantiraman — ogʻirlari chetga!» Kir mashinasi: «Men ham shunday, faqat kir uchun 🧺»","Mitoxondriya: «Men elektr stansiyaman!» Ali: «Mening telefonim ham, faqat zaryadi yoʻq 🔋»","Ribosoma: «Oqsil yasayman!» Lizosoma: «Men esa uni hazm qilaman» Hujayra: «Ikkingiz jamoasiz 😄»","Golji: «Men pochtaman, hamma narsani qadoqlayman 📦» ER: «Mening yoʻllarimsiz yetmaysan!»","Ali: «Ustoz, oʻsimlik hujayrasi nega qalin qobiqli?» Ustoz: «Tayanch uchun: devorsiz uy boʻlmaydi 🧱»","Xloroplast: «Men yashilman — fotosintez qilaman!» Xromoplast: «Men sarigʻman — kuzda tashrif buyuraman 🍂»","Vakuola: «Suv yetishmasa, men soʻlib qolaman.» Oʻsimlik: «Gulga suv quying! 💧»","Fagositoz: «Men yutaman!» Pinositoz: «Men ichaman.» Amyoba: «Men ikkalasini ham xohlayman 😋»","Itb oma","plastida emas"]],"w":"Uch xil plastida bor."},{"t":"match","q":"Olimni kashfiyoti bilan juftlang.","pairs":[["Guk","katakcha"],["Braun","yadro"],["Virxov","hujayradan hujayra"],["Ber","zigota"]],"w":"Har olimning oʻz hissasi."},{"t":"match","q":"Hujayra shaklini misol bilan juftlang.","pairs":[["Yumaloq","tuxum hujayra"],["Oʻsimtali","nerv hujayra"],["Yulduzsimon","biriktiruvchi"],["Amyobasimon","leykotsit"]],"w":"Shakl vazifaga bogʻliq."}]},"9-04":{"id":"9-04","grade":9,"no":4,"title":"Yadro, prokariot va eukariot hujayralar, evolutsiya","subtitle":"14–16-§ · Yadro, xromosoma, hujayralar evolutsiyasi","sticker":"🧬","stickerName":"Yadro qoʻriqchisi","sections":[{"title":"Yadro","items":[{"who":"nur","text":"Ali, oʻtgan darsda organoidlarni koʻrdik. Bugun hujayraning boshqaruv markazi — yadro haqida."},{"who":"ali","text":"Yadro hujayraning «miyasi»mi, ustoz?"},{"who":"nur","text":"Yaxshi oʻxshatish. Aniqrogʻi — kutubxona va direktor kabineti: ichida irsiy axborot saqlanadi va hujayra ishi boshqariladi. Yadro ikki vazifani bajaradi: irsiy axborotni saqlab, nasldan-naslga oʻtkazadi, hamda moddalar almashinuvini idora qiladi."},{"who":"nur","text":"Koʻpincha hujayrada bitta yadro boʻladi. Faqat jigar, muskul va suyak koʻmigi hujayralarida koʻp yadro uchraydi."},{"board":{"title":"Yadro","steps":[{"k":"pic","pic":"nucleus"}]}},{"who":"nur","text":"Yadro qobigʻi ikki qavat: tashqisi ribosomalar bilan qoplangan va endoplazmatik toʻrga tutashgan, ichkisi silliq. Qobiqda teshiklar bor — ular orqali moddalar yadro va sitoplazma oʻrtasida oʻtadi."},{"who":"ali","text":"Teshiklar kutubxona eshigiga oʻxshaydi-da. Hamma kira olmaydi, faqat kerakligi."},{"who":"nur","text":"Toʻgʻri, Ali. Qobiq yadro shirasi bilan sitoplazma tarkibi farqini saqlab turadi. Ichida esa yadrocha va xromatin bor. Jadvalga yozaman."},{"board":{"title":"Yadro qismlari","steps":[{"k":"table","head":["Qism","Vazi­fasi","Hayotda"],"rows":[["Yadro qobi­gʻi","himo­ya, 2 qavat","kutub­xona devori"],["Yadro shi­rasi","struk­tura­larni bogʻ­laydi","kutub­xona ichi"],["Yad­rocha","ribo­soma yasaydi","ribo­soma sexi"],["Xro­matin","DNK va oqsil","kitob­lar"]],"w":[30,38,32]}]}},{"who":"nur","text":"Yadrocha — mustaqil tuzilma emas: xromosomaning r-RNK hosil qiluvchi qismi atrofida paydo boʻladi. Ribosomalar shu yerda shakllanib sitoplazmaga chiqadi. U faqat interfazada koʻrinadi, mitozda yoʻqoladi."},{"ask":{"q":"Ali, ribosomalar yadroning qaysi qismida shakllanadi?","o":["Yadrochada","Qobiqda","Yadro shirasida"],"a":0,"ok":"Barakalla! 🎉","no":"Yadrocha — ribosomalar hosil boʻladigan joy."}},{"joke":true}]},{"title":"Xromosomalar","items":[{"who":"nur","text":"Endi yadroning eng muhim qismi — xromosoma. «Xroma» — boʻyoq, «soma» — tana: boʻyoq bilan boʻyaladigan tana."},{"who":"nur","text":"Xromatin — DNK va oqsil. Boʻlinmayotgan hujayrada u yoyilgan, ingichka ipga oʻxshaydi. Yaxshi boʻyalmaydigan yoyilgan qismi — euxromatin, spirallashgan toʻq boʻyaladigan qismi — geteroxromatin (u genetik faolsiz)."},{"who":"ali","text":"Ip qanday qilib xromosomaga aylanadi?"},{"who":"nur","text":"Telefon zaryadlovchi simini oʻylab koʻr. Yoyilsa uzun, lekin choʻntakka solish uchun oʻraymiz. Hujayra boʻlinganda xromatin shunday oʻralib ixcham xromosoma boʻladi."},{"who":"nur","text":"Xromosoma shakli sentromera — birlamchi belbogʻ joyiga bogʻliq. Unga boʻlinish urchugʻi birikadi."},{"board":{"title":"Xromosoma turlari","steps":[{"k":"pic","pic":"chromtypes"}]}},{"who":"nur","text":"Teng yelkali — metatsentrik, noteng yelkali — submetatsentrik, tayoqchasimon — akrotsentrik."},{"ask":{"q":"Ali, sentromera oʻrtada boʻlsa, xromosoma qanday ataladi?","o":["Metatsentrik","Akrotsentrik","Submetatsentrik"],"a":0,"ok":"Qoyil! 👏","no":"Oʻrtada boʻlsa, yelkalar teng — metatsentrik."}},{"who":"nur","text":"Xromosomalar soni haqida uchta qoida bor: somatik hujayrada son bir xil; jinsiy hujayrada ikki barobar kam; bir turning hammasida bir xil."},{"board":{"title":"Xromosomalar soni","steps":[{"k":"table","head":["Tur","Dip­loid (2n)"],"rows":[["Odam","46"],["Shim­panze","48"],["Qalam­pir","48"],["Zogʻora baliq","104"],["Dro­zofila","8"]],"w":[60,40]}]}},{"who":"ali","text":"Shimpanze va qalampirda bir xil?! Demak, son qarindoshlikni bildirmaydi."},{"who":"nur","text":"Aynan, Ali. Faqat tur uchun doimiy: bu xromosomalar sonining doimiylik qoidasi. Xromosomalar toʻplamining soni, oʻlchami va shakli yigʻindisi — kariotip. Uni hujayraning «pasporti» desak boʻladi."},{"board":{"title":"2n va n","steps":[{"k":"pic","pic":"ploidy"}]}},{"who":"nur","text":"Bir xil shakl va oʻlchamli xromosomalar gomologik deyiladi, ular juft. Poyabzal juftiga oʻxshaydi: bittadan oʻng, bittadan chap. Somatik hujayrada juft toʻplam — diploid, 2n. Jinsiy hujayraga har juftdan faqat bittasi oʻtadi — toq, gaploid, n."},{"ask":{"q":"Ali, odamning jinsiy hujayrasida nechta xromosoma bor?","o":["23","46","92"],"a":0,"ok":"Barakalla!","no":"Somatik hujayrada 46, jinsiy hujayrada ikki barobar kam — 23."}},{"joke":true}]},{"title":"Prokariot va eukariot","items":[{"who":"nur","text":"Hujayralar tuzilishiga koʻra ikki guruh: prokariot va eukariot. Rasmda ularning farqi."},{"board":{"title":"Ikki turdagi hujayra","steps":[{"k":"pic","pic":"prokeu"}]}},{"who":"nur","text":"Prokariotlarga bakteriya va koʻk-yashil suvoʻtlar, eukariotlarga zamburugʻ, oʻsimlik va hayvonlar kiradi."},{"who":"ali","text":"Ularda umumiy narsa ham bormi?"},{"who":"nur","text":"Bor: hujayra qobigʻi, sitoplazma, ribosoma, DNK va RNK. Oqsil sintezi ikkalasida ribosomada boradi. Ikkiga boʻlinish, oziqlanish, nafas olish ham oʻxshash."},{"board":{"title":"Prokariot va eukariot","steps":[{"k":"table","head":["Belgi","Pro­kariot","Euka­riot"],"rows":[["Yadro","yoʻq","bor"],["Mito­xond­riya, ER","yoʻq","bor"],["Boʻ­linish","toʻgʻ­ridan-toʻgʻri","asosan mitoz"],["Misol","bak­teriya","oʻsim­lik, hayvon"]],"w":[34,32,34]}]}},{"who":"nur","text":"Eukariotlarni ham solishtiramiz. Zamburugʻ va oʻsimlik: qobiq xitinsimon yoki sellyuloza, plastida bor-yoʻq, oziqlanish — saprofit yoki avtotrof."},{"board":{"title":"Zamburugʻ va oʻsimlik","steps":[{"k":"table","head":["Belgi","Zam­burugʻ","Oʻsim­lik"],"rows":[["Qobiq","xitin­simon","sell­yuloza"],["Plas­tida","yoʻq","bor"],["Oziq­lanish","sap­rofit","avtot­rof"]],"w":[26,40,34]}]}},{"who":"nur","text":"Hayvon va oʻsimlik hujayrasi ham farq qiladi. Hayvon hujayrasi qobigʻini glikokaliks tashkil etadi. Boʻlinishda ham farq bor."},{"board":{"title":"Boʻlinish","steps":[{"k":"pic","pic":"celldiv"}]}},{"who":"nur","text":"Hayvon hujayrasi oʻrtasida botiqlik paydo boʻlib ikkiga boʻlinadi — xuddi xamirni ipga tortib ajratgandek. Oʻsimlik hujayrasida oʻrtada toʻsiq paydo boʻladi, qobiq qalin boʻlgani uchun."},{"board":{"title":"Hayvon va oʻsimlik","steps":[{"k":"table","head":["Belgi","Hayvon","Oʻsim­lik"],"rows":[["Qobiq","gli­koka­liks","sell­yuloza"],["Plas­tida, vakuola","yoʻq","bor"],["Boʻ­linish","botiq­lik","toʻsiq"],["Oziq­lanish","gete­rot­rof","avtot­rof"]],"w":[34,32,34]}]}},{"ask":{"q":"Ali, prokariotlarda qaysi organoid yoʻq?","o":["Mitoxondriya","Ribosoma","Sitoplazma"],"a":0,"ok":"Ana xolos! 👏","no":"Prokariotlarda mitoxondriya va endoplazmatik toʻr yoʻq."}},{"joke":true}]},{"title":"Hujayralar evolutsiyasi","items":[{"who":"nur","text":"Oxirgi mavzu: hujayralar qanday paydo boʻlgan? Dastlabki hujayra qachon va qanday paydo boʻlganini aniq bilmaymiz, faqat taxmin qilamiz."},{"board":{"title":"Hayotning yoʻli","steps":[{"k":"chain","rows":[["Oddiy organik moddalar","y"],["Murakkab organik moddalar","g"],["Prokariot hujayra — 3,5 mlrd yil oldin","b"],["Eukariot hujayra","p"]]}]}},{"who":"nur","text":"Prokariotlar 3,5 milliard yil avval paydo boʻlgan. Eukariotlar ulardan kelib chiqqan deb faraz qilinadi. Buni uchta gipoteza tushuntiradi."},{"board":{"title":"Uch gipoteza","steps":[{"k":"table","head":["Gipo­teza","Mohi­yati"],"rows":[["Sim­bioz","turli pro­kariot­lar bir­lash­gan"],["Inva­ginat­siya","memb­rana ichga botgan"],["Koʻp genomli","genom boʻ­lak­larga boʻ­lin­gan"]],"w":[36,64]}]}},{"who":"nur","text":"Birinchisi — simbioz: ikki tur birga yashab, bir-biriga foyda keltiradi. Xlorella suvoʻti infuzoriya sitoplazmasida yashab, unga ozuqa beradi."},{"board":{"title":"Simbioz","steps":[{"k":"pic","pic":"symbiosis"}]}},{"who":"ali","text":"Yaʼni mitoxondriya avval mustaqil bakteriya boʻlganmi?!"},{"who":"nur","text":"Gipoteza shunday deydi. Katta hujayra aerob prokariotni ichiga olgan, ular birga yashab qolgan. Xuddi uyga ijarachi kirib, oʻzi elektr yaratib bergandek: ijarachi aslida mitoxondriya. Xloroplast ham shunday: sianobakteriyadan kelib chiqqan."},{"who":"nur","text":"Dalil: mitoxondriya va xloroplastda DNK, RNK bor, ular prokariot kabi boʻlinadi."},{"ask":{"q":"Ali, simbioz gipotezasiga koʻra mitoxondriya qaysi hujayradan kelib chiqqan?","o":["Aerob prokariotdan","Viruslardan","Suvoʻtidan"],"a":0,"ok":"Barakalla! 🎉","no":"Mitoxondriya aerob prokariotdan paydo boʻlgan deyiladi."}},{"joke":true},{"who":"nur","text":"Ikkinchisi — invaginatsiya: tashqi membrana ichga botib kirgan va organoidlarni hosil qilgan."},{"board":{"title":"Invaginatsiya","steps":[{"k":"pic","pic":"invagin"}]}},{"who":"nur","text":"Sharning ustini barmoq bilan bossang, bir qismi ichga botadi. Hujayra membranasi ham shunday ichga choʻkib yadro, mitoxondriya va xloroplast qoʻsh membranasini hosil qilgan. Bu gipoteza eukariot hujayra koʻp hujayradan emas, bitta hujayradan chiqqan deydi."},{"who":"nur","text":"Uchinchisi — koʻp genomli gipoteza."},{"board":{"title":"Koʻp genomli","steps":[{"k":"pic","pic":"multigenome"}]}},{"who":"nur","text":"Prokariot genomi boʻlaklarga boʻlinib, har boʻlak oʻz vazifasiga moslashgan: bittasi yadro, bittasi mitoxondriya, bittasi xloroplast boʻlgan. Dalil — yadro va sitoplazmada plastik jarayonlarning oʻxshashligi."},{"ask":{"q":"Ali, qaysi gipoteza «tashqi membrana ichga botgan» deydi?","o":["Invaginatsiya","Simbioz","Koʻp genomli"],"a":0,"ok":"Qoyil! 👏","no":"Invaginatsiya — sitoplazmaga botib kirish."}}]},{"title":"Xulosa","items":[{"who":"nur","text":"Umumlashtiramiz. Yadro — irsiy axborot markazi: qobiq, shira, yadrocha, xromatin."},{"board":{"title":"Yadro va xromosoma","steps":[{"k":"chain","rows":[["Yadro — irsiy axborot saqlaydi","y"],["Xromatin — DNK + oqsil","g"],["Boʻlinishda xromosomaga oʻraladi","b"],["2n — juft, n — toq","p"]]}]}},{"who":"ali","text":"Hammasini eslab qolishim uchun kutubxona oʻxshatishi yordam berdi!"},{"who":"nur","text":"Ana xolos! Prokariot — yadrosiz, eukariot — yadroli; eukariot esa prokariotdan simbioz, invaginatsiya yoki genom boʻlinishi orqali paydo boʻlgan. Endi test."},{"ask":{"q":"Ali, xromosomalarning toʻplamidagi soni, oʻlchami va shakli yigʻindisi nima?","o":["Kariotip","Genom","Sentromera"],"a":0,"ok":"Barakalla! 🎉","no":"Kariotip — xromosomalar toʻplamining belgilari yigʻindisi."}},{"joke":true}]}],"jokes":["Yadro: «Men hujayraning kutubxonasiman!» Ribosoma: «Menga esa retsept kerak 📖»","Ali: «Ustoz, yadro miyami?» Ustoz: «Direktor kabineti desak, toʻgʻriroq!» 🏢","Xromatin: «Men yoyilib yotaman.» Xromosoma: «Men esa boʻlinishda oʻralib olaman 🧵»","Ali: «Shimpanze va qalampirda 48 ta xromosoma bor!» Ustoz: «Ha, qalampir bunga hayron boʻlmaydi 😄»","Sentromera: «Men xromosomaning belbogʻiman!» Urchuq ip: «Men tortib olib ketaman 🪢»","Gaploid hujayra: «Menda yarmi bor.» Diploid: «Menda toʻliq toʻplam!» 🧬","Poyabzal: «Men juftman!» Gomologik xromosoma: «Men ham, faqat oʻng va chap emas 😄»","Prokariot: «Menda yadro yoʻq.» Eukariot: «Menda bor, hatto yadrocha ham!» 💪","Mitoxondriya: «Men aslida mustaqil bakteriya edim!» Hujayra: «Hozir esa mening ijarachimsan 🏠»","Ali: «Ustoz, xloroplast ham ijarachimi?» Ustoz: «Ha, faqat quyoshdan energiya yasab beradi ☀️»","Invaginatsiya: «Membrana botdi — organoid chiqdi!» Shar: «Meni bosma, men hujayra emasman 🎈»","Karioplazma: «Men yadro ichidagi suyuqlikman.» Yadrocha: «Men esa shu suyuqlikda suzaman 🏊»","Ali: «Hayvon hujayrasi nega botib boʻlinadi?» Ustoz: «Qobigʻi yupqa — x burugʻ","xitinsimon"],["Oʻsimlik","sellyuloza"],["Hayvon","glikokaliks"],["Bakteriya","murein"]],"w":"Har guruhning oʻz qobigʻi bor."}]},"9-05":{"id":"9-05","grade":9,"no":5,"title":"Hujayraning kimyoviy tarkibi: suv, uglevod, lipid","subtitle":"19–23-§ · Elementlar, suv, biomolekulalar, uglevodlar, lipidlar","sticker":"⚗️","stickerName":"Hujayra kimyogari","sections":[{"title":"Kimyoviy elementlar","items":[{"who":"nur","text":"Ali, hozirgacha hujayraning tuzilishini koʻrdik. Bugun u nimadan tashkil topganini bilamiz."},{"who":"ali","text":"Hujayra ham kimyoviy elementlardan iboratmi, ustoz?"},{"who":"nur","text":"Ha. Hujayrada jonsiz tabiatda uchraydigan elementlarning 70 ga yaqini bor. Bu tirik va jonsiz tabiat umumiyligining dalili. Faqat nisbati boshqacha."},{"board":{"title":"Elementlar","steps":[{"k":"pic","pic":"elements"}]}},{"who":"nur","text":"Hujayra massasining 98 foizini toʻrt element tashkil qiladi: vodorod, kislorod, uglerod va azot. Ular barcha organik moddalarning asosi. Oqsil va nuklein kislotalarda yana fosfor va oltingugurt bor."},{"who":"ali","text":"Qolgan 2 foiz kerak emasmi?"},{"who":"nur","text":"Juda kerak! Un, suv va tuz bilan non yopamiz, lekin bir chimdim achitqi boʻlmasa non koʻpchimaydi. Elementlar ham shunday: kam boʻlsa ham oʻz oʻrni bor. Makroelementlar: P, S, K, Na, Ca, Mg, Cl, Fe. Mikroelementlar: Zn, Cu, I, F, Co, Mo, Mn, B."},{"board":{"title":"Elementlar vazifasi","steps":[{"k":"table","head":["Ele­ment","Tar­kibida","Vazi­fasi"],"rows":[["Fe","gemog­lobin","kis­lorod tashiydi"],["Ca, P","suyak","mus­tah­kam­lik"],["Mg","xlo­rofill","foto­sin­tez"],["Na, K, Cl","memb­rana","modda oʻt­kazadi"],["I","tirok­sin","buqoq­dan saq­laydi"],["Co","B12 vita­mini","qon hosil qiladi"],["Zn","fer­ment","gormon faol­ligi"]],"w":[22,34,44]}]}},{"who":"nur","text":"Yod yetishmasa qalqonsimon bez tiroksinni kam ishlab chiqaradi va buqoq kasalligi paydo boʻladi. Shuning uchun yodlangan tuz yeymiz."},{"ask":{"q":"Ali, qon gemoglobini tarkibida qaysi element bor?","o":["Temir","Yod","Kobalt"],"a":0,"ok":"Barakalla! 🎉","no":"Fe gemoglobin tarkibida, kislorod tashiydi."}},{"joke":true}]},{"title":"Suv va tuzlar","items":[{"who":"nur","text":"Hujayrada eng koʻp modda — suv. Suv qancha koʻp boʻlsa, hayot shuncha jadal."},{"board":{"title":"Suv miqdori","steps":[{"k":"pic","pic":"watercontent"}]}},{"who":"nur","text":"Tish emalida atigi 10 foiz, koʻp hujayrali organizmda oʻrtacha 80, oʻsimlikda 90 dan ortiq, tez oʻsayotgan hujayrada 95 foizgacha."},{"who":"ali","text":"Suv nega bunchalik muhim?"},{"who":"nur","text":"Hujayra hajmi va tarangligi suvga bogʻliq. U erituvchi ham, yashash muhiti ham. Hammasi suv molekulasining tuzilishidan kelib chiqadi."},{"board":{"title":"Suv molekulasi","steps":[{"k":"pic","pic":"water"}]}},{"who":"nur","text":"Suv molekulasida zaryadlar notekis: kislorod tomoni manfiy, vodorod tomoni musbat. Bunday molekula dipol deyiladi — kichik magnitga oʻxshaydi. Magnitlar bir-biriga yopishganidek suv molekulalari ham vodorod bogʻlar bilan yopishadi."},{"who":"ali","text":"Choyda shakar shuning uchun erimi?"},{"who":"nur","text":"Aynan! Suv zaryadli va qutbli moddalarni ajratib, eritib yuboradi. Hujayrada moddalar suv orqali tashiladi va parchalanadi. Suvning oʻzi ham gidroliz reaksiyasida qatnashadi."},{"ask":{"q":"Ali, suv molekulasi nima deb ataladi (zaryadlari notekis boʻlgani uchun)?","o":["Dipol","Polimer","Monomer"],"a":0,"ok":"Qoyil! 👏","no":"Zaryadi notekis taqsimlangan molekula — dipol."}},{"who":"nur","text":"Anorganik moddalarning katta qismi mineral tuzlar. K⁺, Na⁺, Ca²⁺ ionlari qoʻzgʻaluvchanlikni taʼminlaydi. Kalsiy va fosfor tuzlari suyak hosil qiladi."},{"who":"nur","text":"Yana bir muhim xususiyat — buferlik. Bufer — mashinaning amortizatoriga oʻxshaydi: yoʻldagi chuqurlikni yutib, salonni silkitmaydi. Hujayra ham ichki muhitni kuchsiz ishqoriy holatda saqlaydi, pH deyarli oʻzgarmaydi."},{"board":{"title":"Tuzlar va bufer","steps":[{"k":"table","head":["Modda","Vazi­fasi"],"rows":[["K, Na, Ca ion­lari","qoʻz­gʻa­luv­chan­lik"],["H2PO4, HPO4","hujayra ichi bufer"],["H2CO3, HCO3","qon va tashqi bufer"],["Ca va P tuz­lari","suyak hosil qilish"]],"w":[44,56]}]}},{"ask":{"q":"Ali, hujayra ichki muhitini bir xil kislotalilikda saqlash xususiyati nima?","o":["Buferlik","Gidroliz","Qutblanish"],"a":0,"ok":"Barakalla!","no":"Buferlik pH ni deyarli oʻzgartirmaydi."}},{"joke":true}]},{"title":"Biomolekulalar","items":[{"who":"nur","text":"Hujayra tarkibining 20–30 foizi organik moddalar — biomolekulalar. Ular kichik va katta boʻladi."},{"who":"nur","text":"Kichik oddiy molekula — monomer. Koʻp monomer birikib, juda katta makromolekula yoki polimer hosil qiladi."},{"board":{"title":"Monomer va polimer","steps":[{"k":"pic","pic":"polymer"}]}},{"who":"nur","text":"Marjonni oʻylab koʻr: har bir dona — monomer, butun marjon — polimer. Yoki Lego: bitta gʻisht — monomer, undan yasalgan qasr — polimer."},{"who":"ali","text":"Qancha xil makromolekula bor?"},{"who":"nur","text":"Toʻrt xil: uglevod, oqsil, nuklein kislota va lipid. Birinchi uchtasi biopolimerlar: monomerlari aminokislota, nukleotid va monosaxarid. Lipidlar bundan istisno."},{"board":{"title":"Biomolekulalar","steps":[{"k":"table","head":["Modda","Mono­meri","Vazi­fasi"],"rows":[["Oqsil","ami­nokis­lota","quri­lish, tashish"],["Nuk­lein kis­lota","nuk­leo­tid","axbo­rot saq­lash"],["Ugle­vod","mono­saxa­rid","ener­giya, quri­lish"],["Lipid","(po­limer emas)","ener­giya, quri­lish"]],"w":[30,32,38]}]}},{"who":"nur","text":"Biopolimerlar uch guruh: tuzilma hosil qiluvchilar (polisaxarid, ayrim oqsil), biologik vazifa bajaruvchilar (oqsil: katalizator, tashuvchi) va axborot saqlovchilar (nuklein kislota). Oʻsimlikda uglevod koʻp, hayvonda oqsil koʻp."},{"ask":{"q":"Ali, oqsilning monomeri nima?","o":["Aminokislota","Nukleotid","Monosaxarid"],"a":0,"ok":"Barakalla! 🎉","no":"Oqsil aminokislotalardan tuziladi."}},{"joke":true}]},{"title":"Uglevodlar","items":[{"who":"nur","text":"Endi uglevodlar — non, shakar, makaron. Formulasi Cn(H2O)m: vodorod va kislorod nisbati suvdagidek, shuning uchun «uglevod»."},{"board":{"title":"Uglevodlar xillari","steps":[{"k":"pic","pic":"carbs"}]}},{"who":"nur","text":"Oddiylari monosaxarid: glukoza (uzum shakari), fruktoza (meva shakari). Nomi «oza» bilan tugaydi. Qondagi glukoza 0,1–0,12 foiz."},{"who":"nur","text":"Ikkita monosaxarid birikib disaxarid boʻladi: saxaroza (qand lavlagi shakari) glukoza va fruktozadan, sut shakari laktoza glukoza va galaktozadan."},{"who":"ali","text":"Choy shirin boʻlishi uchun solayotgan shakarim — saxaroza ekan-da!"},{"who":"nur","text":"Ha. Murakkablari — polisaxaridlar: kraxmal (oʻsimlikda), glikogen (hayvonda) va sellyuloza. Ularning monomeri glukoza."},{"board":{"title":"Uglevodlar jadvali","steps":[{"k":"table","head":["Guruh","Misol","Qayerda"],"rows":[["Mono­saxa­rid","glu­koza, fruk­toza","uzum, meva"],["Disa­xarid","saxa­roza, lak­toza","lav­lagi, sut"],["Poli­saxa­rid","krax­mal","kar­toshka"],["Poli­saxa­rid","gli­kogen","jigar, muskul"],["Poli­saxa­rid","sell­yuloza","paxta"]],"w":[28,38,34]}]}},{"board":{"title":"Zaxira va qurilish","steps":[{"k":"pic","pic":"carbstore"}]}},{"who":"nur","text":"Uglevodning ikki vazifasi bor: qurilish (sellyuloza oʻsimlik qobigʻini, xitin hasharot skeleti va zamburugʻ qobigʻini hosil qiladi) va energiya. 1 gramm uglevod 17,6 kJ beradi."},{"who":"ali","text":"Qancha energiya kerak boʻladi bir kunda?"},{"who":"nur","text":"Masala: 9-sinf oʻquvchisiga kuniga 450 g uglevod kerak boʻlsa, energiya = 450 × 17,6 = 7920 kJ. 1 kkal = 4,184 kJ, yaʼni 7920 : 4,184 ≈ 1893 kkal."},{"ask":{"q":"Ali, kartoshka tugunagida zaxira uglevod qaysi?","o":["Kraxmal","Glikogen","Sellyuloza"],"a":0,"ok":"Qoyil! 👏","no":"Oʻsimlikda zaxira — kraxmal, hayvonda — glikogen."}},{"joke":true}]},{"title":"Lipidlar","items":[{"who":"nur","text":"Oxirgi guruh — lipidlar. Ular suvda erimaydi: yomgʻirda yuvilmaydigan mum kabi."},{"board":{"title":"Lipid tuzilishi","steps":[{"k":"pic","pic":"lipidtypes"}]}},{"who":"nur","text":"Oddiy lipid — glitserin va yogʻ kislotalaridan iborat. Hayvon yogʻi — yogʻ, oʻsimlik yogʻi — moy (xona haroratida suyuq). Mum ham oddiy lipid: asalari undan uya quradi, oʻsimlik bargi suvni yuqtirmaydi."},{"who":"nur","text":"Murakkab lipidlar: fosfolipidlar — membrana tarkibida, glikolipidlar, lipoproteinlar va steroidlar (jinsiy gormonlar, xolesterin, vitamin)."},{"who":"ali","text":"Fosfolipid membranada qanday turadi?"},{"who":"nur","text":"Boshi suvni sevadi, dumi suvdan qochadi. Shu tufayli membrana ikki qavat boʻlib tuziladi — oʻtgan darsdagi membranani eslang."},{"who":"nur","text":"Yogʻning eng katta vazifasi — energiya. Yogʻ uglevoddan ikki marta koʻp energiya beradi."},{"board":{"title":"Energiya","steps":[{"k":"pic","pic":"energy"}]}},{"who":"nur","text":"1 gramm yogʻ parchalansa 38,9 kJ ajraladi. Telefon oʻxshatishi: uglevod — powerbank, tez zaryad; yogʻ — katta akkumulyator, uzoq ishlaydi. Qishki uyquga ketadigan ayiq yogʻ toʻplaydi, teri osti yogʻi esa issiqni saqlaydi."},{"who":"ali","text":"Tuya oʻrkachida suv bormi, ustoz?"},{"who":"nur","text":"Yaxshi savol! Oʻrkachda suv emas, yogʻ bor. Lekin yogʻ parchalanganda suv hosil boʻladi: 1 kg yogʻdan 1,1 litr. Bu metabolik suv choʻl hayvonlari uchun juda muhim."},{"board":{"title":"Tuya","steps":[{"k":"pic","pic":"camel"}]}},{"board":{"title":"Lipidlar jadvali","steps":[{"k":"table","head":["Guruh","Misol","Vazi­fasi"],"rows":[["Neyt­ral yogʻ","yogʻ, moy","ener­giya"],["Mum","asa­lari mumi","suvdan himoya"],["Fos­foli­pid","memb­rana","quri­lish"],["Ste­roid","gor­mon, xoles­terin","bosh­qaruv"]],"w":[28,38,34]}]}},{"who":"nur","text":"Masala: bir kunda 95 g yogʻ isteʼmol qilindi. Energiya = 95 × 38,9 = 3695,5 kJ. Kaloriyada: 3695,5 : 4,184 ≈ 883 kkal."},{"ask":{"q":"Ali, tuya oʻrkachida nima toʻplanadi?","o":["Yogʻ","Suv","Havo"],"a":0,"ok":"Barakalla! 🎉","no":"Oʻrkachda yogʻ bor; u parchalansa suv hosil boʻladi."}},{"joke":true}]}],"jokes":["Ali: «Ustoz, men 98 foiz toʻrt elementdanmanmi?» Ustoz: «Ha, qolgan 2 foizi esa aql! 🧠»","Temir: «Men gemoglobindaman, kislorod tashiyman!» Kislorod: «Men esa hech qachon kechikmayman 🚚»","Yod: «Men yetishmasam buqoq chiqadi!» Tuz: «Shuning uchun men yodlanganman 🧂»","Suv molekulasi: «Men dipolman!» Magnit: «Men ham, faqat sovuqqa chidamsizman 🧲»","Ali: «Shakar choyda nega eriydi?» Ustoz: «Suv qutbli, shakarni oʻrab oladi ☕»","Bufer: «Men amortizatorman — pH silkinmaydi!» Hujayra: «Rahmat, tinch yuramiz 🚗»","Monomer: «Men yolgʻizman.» Polimer: «Men esa butun marjonman 📿»","Glukoza: «Men shirinman!» Fruktoza: «Men ham, faqat mevadaman 🍇»","Kraxmal: «Men oʻsimlik omboriman!» Glikogen: «Men hayvonnikiman, jigarda yashayman 🏠»","Sellyuloza: «Men paxta tolasiman!» Xitin: «Men esa hasharot zirhiman 🪲»","Ali: «Ustoz, tuya oʻrkachida suv bormi?» Ustoz: «Yogʻ bor, yogʻdan suv hosil boʻladi 🐪»","Yogʻ: «Men 38,9 kJ beraman!» Uglevod: «Men esa tezroq beraman, powerbankman 🔋»","Fosfolipid: «Boshim suvni sevadi!» Dum: «Men esa qochaman, ikkala tomon ham haq 💦»","Ayiq: «Qishgacha yogʻ yigʻayapman!» Ali: «Men esa oshxonadan non yigʻayapman 🐻»"],"questions":[{"t":"choice","q":"Hujayrada jonsiz tabiatdagi elementlardan qanchasi uchraydi?","o":["Taxminan 70","Taxminan 7","Taxminan 700","Faqat 4"],"a":0,"w":"70 ga yaqin element."},{"t":"choice","q":"Hujayra massasining 98 foizini nechta element tashkil qiladi?","o":["Toʻrtta","Ikkita","Oltita","Oʻnta"],"a":0,"w":"H, O, C, N."},{"t":"choice","q":"Qaysi element guruhi 98 foiz tashkil qiladi?","o":["H, O, C, N","P, S, K, Na","Zn, Cu, I","Fe, Mg, Ca"],"a":0,"w":"Vodorod, kislorod, uglerod, azot."},{"t":"choice","q":"Oqsil va nuklein kislotada qaysi qoʻshimcha elementlar bor?","o":["P va S","K va Na","Zn va Cu","I va Fe"],"a":0,"w":"Fosfor va oltingugurt."},{"t":"choice","q":"Gemoglobin tarkibiga qaysi element kiradi?","o":["Fe","Mg","Ca","I"],"a":0,"w":"Fe kislorod tashiydi."},{"t":"choice","q":"Xlorofill tarkibida qaysi element bor?","o":["Mg","Fe","Zn :"Biopolimerni monomeri bilan juftlang.","pairs":[["Oqsil","aminokislota"],["Nuklein kislota","nukleotid"],["Kraxmal","glukoza"],["Lipid","polimer emas"]],"w":"Har biopolimerning monomeri bor."}]},"9-06":{"id":"9-06","grade":9,"no":6,"title":"Oqsillar va nuklein kislotalar","subtitle":"24–28-§ · Aminokislota, oqsil tuzilishi va vazifasi, DNK, RNK, ATF","sticker":"🧬","stickerName":"Oqsil ustasi","sections":[{"title":"Aminokislota va peptid","items":[{"who":"nur","text":"Ali, bugun hujayradagi eng muhim modda haqida gaplashamiz — oqsil. Uni hamma biladi: goʻsht, tuxum, tvorog."},{"who":"ali","text":"Oqsil nega bunchalik muhim, ustoz?"},{"who":"nur","text":"Hujayrada miqdori ham, vazifasi ham eng koʻp. Oqsilda C 50–54 %, O 21–23 %, N 16 %, H 6,5–7,3 % va oz miqdorda S bor. Azot borligi bilan uglevod va yogʻdan farq qiladi."},{"who":"nur","text":"Oqsilning monomeri — aminokislota. Ularning 20 xili bor: 10 tasini organizm oʻzi hosil qilolmaydi, ovqatdan olish kerak (almashtirib boʻlmaydigan), 10 tasini oʻzi qiladi."},{"board":{"title":"Aminokislota","steps":[{"k":"pic","pic":"aminoacid"}]}},{"who":"nur","text":"Aminokislota — bir xil «gʻisht» shakli. Hammasida amino guruh va karboksil guruh bor. Faqat R — radikal har xil. Lego gʻishtlari ham bir xil ulanadi, rangi va shakli turlicha."},{"who":"ali","text":"Aminokislotalar bir-biriga qanday ulanadi?"},{"who":"nur","text":"Bir aminokislotaning COOH guruhi ikkinchisining NH2 guruhi bilan birikadi, suv ajraladi. Hosil boʻlgan bogʻ — peptid bogʻ. Qoʻllarni ushlashib turgan bolalar zanjiri kabi."},{"board":{"title":"Peptid bogʻ","steps":[{"k":"pic","pic":"peptide"}]}},{"who":"nur","text":"Ikki aminokislota — dipeptid, uchtasi — tripeptid. 50 tagacha boʻlsa polipeptid, 50 dan koʻp boʻlsa oqsil."},{"board":{"title":"Peptidlar","steps":[{"k":"table","head":["Nomi","Soni"],"rows":[["Dipep­tid","2 ta AK"],["Tri­pep­tid","3 ta AK"],["Poli­pep­tid","50 dan kam"],["Oqsil","50 dan koʻp"]],"w":[50,50]}]}},{"who":"nur","text":"Masala: oqsil 250 ta aminokislotadan iborat. Peptid bogʻ soni = 250 − 1 = 249 ta."},{"ask":{"q":"Ali, aminokislotalarni bogʻlovchi bogʻ nima?","o":["Peptid bogʻ","Vodorod bogʻ","Ion bogʻ"],"a":0,"ok":"Barakalla! 🎉","no":"Aminokislotalar peptid bogʻ bilan ulanadi."}},{"joke":true}]},{"title":"Oqsil tuzilishi","items":[{"who":"nur","text":"Har bir tur oʻz oqsiliga ega. Shuning uchun mushuk mushukcha, odam odamcha. Oqsil tuzilishi toʻrt darajada oʻrganiladi."},{"board":{"title":"Tuzilish darajalari","steps":[{"k":"pic","pic":"proteinlevels"}]}},{"who":"nur","text":"Birlamchi — aminokislotalar ketma-ket zanjiri, peptid bogʻ bilan. Ikkilamchi — zanjir spiralga buraladi, vodorod bogʻlar ushlab turadi (keratin, kollagen)."},{"who":"ali","text":"Ip kalavaga oʻxshaydimi?"},{"who":"nur","text":"Aynan! Ipni toʻgʻri tortsak — birlamchi. Prujinaga oʻrasak — ikkilamchi. Prujinani toʻpga yigʻsak — uchlamchi (globula, masalan mioglobin). Bir nechta toʻpni birlashtirsak — toʻrtlamchi (gemoglobin)."},{"board":{"title":"Daraja jadvali","steps":[{"k":"table","head":["Daraja","Shakl","Bogʻ"],"rows":[["Bir­lam­chi","zanjir","peptid"],["Ikki­lam­chi","spiral","vodo­rod"],["Uch­lam­chi","glo­bula","gid­rofob, disul­fid"],["Toʻrt­lam­chi","koʻp zanjir","uch­lam­chi kabi"]],"w":[36,24,40]}]}},{"who":"nur","text":"Aminokislota uzunligi 0,35 nm, oqsil globulasi esa 5–7 nm. Gemoglobin toʻrtlamchi tuzilishga ega va tarkibida temir (Fe) bor."},{"ask":{"q":"Ali, keratin va kollagen qaysi tuzilishda?","o":["Ikkilamchi","Birlamchi","Toʻrtlamchi"],"a":0,"ok":"Qoyil! 👏","no":"Ular spiral — ikkilamchi tuzilishda."}},{"joke":true}]},{"title":"Oqsil xossalari","items":[{"who":"nur","text":"Oqsilning massasi katta. Molekulyar massa = aminokislota soni × 120."},{"who":"nur","text":"Masala: 300 ta aminokislotadan iborat oqsil massasi 300 × 120 = 36 000. Boshqa masala: 124 ta aminokislota boʻlsa, massa 124 × 120 = 14 880, peptid bogʻ 123 ta."},{"who":"nur","text":"Shakli boʻyicha oqsil tolasimon (keratin, kollagen) yoki yumaloq (gemoglobin, albumin) boʻladi. Sodda oqsillar — albumin va globulin. Murakkablari: nukleoprotein, xromoprotein, lipoprotein, glikoprotein."},{"who":"ali","text":"Tuxumni qaynatsak nega qotadi?"},{"who":"nur","text":"Issiqlikda oqsilning tabiiy shakli buziladi. Bu denaturatsiya. Baʼzan qaytadi (renaturatsiya), lekin qaynagan tuxum oq boʻlib, qaytmaydi."},{"board":{"title":"Denaturatsiya","steps":[{"k":"pic","pic":"denat"}]}},{"board":{"title":"Oqsil turlari","steps":[{"k":"table","head":["Guruh","Misol"],"rows":[["Tola­simon","kera­tin, kol­lagen"],["Yuma­loq","gemog­lobin"],["Nuk­leop­rotein","DNK bilan"],["Lipop­rotein","yogʻ bilan"]],"w":[44,56]}]}},{"ask":{"q":"Ali, oqsil shaklining buzilishi nima deyiladi?","o":["Denaturatsiya","Gidroliz","Fotosintez"],"a":0,"ok":"Barakalla!","no":"Tabiiy shaklning buzilishi — denaturatsiya."}},{"joke":true}]},{"title":"Oqsil vazifalari","items":[{"who":"nur","text":"Oqsil — hujayraning ishchi kuchi. Koʻp vazifa bajaradi."},{"board":{"title":"Ferment ishlashi","steps":[{"k":"pic","pic":"enzyme"}]}},{"who":"nur","text":"Ferment — oqsil-katalizator. U kalit-qulf kabi faqat oʻz moddasiga taʼsir qiladi. Shuning uchun reaksiyalar tez va tanlab ketadi."},{"board":{"title":"Oqsil vazifalari","steps":[{"k":"table","head":["Vazifa","Misol"],"rows":[["Quri­lish","memb­rana, soch"],["Kata­litik","fer­ment"],["Tashish","gemog­lobin"],["Himoya","anti­tana"],["Gormon","insu­lin"],["Signal","rodop­sin"],["Hara­kat","muskul oqsili"],["Zaxira","tuxum oqsili"]],"w":[28,72]}]}},{"who":"ali","text":"Oqsildan energiya ham olinadimi?"},{"who":"nur","text":"Ha, 1 g oqsil 17,6 kJ beradi. Masala: 100 g oqsil + 95 g yogʻ + 400 g uglevod. Energiya = 100·17,6 + 95·38,9 + 400·17,6 = 1760 + 3695,5 + 7040 = 12 495,5 kJ. Kaloriya: 12 495,5 : 4,184 ≈ 2986 kkal."},{"ask":{"q":"Ali, insulin qaysi vazifaga misol?","o":["Gormon","Himoya","Zaxira"],"a":0,"ok":"Barakalla! 🎉","no":"Insulin — gormon vazifasidagi oqsil."}},{"joke":true}]},{"title":"Nuklein ki
