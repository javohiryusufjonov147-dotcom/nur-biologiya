tions":[{"title":"Genetika nima?","items":[{"who":"nur","text":"Ali, bugundan yangi katta boʻlim boshlaymiz — genetika. Nega bola otasiga yoki onasiga oʻxshaydi, deb oʻylab koʻrganmisan?"},{"who":"ali","text":"Ustoz, oʻxshash gen bor-da!"},{"who":"nur","text":"Aynan! Genetika yunoncha «genetikos» — «tugʻilish, kelib chiqish». Bu atamani 1906-yilda angliyalik olim V. Betson fanga kiritgan."},{"who":"nur","text":"Genetika organizmlarning ikki xususiyatini oʻrganadi: irsiyat va oʻzgaruvchanlik."},{"who":"nur","text":"Irsiyat — organizmning oʻziga xos belgilarini avlodlarga qoldirish, yaʼni nasldan naslga berish. Irsiyat tufayli tur ichidagi hamma individ oʻxshash. Nusxa koʻchirish kabi: ona-bolaning oʻxshashligi."},{"who":"nur","text":"Oʻzgaruvchanlik — organizmning yangi belgilarini namoyon etish qobiliyati. Shuning uchun tur ichidagi individlar bir-biridan farq qiladi. Egizaklar ham aynan bir xil emas."},{"who":"nur","text":"Demak, irsiyat va oʻzgaruvchanlik bir-biriga qarama-qarshi, lekin bogʻliq. Irsiyat turning bir xilligini saqlaydi, oʻzgaruvchanlik esa turni turlicha qiladi."},{"ask":{"q":"Ali, genetikaning ikki asosiy xususiyati qaysi?","o":["Irsiyat va oʻzgaruvchanlik","Oʻsish va rivojlanish","Nafas va ovqat"],"a":0,"ok":"Barakalla! 🎉","no":"Genetika irsiyat va oʻzgaruvchanlikni oʻrganadi."}},{"who":"nur","text":"Maʼlum organizmning barcha genlari yigʻindisi — genotip. Barcha belgi va xususiyatlari yigʻindisi — fenotip."},{"board":{"title":"Genotip va fenotip","steps":[{"k":"pic","pic":"genfen"}]}},{"who":"nur","text":"Fenotip genotipga va maʼlum darajada tashqi muhitga bogʻliq. Retsept va tayyor taom kabi: retsept bir xil, lekin pishirish sharoiti taʼsir qiladi."},{"board":{"title":"Ikki tushuncha","steps":[{"k":"table","head":["Atama","Maʼnosi"],"rows":[["Genotip","barcha genlar"],["Fenotip","barcha belgilar"]],"w":[40,60]}]}},{"ask":{"q":"Ali, organizmning barcha belgilari yigʻindisi nima deyiladi?","o":["Fenotip","Genotip","Gameta"],"a":0,"ok":"Qoyil! 👏","no":"Fenotip — barcha belgi va xususiyatlar yigʻindisi."}},{"joke":true}]},{"title":"Genetika vazifalari, usullari, tarixi","items":[{"who":"nur","text":"Genetikaning vazifalari beshta: irsiyatning moddiy asoslari — xromosoma va genlar tuzilishini tekshirish; belgilarning avlodlarga berilish qonuniyatlarini aniqlash; fizik va kimyoviy omillar taʼsirida irsiy oʻzgaruvchanlik qonuniyatlarini ochish; sermahsul navlar, zotlar, shtammlar yaratish usullarini ishlab chiqish; irsiy kasalliklar sabablarini oʻrganish va davolash yoʻllarini izlash."},{"who":"nur","text":"Bu vazifalarni hal etishda genetika bir necha usuldan foydalanadi."},{"board":{"title":"Genetika usullari","steps":[{"k":"table","head":["Usul","Nima qiladi"],"rows":[["Duragaylash","chatishtirib, belgilarni kuzatadi"],["Sitogenetik","xromosomalarni koʻradi"],["Molekular","DNK va RNKni oʻrganadi"],["Ontogenetik","genotip va muhitni oʻrganadi"],["Genetik injeneriya","genni koʻchiradi"]],"w":[38,62]}]}},{"ask":{"q":"Ali, genni bir organizmdan boshqasiga koʻchirish qaysi usul?","o":["Genetik injeneriya","Duragaylash","Sitogenetik"],"a":0,"ok":"Barakalla! 🎉","no":"Genetik injeneriya noyob genlarni boshqa organizmga koʻchiradi."}},{"who":"nur","text":"Genetika tarixida uch bosqich bor. 1-bosqich: G. Mendel va izdoshlari irsiyat qonunlarini kashf etdi. 2-bosqich: T. Morganning xromosoma nazariyasi yaratildi. 3-bosqich: genetikaga kimyo, fizika, kibernetika yutuqlari qoʻllandi: elektron mikroskopiya, rentgenostruktur tashxis."},{"board":{"title":"Genetika bosqichlari","steps":[{"k":"table","head":["Bosqich","Nima boʻldi"],"rows":[["1","Mendel qonunlari"],["2","Morgan nazariyasi"],["3","kimyo, fizika qoʻllandi"]],"w":[24,76]}]}},{"who":"nur","text":"Oʻzbekistonda ham genetika sohasida koʻp olim ishlagan: akademiklar J. A. Musayev, O. Jalilov, N. Nazirov, S. Mirahmedov, A. Abdukarimov, Abdullaev va boshqalar."},{"ask":{"q":"Ali, genetikaning 2-bosqichida nima yaratildi?","o":["Xromosoma nazariyasi","Mendel qonunlari","Genetik injeneriya"],"a":0,"ok":"Qoyil! 👏","no":"2-bosqichda T. Morganning xromosoma nazariyasi yaratildi."}},{"joke":true}]},{"title":"Genetik belgilar","items":[{"who":"nur","text":"Genetikada masala yechish uchun maxsus belgilar bor. Bu — genetika alifbosi. Telefonda emoji kabi: bitta belgi — katta maʼno."},{"who":"nur","text":"Chatishtirish «×» belgisi bilan yoziladi. Ona organizm — ♀ (Venera koʻzgusi), ota organizm — ♂ (Mars qalqoni va nayzasi). Ota-ona oldiga «P» (lotincha «parents») yoziladi."},{"who":"nur","text":"Gametalar «G» harfi bilan belgilanadi. Birinchi avlod duragay — F1, ikkinchi — F2. «F» — lotincha «filio», yaʼni «bolalar»."},{"who":"nur","text":"F1 duragaylarni dominant yoki retsessiv gomozigotali organizm bilan qayta chatishtirish — qayta tahliliy chatishtirish yoki bekkross. Olingan avlod — Fb."},{"board":{"title":"Genetik belgilar","steps":[{"k":"table","head":["Belgi","Maʼnosi"],"rows":[["×","chatishtirish"],["♀","ona"],["♂","ota"],["P","ota-ona"],["G","gametalar"],["F1, F2","avlodlar"],["Fb","tahliliy avlod"]],"w":[30,70]}]}},{"ask":{"q":"Ali, «P» harfi nimani bildiradi?","o":["Ota-ona organizm","Gameta","Birinchi avlod"],"a":0,"ok":"Barakalla! 🎉","no":"P — lotincha «parents», yaʼni ota-ona."}},{"ask":{"q":"Ali, F1 nima?","o":["Birinchi avlod duragay","Ota-ona","Gametalar"],"a":0,"ok":"Qoyil! 👏","no":"F1 — birinchi avlod duragay, F2 — ikkinchi."}},{"joke":true}]},{"title":"Mendel va noʻxat tajribasi","items":[{"who":"nur","text":"Irsiyat qonunlarini birinchi boʻlib chex olimi Gregor Mendel 1865-yilda eʼlon qilgan. Lekin uning ishi uzoq vaqt toʻgʻri baholanmadi."},{"who":"nur","text":"1900-yilda Mendel tadqiqotlari uch olim — G. de Friz, E. Chermak va K. Korrens tomonidan qayta kashf etildi. Shuning uchun 1900-yil genetikaga asos solingan yil hisoblanadi."},{"board":{"title":"Mendel","steps":[{"k":"table","head":["Yil","Voqea"],"rows":[["1865","qonunlar eʼlon qilindi"],["1900","qayta kashf etildi"]],"w":[30,70]}]}},{"who":"nur","text":"Mendel tajribasini noʻxatda oʻtkazdi. Nega aynan noʻxat? Uning navlari koʻp, belgilari aniq ajralib turadi: gullari oq yoki qizil, poyasi baland yoki past, donlari sariq yoki yashil, silliq yoki burishgan. Noʻxat odatda oʻz-oʻzidan changlanadi, lekin chetdan ham changlanishi mumkin."},{"board":{"title":"Noʻxat","steps":[{"k":"pic","pic":"peas"}]}},{"board":{"title":"Noʻxat belgilari","steps":[{"k":"table","head":["Belgi","Dominant","Retsessiv"],"rows":[["Don shakli","silliq","burishgan"],["Don rangi","sariq","yashil"],["Gul rangi","qizil","oq"],["Poya","uzun","kalta"],["Dukkak","oddiy","boʻgʻimli"]],"w":[32,34,34]}]}},{"who":"nur","text":"Mendel gibridologik usulni qoʻlladi: maʼlum belgilari bilan farq qiladigan ota-onalarni chatishtirdi va belgilar bir necha avlodda qanday namoyon boʻlishini kuzatdi. Eng muhimi — belgilarni hamma individlarda miqdor jihatdan aniq sanab bordi. Shu tufayli u miqdoriy qonuniyatlarni topdi. Choʻntak hisoblagichli tadqiqotchi kabi."},{"who":"nur","text":"Bir juft belgisi bilan farq qiladigan organizmlarni chatishtirish — monoduragay. Ikki juft belgi bilan — diduragay. Uch va undan koʻp juft belgi bilan — poliduragay."},{"board":{"title":"Chatishtirish xillari","steps":[{"k":"table","head":["Xili","Belgi juftlari"],"rows":[["Monoduragay","1 juft"],["Diduragay","2 juft"],["Poliduragay","3 va koʻp"]],"w":[46,54]}]}},{"ask":{"q":"Ali, 1900-yili Mendel ishini kimlar qayta kashf etgan?","o":["De Friz, Chermak, Korrens","Morgan, Betson, Gekkel","Navashin, Ber, Shpeman"],"a":0,"ok":"Barakalla! 🎉","no":"Mendel ishini 1900-yilda de Friz, Chermak va Korrens qayta kashf etdi."}},{"ask":{"q":"Ali, noʻxat nega qulay obʼyekt?","o":["Belgilari aniq farqli, oʻz-oʻzidan changlanadi","Juda katta boʻladi","Hayvon hisoblanadi"],"a":0,"ok":"Qoyil! 👏","no":"Noʻxatning belgilari aniq ajralib turadi va u oʻz-oʻzidan changlanadi."}},{"joke":true}]},{"title":"Mendelning 1-qonuni","items":[{"who":"nur","text":"Mendel monoduragay chatishtirishdan boshladi. Masalan, doni sariq noʻxatni doni yashil noʻxat bilan chatishtirdi."},{"who":"nur","text":"Natija: birinchi avlod F1 duragaylarning hammasi sariq boʻldi. Yashil belgi goʻyo yoʻqolib qoldi."},{"board":{"title":"Mendelning 1-qonuni","steps":[{"k":"pic","pic":"mendel1"}]}},{"who":"nur","text":"Belgining ustun turishi — dominantlik, ustun belgi — dominant. F1 da koʻrinmaydigan belgi — retsessiv. Dominant belgi katta harf (A), retsessiv — kichik harf (a) bilan yoziladi."},{"who":"nur","text":"Mendelning 1-qonuni — dominantlik qonuni, yoki birinchi boʻginda bir xillilik qonuni."},{"who":"nur","text":"Genotipda ikkita bir xil gen boʻlsa — gomozigota (AA yoki aa). Genlar har xil boʻlsa, yaʼni biri dominant, biri retsessiv (Aa) — geterozigota."},{"board":{"title":"Zigotalar","steps":[{"k":"table","head":["Genotip","Nomi"],"rows":[["AA","gomozigota, dominant"],["aa","gomozigota, retsessiv"],["Aa","geterozigota"]],"w":[30,70]}]}},{"who":"nur","text":"Qonunning izohi: bir juft belgisi bilan farq qiladigan gomozigota organizmlar chatishtirilsa, F1 duragaylar bitta belgiga ega boʻlib, hammasi fenotip va genotip jihatdan bir xil boʻladi."},{"who":"nur","text":"Don rangi (sariq, yashil) va shakli (silliq, burishgan) boʻyicha ham shunday: F1 da hammasi sariq va silliq. Dominant — kuchli aytilgan soʻz, retsessiv — jim turgan oʻquvchi: hozir gapirmaydi, lekin yoʻqolmaydi."},{"ask":{"q":"Ali, 1-qonun qanday ataladi?","o":["Dominantlik qonuni","Ajralish qonuni","Mustaqil irsiylanish qonuni"],"a":0,"ok":"Barakalla! 🎉","no":"1-qonun — dominantlik qonuni (F1 da bir xillik)."}},{"ask":{"q":"Ali, Aa genotipli organizm qanday ataladi?","o":["Geterozigota","Gomozigota dominant","Gomozigota retsessiv"],"a":0,"ok":"Qoyil! 👏","no":"Aa — geterozigota."}},{"joke":true}]},{"title":"Mendelning 2-qonuni va tahlil","items":[{"who":"nur","text":"Endi F1 duragaylarni oʻzaro chatishtirsak, nima boʻladi? F2 avlodda ajralish kuzatiladi: ota-onaning ikkala belgisi ham, maʼlum son nisbatida paydo boʻladi."},{"who":"nur","text":"Duragaylarning 3/4 qismi dominant belgiga, 1/4 qismi retsessiv belgiga ega boʻladi."},{"board":{"title":"Mendelning 2-qonuni","steps":[{"k":"pic","pic":"mendel2"}]}},{"who":"nur","text":"Mendelning 2-qonuni — ajralish qonuni: geterozigota F1 duragaylarni oʻzaro chatishtirsak, F2 da fenotip boʻyicha 3:1, genotip boʻyicha 1:2:1 nisbatda ajralish boʻladi."},{"who":"nur","text":"Yaʼni F2 organizmlarning 25 % i dominant gomozigota (AA), 50 % i geterozigota (Aa), 25 % i retsessiv gomozigota (aa). Hisob oson: 4 ta katakdan 3 tasi sariq, 1 tasi yashil."},{"board":{"title":"F2 nisbatlari","steps":[{"k":"table","head":["Belgi","Nisbat"],"rows":[["Fenotip","3 : 1"],["Genotip","1 : 2 : 1"],["AA","25 %"],["Aa","50 %"],["aa","25 %"]],"w":[40,60]}]}},{"ask":{"q":"Ali, F2 da fenotip boʻyicha ajralish qanday?","o":["3 : 1","1 : 1","9 : 3 : 3 : 1"],"a":0,"ok":"Barakalla! 🎉","no":"Monoduragay F2 da fenotip 3:1, genotip 1:2:1."}},{"ask":{"q":"Ali, F2 da geterozigotalar necha foiz?","o":["50 %","25 %","75 %"],"a":0,"ok":"Qoyil! 👏","no":"Aa — 50 %, AA va aa — 25 % dan."}},{"joke":true},{"who":"nur","text":"Chala dominantlik: har doim ham dominant belgi toʻliq ustun boʻlavermaydi. Baʼzan geterozigotada belgi oraliq boʻladi. Masalan, namozshomgulda qizil gulli bilan oq gulli oʻsimlik chatishtirilsa, F1 hammasi pushti boʻladi. Qizil va oq boʻyoqni aralashtirib pushti hosil qilgandek."},{"board":{"title":"Chala dominantlik","steps":[{"k":"pic","pic":"incomplete"}]}},{"who":"nur","text":"F1 pushtilarni oʻzaro chatishtirsak, F2 da fenotip ham, genotip ham 1:2:1 boʻladi. Oraliq irsiylanish qulupnay mevasi rangida, qushlar pati tuzilishida, andaluz tovuq pati rangida, odamdagi biokimyoviy belgilarda uchraydi."},{"ask":{"q":"Ali, chala dominantlikda F1 qanday boʻladi?","o":["Oraliq belgili","Faqat dominant","Faqat retsessiv"],"a":0,"ok":"Barakalla! 🎉","no":"Chala dominantlikda geterozigota oraliq belgiga ega boʻladi."}},{"who":"nur","text":"Tahliliy chatishtirish. Fenotipga qarab dominant organizm AA yoki Aa ekanini bilib boʻlmaydi. Uni aniqlash uchun noaniq genotipli organizm sof gomozigota retsessiv (aa) bilan chatishtiriladi."},{"board":{"title":"Tahliliy chatishtirish","steps":[{"k":"pic","pic":"testcross"}]}},{"who":"nur","text":"Dominant organizm AA boʻlsa, avlodda ajralish boʻlmaydi, hammasi Aa. Geterozigota boʻlsa, fenotip va genotip boʻyicha 1:1. Bu natija geterozigotaning ikki xil gameta hosil qilishining isbotidir. Imtihonsiz bilim aniqlanmaydi, tahliliy chatishtirishsiz genotip aniqlanmaydi."},{"board":{"title":"Tahliliy chatishtirish","steps":[{"k":"table","head":["Chatishtirish","Natija"],"rows":[["AA × aa","hammasi Aa"],["Aa × aa","1 Aa : 1 aa"]],"w":[40,60]}]}},{"ask":{"q":"Ali, Aa × aa chatishtirishda nisbat qanday?","o":["1 : 1","3 : 1","hammasi bir xil"],"a":0,"ok":"Qoyil! 👏","no":"Geterozigotani aa bilan chatishtirsak, 1:1 ajralish boʻladi."}},{"joke":true},{"who":"nur","text":"Mendel buni gametalar sofligi gipotezasi bilan tushuntirdi: irsiy omillar duragayda aralashib ketmaydi, oʻzgarmagan holda saqlanadi. Har bir gameta juft irsiy omillardan faqat bittasiga ega boʻladi."},{"board":{"title":"Gametalar sofligi","steps":[{"k":"pic","pic":"gametes"}]}},{"who":"nur","text":"Retsessiv belgi F2 da ikki shart bajarilsa chiqadi: 1) irsiy omil duragayda oʻzgarmay saqlangan boʻlsa; 2) gameta allellar juftidan faqat bittasini olgan boʻlsa."},{"who":"nur","text":"Mendel zamonida mitoz va meyoz hali maʼlum emas edi. Hozir sitologiya tufayli qonunlar mustahkam asosga ega: meyozda gomologik xromosomalar har xil gametalarga tarqaladi, shuning uchun gametalarda har juft gendan bittadan qoladi. Zigotada juft yana tiklanadi."},{"who":"nur","text":"Juft genlar — allel genlar. Masalan, noʻxat donining sariq va yashil rangini belgilovchi genlar. Allel genlar gomologik xromosomalarda joylashadi, shuning uchun meyozda har xil gametalarga tushadi."},{"board":{"title":"Allel genlar","steps":[{"k":"pic","pic":"allel"}]}},{"ask":{"q":"Ali, allel genlar qayerda joylashadi?","o":["Gomologik xromosomalarda","Bitta xromatidada","Sitoplazmada"],"a":0,"ok":"Barakalla! 🎉","no":"Allel genlar gomologik, yaʼni juft xromosomalarda joylashadi."}},{"ask":{"q":"Ali, belgilarning ajralishining sitologik asosi nima?","o":["Meyozda gomologik xromosomalarning tarqalishi","Mitozda DNK ning ikki hissa ortishi","Urugʻlanish"],"a":0,"ok":"Qoyil! 👏","no":"Sitologik asos — meyozda gomologik xromosomalar tarqalib gaploid gametalar hosil boʻlishi."}},{"joke":true}]},{"title":"Mendelning 3-qonuni","items":[{"who":"nur","text":"Organizmlar koʻp belgilar bilan farq qiladi. Ikki yoki undan koʻp juft belgi bilan farq qiladigan ota-onalarni chatishtirish — di- yoki poliduragay chatishtirish."},{"who":"nur","text":"Mendel noʻxatni ikki juft belgisi boʻyicha chatishtirdi: don rangi (sariq A, yashil a) va shakli (silliq B, burishgan b). Sariq va silliq — dominant. Ota-onalar gomozigota: AABB va aabb."},{"board":{"title":"Diduragay chatishtirish","steps":[{"k":"pic","pic":"dihyb"}]}},{"who":"nur","text":"Har ota-ona bitta tipdagi gameta beradi: AB va ab. Shuning uchun F1 hammasi bir xil — AaBb, sariq-silliq."},{"who":"nur","text":"F1 da meyozda gametalar har juft allel genlardan bittadan oladi: A gen B bilan yoki b bilan, a gen B bilan yoki b bilan tushishi mumkin. Shuning uchun har F1 organizm toʻrt xil gameta hosil qiladi, har biri 25 %: AB, Ab, aB, ab."},{"who":"nur","text":"Urugʻlanishda gametalar tasodifan uchrashadi. Buni Pennet katakchasi bilan osonlik bilan aniqlaymiz: bir organizm gametalari gorizontal, ikkinchisiniki vertikal yoziladi. Katakchalarga zigotalar genotipi yoziladi. Shaxmat taxtasiga oʻxshaydi: har katak — bitta imkoniyat."},{"board":{"title":"Pennet katakchasi","steps":[{"k":"pic","pic":"punnett4"}]}},{"who":"nur","text":"F2 da 16 kombinatsiya, 4 fenotip guruhi: 9 ta sariq-silliq, 3 ta yashil-silliq, 3 ta sariq-burishgan, 1 ta yashil-burishgan. Nisbat fenotip boʻyicha 9:3:3:1, genotip boʻyicha 1:2:2:4:1:2:1:2:1."},{"who":"nur","text":"Har belgini alohida sanasak, sariq : yashil = 3:1, silliq : burishgan = 3:1. Demak, har juft belgi boshqasiga bogʻliq boʻlmay, monoduragaydagidek ajraladi."},{"ask":{"q":"Ali, diduragay F2 da fenotip nisbati qanday?","o":["9 : 3 : 3 : 1","3 : 1","1 : 2 : 1"],"a":0,"ok":"Barakalla! 🎉","no":"Diduragay F2 da fenotip 9:3:3:1."}},{"who":"nur","text":"Mendelning 3-qonuni — belgilarning mustaqil irsiylanish qonuni: ikki yoki undan koʻp juft belgi bilan farq qiladigan ota-onalar chatishtirilsa, genlar va belgilar bir-biridan mustaqil irsiylanadi. Bu faqat juft allel genlar har xil gomologik xromosomalarda joylashgan boʻlsa amalga oshadi."},{"who":"nur","text":"Gametalar umumiy soni 2ⁿ formulasi bilan topiladi, n — geterozigota juft genlar soni. Aa bilan 2, AaBb bilan 4, AaBbCc bilan 8 xil gameta."},{"board":{"title":"Gameta xillari","steps":[{"k":"table","head":["Genotip","Gameta xili"],"rows":[["Aa","2"],["AaBb","4"],["AaBbCc","8"]],"w":[50,50]}]}},{"board":{"title":"Mendel qonunlari","steps":[{"k":"table","head":["Qonun","Natija"],"rows":[["1-qonun","F1 bir xil"],["2-qonun","3 : 1"],["3-qonun","9 : 3 : 3 : 1"]],"w":[36,64]}]}},{"who":"nur","text":"Diduragay tahliliy chatishtirish: AaBb × aabb. Natija toʻrt xil fenotip, nisbat 1:1:1:1."},{"board":{"title":"Diduragay tahlil","steps":[{"k":"table","head":["Chatishtirish","Nisbat"],"rows":[["AaBb × aabb","1 : 1 : 1 : 1"]],"w":[56,44]}]}},{"ask":{"q":"Ali, AaBbCc genotipli organizm nechta xil gameta hosil qiladi?","o":["8","6","4"],"a":0,"ok":"Qoyil! 👏","no":"2ⁿ = 2³ = 8 xil gameta."}},{"ask":{"q":"Ali, 3-qonun qaysi?","o":["Mustaqil irsiylanish qonuni","Dominantlik qonuni","Ajralish qonuni"],"a":0,"ok":"Barakalla! 🎉","no":"3-qonun — belgilarning mustaqil irsiylanish qonuni."}},{"joke":true}]}],"jokes":["Genotip: «Men retseptman!» Fenotip: «Men esa taomman, lekin muhit tuz soldi 🍲»","Irsiyat: «Hammangiz oʻxshashsiz!» Oʻzgaruvchanlik: «Yoʻq, hammamiz boshqachamiz 😄»","Betson: «Genetika!» Ali: «Ustoz, bu yangi telefon mark  ham, B ham yoʻq — oddiy toj."}},{"ask":{"q":"Ali, AAbb × aaBB dan F1 da qanday toj chiqadi?","o":["Yongʻoqsimon","Gulsimon","Noʻxatsimon"],"a":0,"ok":"Qoyil! 👏","no":"F1 AaBb: A ham, B ham bor — yongʻoqsimon."}},{"joke":true}]},{"title":"Komplementar taʼsir: ikki kalit","items":[{"who":"nur","text":"Komplementar — «toʻldiruvchi» degani. Belgi faqat ikki dominant gen birga boʻlsa paydo boʻladi. Yakka-yakka ular hech narsa qilolmaydi."},{"who":"nur","text":"Misol: xushboʻy noʻxat. Ikki oq gulli navni chatishtirsak, F1 da qizil gullar chiqadi! Ota-onalar: AAbb va aaBB."},{"who":"nur","text":"Sababi: qizil rang ikki bosqichda yasaladi. A gen birinchi moddani, B gen ikkinchi moddani beradi. Ikkalasi ishlasa — qizil pigment."},{"board":{"title":"Ikki kalit","steps":[{"k":"pic","pic":"compl"}]}},{"who":"nur","text":"Telefon ishlashi uchun ham SIM-karta, ham zaryad kerak. Bittasi yoʻq — ishlamaydi. Bu ham komplementar."},{"who":"nur","text":"P: AAbb × aaBB. Gametalar: Ab va aB. F1: hammasi AaBb — qizil gulli. F2: AaBb × AaBb, Pennet katakchasi 16 ta."},{"board":{"title":"F2: 9 : 7","steps":[{"k":"pic","pic":"grid97"}]}},{"who":"nur","text":"Qizil gul — faqat A va B ikkalasi bor katakchalar: 9 ta. Qolgan 7 tasida kamida bittasi yoʻq — oq gul. Nisbat 9 : 7."},{"board":{"title":"Komplementar nisbatlar","steps":[{"k":"table","head":["Nisbat","Misol"],"rows":[["9:3:3:1","tovuq toji"],["9 : 7","xushboʻy noʻxat"],["9 : 3 : 4","uch guruh"],["9 : 6 : 1","uch guruh"]],"w":[40,60]}]}},{"ask":{"q":"Ali, F2 da 9 : 7 nisbat qaysi taʼsirda chiqadi?","o":["Komplementar","Polimer","Letal"],"a":0,"ok":"Barakalla! 🎉","no":"Qizil gul uchun ikkala gen kerak — komplementar taʼsir."}},{"ask":{"q":"Ali, AAbb × aaBB dan xushboʻy noʻxatda F1 gul rangi qanday?","o":["Qizil","Oq","Pushti"],"a":0,"ok":"Qoyil! 👏","no":"F1 AaBb: ikkala dominant gen bor — qizil gul."}},{"joke":true}]},{"title":"Epistaz: oʻchirgich","items":[{"who":"nur","text":"Epistaz — bir genning boshqa genni «bosib qoʻyishi». Bosuvchi gen — ingibitor. Bosilgan gen genotipda bor, lekin ishlamaydi."},{"who":"nur","text":"Misol: tovuq pat rangi. C geni rang beradi, c bermaydi. Ikkinchi gen I — ingibitor: C ning ishini toʻxtatadi. i esa tegmaydi."},{"who":"nur","text":"Uyda chiroq yonishi uchun lampochka (C) kerak. Lekin oʻchirgich (I) oʻchirilgan boʻlsa, lampochka bor, yorugʻlik yoʻq. I — oʻchirgich!"},{"board":{"title":"Chiroq va oʻchirgich","steps":[{"k":"pic","pic":"epistaz"}]}},{"board":{"title":"Pat rangi","steps":[{"k":"table","head":["Genotip","Pat"],"rows":[["iiCC, iiCc","rangli"],["IICC, IiCC, IiCc","oq: I bosadi"],["iicc","oq: rang geni yoʻq"],["IIcc, Iicc","oq"]],"w":[48,52]}]}},{"who":"nur","text":"Ikki oq patli zotni chatishtiramiz: IICC × iicc. Ikkalasi ham oq! Gametalar: IC va ic. F1: hammasi IiCc — oq (I bosyapti)."},{"who":"nur","text":"F2: IiCc × IiCc, 16 katak. Rangli faqat ii va C bor boʻlganlar: iiCC va iiCc. Bunday katak 3 ta. Qolgan 13 tasi oq. Nisbat 13 : 3."},{"board":{"title":"F2: 13 : 3","steps":[{"k":"pic","pic":"grid133"}]}},{"who":"nur","text":"Ikki oq ota-onadan rangli bolalar chiqdi — yangi belgi paydo boʻldi!"},{"board":{"title":"Epistaz nisbatlari","steps":[{"k":"table","head":["Epistaz","F2 nisbat"],"rows":[["dominant","13 : 3 yoki 12 : 3 : 1"],["retsessiv","9 : 3 : 4"]],"w":[40,60]}]}},{"ask":{"q":"Ali, 13 : 3 nisbat qaysi taʼsirda chiqadi?","o":["Dominant epistaz","Komplementar 9 : 7","Polimer"],"a":0,"ok":"Barakalla! 🎉","no":"Tovuq pat rangida I geni epistatik: 13 : 3."}},{"ask":{"q":"Ali, tovuqda I geni nima qiladi?","o":["C genini bosib, patni oq qiladi","Patga rang beradi","Tojni oʻzgartiradi"],"a":0,"ok":"Qoyil! 👏","no":"I — ingibitor: rang genining ishini toʻxtatadi."}},{"ask":{"q":"Ali, IiCc genotipli tovuq pati qanday?","o":["Oq","Rangli","Yarmi rangli"],"a":0,"ok":"Barakalla! 🎉","no":"I bor — u C ni bosadi, pat oq."}},{"joke":true}]},{"title":"Polimeriya: shakar qoshiqlari","items":[{"who":"nur","text":"Polimer — «koʻp qismli». Bir belgini bir necha oʻxshash gen birga yasaydi. Dominant gen qancha koʻp — belgi shuncha kuchli."},{"who":"nur","text":"Choyga shakar solamiz: 1 qoshiq — arang shirin, 4 qoshiq — juda shirin. Har bir dominant gen — bitta qoshiq shakar."},{"who":"nur","text":"Bunday belgilar miqdoriy belgilar: hayvon vazni, oʻsimlik boʻyi, tuxum soni, sutning miqdori va yogʻliligi, vitamin miqdori."},{"who":"nur","text":"Polimeriyani birinchi boʻlib shved olimi Nilson Ele oʻrgandi. U bugʻdoyning qizil (A1A1A2A2) va oq (a1a1a2a2) donli navlarini chatishtirdi. F1 doni pushti — oraliq."},{"who":"nur","text":"F1 ni oʻzaro chatishtirdik. F2 da don rangi 5 guruhga ajraldi. Guruhni dominant genlar soni belgilaydi."},{"board":{"title":"Bugʻdoy F2: 1 : 4 : 6 : 4 : 1","steps":[{"k":"pic","pic":"wheat"}]}},{"board":{"title":"Don rangi","steps":[{"k":"table","head":["Dominant gen","Don rangi","Soni"],"rows":[["4 ta","qizil","1"],["3 ta","och qizil","4"],["2 ta","pushti","6"],["1 ta","och pushti","4"],["0 ta","oq","1"]],"w":[28,44,28]}]}},{"who":"nur","text":"Bu — kumulyativ polimeriya: genlar taʼsiri jamlanadi. F2 da nisbat 1 : 4 : 6 : 4 : 1. Miqdoriy belgilar shunday irsiylanadi."},{"who":"nur","text":"Ikkinchi xili — nokumulyativ polimeriya: bitta dominant gen yetarli, soni ahamiyatsiz. F2 da nisbat 15 : 1. Bu koʻproq sifat belgilarga xos."},{"board":{"title":"Polimeriya xillari","steps":[{"k":"table","head":["Xil","F2 nisbat"],"rows":[["kumulyativ","1:4:6:4:1"],["nokumulyativ","15 : 1"]],"w":[50,50]}]}},{"who":"nur","text":"Ahamiyati katta: sut miqdori va yogʻliligi, lavlagidagi shakar, boshoq va makkajoʻxori soʻtasining uzunligi polimer genlar bilan boshqariladi. Seleksionerlar hosildorlikni shu bilan oshiradi."},{"ask":{"q":"Ali, F2 da 1 : 4 : 6 : 4 : 1 nisbat qaysi taʼsirda?","o":["Kumulyativ polimeriya","Epistaz","Komplementar"],"a":0,"ok":"Qoyil! 👏","no":"Dominant genlar soni boʻyicha 5 guruh — kumulyativ polimeriya."}},{"ask":{"q":"Ali, bugʻdoy F2 da eng koʻp (6 qism) guruh qaysi?","o":["Pushti","Qizil","Oq" y tushuntiramiz?"},{"who":"nur","text":"Uch rang va «juda oz oq» — bu dominant epistaz: 12 : 3 : 1. Malla gen (A) yashil genni (B) bosadi. A bor boʻlsa — malla, aaB_ — yashil, aabb — oq."},{"who":"nur","text":"P: AAbb (malla) × aaBB (yashil). F1: AaBb — malla. F2: 12 malla : 3 yashil : 1 oq. Oq — atigi 1/16, shuning uchun juda oz."},{"board":{"title":"Gʻoʻza tolasi","steps":[{"k":"table","head":["Genotip","Tola"],"rows":[["A bor","malla, 12"],["aaB_","yashil, 3"],["aabb","oq, 1"]],"w":[44,56]}]}},{"who":"nur","text":"5-masala. Makkajoʻxori soʻtasi: 20 sm va 8 sm uzunlikdagi ikki nav chatishtirildi. Har dominant gen soʻtani 5 sm, retsessiv gen 2 sm qiladi."},{"who":"nur","text":"Avval genlar sonini topamiz. Uzun nav: 20 sm = 4 × 5, yaʼni 4 ta dominant gen — AABB. Kalta nav: 8 sm = 4 × 2, yaʼni 4 ta retsessiv gen — aabb. Demak, 2 juft gen."},{"who":"nur","text":"a) F1 AaBb: 2 ta dominant va 2 ta retsessiv gen. Uzunlik: 2 × 5 + 2 × 2 = 14 sm."},{"who":"nur","text":"b) F2 da 3 ta dominant genli formalar: AABb va AaBB. Pennet katakchasida 16 dan 4 tasi. 4/16 = 1/4 qism. 960 ta oʻsimlikdan: 960 : 4 = 240 ta."},{"board":{"title":"Makkajoʻxori","steps":[{"k":"table","head":["Savol","Javob"],"rows":[["uzun nav","AABB, 20 sm"],["kalta nav","aabb, 8 sm"],["a) F1 soʻta","14 sm"],["b) ulushi","1/4 qism"],["b) soni","240 ta"]],"w":[50,50]}]}},{"ask":{"q":"Ali, F1 makkajoʻxori soʻtasi necha sm?","o":["14","20","8"],"a":0,"ok":"Barakalla! 🎉","no":"2 × 5 + 2 × 2 = 14 sm."}},{"ask":{"q":"Ali, 960 ta F2 oʻsimlikdan 3 ta dominant genlilar nechta?","o":["240","120","60"],"a":0,"ok":"Qoyil! 👏","no":"4/16 = 1/4; 960 : 4 = 240."}},{"ask":{"q":"Ali, gʻoʻzada F2 da 12 : 3 : 1 nimani koʻrsatadi?","o":["Dominant epistaz","Letal gen","Pleyotropiya"],"a":0,"ok":"Barakalla! 🎉","no":"Malla gen yashil genni bosadi: 12 : 3 : 1."}},{"board":{"title":"Bugungi dars","steps":[{"k":"table","head":["Taʼsir","Oʻxshatish"],"rows":[["komplementar","ikki kalit"],["epistaz","oʻchirgich"],["polimer","shakar qos ill","q":"Odamda 22 juft ___ va 2 ta jinsiy xromosoma bor.","o":["autosoma","plastida","mitoxondriya"],"a":0,"w":"Autosoma."},{"t":"fill","q":"Qushlarda ___ jins geterogametali.","o":["urgʻochi","erkak","ikkala"],"a":0,"w":"Urgʻochi."},{"t":"fill","q":"XHXh × XHY dan 8 farzandda kasal oʻgʻil ___ ta kutiladi.","o":["2","4","1"],"a":0,"w":"2 ta."},{"t":"fill","q":"Y xromosoma genlari otadan ___ oʻtadi.","o":["oʻgʻilga","qizga","hammaga"],"a":0,"w":"Oʻgʻilga."},{"t":"image","q":"Drozofila urgʻochisi qanday jinsiy xromosomalarga ega?","o":["XX","XY","X"],"a":0,"w":"Urgʻochida XX.","e":"🪰"},{"t":"image","q":"Kariotipda 22 juft autosoma va XY bor. Bu kim?","o":["Erkak","Ayol","Aniq emas"],"a":0,"w":"XY — erkak.","e":"🧬"},{"t":"image","q":"Viandot: kumushrang tovuq × oltin xoʻroz. F1 xoʻrozlar qanday?","o":["Kumushrang","Oltin rang","Yarmi oltin"],"a":0,"w":"XSXs — kumushrang.","e":"🐓"},{"t":"image","q":"Pomidor F2 da 1200 ta. Kalta noksimon (1/4) nechta?","o":["300","900","600"],"a":0,"w":"1200 : 4 = 300.","e":"🍅"},{"t":"image","q":"Makkajoʻxori: 301 ta yangi birikma, jami 8616. Masofa?","o":["3,5 morganida","35 morganida","0,35 morganida"],"a":0,"w":"301 : 8616 × 100 ≈ 3,5.","e":"🌽"},{"t":"image","q":"Gemofiliya: XHXh × XHY. Kasal oʻgʻil ulushi?","o":["Oʻgʻillarning yarmi","Hammasi","Hech biri"],"a":0,"w":"XhY — oʻgʻillarning yarmi.","e":"🩸"},{"t":"order","q":"Jinsning belgilanishi bosqichlari.","items":["Meyozda X va Y spermiylar hosil boʻladi","Spermiy tuxum hujayraga qoʻshiladi","Zigota XX yoki XY boʻladi","Qiz yoki oʻgʻil rivojlanadi"],"w":"Meyoz → urugʻlanish → zigota → rivojlanish."},{"t":"order","q":"Krossingover foizini topish bosqichlari.","items":["Jami sonni topish","Yangi birikmalarni qoʻshish","Yangi sonni jamiga boʻlish","100 ga koʻpaytirish"],"w":"Jami → yangi → boʻlish → 100."},{"t":"order","q":"Xromosoma soni (kichikdan kattaga).","items":["4 (drozofila guruhi)","7 (noʻxat guruhi)","23 (odam guruhi)","46 (odam 2n)"],"w":"4, 7, 23, 46."},{"t":"order","q":"Gemofiliya masalasi bosqichlari.","items":["Ota-ona XHXh × XHY","Gametalar XH, Xh va XH, Y","Bolalar XHXH, XHXh, XHY, XhY","8 farzandda 2 ta kasal oʻgʻil"],"w":"Ota-ona → gameta → bolalar → javob."},{"t":"match","q":"Terminni maʼnosi bilan juftlang.","pairs":[["autosoma","ikki jinsda bir xil"],["jinsiy xromosoma","ikki jinsda har xil"],["krossingover","qism almashish"],["birikish guruhi","gaploid soniga teng"]],"w":"Terminlar."},{"t":"match","q":"Organizmni jinsiy xromosomalar bilan juftlang.","pairs":[["ayol","XX"],["erkak","XY"],["qush urgʻochisi","XY"],["qush erkagi","XX"]],"w":"Jinsiy xromosomalar."},{"t":"match","q":"Masalani javob bilan juftlang.","pairs":[["pomidor F2 uzun yumaloq","900"],["primula kalta yashil","495"],["drozofila F2 oq erkak","75"],["viandot kumush jʻoʻja","15"]],"w":"Masala javoblari."},{"t":"match","q":"Genotipni holat bilan juftlang.","pairs":[["XHXH","sogʻlom qiz"],["XHXh","tashuvchi qiz"],["XHY","sogʻlom oʻgʻil"],["XhY","kasal oʻgʻil"]],"w":"Gemofiliya."}]},"9-16":{"id":"9-16","grade":9,"no":16,"title":"Oʻzgaruvchanlik va odam genetikasi","subtitle":"59, 61–63-§ · Modifikatsiya, mutatsiya, irsiy kasalliklar","sticker":"🧪","stickerName":"Mutatsiya sirlari","sections":[{"title":"Oʻzgaruvchanlik: nega hamma har xil?","items":[{"who":"nur","text":"Ali, sinfdoshlaringga qara. Hammasi odam, lekin hech biri bir-biriga oʻxshamaydi. Organizmlarning belgilari bilan bir-biridan farq qilishi — oʻzgaruvchanlik."},{"who":"ali","text":"Ustoz, bu yaxshimi?"},{"who":"nur","text":"Juda yaxshi. Oʻzgaruvchanlik tufayli tur xilma-xil boʻladi. Tabiiy va sunʼiy tanlash ham aynan shu xilma-xillikdan tanlaydi."},{"who":"nur","text":"Oʻzgaruvchanlik ikki guruhga boʻlinadi: irsiylanmaydigan va irsiylanadigan."},{"who":"nur","text":"Kitob misolini ol. Yomgʻirda kitobing ivib qolsa, bu faqat shu nusxaga tegadi. Bosmaxonada matnda xato ketsa, keyingi barcha nusxalarda ham takrorlanadi. Birinchisi — modifikatsiya, ikkinchisi — mutatsiya."},{"board":{"title":"Oʻzgaruvchanlik xillari","steps":[{"k":"table","head":["Xil","Nimaga bogʻliq"],"rows":[["kombinativ","yangi gen birikmasi"],["rekombinogenez","krossingover"],["mutatsion","gen, xromosoma"],["ontogenetik","rivojlanish"],["modifikatsion","tashqi muhit"]],"w":[56,44]}]}},{"who":"nur","text":"Kombinativ — ota-onaning erkin chatishuvidan genlarning yangi birikmalari. Rekombinogenez — meyozdagi krossingoverdan. Ontogenetik — organizm rivojlanishi davomida belgilarning oʻzgarishi."},{"ask":{"q":"Ali, oʻzgaruvchanlik nima?","o":["Organizmlarning belgilari bilan farq qilishi","Faqat jinsiy farq","Faqat boʻy farqi"],"a":0,"ok":"Barakalla! 🎉","no":"Bir turdagi organizmlarning bir-biridan farq qilish xossasi."}},{"ask":{"q":"Ali, krossingover tufayli boʻladigan oʻzgaruvchanlik qaysi?","o":["Rekombinogenez","Modifikatsion","Ontogenetik"],"a":0,"ok":"Qoyil! 👏","no":"Meyozdagi krossingover — rekombinogenez oʻzgaruvchanlik."}},{"joke":true}]},{"title":"Modifikatsiya: muhit taʼsiri","items":[{"who":"nur","text":"Modifikatsion oʻzgaruvchanlikda genotip oʻzgarmaydi, faqat fenotip oʻzgaradi. Sababi — tashqi muhit: harorat, namlik, ozuqa."},{"who":"nur","text":"Himolay quyoni — mashhur misol. Uning yelkasidagi oq junni yulib, joyiga sovuq taʼsir qilsang, qora jun oʻsadi. Issiq belbogʻ bogʻlasang, yana oq jun oʻsadi."},{"board":{"title":"Himolay quyoni","steps":[{"k":"pic","pic":"modif"}]}},{"who":"nur","text":"30 °C da boqilgan Himolay quyonining hamma juni oq boʻladi. Lekin normal sharoitda oʻstirilgan ikki oq quyon avlodida pigment odatdagidek tarqaladi. Demak, muhit taʼsiridagi oʻzgarish nasldan-naslga oʻtmaydi."},{"who":"nur","text":"Yana bir misol — suv nilufari. Suv ostidagi bargi ingichka lansetsimon, suv ustidagi bargi keng voronkasimon. Gen bitta, muhit ikkita."},{"board":{"title":"Nilufar bargi","steps":[{"k":"pic","pic":"lily"}]}},{"who":"nur","text":"Suv yongʻogʻida ham shunday: suv osti bargi patsimon qirqilgan, suv ustidagi yaxlit."},{"who":"nur","text":"Odamda ham bor: quyosh nuri taʼsirida teri melanin toʻplab qorayadi (albinoslardan tashqari). Qoraygan terang bolangga oʻtmaydi."},{"ask":{"q":"Ali, Himolay quyonini 30 °C da boqsak, juni qanday boʻladi?","o":["Hammasi oq","Hammasi qora","Yarmi qora"],"a":0,"ok":"Barakalla! 🎉","no":"Issiqda pigment hosil boʻlmaydi, jun oq boʻladi."}},{"ask":{"q":"Ali, modifikatsiyada nima oʻzgaradi?","o":["Fenotip","Genotip","DNK ketma-ketligi"],"a":0,"ok":"Qoyil! 👏","no":"Genotip oʻzgarmaydi, fenotip oʻzgaradi."}},{"ask":{"q":"Ali, nilufar bargining shakli nimaga bogʻliq?","o":["Suv ostida yoki ustida ekaniga","Xromosoma soniga","Mutatsiyaga"],"a":0,"ok":"Barakalla! 🎉","no":"Tashqi muhit shaklni oʻzgartiradi."}},{"joke":true}]},{"title":"Reaksiya normasi: rezina chegarasi","items":[{"who":"nur","text":"Muhit belgini oʻzgartiradi, lekin cheksiz emas. Belgi oʻzgaradigan doira — reaksiya normasi."},{"who":"nur","text":"Rezinani choʻz: u bir joygacha choʻziladi, keyin uziladi. Rezinaning chegarasini uning materiali, yaʼni genotip belgilaydi."},{"board":{"title":"Reaksiya normasi","steps":[{"k":"pic","pic":"rnorm"}]}},{"who":"nur","text":"Muhim belgilarda reaksiya normasi tor: bosh miya va yurak kattaligi deyarli oʻzgarmaydi. Yogʻ miqdori esa keng oraliqda oʻzgaradi. Sut yogʻi qoramol zotiga, yaʼni genotipga bogʻliq."},{"who":"ali","text":"Ustoz, bu nimaga kerak?"},{"who":"nur","text":"Seleksiyada: yangi sermahsul nav va zot yaratishda hamda bor navlardan yuqori hosil olishda. Tibbiyotda ham: odam organizmini reaksiya normasi doirasida saqlash uchun."},{"board":{"title":"Modifikatsiya xususiyatlari","steps":[{"k":"table","head":["№","Xususiyat"],"rows":[["1","irsiylanmaydi"],["2","guruhli xarakter"],["3","muhitga bogʻliq"],["4","chegarasi genotipda"]],"w":[18,82]}]}},{"ask":{"q":"Ali, reaksiya normasining kengligini nima belgilaydi?","o":["Genotip","Faqat harorat","Tasodif"],"a":0,"ok":"Qoyil! 👏","no":"Chegarani genotip belgilaydi."}},{"ask":{"q":"Ali, qaysi belgining reaksiya normasi tor?","o":["Yurak kattaligi","Yogʻ miqdori","Barg kattaligi"],"a":0,"ok":"Barakalla! 🎉","no":"Muhim belgilar deyarli oʻzgarmaydi."}},{"joke":true}]},{"title":"Mutatsiya: bosmaxonadagi xato","items":[{"who":"nur","text":"Irsiy materialning oʻzgarishi — mutatsiya. Genotip oʻzgaradi va oʻzgarish bir necha avlodda saqlanadi."},{"who":"nur","text":"Bosmaxonadagi xato eslaysanmi? Matndagi bitta harf almashsa, shu kitobning hamma nusxasida xato chiqadi. Mutatsiya shunday."},{"who":"nur","text":"Misollar: kalta oyoqli qoʻylar, patsiz tovuqlar, albinizm, kalta barmoqlilik va koʻp barmoqlilik (polidaktiliya). Xushboʻy noʻxatning kalta poyali navlari ham mutatsiyadan paydo boʻlgan."},{"who":"nur","text":"Mutatsiyalar gen yoki xromosoma tuzilishining oʻzgarishidan hosil boʻladi va tur ichidagi xilma-xillikning yagona manbai."},{"who":"nur","text":"Namoyon boʻlishiga qarab mutatsiya dominant yoki retsessiv boʻladi. Koʻpchiligi retsessiv: geterozigotada yashirin turadi. Bu turning yashashi uchun muhim."},{"who":"nur","text":"Odatda mutatsiyalar zararli: nozik muvozanatdagi biokimyoviy jarayonlarni buzadi. Lekin muhit oʻzgarsa, avval zararli mutatsiya foydali boʻlib qolishi mumkin. Unday tashuvchilarni tabiiy tanlanish saralaydi."},{"board":{"title":"Paydo boʻlgan joyi","steps":[{"k":"table","head":["Xil","Qayerda","Kimga oʻtadi"],"rows":[["generativ","jinsiy hujayra","keyingi avlod"],["somatik","tana hujayra","oʻzida"]],"w":[36,34,30]}]}},{"who":"nur","text":"Generativ mutatsiya egasida koʻrinmaydi, keyingi bugʻinda namoyon boʻladi. Somatik mutatsiya shu organizmning oʻzida koʻrinadi va jinsiy koʻpayishda oʻtmaydi. Jinssiz koʻpayishda esa avlodlarga oʻtishi mumkin."},{"who":"nur","text":"Oʻsimlikshunoslikda somatik mutatsiyalardan madaniy oʻsimliklarning yangi navlarini yaratishda keng foydalaniladi."},{"ask":{"q":"Ali, jinsiy hujayradagi mutatsiya qanday ataladi?","o":["Generativ","Somatik","Modifikatsion"],"a":0,"ok":"Barakalla! 🎉","no":"Jinsiy hujayradagi — generativ, keyingi avlodda koʻrinadi."}},{"ask":{"q":"Ali, mutatsiyalarning koʻpchiligi qanday?","o":["Retsessiv","Dominant","Hammasi foydali"],"a":0,"ok":"Qoyil! 👏","no":"Koʻpchiligi retsessiv, geterozigotada yashirin turadi."}},{"ask":{"q":"Ali, tur ichidagi xilma-xillikning yagona manbai nima?","o":["Mutatsiya","Ozuqa","Harorat"],"a":0,"ok":"Barakalla! 🎉","no":"Yangi gen variantlarini mutatsiya beradi."}},{"joke":true}]},{"title":"Gen, xromosoma va poliploidiya","items":[{"who":"nur","text":"Mutatsiya qaysi darajada boʻlishiga qarab gen yoki xromosoma mutatsiyasiga boʻlinadi."},{"who":"nur","text":"Bir gen ichida bitta yoki bir nechta nukleotid almashsa — gen (nuqtali) mutatsiya. Oqsildagi aminokislotalar ketma-ketligi oʻzgaradi, oqsil ishi ham oʻzgaradi."},{"board":{"title":"Nuqtali mutatsiya","steps":[{"k":"pic","pic":"pointmut"}]}},{"who":"nur","text":"Xromosomaning tuzilishi oʻzgarsa — xromosoma mutatsiyasi. Masalan, xromosoma bir qismi yoʻqoladi yoki uzilgan qism boshqa xromosomaga yopishib, genlar yangi birikma hosil qiladi."},{"who":"nur","text":"Xromosomalar soni bittaga ortsa yoki kamaysa ham genlar muvozanati buziladi va rivojlanish buziladi."},{"who":"nur","text":"Poliploidiya — xromosomalar toʻplamining gaploid songa nisbatan karra ortishi. Sodda hayvonlarda yuz barobarga yetishi mumkin. Yuksak oʻsimliklarda keng tarqalgan."},{"board":{"title":"Poliploidiya","steps":[{"k":"pic","pic":"poly"}]}},{"who":"nur","text":"Karam misolida: diploid, tetraploid va oktaploid shakllar bor. Xromosomalar koʻpayishi genetik barqarorlikni oshiradi, hosildorlik va hayotchanlik ortadi."},{"who":"ali","text":"Ustoz, nega barqarorlik oshadi?"},{"who":"nur","text":"Kitobning 4 nusxasi bor. Bitta nusxada xato chiqsa, uchtasi turibdi. Poliploid ham shunday: bitta genning zaxirasi koʻp."},{"who":"nur","text":"Mutatsiyani mutagenlar koʻpaytiradi: rentgen nurlari (150 martagacha) va kimyoviy moddalar. Sunʼiy mutatsiyalar seleksionerga yordamchi material beradi."},{"board":{"title":"Mutatsiya darajalari","steps":[{"k":"table","head":["Daraja","Nima oʻzgaradi"],"rows":[["gen","nukleotid"],["xromosoma","tuzilishi"],["genom","soni, poliploidiya"]],"w":[44,56]}]}},{"ask":{"q":"Ali, bitta nukleotid almashsa, bu qanday mutatsiya?","o":["Gen (nuqtali)","Xromosoma","Somatik"],"a":0,"ok":"Barakalla! 🎉","no":"Gen doirasidagi oʻzgarish — nuqtali mutatsiya."}},{"ask":{"q":"Ali, poliploidiya nima?","o":["Xromosomalar toʻplami karra ortishi","Bitta xromosoma yoʻqolishi","Gen almashishi"],"a":0,"ok":"Qoyil! 👏","no":"Toʻplam gaploidga nisbatan bir necha baravar koʻpayadi."}},{"ask":{"q":"Ali, mutatsiyani koʻpaytiruvchi omillar qaysi?","o":["Rentgen nuri va kimyoviy moddalar","Faqat sovuq","Faqat ozuqa"],"a":0,"ok":"Barakalla! 🎉","no":"Ular mutagenlar deyiladi."}},{"joke":true}]},{"title":"Odam genetikasi: qanday oʻrganiladi?","items":[{"who":"nur","text":"Odamda tajriba oʻtkazib boʻlmaydi: u sekin rivojlanadi, balogʻatga kech yetadi, bolalari oz. Shuning uchun maxsus usullar ishlab chiqilgan."},{"who":"nur","text":"Hozir odamda 4000 ga yaqin normal va patologik belgining irsiylanishi oʻrganilgan."},{"board":{"title":"Odam genetikasi usullari","steps":[{"k":"table","head":["Usul","Nimani oʻrganadi"],"rows":[["shajara","nasl-nasab"],["egizaklar","genotip va muhit"],["sitogenetik","xromosoma soni, tuzilishi"],["biokimyoviy","moddalar almashinuvi"]],"w":[44,56]}]}},{"who":"nur","text":"Shajara usulini F. Galton kiritgan. Bunda iloji boricha koʻp qarindoshning nasl-nasabi oʻrganiladi. Oila daraxtiga oʻxshaydi: bobo, ota-ona, farzand."},{"board":{"title":"Shajara","steps":[{"k":"pic","pic":"pedigree"}]}},{"who":"nur","text":"Shajara yordamida belgi va kasalliklar qanday oʻtishi aniqlanadi. Masalan, musiqa va matematikaga qobiliyat irsiy omilga bogʻliq. Temuriylar sulolasi ham shunday misol. Lekin qobiliyat ijtimoiy muhitga ham bogʻliq."},{"who":"nur","text":"Retsessiv holda oʻtadigan: qandli diabet, tugʻma karlik, gemofiliya. Dominant holda oʻtadigan: braxidaktiliya (kaltabarmoqlik)."},{"who":"nur","text":"Egizaklar usuli: egizaklarda belgi rivojlanishini oʻrganish. Genotip va muhit taʼsirini ajratish uchun eng qulay obyekt."},{"board":{"title":"Egizaklar","steps":[{"k":"pic","pic":"twins"}]}},{"who":"nur","text":"Bir tuxumdan rivojlangan egizaklar bir jinsli va juda oʻxshash: genotipi bir xil, farqi faqat muhitdan. Ikki tuxumdan rivojlangani oddiy aka-uka yoki opa-singilga oʻxshaydi, jinsi bir xil yoki har xil boʻladi."},{"who":"nur","text":"Sitogenetik usul: sogʻlom va kasal odamda xromosomalarni mikroskopda solishtirish. Biokimyoviy usul: moddalar almashinuvidagi oʻzgarishni aniqlash. Masalan, qandli diabetda meʼda osti bezi insulinni kam ajratadi."},{"board":{"title":"Dominant va retsessiv belgilar","steps":[{"k":"table","head":["Dominant","Retsessiv"],"rows":[["jingalak soch","toʻgʻri soch"],["qoʻy koʻz","koʻk, kulrang koʻz"],["sepkil","sepkilsiz"],["pakanalik","normal boʻy"],["polidaktiliya","normal barmoq"]],"w":[50,50]}]}},{"ask":{"q":"Ali, shajara usulini kim kiritgan?","o":["F. Galton","Mendel","Morgan"],"a":0,"ok":"Barakalla! 🎉","no":"Nasl-nasab usulini F. Galton kiritgan."}},{"ask":{"q":"Ali, bir tuxumdan rivojlangan egizaklar qanday?","o":["Bir jinsli, oʻxshash","Jinsi har xil","Umuman oʻxshamaydi"],"a":0,"ok":"Qoyil! 👏","no":"Genotipi bir xil, shuning uchun juda oʻxshash."}},{"ask":{"q":"Ali, sepkil — qanday belgi?","o":["Dominant","Retsessiv","Letal"],"a":0,"ok":"Barakalla! 🎉","no":"Sepkil dominant belgi."}},{"joke":true}]},{"title":"Gen kasalliklari","items":[{"who":"nur","text":"Odamda 2000 dan ortiq irsiy kasallik maʼlum. Ularni tibbiyot genetikasi oʻrganadi: sabablarini topadi, oldini olish va davolash yoʻllarini ishlaydi."},{"who":"nur","text":"Kasalliklar ikkiga boʻlinadi: gen kasalliklari va xromosoma kasalliklari. Tibbiyot genetikasi mutatsiya sabablarini ham aniqlaydi: radiatsiya, kimyoviy mutagenlar, spirtli ichimlik va narkotiklar irsiyatga zarar qiladi."},{"who":"nur","text":"Dominant gen kasalliklari fenotipda aniq koʻrinadi. Misollar: sindaktiliya (panjalar tutashib ketishi), polidaktiliya (ortiqcha barmoq), mikrotsefaliya. Ular erta aniqlanadi, shuning uchun davoni oʻz vaqtida boshlash mumkin."},{"who":"nur","text":"Retsessiv gen kasalligi geterozigotada koʻrinmaydi. Ikkinchi gen xuddi zaxira kalit kabi ishlaydi. Faqat gomozigota holda kasallik paydo boʻladi."},{"board":{"title":"Retsessiv kasalliklar","steps":[{"k":"table","head":["Kasallik","Xususiyat"],"rows":[["fenilketonuriya","10 000 dan 1"],["albinizm","pigment yoʻq"],["gemofiliya","X ga birikkan"],["daltonizm","X ga birikkan"]],"w":[54,46]}]}},{"who":"nur","text":"Fenilketonuriya: har 10 000 chaqaloqdan bittasida uchraydi. Vaqtida aniqlab, ovqatdan fenilalanin chiqarib tashlansa, miya normal shakllanadi."},{"who":"nur","text":"Albinizmda teri va sochda pigment boʻlmaydi, koʻrish zaifroq, quyoshga juda taʼsirchan boʻladi. Gemofiliya va daltonizm jinsiy X xromosomaga birikkan gen kasalliklari."},{"ask":{"q":"Ali, qaysi kasallik dominant genlardan paydo boʻladi?","o":["Polidaktiliya","Albinizm","Fenilketonuriya"],"a":0,"ok":"Barakalla! 🎉","no":"Polidaktiliya, sindaktiliya dominant."}},{"ask":{"q":"Ali, fenilketonuriyada nima qilish kerak?","o":["Ovqatdan fenilalaninni chiqarish","Quyoshda yurish","Hech narsa"],"a":0,"ok":"Qoyil! 👏","no":"Vaqtida tashxis va maxsus ovqat miya shakllanishini saqlaydi."}},{"ask":{"q":"Ali, qaysi kasallik X xromosomaga birikkan?","o":["Daltonizm","Albinizm","Daun sindromi"],"a":0,"ok":"Barakalla! 🎉","no":"Gemofiliya va daltonizm X ga birikkan."}},{"joke":true}]},{"title":"Xromosoma kasalliklari","items":[{"who":"nur","text":"Xromosoma kasalliklarida xromosomalar soni yoki tuzilishi oʻzgaradi. Ularni sitogenetik usul aniqlaydi. Qondagi leykositlarni 37 °C da oziq muhitda boʻldirib, xromosomalarni koʻrinadigan qilishadi."},{"who":"nur","text":"Kitobning sahifalarini sanaganingni tasavvur qil. Normal kitobda 2 nusxadan, lekin bitta sahifa ortiqcha chiqib qolsa, kitob muvozanati buziladi. Xromosoma kasalligi ham shunday."},{"who":"nur","text":"Daun sindromi: 21-juft xromosoma bittaga ortiq, yaʼni trisomiya. Xromosomalar soni 46 emas, 47 ta."},{"board":{"title":"21-juft xromosoma","steps":[{"k":"pic","pic":"trisomy"}]}},{"who":"nur","text":"Daun sindromi ayolda ham, erkakda ham uchraydi. Bunday bolalar rivojlanishida alohida yordam va eʼtibor kerak boʻladi. Sabab: tashqi muhit omillari va onaning yoshi. Ona 35–40 dan oshgan boʻlsa, ehtimol 18–25 yoshdagiga nisbatan 10 baravar koʻp."},{"who":"nur","text":"Jinsiy xromosomalar soni oʻzgarishidan ham kasalliklar bor: Klaynfelter va Shershevskiy–Terner sindromlari."},{"board":{"title":"Jinsiy xromosoma sindromlari","steps":[{"k":"table","head":["Sindrom","Genotip","2n"],"rows":[["Klaynfelter","XXY","47"],["Shershevskiy–Terner","X0","45"],["Daun","21-trisomiya","47"]],"w":[44,30,26]}]}},{"who":"nur","text":"Klaynfelter sindromi faqat erkaklarda: genotip XXY. Taxminan 500 ta oʻgʻil bolaning bittasida uchraydi. Boʻy va oyoq-qoʻllar uzun, jinsiy bezlar rivojlanishi buziladi."},{"who":"nur","text":"Shershevskiy–Terner sindromi faqat ayollarda: ikkita X oʻrniga bitta X (45 ta xromosoma). Boʻyi past, tuxumdon rivojlanmagan. Taxminan 5000 ta qizning bittasida uchraydi."},{"ask":{"q":"Ali, Daun sindromida xromosomalar soni nechta?","o":["47","46","45"],"a":0,"ok":"Barakalla! 🎉","no":"21-juft xromosoma bittaga ortiq: 47."}},{"ask":{"q":"Ali, Klaynfelter sindromida jinsiy xromosomalar qanday?","o":["XXY","X0","XYY"],"a":0,"ok":"Qoyil! 👏","no":"Erkakda bitta ortiqcha X: XXY."}},{"ask":{"q":"Ali, Shershevskiy–Terner sindromida xromosomalar soni?","o":["45","47","46"],"a":0,"ok":"Barakalla! 🎉","no":"XX oʻrniga X: 45 ta."}},{"joke":true}]},{"title":"Tibbiy-genetik maslahat","items":[{"who":"nur","text":"Retsessiv kasallikda geterozigota tashuvchi oʻzi kasal boʻlmaydi. Lekin ikki tashuvchi turmush qursa, bolasining kasal tugʻilish ehtimoli yuqori."},{"who":"nur","text":"Yoshlar turmush qurayotganda koʻpincha bunday kasallik haqida oʻylamaydi. Shuning uchun tibbiy-genetik maslahat markazlari ochilgan: ular oila qurmoqchi yoshlarga kelajak farzand salomatligi haqida tushuntiradi."},{"board":{"title":"Genetik maslahat nima beradi","steps":[{"k":"table","head":["Imkoniyat"],"rows":[["tashuvchini aniqlash"],["ehtimolni baholash"],["oldini olish yoʻli"],["sogʻlom avlod"]],"w":[100]}]}},{"who":"nur","text":"Xulosa: modifikatsiya muhitdan, mutatsiya genotipdan. Odam genetikasi shajara, egizaklar, sitogenetik va biokimyoviy usullar bilan oʻrganiladi. Maqsad — sogʻlom avlod."},{"ask":{"q":"Ali, tibbiy-genetik maslahat nima uchun kerak?","o":["Kasal bolaning tugʻilish ehtimolini oldindan bilish","Faqat dori berish","Boʻyni oʻlchash"],"a":0,"ok":"Barakalla! 🎉","no":"Tashuvchilarni aniqlab, sogʻlom avlod uchun yordam beradi."}},{"ask":{"q":"Ali, geterozigota tashuvchi kasal boʻladimi?","o":["Yoʻq, oʻzi sogʻlom","Ha, albatta","Yarmi"],"a":0,"ok":"Qoyil! 👏","no":"Retsessiv gen yashirin turadi."}},{"joke":true}]}],"jokes":["Kitob: «Menga yomgʻir tegdi!» Nusxalari: «Bizga oʻtmaydi, modifikatsiya 😄»","Ali: «Mutatsiya nima?» Ustoz: «Bosmaxonadagi xato, hamma nusxada takrorlanadi 📚»","Himolay quyoni: «Sovuqda qoraydim!» Issiq belbogʻ: «Men yana oqartiraman ☀️»","Nilufar: «Suv ustida keng, suv ostida ingichka barg!» Gen: «Men bitta, muhit ikkita 🌿»","Rezina: «Men choʻzilaman!» Genotip: «Mening chegaram bor, tinchla 😅»","Ali: «Teri qorayganda bolam ham qoramtir boʻladimi?» Ustoz: «Yoʻq, bu modifikatsiya 🌞»","Poliploid karam: «Menda zaxira genlar koʻp!» Oddiy karam: «Menda esa faqat ikkita 🥬»","Rentgen: «Men mutatsiyani 150 marta oshiraman!» Ali: «Shuning uchun kerak boʻlmasa kelmang 🚫»","Shajara: «Men oila daraxtiman!» Ali: «Men esa bobomning ismini hali ham bilmayman 🌳»","Egizak: «Biz bir tuxumdan!» Ikkinchisi: «Lekin uy vazifasini men yozaman 😎»","Galton: «Shajara usulini men kiritdim!» Ali: «Men esa oʻqituvchining ismini yodlab oldim 🧠»","Ona: «Qizim, sochi jingalak!» Ota: «Jingalak dominant, bildim 🌀»","Fenilketonuriya: «Meni va aterial kerak. Eng boy material — yovvoyi shakllar va qadimgi navlar. Ularni qidirish seleksiyaning birinchi qadami."},{"who":"nur","text":"Rossiyalik olim N. I. Vavilov 1920–1940-yillarda koʻp ekspeditsiya uyushtirdi. U dunyo oʻsimlik resurslarini oʻrganib, urugʻlarning katta kolleksiyasini toʻpladi."},{"who":"nur","text":"Xulosa: madaniy oʻsimliklarning kelib chiqishi 7 markazga boʻlinadi. Har bir ekinning oʻz «uyi» bor, xuddi odamning vatani kabi."},{"board":{"title":"Markazlar ulushi","steps":[{"k":"pic","pic":"centers"}]}},{"board":{"title":"Kelib chiqish markazlari","steps":[{"k":"table","head":["Markaz","Ekinlar"],"rows":[["1. Janubiy Osiyo","sholi, shakarqamish"],["2. Sharqiy Osiyo","soya, tariq"],["3. Janubiy-gʻarbiy Osiyo","bugʻdoy, sabzi, zigʻir"],["4. Oʻrta yer dengizi","karam, lavlagi, zaytun"],["5. Abissiya","arpa, banan, kofe"],["6. Markaziy Amerika","makkajoʻxori, loviya, kakao"],["7. Janubiy Amerika","kartoshka, ananas, tamaki"]],"w":[46,54]}]}},{"who":"nur","text":"Hozir markazlar soni 12 tagacha koʻpaytirilgan. Vavilov kolleksiyasining subtropik oʻsimliklari qismi Oʻzbekiston oʻsimlikshunoslik institutida ham saqlanadi."},{"who":"nur","text":"Rossiyadagi kolleksiyada 320 mingdan ortiq namuna bor, 1041 tur. Unda yovvoyi turlar, madaniy oʻsimliklar avlodlari va eski mahalliy navlar saqlanadi."},{"who":"nur","text":"Olimlar bu «genlar bankidan» kerakli belgini tanlaydi: hosildorlik, tezpisharlik, kasallik va zararkunandaga, qurgʻoqchilikka chidamlilik."},{"who":"nur","text":"Misol: yovvoyi gʻoʻza genlari asosida yaratilgan «Toshkent» navlari viltga chidamli."},{"ask":{"q":"Ali, Vavilov madaniy oʻsimliklarning kelib chiqishini nechta markazga boʻldi?","o":["7","3","12"],"a":0,"ok":"Barakalla! 🎉","no":"Dastlab 7 markaz, hozir 12 tagacha."}},{"ask":{"q":"Ali, kartoshka qaysi markazdan?","o":["Janubiy Amerika","Sharqiy Osiyo","Abissiya"],"a":0,"ok":"Qoyil! 👏","no":"Kartoshka, ananas, tamaki — And markazidan."}},{"ask":{"q":"Ali, bugʻdoy qaysi markazning ekini?","o":["Janubiy-gʻarbiy Osiyo","Markaziy Amerika","Sharqiy Osiyo"],"a":0,"ok":"Barakalla! 🎉","no":"Kichik Osiyo, Oʻrta Osiyo, Eron-Afgʻoniston markazi."}},{"joke":true}]},{"title":"Zot va nav: reaksiya normasi","items":[{"who":"nur","text":"Har bir zot va nav oʻz reaksiya normasiga ega. Shuning uchun uni sharoitga moslab yaratish kerak."},{"who":"nur","text":"Oq lekgorn tovuqi koʻp tuxum beradi. Ozuqa va sharoit yaxshilansa, tuxum soni ortadi, lekin tuxum massasi deyarli oʻzgarmaydi. Chegarani genotip belgilaydi, sen oldingi darsdagi rezinani eslaysan."},{"board":{"title":"Zot va nav sharoiti","steps":[{"k":"table","head":["Nima","Izoh"],"rows":[["fenotip","sharoitda koʻrinadi"],["iqlim","har joyda har xil"],["agrotexnika","har joyda har xil"],["xulosa","moslangan zot kerak"]],"w":[46,54]}]}},{"ask":{"q":"Ali, oq lekgorn tovuqida sharoit yaxshilansa nima ortadi?","o":["Tuxum soni","Tuxum massasi","Zot oʻzgaradi"],"a":0,"ok":"Qoyil! 👏","no":"Tuxum soni ortadi, massa deyarli oʻzgarmaydi."}},{"joke":true}]},{"title":"Tanlash: yalpi va yakka","items":[{"who":"nur","text":"Tanlash ikki xil: yalpi va individual (yakka)."},{"who":"nur","text":"Yalpi tanlash sinfdan aʼlochilar guruhini ajratib olishga oʻxshaydi: ekinzordan kerakli sifatli oʻsimliklar guruhi tanlanadi. Kelasi yil ularning urugʻi ekiladi va tanlash yana takrorlanadi."},{"who":"nur","text":"Yakka tanlash esa bitta eng yaxshi oʻquvchini tanlashga oʻxshaydi: qimmatli belgili alohida oʻsimlik olinadi va undan yangi avlod yetishtiriladi."},{"board":{"title":"Tanlash","steps":[{"k":"pic","pic":"selchoose"}]}},{"board":{"title":"Yalpi va yakka tanlash","steps":[{"k":"table","head":["Belgi","Yalpi","Yakka"],"rows":[["olinadi","guruh","bitta"],["nav","bir xil emas","toza liniya"],["takror","kerak","kerak emas"]],"w":[28,36,36]}]}},{"who":"nur","text":"Yalpi tanlashdan olingan nav genetik jihatdan bir xil boʻlmaydi, shuning uchun tanlashni vaqti-vaqti bilan takrorlab turish kerak. Yakka tanlash esa genetik bir xi : mevasining yarmi karamga, yarmi turpga oʻxshaydi."},{"board":{"title":"Uzoq duragaylar","steps":[{"k":"pic","pic":"farcross"}]}},{"board":{"title":"Uzoq turlar duragaylari","steps":[{"k":"table","head":["Nomi","Ota-ona"],"rows":[["tritikale","bugʻdoy × javdar"],["yem bugʻdoy","bugʻdoy × bugʻdoyiq"]],"w":[40,60]}]}},{"who":"nur","text":"Tritikale hosildor, yashil massasi koʻp va oziqlik sifati yuqori. Bugʻdoy bilan bugʻdoyiq duragayidan donli yem-xashak navi yaratilgan: bir mavsumda 3–4 marta oʻriladi va gektaridan 300–450 sentner yashil massa beradi."},{"ask":{"q":"Ali, tritikale qaysi ikki oʻsimlikning duragayi?","o":["Bugʻdoy va javdar","Karam va turp","Gʻoʻza va bugʻdoy"],"a":0,"ok":"Barakalla! 🎉","no":"Tritikale — bugʻdoy × javdar."}},{"ask":{"q":"Ali, Toshkent-1, 2, 3 navlarini kim yaratgan?","o":["S. Mirahmedov","N. Vavilov","G. Karpechenko"],"a":0,"ok":"Qoyil! 👏","no":"Akademik Sodiq Mirahmedov."}},{"ask":{"q":"Ali, qaysi duragaylash xilida duragay odatda bepusht boʻladi?","o":["Genetik uzoq","Tur ichida","Geografik uzoq"],"a":0,"ok":"Barakalla! 🎉","no":"Har xil turlar chatishsa, bepushtlik chiqadi. Karpechenko buni yengdi."}},{"joke":true}]},{"title":"Mutagenez, poliploidiya va geterozis","items":[{"who":"nur","text":"Sunʼiy mutagenez — kuchli taʼsir etuvchi omillar bilan oʻsimliklarda mutatsiya olish. Oʻtgan darsda mutatsiya bosmaxonadagi xato edi. Mutagenezda bu xatoni olim tezlashtiradi va foydali xatolarni tanlaydi."},{"who":"nur","text":"Bu usul bilan akademiklar Nabijon Nazirov va Oston Jalilov gʻoʻzaning serhosil AN-402, Samarqand-3 va Yulduz navlarini yaratgan."},{"who":"nur","text":"Poliploid oʻsimliklar organik moddalarni faolroq sintez qiladi, hosildor va yirik boʻladi. Masalan, bugʻdoyning diploid navida 2n = 14, tetraploid navida 4n = 28 xromosoma bor."},{"board":{"title":"Oʻsimliklar seleksiyasi usullari","steps":[{"k":"table","head":["Usul","Natija"],"rows":[["mutagenez","AN-402, Yulduz"],["poliploidiya","yirik, hosildor"],["geterozis","kuch <style>
:root{
  --bg:#0E1D1A; --bg2:#122622; --card:#16302B; --ink:#E6F3EE; --soft:#9DB8B0; --line:#2B4A43;
  --accent:#3CC389; --accent-ink:#06231A; --good:#4BD196; --goodbg:#17402F;
  --bad:#FF8B7B; --badbg:#4A2420; --pink:#E56BA6; --gold:#F5C451;
  --cw:#F4F1E8; --cy:#F7E27A; --cg:#A6EBB0; --cp:#F6A9CB; --cb:#A3D6F7;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding:16px 14px 48px}
h1{font-size:28px;line-height:1.15;margin:0 0 4px;font-weight:800}
h2{font-size:21px;margin:30px 0 10px;font-weight:800}
p{margin:0 0 10px}
.soft{color:var(--soft)}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:16px}
.btn{display:block;width:100%;min-height:54px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:800;font-size:17px;padding:12px 16px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn+.btn{margin-top:10px}
.btn:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top.sticky{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;margin-top:-8px}
.back{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;min-width:46px;height:46px;font:inherit;font-weight:800;font-size:20px;cursor:pointer}
.bar{flex:1;height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .3s}
.count{font-weight:800;min-width:48px;text-align:right}
.pill{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.done{border-color:var(--good);color:var(--good)}
.ttl{flex:1;min-width:0;font-weight:800;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:flex;gap:10px;margin:14px 0}
.stat{flex:1;text-align:center;padding:12px 8px}
.stat b{display:block;font-size:24px}
.lcard{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:18px;padding:16px;font:inherit;cursor:pointer;margin-bottom:12px}
.lcard .no{color:var(--accent);font-weight:800;font-size:14px;letter-spacing:.04em}
.lcard b.t{display:block;font-size:22px;margin:2px 0}
.lcard.off{opacity:.55;cursor:default}
.badge{display:inline-block;margin-top:8px;padding:4px 10px;border-radius:999px;background:var(--goodbg);color:var(--good);font-weight:800;font-size:14px}
.stickers{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.stk{width:64px;height:64px;border-radius:18px;background:var(--card);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:36px}

/* ---- suhbat (Telegram uslubi) ---- */
.msg{display:flex;gap:8px;align-items:flex-end;margin:10px 0;animation:pop .25s ease-out}
.msg.ali{flex-direction:row-reverse}
.av{flex:none;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:23px;border:1.5px solid var(--line);background:var(--card)}
.msg.nur .av{background:#1C4436}
.msg.ali .av{background:#1B3D4A}
.bub{max-width:80%;padding:10px 13px;border-radius:18px;background:var(--card);border:1.5px solid var(--line)}
.msg.nur .bub{border-bottom-left-radius:6px}
.msg.ali .bub{background:#1B3D4A;border-color:#2F6075;border-bottom-right-radius:6px}
.msg.joke .bub{background:#3A3417;border-color:#6B5E22}
.who{display:block;font-size:13px;font-weight:800;color:var(--accent);margin-bottom:2px}
.msg.ali .who{color:#8FD3F0}
.msg.joke .who{color:var(--gold)}
.typing{display:inline-flex;gap:4px;padding:4px 2px}
.typing i{width:8px;height:8px;border-radius:50%;background:var(--soft);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.status{font-size:14px;color:var(--soft);margin:8px 2px}
.sec{margin-top:24px;padding:10px 14px;border-radius:12px;background:var(--bg2);border-left:5px solid var(--accent);font-weight:800;font-size:19px;animation:pop .25s ease-out}
#reply{position:fixed;left:0;right:0;bottom:0;z-index:7;background:linear-gradient(to top,var(--bg) 80%,rgba(14,29,26,0));padding:18px 14px calc(14px + env(safe-area-inset-bottom,0px))}
#reply .in{max-width:560px;margin:0 auto}
#reply .lbl{font-size:13px;font-weight:800;color:#8FD3F0;margin:0 4px 6px}
.say{display:flex;align-items:center;gap:10px;width:100%;text-align:left;min-height:54px;margin-top:8px;background:#1B3D4A;color:var(--ink);border:2px solid #2F6075;border-radius:16px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer;animation:pop .2s ease-out}
.say:after{content:"➤";margin-left:auto;color:#8FD3F0}
.say.opt2{background:var(--card);border-color:var(--line)}
.say.opt2:after{content:""}
#chat{padding-bottom:12px}
.chatpad{height:190px}
.msg.nur.fb .bub{border-color:var(--good)}
.msg.nur.fbx .bub{border-color:var(--bad)}
.skip{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:6;box-shadow:0 4px 14px rgba(0,0,0,.5);font-size:15px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:10px 18px;font:inherit;font-weight:800;cursor:pointer}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* ---- bo'r doskasi ---- */
.cb{position:relative;margin:14px 0;padding:16px 14px 30px;border-radius:10px;cursor:pointer;
  background:
    radial-gradient(ellipse at 20% 15%,rgba(255,255,255,.07),transparent 45%),
    radial-gradient(ellipse at 80% 70%,rgba(255,255,255,.05),transparent 50%),
    radial-gradient(ellipse at 55% 40%,rgba(0,0,0,.18),transparent 60%),
    #22402F;
  border:11px solid #7A4E2B;
  box-shadow:inset 0 0 0 2px #5B381D,inset 0 0 30px rgba(0,0,0,.45),0 6px 0 #4C2F17;
  font-family:"Caveat","Comic Sans MS",cursive;color:var(--cw);animation:pop .25s ease-out}
.cb:after{content:"";position:absolute;left:12%;right:12%;bottom:6px;height:10px;border-radius:3px;background:#5B381D;
  box-shadow:inset 0 2px 0 #7A4E2B}
.cb .chalk{position:absolute;bottom:9px;width:22px;height:7px;border-radius:3px;z-index:1}
.cb .tt{font-size:30px;font-weight:700;color:var(--cy);text-align:center;line-height:1.1}
.cb .ul{display:block;width:62%;height:12px;margin:0 auto 8px}
.cb .txt{text-shadow:0 0 1px currentColor,0 0 6px rgba(255,255,255,.12)}
.cb .wd{font-size:30px;font-weight:700;text-align:center;line-height:1.15;margin:4px 0}
.cb .nt{font-size:25px;text-align:center;margin:8px 0 2px;line-height:1.2}
.cb .bg{text-align:center;margin:6px 0}
.cb .bg b{display:block;font-size:52px;line-height:1}
.cb .bg span{font-size:22px;color:var(--cw)}
.cb .row{font-size:23px;line-height:1.2;margin:7px 0}
.cb .row b{font-weight:700}
.cb .arrow{display:block;width:40px;height:44px;margin:0 auto}
.cb .hl{display:block;width:100%;height:14px;margin:6px 0}
.cb svg text{font-family:"Caveat",cursive;font-weight:700}
.cb .split{display:grid;grid-template-columns:minmax(0,1fr) 6px minmax(0,1fr);gap:8px;margin-top:6px;text-align:center}
.cb .split .h{font-size:21px;font-weight:700;line-height:1.1;overflow-wrap:break-word}
.cb .split .m{font-size:21px;line-height:1.15}
.cb .split .s{font-size:18px;line-height:1.15;opacity:.85}
.cb .vline{width:6px;height:100%}
.cb .tl{display:grid;grid-template-columns:28px 1fr;gap:4px 8px;position:relative}
.cb .tl .dot{width:28px;height:28px}
.cb .tl .ln{position:absolute;left:12px;top:14px;height:calc(100% - 40px);width:4px}
.cb .tl .r{font-size:22px;line-height:1.15;padding:2px 0 10px}
.cb .dd{display:grid;grid-template-columns:62px 1fr;gap:8px;align-items:center;margin:6px 0}
.cb .dd svg{width:62px;height:62px}
.cb .dd .r{font-size:22px;line-height:1.12}
.cb .dd .ex{opacity:.85;font-size:20px}
.cb .tb{width:100%;border-collapse:collapse;table-layout:fixed;margin:8px 0 4px}
.cb .tb th,.cb .tb td{border:2px solid rgba(244,241,232,.78);padding:5px 6px;vertical-align:top;text-align:left;font-size:22px;line-height:1.12;overflow-wrap:break-word;word-break:normal}
.cb .tb td:nth-child(odd){border-width:2px 2.5px 2px 2px}
.cb .tb th{font-size:22px;font-weight:700;text-align:center;border-bottom:3px solid var(--cy)}
.cb .tb td:first-child{font-weight:700;font-size:22px}
.cb .tb .w{display:block}
.c-w{color:var(--cw)}.c-y{color:var(--cy)}.c-g{color:var(--cg)}.c-p{color:var(--cp)}.c-b{color:var(--cb)}
.s-w{stroke:var(--cw)}.s-y{stroke:var(--cy)}.s-g{stroke:var(--cg)}.s-p{stroke:var(--cp)}.s-b{stroke:var(--cb)}
.f-w{fill:var(--cw)}.f-y{fill:var(--cy)}.f-g{fill:var(--cg)}.f-p{fill:var(--cp)}.f-b{fill:var(--cb)}
.cb svg path,.cb svg line,.cb svg circle,.cb svg ellipse{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
/* chizish animatsiyasi */
.cb .w{display:block;clip-path:inset(-12px 100% -12px -12px);animation:write var(--t) linear var(--d) forwards}
.cb .f{opacity:0;animation:fade var(--t) ease var(--d) forwards}
.cb .dp{stroke-dasharray:1 1;stroke-dashoffset:1;animation:draw var(--t) ease-in-out var(--d) forwards}
.cb.static .w{animation:none;clip-path:none}
.cb.static .f{animation:none;opacity:1}
.cb.static .dp{animation:none;stroke-dashoffset:0}
.cb .hint{position:absolute;right:10px;top:4px;font-family:"Nunito",sans-serif;font-size:12px;color:rgba(255,255,255,.35)}
@keyframes write{to{clip-path:inset(-12px -12px -12px -12px)}}
@keyframes fade{to{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}

/* ---- test ---- */
.q{font-size:20px;font-weight:800;line-height:1.3;margin:6px 0 14px}
.emoji{font-size:84px;text-align:center;line-height:1.1;margin:4px 0 10px}
.opt{display:block;width:100%;text-align:left;min-height:56px;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;font-weight:700;margin-bottom:10px;cursor:pointer}
.opt.sel{border-color:var(--pink);box-shadow:0 0 0 2px var(--pink) inset}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default}
.fb{margin-top:6px;padding:14px;border-radius:14px;font-weight:800}
.fb.good{background:var(--goodbg)}
.fb.bad{background:var(--badbg)}
.fb p{margin:6px 0 0;font-weight:500}
.fb .big{font-size:34px;line-height:1}
.fjoke{margin-top:10px;padding:12px 14px;border-radius:14px;background:#3A3417;border:1.5px solid #6B5E22;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.chip{min-height:46px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer;text-align:left}
.chip:disabled{opacity:.35}
.slot{min-height:60px;border:2px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.slot .chip{background:var(--goodbg);border-color:var(--good)}
.slot.bad .chip{background:var(--badbg);border-color:var(--bad)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cols .opt{margin:0 0 10px;font-size:15px;min-height:64px}

function boardHtml(b, isStatic){
  var clk={t:0.1}, h='', i, j, s, col;
  h+='<div class="tt txt"><span'+anim("w",clk.t,wtime(b.title))+'>'+esc(b.title)+'</span></div>';
  clk.t+=wtime(b.title);
  h+='<svg class="ul" viewBox="0 0 200 12" preserveAspectRatio="none">'+P("M4 7 Q60 2 110 7 T196 5","y",clk,.35)+'</svg>';
  for(i=0;i<b.steps.length;i++){
    s=b.steps[i]; col=s.c||"w";
    if(s.k==="word"){ h+='<div class="wd txt c-'+col+'"><span'+anim("w",clk.t,wtime(s.t))+'>'+esc(s.t)+'</span></div>'; clk.t+=wtime(s.t); }
    if(s.k==="note"){ h+='<div class="nt txt c-'+col+'"><span'+anim("w",clk.t,wtime(s.t))+'>'+esc(s.t)+'</span></div>'; clk.t+=wtime(s.t); }
    if(s.k==="arrow"){ h+='<svg class="arrow" viewBox="0 0 40 44">'+P("M20 4 V38 M10 28 L20 40 L30 28","w",clk,.45)+'</svg>'; }
    if(s.k==="line"){ h+='<svg class="hl" viewBox="0 0 300 14" preserveAspectRatio="none">'+P("M6 8 Q80 3 150 8 T294 6","w",clk,.4)+'</svg>'; }
    if(s.k==="big"){
      h+='<div class="bg txt c-'+col+'"><b'+anim("w",clk.t,0.6)+'>'+esc(s.t)+'</b>'; clk.t+=0.6;
      h+='<span'+anim("w",clk.t,wtime(s.s))+'>'+esc(s.s)+'</span></div>'; clk.t+=wtime(s.s);
    }
    if(s.k==="list"){
      for(j=0;j<s.rows.length;j++){
        var r=s.rows[j], line=r[0]+" — "+r[1], tt=wtime(line);
        h+='<div class="row txt"><span'+anim("w",clk.t,tt)+'><b class="c-'+(r[2]||"y")+'">'+esc(r[0])+'</b> — '+esc(r[1])+'</span></div>';
        clk.t+=tt;
      }
    }
    if(s.k==="timeline"){
      var t0=clk.t;
      h+='<div class="tl"><svg class="ln" viewBox="0 0 4 100" preserveAspectRatio="none">'+P("M2 0 V100","w",clk,.6)+'</svg>';
      clk.t=t0+0.4;
      for(j=0;j<s.rows.length;j++){
        var tr=s.rows[j], c2=tr[2]||"y";
        h+='<svg class="dot" viewBox="0 0 28 28">'+'<circle cx="14" cy="14" r="8" pathLength="1"'+anim("dp s-"+c2,clk.t,.3)+'/></svg>';
        clk.t+=0.25;
        var tl=wtime(tr[0]+tr[1]);
        h+='<div class="r txt"><span'+anim("w",clk.t,tl)+'><b class="c-'+c2+'">'+esc(tr[0])+'</b><br>'+esc(tr[1])+'</span></div>';
        clk.t+=tl;
      }
      h+='</div>';
    }
    if(s.k==="split"){
      var side=function(a){ var x='<div><div class="h txt c-'+a[3]+'"><span'+anim("w",clk.t,.5)+'>'+esc(a[0])+'</span></div>'; clk.t+=.5;
        x+='<div class="m txt"><span'+anim("w",clk.t,wtime(a[1]))+'>'+esc(a[1])+'</span></div>'; clk.t+=wtime(a[1]);
        x+='<div class="s txt"><span'+anim("w",clk.t,wtime(a[2]))+'>'+esc(a[2])+'</span></div></div>'; clk.t+=wtime(a[2]); return x; };
      h+='<div class="split">'+side(s.l)+'<svg class="vline" viewBox="0 0 6 100" preserveAspectRatio="none">'+P("M3 2 V98","w",clk,.4)+'</svg>'+side(s.r)+'</div>';
    }
    if(s.k==="chain"){
      for(j=0;j<s.rows.length;j++){
        if(j>0){ h+='<svg class="arrow" viewBox="0 0 40 44" style="height:30px">'+P("M20 4 V38 M10 28 L20 40 L30 28","w",clk,.3)+'</svg>'; }
        var cr=s.rows[j], ct=wtime(cr[0]);
        h+='<div class="nt txt c-'+(cr[1]||"w")+'" style="margin:0"><span'+anim("w",clk.t,ct)+'>'+esc(cr[0])+'</span></div>'; clk.t+=ct;
      }
    }
    if(s.k==="table"){
      var tw=s.w||[], tcol=["y","g","b","p","w"], th='<tr>', tb='', rr, cc;
      for(j=0;j<s.head.length;j++){ th+='<th class="c-y"><span'+anim("w",clk.t,wtime(s.head[j]))+'>'+esc(s.head[j])+'</span></th>'; clk.t+=wtime(s.head[j]); }
      th+='</tr>';
      for(rr=0;rr<s.rows.length;rr++){
        tb+='<tr>';
        for(cc=0;cc<s.rows[rr].length;cc++){
          var tt2=wtime(s.rows[rr][cc]);
          tb+='<td'+(cc===0?' class="c-'+tcol[rr%5]+'"':'')+'><span'+anim("w",clk.t,tt2)+'>'+esc(s.rows[rr][cc])+'</span></td>'; clk.t+=tt2;
        }
        tb+='</tr>';
      }
      var cg=''; if(tw.length){ cg='<colgroup>'; for(j=0;j<tw.length;j++){ cg+='<col style="width:'+tw[j]+'%">'; } cg+='</colgroup>'; }
      h+='<table class="tb">'+cg+'<thead>'+th+'</thead><tbody>'+tb+'</tbody></table>';
    }
    if(s.k==="pic" && PICS[s.pic]){ h+=PICS[s.pic](clk); }
    if(s.k==="doodles"){
      for(j=0;j<s.rows.length;j++){
        var dr=s.rows[j], c3=dr[4]||"y", parts=DOODLES[dr[0]].split("|"), sv='<svg viewBox="0 0 60 62">', k;
        for(k=0;k<parts.length;k++){ sv+=P(parts[k],c3,clk,.35); }
        sv+='</svg>';
        var dl=wtime(dr[1]+dr[2]+dr[3]);
        h+='<div class="dd">'+sv+'<div class="r txt"><span'+anim("w",clk.t,dl)+'><b class="c-'+c3+'">'+esc(dr[1])+'</b> — '+esc(dr[2])+'<br><span class="ex">'+esc(dr[3])+'</span></span></div></div>';
        clk.t+=dl;
      }
    }
  }
  var chalks='<span class="chalk" style="left:24%;background:#F4F1E8"></span><span class="chalk" style="left:36%;background:#F7E27A"></span><span class="chalk" style="left:48%;background:#F6A9CB"></span><span class="chalk" style="left:60%;background:#A6EBB0"></span>';
  return {html:'<div class="cb'+(isStatic?" static":"")+'" data-board="1" role="img" aria-label="Doska: '+esc(b.title)+'"><span class="hint">bossang qayta chiziladi</span>'+h+chalks+'</div>', dur:clk.t};
}

function nurMsg(t,cls){ return '<div class="msg nur'+(cls?" "+cls:"")+'"><div class="av">👨‍🏫</div><div class="bub"><span class="who">Nur ustoz</span>'+esc(t)+'</div></div>'; }
function aliMsg(t,joke){ return '<div class="msg ali'+(joke?" joke":"")+'"><div class="av">🧑‍🎓</div><div class="bub"><span class="who">Ali (siz)'+(joke?" 😄":"")+'</span>'+esc(t)+'</div></div>'; }
function msgHtml(m){
  if(m.joke){ return aliMsg(m._t||nextJoke(),true); }
  if(m.ask){ return nurMsg(m.ask.q); }

  return ali ? aliMsg(m.text) : nurMsg(m.text);

function buildFlow(){
  var f=[], i, j;
  for(i=0;i<L.sections.length;i++){
    f.push({sec:(i+1)+". "+L.sections[i].title});
    for(j=0;j<L.sections[i].items.length;j++){ f.push(L.sections[i].items[j]); }
  }
  return f;
}

function staticItem(it){
  if(it.sec) return '<div class="sec">'+esc(it.sec)+'</div>';
  if(it.board) return boardHtml(it.board,true).html;
  if(it.ask) return nurMsg(it.ask.q)+aliMsg(it.ask.o[it.ask.a])+nurMsg(it.ask.ok,"fb");
  return msgHtml(it);
}
function revealUpTo(n){            // oldin koʻrilgan qismini birdan chiqaramiz, qolgani davom etadi
  var chat=document.getElementById("chat"), h='', i;
  for(i=0;i<n;i++){ h+=staticItem(S.flow[i]); }
  if(chat){ chat.insertAdjacentHTML("beforeend",h); }
  S.fi=n;
}
function seenSave(n){ if(L && L.id && n>load("nb_seen_"+L.id,0)) save("nb_seen_"+L.id,n); }

function toBottom(){ setTimeout(function(){ try{ window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"}); }catch(e){ window.scrollTo(0,document.body.scrollHeight); } },30); }
function nearBottom(){ return (window.innerHeight+window.scrollY) >= document.body.scrollHeight-260; }
function appendNode(html){
  var chat=document.getElementById("chat"); if(!chat) return null;
  var follow=true;
  var box=document.createElement("div"); box.innerHTML=html; var el=box.firstChild;
  chat.appendChild(el);
  if(follow){ toBottom(); }
  return el;
}
function setStatus(html){ var st=document.getElementById("status"); if(st) st.innerHTML=html; }

function flowNext(){
  if(S.screen!=="lesson") return;
  seenSave(S.fi);
  if(S.fi>=S.flow.length){ finishFlow(); return; }
  if(document.visibilityState!=="visible"){ S.flowTimer=setTimeout(flowNext,500); return; }
  var it=S.flow[S.fi];
  if(it.sec){ appendNode('<div class="sec">'+esc(it.sec)+'</div>'); S.fi++; S.flowTimer=setTimeout(flowNext,500); return; }
  if(it.board){
    setStatus('<div class="status">✍️ Nur ustoz doskaga yozmoqda…</div>');
    S.flowTimer=setTimeout(function(){
      var b=boardHtml(it.board,false); setStatus(""); appendNode(b.html); S.fi++;
      S.flowTimer=setTimeout(flowNext, Math.round(b.dur*1000)+500);
    },500);
    return;
  }
  if(it.joke || it.who==="ali"){            // navbat Alida: oʻquvchi tugmani bosadi
    if(it.joke){ it._t = nextJoke(); }
    showReply([{t: it.joke ? it._t : it.text, k:-1}], it.joke ? "Ali boʻlib hazil qiling 😄" : "Siz — Alisiz. Bosib ayting:");
    return;
  }
  var txt = it.ask ? it.ask.q : it.text, wait = clamp(450+txt.length*14,700,1900);
  setStatus('<div class="msg nur"><div class="av">👨‍🏫</div><div class="bub"><span class="typing"><i></i><i></i><i></i></span></div></div>');
  S.flowTimer=setTimeout(function(){
    setStatus(""); appendNode(nurMsg(txt));
    if(it.ask){
      var o = shuffle(it.ask.o.map(function(t,i){ return {t:t,k:i}; }));
      showReply(o, "Ali oʻrnida javob bering:", true);
      return;
    }
    S.fi++; S.flowTimer=setTimeout(flowNext,350);
  }, wait);
}
function showReply(opts,label,isAsk){
  var r=document.getElementById("reply"), ri=document.getElementById("replyIn"), h='<div class="lbl">'+esc(label)+'</div>', i;
  if(!r) return;
  for(i=0;i<opts.length;i++){ h+='<button class="say'+(isAsk?" opt2":"")+'" data-act="say" data-k="'+opts[i].k+'">'+esc(opts[i].t)+'</button>'; }
  ri.innerHTML=h; r.style.display="block";
  toBottom();
}
function hideReply(){ var r=document.getElementById("reply"); if(r){ r.style.display="none"; } }
function onSay(k){
  var it=S.flow[S.fi]; if(!it) return;
  hideReply();
  if(it.ask){
    var ok = k===it.ask.a;
    appendNode(aliMsg(it.ask.o[k]));
    setStatus('<div class="msg nur"><div class="av">👨‍🏫</div><div class="bub"><span class="typing"><i></i><i></i><i></i></span></div></div>');
    S.flowTimer=setTimeout(function(){
      setStatus("");
      appendNode(nurMsg(ok ? it.ask.ok : pick(SCOLD)+" "+it.ask.no, ok?"fb":"fbx"));
      S.fi++; S.flowTimer=setTimeout(flowNext,700);
    },900);
    return;
  }
  appendNode(msgHtml(it)); S.fi++; S.flowTimer=setTimeout(flowNext,450);
}
function revealAll(){
  clearTimeout(S.flowTimer); setStatus("");
  var chat=document.getElementById("chat"), h='', i;
  for(i=S.fi;i<S.flow.length;i++){
    var it=S.flow[i];
    if(it.sec) h+='<div class="sec">'+esc(it.sec)+'</div>';
    else if(it.board) h+=boardHtml(it.board,true).html;
    else if(it.ask) h+=nurMsg(it.ask.q)+aliMsg(it.ask.o[it.ask.a])+nurMsg(it.ask.ok,"fb");
    else h+=msgHtml(it);
  }
  hideReply();
  if(chat){ chat.insertAdjacentHTML("beforeend",h); }
  S.fi=S.flow.length; finishFlow();
}
function finishFlow(){
  S.readAll=true; seenSave(S.flow.length);

  if(eb) eb.style.display="block"; if(sk) sk.style.display="none";

function coolOn(){ return !!(L && L.id && load("nb_cool_"+L.id,false)); }
function coolSet(v){ if(L && L.id) save("nb_cool_"+L.id, v); }
setInterval(function(){
  if(S.screen!=="lesson" || S.left<=0) return;
  if(document.visibilityState!=="visible") return;   // sahifada boʻlmasa sanamaydi
  S.left--; if(S.left<=0) coolSet(false); updateTimerUI();
