:{"title":"Metabolizm","steps":[{"k":"pic","pic":"metab"}]}},{"who":"nur","text":"Uy qurishni oʻyla: gʻisht va sement — xomashyo, qurish — assimilyatsiya, pul sarflanadi. Eski devorni buzib, oʻtin qilib yoqish — dissimilyatsiya, issiqlik beradi. Hujayra ham shunday ishlaydi."},{"board":{"title":"Ikki jarayon","steps":[{"k":"table","head":["Belgi","Plas­tik","Ener­getik"],"rows":[["Nomi","ana­bolizm","kata­bolizm"],["Ish","sintez","par­cha­lanish"],["Ener­giya","yuti­ladi","ajra­ladi"],["Vazifa","quri­lish","ener­giya"]],"w":[30,34,36]}]}},{"who":"nur","text":"Hujayra ochiq sistema: atrof-muhit bilan modda va energiya tinmay almashinadi. Odam uchun bir kunlik ozuqa energiyasi taxminan 3000 kkal."},{"ask":{"q":"Ali, moddalar almashinuvining ikkinchi nomi nima?","o":["Metabolizm","Gidroliz","Mitoz"],"a":0,"ok":"Barakalla! 🎉","no":"Moddalar almashinuvi — metabolizm."}},{"joke":true}]},{"title":"Assimilyatsiya","items":[{"who":"nur","text":"Birinchi jarayon — assimilyatsiya. Oddiy kichik molekulalardan murakkab katta molekulalar quriladi. Bu biosintez deb ham ataladi."},{"who":"ali","text":"Misol keltirasizmi?"},{"who":"nur","text":"Aminokislotalardan oqsil, monosaxaridlardan murakkab uglevod, azotli asos va boshqalardan nukleotid va nuklein kislota, asetat kislotadan yogʻ kislotasi, keyin glitserin bilan yogʻ hosil boʻladi. Konstruktor detallaridan oʻyinchoq yigʻish kabi."},{"board":{"title":"Biosintez","steps":[{"k":"table","head":["Xomashyo","Hosil boʻ­ladi"],"rows":[["Ami­nokis­lota","oqsil"],["Mono­saxa­rid","ugle­vod"],["Nuk­leo­tid","nuk­lein kis­lota"],["Yogʻ kis­lotasi","yogʻ, moy"]],"w":[50,50]}]}},{"who":"nur","text":"Barcha sintez reaksiyalari energiya yutilishi bilan boradi. Ularni fermentlar tezlashtiradi."},{"who":"nur","text":"Oqsil tuzilishi DNK dagi nukleotidlar ketma-ketligi bilan aniqlanadi. Shuning uchun har bir tur va har bir odamning moddalari oʻziga xos."},{"who":"ali","text":"Oʻsib boʻlgan hujayrada ham sintez boʻladimi?"},{"who":"nur","text":"Ha. Oʻsayotgan hujayrada jadal, lekin toʻliq shakllangan hujayrada ham sarflangan moddalar oʻrniga yangisi doimo yasaladi. Eskirgan telefon qopqogʻini yangilash kabi."},{"ask":{"q":"Ali, biosintez reaksiyalarida energiya nima boʻladi?","o":["Yutiladi","Ajraladi","Oʻzgarmaydi"],"a":0,"ok":"Qoyil! 👏","no":"Sintez uchun energiya sarflanadi."}},{"joke":true}]},{"title":"Dissimilyatsiya va ATF","items":[{"who":"nur","text":"Ikkinchi jarayon — dissimilyatsiya. Murakkab moddalar parchalanadi: oqsil aminokislotalarga, kraxmal glukozaga, yogʻ yogʻ kislotasi va glitseringa."},{"who":"nur","text":"Parchalanishda energiya ajraladi. Har qanday harakat va sintez shu energiya hisobiga ketadi. Shuning uchun assimilyatsiya dissimilyatsiyasiz boʻlmaydi."},{"who":"ali","text":"Energiya qayerda saqlanadi?"},{"who":"nur","text":"Ozuqadagi energiya moddalardagi kovalent bogʻlarda yashiringan. 180 g glukozada 2800 kJ bor. U fermentlar yordamida bosqichma-bosqich ajraladi."},{"board":{"title":"Glukoza parchalanishi","steps":[{"k":"pic","pic":"glucose"}]}},{"who":"nur","text":"Ajralgan energiyaning bir qismi issiqlik boʻlib tarqaladi, qolgani ATF ning energiyaga boy bogʻlarida toʻplanadi. Hujayra boʻlinishi, muskul qisqarishi, nerv impulsi — hammasi ATF hisobiga."},{"board":{"title":"ATF aylanishi","steps":[{"k":"pic","pic":"atpcycle"}]}},{"who":"nur","text":"ATF — telefon zaryadi kabi. Zaryad tez tugaydi, shuning uchun doimo qayta zaryadlanadi. Muskuldagi ATF atigi 20–30 qisqarishga yetadi, lekin muskul soatlab ishlaydi, chunki ATF toʻxtovsiz qayta hosil boʻladi."},{"board":{"title":"Sprint","steps":[{"k":"pic","pic":"sprint"}]}},{"who":"nur","text":"Qisqa masofaga yugurganda muskul faqat zaxiradagi ATF dan foydalanadi. Yugurib boʻlgach kuchli nafas olamiz: kislorod taʼsirida uglevodlar parchalanib, ATF tiklanadi."},{"ask":{"q":"Ali, hujayra uchun energiyaning bevosita manbai nima?","o":["ATF","Glukoza","Oqsil"],"a":0,"ok":"Barakalla! 🎉","no":"ATF — universal bevosita manba."}},{"joke":true}]},{"title":"Uch bosqich va glikoliz","items":[{"who":"nur","text":"Energiya almashinuvi uch bosqichda boradi. Avval umumiy rasm."},{"board":{"title":"Uch bosqich","steps":[{"k":"pic","pic":"stages3"}]}},{"board":{"title":"Bosqichlar jadvali","steps":[{"k":"table","head":["Bos­qich","Qayerda","Natija"],"rows":[["Tay­yor­gar­lik","hujayra","issiq­lik"],["Gli­koliz","sitop­lazma","2 ATF"],["Kis­lorodli","mito­xond­riya","36 ATF"]],"w":[34,40,26]}]}},{"who":"nur","text":"Birinchi bosqich — tayyorgarlik. Yirik molekulalar oddiyga parchalanadi: kraxmal glukozagacha, yogʻ yogʻ kislotasi va glitseringacha, oqsil aminokislotagacha. Bu yerda ajralgan energiyaning hammasi issiqlik boʻlib ketadi. Goʻshtni mayda boʻlaklarga toʻgʻrab, oshga tayyorlash kabi."},{"who":"ali","text":"Ikkinchi bosqich-chi?"},{"who":"nur","text":"Glikoliz — kislorodsiz (anaerob) parchalanish. Glukoza 2 molekula sut kislotasigacha parchalanadi, 2 ATF hosil boʻladi."},{"board":{"title":"Glikoliz","steps":[{"k":"pic","pic":"glikoliz"}]}},{"who":"nur","text":"Tenglama: C6H12O6 + 2H3PO4 + 2ADF = 2C3H6O3 + 2ATF + 2H2O. Jami 200 kJ ajraladi. Har ATF ga 40 kJ, 2 × 40 = 80 kJ ATF da saqlanadi (40 %), 120 kJ issiqlik boʻladi (60 %)."},{"who":"nur","text":"Spirtli achishda ham 200 kJ va 2 ATF hosil boʻladi, lekin sut kislotasi oʻrniga etil spirti va CO2 chiqadi: C6H12O6 + 2H3PO4 + 2ADF = 2C2H5OH + 2ATF + 2H2O + 2CO2. Non xamirining koʻpchishi shundan."},{"ask":{"q":"Ali, glikoliz qayerda boradi?","o":["Sitoplazma","Mitoxondriya","Yadro"],"a":0,"ok":"Qoyil! 👏","no":"Glikoliz kislorodsiz, sitoplazmada kechadi."}},{"joke":true}]},{"title":"Aerob parchalanish","items":[{"who":"nur","text":"Uchinchi bosqich — kislorodli (aerob) parchalanish, toʻla parchalanish. Mitoxondriyada kislorod bilan boradi."},{"board":{"title":"Aerob bosqich","steps":[{"k":"pic","pic":"aerob"}]}},{"who":"nur","text":"2 sut kislotasi kislorod bilan CO2 va suvgacha yonadi: 2C3H6O3 + 6O2 + 36H3PO4 + 36ADF = 6CO2 + 36ATF + 42H2O. 2600 kJ ajraladi, 44,6 % issiqlik, 55,4 % ATF da."},{"who":"ali","text":"Kislorodli yoʻl qanchalik foydali?"},{"who":"nur","text":"Anaerob parchalanishdan 13 marta koʻp energiya va 18 marta koʻp ATF beradi. Mashina chala yoqilgi bilan emas, toʻliq yoqilgi bilan ketganday."},{"board":{"title":"Taqqoslash","steps":[{"k":"pic","pic":"compare"}]}},{"board":{"title":"Anaerob va aerob","steps":[{"k":"table","head":["Belgi","Anae­rob","Aerob"],"rows":[["Joyi","sitop­lazma","mito­xond­riya"],["Kis­lorod","kerak emas","kerak"],["Ener­giya","200 kJ","2600 kJ"],["ATF","2 ta","36 ta"]],"w":[28,34,38]}]}},{"who":"nur","text":"Toʻliq parchalanishda: 2 + 36 = 38 ATF, 38 × 40 = 1520 kJ ATF da, 200 + 2600 = 2800 kJ jami. Kislorod yetishmasa, hujayra ATF ni faqat anaerob yoʻl bilan oladi, bunda 20 barobar koʻp glukoza sarflanadi."},{"who":"nur","text":"Masala: 2,5 molekula glukoza toʻliq parchalandi. ATF = 2,5 × 38 = 95 ta. CO2 = 2,5 × 6 = 15 molekula."},{"ask":{"q":"Ali, glukoza toʻliq parchalanganda nechta ATF hosil boʻladi?","o":["38","2","36"],"a":0,"ok":"Barakalla! 🎉","no":"2 + 36 = 38 ATF."}},{"joke":true}]}],"jokes":["Ali: «Ustoz, metabolizm nima?» Ustoz: «Oshxonadagi tinimsiz ish: bir tomondan qurish, bir tomondan buzish 🍳»","Assimilyatsiya: «Men quraman, pul sarflayman!» Dissimilyatsiya: «Men buzaman, pul topaman 💸»","Oqsil: «Men aminokislotalardan yigʻilganman!» Konstruktor: «Men ham, faqat detallarim kam 🧩»","ATF: «Men batareykaman!» Muskul: «Qisqa yugurishda meni tez tugatasan 🔋»","Glukoza: «Menda 2800 kJ bor!» Ali: «Lekin kunda atigi 1 ta shirinlik 🍬»","ADF: «Men zaryadsiz telefonman.» P: «Men esa zaryadlovchiman 🔌»","Birinchi bosqich: «Men goʻshtni toʻgʻrayman!» Ikkinchi bosqich: «Men esa pishirishni boshlayman 🔪»","Glikoliz: «Kislorod kerak emas!» Mitoxondriya: «Lekin men undan koʻp ATF beraman 💨»","Sut kislotasi: «Yugurib charchadim!» Muskul: «Men ham, ogʻrib turibman 🏃»","Achitqi: «Men spirtli achiyman!» Xamir: «Men esa koʻpchiyman 🍞»","Anaerob: «Men 2 ATF beraman.» Aerob: «Men esa norganikdan (CO2, H2O) oʻzi sintez qiladi. Asosiy avtotroflar — yashil oʻsimliklar, shuningdek ayrim bakteriyalar. Geterotrof hujayra esa tayyor organik moddaga muhtoj: hayvon, zamburugʻ. Avtotrof — oʻz oshxonasi bor odam, geterotrof — restoranda ovqatlanuvchi."},{"board":{"title":"Oziqlanish turlari","steps":[{"k":"table","head":["Guruh","Oziq","Misol"],"rows":[["Avtot­rof","oʻzi yasaydi","oʻsim­lik"],["Gete­rot­rof","tayyor oladi","hayvon"],["Fotot­rof","yorugʻ­lik­dan","yashil bargi"],["Xemot­rof","kim­yoviy","bak­teriya"]],"w":[28,36,36]}]}},{"ask":{"q":"Ali, hayvonlar qaysi oziqlanishga kiradi?","o":["Geterotrof","Avtotrof","Fototrof"],"a":0,"ok":"Barakalla! 🎉","no":"Hayvonlar tayyor organik modda isteʼmol qiladi."}},{"joke":true}]},{"title":"Fotosintez","items":[{"who":"nur","text":"Yashil bargda sodir boʻladigan eng muhim jarayon — fotosintez. Quyosh nuri taʼsirida CO2 va suvdan organik modda hosil boʻladi."},{"board":{"title":"Fotosintez","steps":[{"k":"pic","pic":"photosyn"}]}},{"who":"nur","text":"Tenglama: 6CO2 + 6H2O = C6H12O6 + 6O2. Xlorofill pigmenti xloroplastda yorugʻlik energiyasini kimyoviy energiyaga aylantiradi. Quyosh paneli quyosh nurini elektrga aylantirganidek."},{"who":"ali","text":"Fotosintez bosqichlarga boʻlinadimi?"},{"who":"nur","text":"Ha: yorugʻlik va qorongʻulik bosqichlari."},{"board":{"title":"Ikki bosqich","steps":[{"k":"pic","pic":"lightdark"}]}},{"who":"nur","text":"Yorugʻlik bosqichida foton xlorofillni qoʻzgʻatadi, elektronlar sakraydi. Suv parchalanadi — bu fotoliz. Hosil boʻlgan kislorod suvdan chiqadi, havodan emas."},{"board":{"title":"Fotoliz","steps":[{"k":"pic","pic":"photolysis"}]}},{"who":"nur","text":"Yorugʻlik energiyasi ADF va fosfatdan ATF sintezi uchun ham sarflanadi. Xloroplastda mitoxondriyadagiga nisbatan 30 barobar koʻp ATF hosil boʻladi. Yorugʻlik bosqichida uch jarayon: fotoliz, O2 va H hosil boʻlishi, ATF sintezi."},{"ask":{"q":"Ali, fotosintezda ajraladigan kislorod qayerdan?","o":["Suvdan","CO2 dan","Glukozadan"],"a":0,"ok":"Qoyil! 👏","no":"Kislorod suvning fotolizidan chiqadi."}},{"joke":true}]},{"title":"Qorongʻulik bosqichi","items":[{"who":"nur","text":"Ikkinchi bosqich — qorongʻulik. Yorugʻda ham, qorongʻuda ham boradi, shuning uchun shunday nomlangan. U yorugʻlikka bevosita bogʻliq emas, lekin yorugʻlik bosqichi bergan ATF va H ni ishlatadi."},{"who":"nur","text":"Reaksiya: 6CO2 + 24H = C6H12O6 + 6H2O. CO2 havodan barg hujayralariga kiradi, vodorod esa suvning fotolizidan keladi. Birinchi bosqich — materiallar va elektr, ikkinchi bosqich — shu materiallardan mahsulot yasaydigan sex."},{"board":{"title":"Fotosintez jadvali","steps":[{"k":"table","head":["Belgi","Yorugʻ­lik","Qoron­gʻu­lik"],"rows":[["Natija","ATF, H, O2","glu­koza"],["Suv","par­cha­lanadi","hosil boʻ­ladi"],["CO2","ish­latil­maydi","ish­lati­ladi"],["Ener­giya","yuti­ladi","ATF sarfi"]],"w":[26,36,38]}]}},{"who":"ali","text":"Fotosintez qancha foydali?"},{"who":"nur","text":"Oʻsimlik bargi quyosh energiyasining atigi 1 foizini ishlatadi. 1 m² barg soatiga taxminan 1 g organik modda hosil qiladi, yozda bir kunda 15–16 g. Har yili bir necha milliard tonna organik modda sintezlanadi."},{"board":{"title":"Kislorod balansi","steps":[{"k":"pic","pic":"o2balance"}]}},{"who":"nur","text":"Oʻsimlik ham nafas oladi, lekin fotosintezda chiqadigan kislorod nafasda olinganidan 20–30 baravar koʻp. Shuning uchun havodagi kislorod muvozanatda."},{"who":"nur","text":"Masala: noʻxat hujayrasida glukoza toʻliq parchalanganda 2356 molekula ATF sintezlandi. Ikkinchi bosqich (glikoliz)da hosil boʻlgan ATF energiyasi qancha? Glukoza soni = 2356 : 38 = 62. Glikolizda 62 × 2 = 124 ATF. Energiya = 124 × 40 = 4960 kJ."},{"ask":{"q":"Ali, qorongʻulik bosqichida nima hosil boʻladi?","o":["Glukoza","Kislorod","ATF"],"a":0,"ok":"Barakalla!","no":"Qorongʻulik bosqichida uglevod (glukoza) sintezlanadi."}},{"joke":true}]},{"title":"Xemosintez","items":[{"who":"nur","text":"Hamma avtotrof ham oʻsimlik emas. Baʼzi bakteriyalarda xlorofill yoʻq, lekin ular organik modda yasaydi. Qanday qilib?"},{"who":"nur","text":"Ular kimyoviy reaksiya energiyasidan foydalanadi: anorganik moddalarni oksidlab, shu paytda ajralgan energiyani organik modda sintezi uchun ishlatadi. Bu xemosintez. Quyoshsiz ishlaydigan elektrostansiya."},{"board":{"title":"Xemosintez","steps":[{"k":"pic","pic":"chemosyn"}]}},{"board":{"title":"Xemosintetiklar","steps":[{"k":"table","head":["Bak­teriya","Reak­siya"],"rows":[["Nit­rifi­kator","NH3 → HNO2 → HNO3"],["Temir","Fe²⁺ → Fe³⁺"],["Oltin­gugurt","H2S → H2SO4"]],"w":[40,60]}]}},{"who":"nur","text":"Azot toʻplovchi va nitrifikatsiyalovchi bakteriyalar eng muhim. Ular havodagi azotni oʻsimlik oʻzlashtira oladigan birikmaga aylantiradi, shuning uchun hosildorlik oshadi. Xemosintezchilar tabiatda moddalar aylanishida katta rol oʻynaydi."},{"ask":{"q":"Ali, xemosintez uchun energiya qayerdan?","o":["Moddalar oksidlanishidan","Quyosh nuridan","Ozuqadan"],"a":0,"ok":"Qoyil! 👏","no":"Anorganik moddalarni oksidlashdan."}},{"joke":true}]},{"title":"DNK va RNK sintezi","items":[{"who":"nur","text":"Endi plastik almashinuv: hujayra oʻziga kerakli moddalarni oʻzi yasaydi. Eng muhimi — DNK, RNK va oqsil sintezi."},{"who":"nur","text":"DNK sintezida qoʻsh spiral ikkiga ajraladi. Maxsus ferment vodorod bogʻlarni uzadi, boshqa ferment har bir zanjirga komplementar yangi zanjirni ulaydi. Fermuarni ochib, har bir yarmiga yangisini tikkandek."},{"board":{"title":"Replikatsiya","steps":[{"k":"pic","pic":"replication"}]}},{"who":"nur","text":"Yangi DNK da bitta zanjir eski, bittasi yangi. A ning qarshisiga T, G ning qarshisiga C qoʻyiladi. DNK ning ikki hissa ortishi — replikatsiya."},{"who":"ali","text":"RNK-chi?"},{"who":"nur","text":"RNK sintezi asosan yadroda, DNK dagi axborot i-RNK ga koʻchiriladi. Bu transkripsiya. Faqat T oʻrniga U, dezoksiriboza oʻrniga riboza turadi. Kutubxonadagi kitobdan nusxa olish kabi: asl kitob yadroda qoladi, nusxa chiqib ketadi."},{"board":{"title":"Transkripsiya","steps":[{"k":"pic","pic":"transcr"}]}},{"board":{"title":"DNK replikatsiya va transkripsiya","steps":[{"k":"table","head":["Jara­yon","Natija"],"rows":[["Rep­likat­siya","DNK ikki bara­var"],["Transk­rip­siya","i-RNK hosil"]],"w":[44,56]}]}},{"who":"nur","text":"Bitta DNK dan yuzlab, minglab i-RNK, t-RNK, r-RNK sintezlanishi mumkin. Har bir i-RNK kamida bitta oqsil uchun axborot tashiydi."},{"ask":{"q":"Ali, DNK dan i-RNK ga koʻchirish nima deyiladi?","o":["Transkripsiya","Translyatsiya","Replikatsiya"],"a":0,"ok":"Barakalla! 🎉","no":"DNK → i-RNK — transkripsiya."}},{"joke":true}]},{"title":"Genetik kod va oqsil sintezi","items":[{"who":"nur","text":"Oqsil qanday yigʻiladi? Reja DNK da yozilgan. Bu reja 4 xil nukleotid yordamida yoziladi va genetik kod deyiladi."},{"who":"nur","text":"Har bir aminokislotani 3 ta nukleotid — triplet kodlaydi. Jami kod 4 × 4 × 4 = 64. Shundan 61 tasi 20 aminokislotani kodlaydi, 3 tasi (UAA, UAG, UGA) terminator — oqsil sintezini toʻxtatadi."},{"board":{"title":"Genetik kod","steps":[{"k":"pic","pic":"codon"}]}},{"who":"nur","text":"20 aminokislotadan 18 tasi bittadan koʻp kodon bilan kodlanadi. Genetik kod universal: bakteriyadan odamgacha bir xil. Bu bir xil alifbo bilan yozilgan kitob kabi."},{"who":"ali","text":"Ribosomada nima boʻladi?"},{"who":"nur","text":"Translyatsiya: i-RNK dagi nukleotidlar ketma-ketligi aminokislotalar ketma-ketligiga aylanadi. Ribosoma i-RNK boʻylab tripletdan tripletga qadam tashlaydi. t-RNK mos aminokislotani olib keladi, aminokislotalar peptid bogʻ bilan ulanadi. Terminatorga yetganda sintez toʻxtaydi."},{"board":{"title":"Translyatsiya","steps":[{"k":"pic","pic":"translat"}]}},{"board":{"title":"Oqsil sintezi","steps":[{"k":"pic","pic":"proteinflow"}]}},{"who":"nur","text":"Bitta oqsilga toʻgʻri keladigan DNK qismi — gen. Bitta aminokislota xato qoʻyilsa, oqsil ishlamaydi va irsiy kasallik kelib chiqishi mumkin."},{"who":"nur","text":"Masala 1: 90 ta aminokislotali oqsil. Nukleotid = 90 × 3 = 270, uzunligi = 270 × 0,34 = 91,8 nm. Masala 2: gen uzunligi 316,2 nm. Nukleotid = 316,2 : 0,34 = 930, aminokislota = 930 : 3 = 310."},{"board":{"title":"Hisoblash","steps":[{"k":"table","head":["Savol","Javob"],"rows":[["90 AK, nuk­leo­tid","270"],["90 AK, uzun­lik","91,8 nm"],["316,2 nm: nuk­leo­tid","930"],["316,2 nm: AK","310"]],"w":[62,38]}]}},{"ask":{"q":"Ali, bitta aminokislotani nechta nukleotid kodlaydi?","o":["3 ta","2 ta","4 ta"],"a":0,"ok":"Qoyil! 👏","no":"Triplet — 3 ta nukleotid."}},{"joke":true}]}],"jokes":["Ali: «Ustoz, oʻsimlik nega ovqat yemaydi?» Ustoz: «U oʻzi pishiradi, xloroplast uning oshxonasi 🍳»","Avtotrof: «Men oʻzim yasayman!» Geterotrof: «Men esa tayyorini yeyman 🍽️»","Xlorofill: «Men quyosh panelimanman!» Barg: «Men esa toʻliq uyman ☀️»","Suv: «Kislorod mendan!» CO2: «Men esa uglerod beraman 💨»","Fotoliz: «Suvni parchalayman!» Ali: «Men ham, faqat shishani 💧»","Yorugʻlik bosqichi: «Men ATF beraman!» Qorongʻulik: «Men esa glukoza yasayman 🍬»","Bargi: «Men quyoshning 1 foizini ishlataman!» Ali: «Men esa 1 foiz telefon zaryadini 🔋»","Xemosintez: «Quyosh kerak emas!» Bakteriya: «Menga oksidlanish yetadi 🧪»","Azot bakteriyasi: «Men havodagi azotni oqsilga aylantiraman!» Oʻsimlik: «Rahmat, toʻydim 🌱»","DNK: «Men replikatsiya qilaman!» Ali: «Men ham nusxa koʻchiraman, lekin darslardan 📄»","Transkripsiya: «Men nusxa chiqaraman!» Yadro: «Asl nusxa menda qoladi 📚»","Triplet: «Uchta nukleotidmiz!» Aminokislota: «Men esa bittaman, lekin shu uchtaga arziyman 🧬»","Ribosoma: «Men qadamlab yuraman!» i-RNK: «Men esa yoʻl-yoʻriqman 🚶»","Terminator: «Men toʻxtataman!» Ribosoma: «Mana bu qizil chiroq edi 🚦»"],"questions":[{"t":"choice","q":"Organik moddani anorganikdan sintez qiladigan hujayra?","o":["Avtotrof","Geterotrof","Parazit","Saprofit"],"a":0,"w":"Avtotrof."},{"t":"choice","q":"Tayyor organik modda kerak boʻlgan hujayra?","o":["Geterotrof","Avtotrof","Fototrof","Xemotrof"],"a":0,"w":"Geterotrof."},{"t":"choice","q":"Asosiy avtotroflar qaysilar?","o":[" ch","q":"Jarayonni natijasi bilan juftlang.","pairs":[["Replikatsiya","DNK ikki baravar"],["Transkripsiya","i-RNK"],["Translyatsiya","oqsil"],["Fotoliz","O2"]],"w":"Natijalar."},{"t":"match","q":"Atamani maʼnosi bilan juftlang.","pairs":[["Triplet","3 nukleotid"],["Gen","oqsil uchun DNK qismi"],["Terminator","toʻxtatish kodi"],["Kodon","i-RNK tripleti"]],"w":"Genetik kod atamalari."},{"t":"match","q":"Guruhni misol bilan juftlang.","pairs":[["Avtotrof","oʻsimlik"],["Geterotrof","hayvon"],["Fototrof","yashil bargi"],["Xemotrof","nitrifikator"]],"w":"Oziqlanish turlari."}]},"9-09":{"id":"9-09","grade":9,"no":9,"title":"Hujayra sikli, meyoz, koʻpayish xillari","subtitle":"38–40-§ · Interfaza, mitoz, meyoz, jinssiz koʻpayish","sticker":"🧫","stickerName":"Boʻlinish ustasi","sections":[{"title":"Hujayra sikli","items":[{"who":"nur","text":"Ali, hujayralar tuzilishini bilib oldik. Endi eng qiziq savol: hujayra qanday koʻpayadi?"},{"who":"ali","text":"Ustoz, oʻzidan nusxa koʻchiradimi?"},{"who":"nur","text":"Deyarli shunday! Koʻpayish — tirik tabiatning asosiy xususiyati. Bakteriyadan sutemizuvchigacha hamma koʻpayadi. Tur ota-ona va avlodlar orasidagi izchillik tufayli saqlanadi."},{"who":"nur","text":"Hamma hujayra ham bir xil boʻlinmaydi. Nerv va muskul hujayralari embrional rivojlanishdan keyin boʻlinmaydi, butun umr ishlaydi. Suyak koʻmigi, epidermis va ichak epiteliysi hujayralari esa umr boʻyi boʻlinib turadi."},{"board":{"title":"Boʻlinadigan va boʻlinmaydigan","steps":[{"k":"pic","pic":"cellfates"}]}},{"who":"nur","text":"Hujayraning hayot sikli — yangi hujayra hosil boʻlgandan oʻlguncha yoki keyingi boʻlinishigacha boʻlgan davr."},{"who":"nur","text":"Eukariot hujayralar ikki xil boʻlinadi: mitoz — tana (somatik) hujayralarining boʻlinishi, meyoz — jinsiy hujayralarning boʻlinishi."},{"ask":{"q":"Ali, qaysi hujayralar embrional rivojlanishdan keyin boʻlinmaydi?","o":["Nerv va muskul","Epidermis","Ichak epiteliysi"],"a":0,"ok":"Barakalla! 🎉","no":"Nerv va muskul hujayralari butun umr boʻlinmaydi."}},{"joke":true}]},{"title":"Interfaza","items":[{"who":"nur","text":"«Mitoz» yunoncha «ip» degani. Mitoz sikli — boʻlinishga tayyorgarlik davri va mitozning oʻzi."},{"who":"nur","text":"Ikki mitoz orasidagi tayyorgarlik davri — interfaza. Uyni taʼmirlashga oʻxshaydi: ish boshlashdan oldin hamma narsa tayyor boʻlishi kerak."},{"board":{"title":"Hujayra sikli","steps":[{"k":"pic","pic":"lifecycle"}]}},{"who":"nur","text":"Interfaza uch davrga boʻlinadi: G1, S va G2."},{"board":{"title":"Interfaza","steps":[{"k":"pic","pic":"interphase"}]}},{"who":"nur","text":"G1 — taʼmirga material yigʻish: hujayra jadal oʻsadi, oqsil va RNK sintezlanadi, fermentlar faolligi ortadi."},{"who":"nur","text":"S — hujjatni ksero qilish: DNK reduplikatsiyalanadi, miqdori ikki hissa ortadi. Hujayra markazi ham ikki hissa koʻpayadi, mitoxondriya va plastidalardagi DNK ham."},{"who":"nur","text":"G2 — yakuniy tekshiruv: oqsil va RNK sintezi davom etadi, hujayra mitozga tayyorlanishni tugatadi."},{"board":{"title":"S davrida xromosoma","steps":[{"k":"pic","pic":"xchromo"}]}},{"who":"nur","text":"S davrida har bir xromosomada DNK ikki barobar koʻp boʻladi: ikkita nusxa — ikkita xromatida — sentromera bilan bogʻlangan."},{"board":{"title":"Interfaza davrlari","steps":[{"k":"table","head":["Davr","Nima boʻladi"],"rows":[["G1","hujayra oʻsadi"],["S","DNK ikki hissa"],["G2","mitozga tayyor"]],"w":[30,70]}]}},{"ask":{"q":"Ali, DNK ikki hissa ortadigan davr qaysi?","o":["S davri","G1 davri","G2 davri"],"a":0,"ok":"Qoyil! 👏","no":"DNK S davrida (sintez davri) ikki hissa ortadi."}},{"joke":true}]},{"title":"Mitoz bosqichlari","items":[{"who":"nur","text":"Mitoz toʻrt bosqichdan iborat: profaza, metafaza, anafaza, telofaza. Hammasi 30 daqiqadan 3 soatgacha davom etadi."},{"board":{"title":"Mitoz","steps":[{"k":"pic","pic":"mitosis4"}]}},{"who":"nur","text":"Profaza: yadro qobigʻi va yadrochalar yoʻqoladi, xromosomalar spirallashib kalta va yoʻgʻon boʻladi, mikroskopda aniq koʻrinadi. Ikkita sentriola qutblarga tarqaladi, boʻlinish urchugʻi hosil boʻla boshlaydi. Zaryadlovchi simni oʻrab qoʻyganimizdek — xromosoma ixcham boʻladi."},{"who":"nur","text":"Metafaza: xromosomalar eng kalta va yoʻgʻon holatga oʻtadi. Ular ekvator tekisligida, qutblardan bir xil masofada bir tekis turadi. Urchuq iplari har xromosoma sentromerasiga birikadi. Maktab saf — hamma bir chiziqda."},{"who":"nur","text":"Anafaza: sentromeradagi belbogʻ uziladi, xromatidalar mustaqil xromosomaga aylanadi. Urchuq iplari qisqarib, ularni qutblarga tortadi. Ksero qilingan ikki nusxa ikki tomonga ketadi."},{"who":"nur","text":"Telofaza: xromosomalar qutblarda toʻplanadi, spirallar yoyiladi, yadro qobigʻi va yadrochalar qayta hosil boʻladi."},{"board":{"title":"Mitoz bosqichlari","steps":[{"k":"table","head":["Bosqich","Asosiy hodisa"],"rows":[["Profaza","qobiq yoʻqoladi"],["Meta­faza","ekvatorda saf"],["Ana­faza","qutbga ketadi"],["Telo­faza","qobiq qayta hosil"]],"w":[34,66]}]}},{"ask":{"q":"Ali, xromatidalar mustaqil xromosomaga aylanadigan bosqich qaysi?","o":["Anafaza","Profaza","Metafaza"],"a":0,"ok":"Barakalla! 🎉","no":"Anafazada sentromera belbogʻi uziladi va xromatidalar mustaqil xromosoma boʻladi."}},{"joke":true},{"who":"nur","text":"Telofaza oxirida sitoplazma ham boʻlinadi — sitokinez. Hayvon hujayrasida plazmatik membrana ichkariga botiq hosil qiladi, u asta toraya borib hujayrani ikkiga ajratadi. Xamirni ip bilan kesgandek."},{"board":{"title":"Sitokinez","steps":[{"k":"pic","pic":"cytokin"}]}},{"who":"nur","text":"Oʻsimlikda qalin sellyuloza qobiq bor. Shuning uchun hujayra oʻrtasida koʻndalang toʻsiq paydo boʻladi, keyin sellyuloza qobiq hosil boʻladi. Oʻrtadan devor qurib, bitta xonani ikkiga boʻlgandek."},{"ask":{"q":"Ali, oʻsimlik hujayrasida sitokinez qanday boshlanadi?","o":["Oʻrtada toʻsiq hosil boʻladi","Botiqlik paydo boʻladi","Yadro yoʻqoladi"],"a":0,"ok":"Qoyil! 👏","no":"Oʻsimlikda ekvatorda koʻndalang toʻsiq hosil boʻladi."}},{"who":"nur","text":"Mitoz natijasida ikkita hujayra hosil boʻladi: ikkalasi ham diploid, xromosomalar toʻplami va genlari ona hujayradagidek bir xil."},{"board":{"title":"Mitozning ahamiyati","steps":[{"k":"pic","pic":"mitosisres"}]}},{"who":"nur","text":"Mitoz embrional rivojlanishni, oʻsishni, shikastlangan toʻqima va hujayralarning tiklanishini taʼminlaydi. Jinssiz koʻpayish ham mitoz asosida boradi."},{"ask":{"q":"Ali, mitozning ahamiyati qaysi?","o":["Oʻsish va toʻqimalar tiklanishi","Gametalar hosil qilish","Xromosomalar sonini kamaytirish"],"a":0,"ok":"Barakalla!","no":"Mitoz oʻsish va tiklanishni taʼminlaydi; gametalar meyozda hosil boʻladi."}},{"joke":true}]},{"title":"Meyoz","items":[{"who":"nur","text":"Endi jinsiy koʻpayadigan organizmlarga xos boʻlinish — meyoz. «Meyoz» soʻzi «kamayish» degani."},{"who":"nur","text":"Meyozda diploid toʻplamli birlamchi jinsiy hujayradan gaploid toʻplamli jinsiy hujayralar hosil boʻladi. Nega kerak? Tuxum va spermiy qoʻshilganda yana toʻliq toʻplam chiqishi uchun: 23 + 23 = 46."},{"board":{"title":"Meyoz","steps":[{"k":"pic","pic":"meiosisflow"}]}},{"who":"nur","text":"Meyoz ketma-ket ikkita boʻlinishdan iborat. Har biri mitozdagidek toʻrt bosqichli. Farqlash uchun birinchisiga I, ikkinchisiga II raqami qoʻyiladi."},{"who":"nur","text":"Ular orasidagi qisqa vaqt — interkinez. Bu vaqtda DNK reduplikatsiyalanmaydi. Koʻpincha interkinez boʻlmaydi: telofaza I bevosita profaza II ga ulanib ketadi."},{"who":"nur","text":"Meyoz I da gomologik xromosomalar ajraladi. Gomologik juft — poyabzal jufti kabi: biri otadan, biri onadan."},{"who":"nur","text":"Profaza I: xromosomalar spirallashadi. Gomologik xromosomalar yaqinlashib, yonma-yon yopishadi — bu konʼyugatsiya. Keyin ular oʻxshash qismlari, yaʼni genlari bilan almashadi — bu krossingover. Ikki doʻst daftaridan bir varaqni almashgandek."},{"board":{"title":"Krossingover","steps":[{"k":"pic","pic":"crossing"}]}},{"who":"nur","text":"Profaza I oxirida gomologik xromosomalar bir-biridan ajrala boshlaydi, yadro qobigʻi va yadrochalar yoʻqoladi."},{"who":"nur","text":"Metafaza I: konʼyugatsiyalashgan xromosomalar juft-juft boʻlib ekvator boʻylab joylashadi. Sentromeraga boʻlinish urchugʻi birikadi."},{"who":"nur","text":"Anafaza I: gomologik xromosomalar bir-biridan ajraladi, lekin xromatidlarga ajralmasdan qutblarga ketadi. Yaʼni juft ajraladi, xromatidalar emas."},{"who":"nur","text":"Telofaza I: xromosomalar soni ikki hissa kamaygan hujayralar hosil boʻladi."},{"board":{"title":"Meyoz I","steps":[{"k":"pic","pic":"meiosis1"}]}},{"ask":{"q":"Ali, anafaza I da nima ajraladi?","o":["Gomologik xromosomalar","Xromatidalar","Sentriolalar"],"a":0,"ok":"Barakalla! 🎉","no":"Anafaza I da gomologik xromosomalar ajraladi, xromatidalar emas."}},{"joke":true},{"who":"nur","text":"Birinchi boʻlinishdan hosil boʻlgan hujayralar ota va ona xromosomalari yigʻindisi jihatidan bir-biridan farq qiladi. Krossingoverni hisobga olsak, har bir jinsiy hujayra takrorlanmaydigan genlar yigʻindisiga ega boʻladi."},{"who":"nur","text":"Meyoz II xuddi mitozga oʻxshaydi: profaza II va metafaza II da mitozdagidek jarayonlar boradi, farqi — hujayra gaploid toʻplamli."},{"who":"nur","text":"Anafaza II da sentromera bilan birikkan xromatidlar ajraladi va mustaqil xromosoma boʻladi. Telofaza II da gaploid xromosomali ikkita hujayra hosil boʻladi. Birinchi bosqichda ikkita hujayra boʻlgani uchun jami 4 ta gaploid jinsiy hujayra — gameta chiqadi."},{"board":{"title":"Meyoz II","steps":[{"k":"pic","pic":"meiosis2"}]}},{"ask":{"q":"Ali, bitta diploid hujayradan meyozda nechta gameta hosil boʻladi?","o":["4 ta","2 ta","8 ta"],"a":0,"ok":"Qoyil! 👏","no":"Ikki ketma-ket boʻlinishdan 4 ta gaploid gameta hosil boʻladi."}},{"who":"nur","text":"Meyoz tufayli avlodlar almashinganda xromosomalar soni oʻzgarmaydi. Gomologik xromosomalarning juda koʻp xilma-xil variantlari hosil boʻladi, krossingover esa irsiy axborotning yangi toʻplamini yaratadi."},{"joke":true}]},{"title":"Mitoz va meyoz, masalalar","items":[{"who":"ali","text":"Ustoz, mitoz bilan meyozni qanday farqlayman?"},{"who":"nur","text":"Rasmga qara: mitozda bitta boʻlinish, ikkita bir xil diploid hujayra. Meyozda ikkita boʻlinish, toʻrtta gaploid hujayra."},{"board":{"title":"Mitoz va meyoz","steps":[{"k":"pic","pic":"mitmey"}]}},{"board":{"title":"Mitoz va meyoz","steps":[{"k":"table","head":["Belgi","Mitoz","Meyoz"],"rows":[["Marta","1","2"],["Hujayra","2 ta","4 ta"],["Toʻplam","diploid","gaploid"],["Qayerda","somatik","jinsiy"],["Genlar","bir xil","turlicha"]],"w":[30,35,35]}]}},{"ask":{"q":"Ali, meyozda hosil boʻladigan hujayralar qaysi toʻplamli?","o":["Gaploid","Diploid","Triploid"],"a":0,"ok":"Barakalla! 🎉","no":"Meyozda xromosomalar soni ikki hissa kamayadi: gaploid toʻplam."}},{"who":"nur","text":"Masala 1: hayvon hujayrasining diploid toʻplami 34. Mitozdan oldin, mitozdan keyin, meyoz I va meyoz II dan keyin DNK molekulalari soni qancha?"},{"who":"nur","text":"Yechim: G1 davrida 34 ta DNK. S davrida ikki hissa ortadi — mitozdan oldin 68. Mitozdan keyin har qiz hujayrada 34. Meyoz I dan keyin ham 34: xromosoma 17 ta, lekin har biri ikki xromatidali. Meyoz II dan keyin har gametada 17."},{"board":{"title":"Masala 1","steps":[{"k":"table","head":["Payt","DNK"],"rows":[["G1 davrida","34"],["Mitozdan oldin","68"],["Mitozdan keyin","34"],["Meyoz I keyin","34"],["Meyoz II keyin","17"]],"w":[64,36]}]}},{"who":"nur","text":"Masala 2: odam hujayrasi (2n = 46). Meyoz I telofazasi oxirida va meyoz II anafazasida xromosoma va DNK soni qancha? Qoida: xromosomani sentromeralar boʻyicha, DNK ni xromatidalar boʻyicha sana."},{"who":"nur","text":"Yechim: telofaza I oxirida 23 xromosoma, har biri ikki xromatidali — DNK 46. Anafaza II da xromatidalar ajralib mustaqil xromosoma boʻladi: 46 xromosoma, DNK 46."},{"board":{"title":"Masala 2","steps":[{"k":"table","head":["Payt","Xro­mo­so­ma","DNK"],"rows":[["Telo­faza I","23","46"],["Ana­faza II","46","46"]],"w":[38,34,28]}]}},{"ask":{"q":"Ali, diploid toʻplami 34 boʻlgan hayvonning gametasida nechta DNK bor?","o":["17","34","68"],"a":0,"ok":"Qoyil! 👏","no":"Gametada 17 xromosoma, har biri bitta xromatidali: 17 DNK."}},{"joke":true}]},{"title":"Jinssiz va jinsiy koʻpayish","items":[{"who":"nur","text":"Barcha tirik organizmlar koʻpayadi. Koʻpayish asosida DNK ning ikki hissa ortishi yotadi. Hatto mitoxondriya va plastidalar ham hujayra ichida mustaqil koʻpaya oladi."},{"who":"nur","text":"Bir va koʻp hujayralilarning koʻpayishi ikki asosiy usulda boradi: jinssiz va jinsiy. Jinssizda ona organizmdagi bitta yoki bir nechta somatik hujayradan yangi organizm rivojlanadi."},{"board":{"title":"Koʻpayish xillari","steps":[{"k":"pic","pic":"repro"}]}},{"ask":{"q":"Ali, jinssiz koʻpayishda yangi organizm nimadan rivojlanadi?","o":["Somatik hujayralardan","Gametalardan","Urugʻlangan tuxumdan"],"a":0,"ok":"Barakalla! 🎉","no":"Jinssiz koʻpayishda somatik hujayralardan yangi organizm hosil boʻladi."}},{"joke":true}]},{"title":"Bir hujayralilarda jinssiz koʻpayish","items":[{"who":"nur","text":"Bir hujayralilarda toʻrt usul bor: ikkiga boʻlinish, shizogoniya, kurtaklanish va sporalar orqali koʻpayish."},{"board":{"title":"Ikkiga boʻlinish va shizogoniya","steps":[{"k":"pic","pic":"bin_schizo"}]}},{"who":"nur","text":"Ikkiga boʻlinish — amyoba, yashil evglena, tufelkada: hujayra ikkiga boʻlinib, ikkita yangi organizm hosil boʻladi."},{"who":"nur","text":"Shizogoniya — koʻp boʻlaklarga boʻlinish: xlorella, xlamidomonada, ayrim zamburugʻlar, bezgak plazmodiysida. Yadro koʻp marta boʻlinadi, sitoplazma esa butun qoladi. Keyin sitoplazma har yadroni oʻrab oladi va bitta hujayradan oʻnlab, yuzlab, hatto minglab yangi organizm paydo boʻladi. Katta zalni pardalar bilan koʻp xonaga boʻlgandek."},{"ask":{"q":"Ali, shizogoniya qaysi organizmda uchraydi?","o":["Bezgak plazmodiysi","Amyoba","Achitqi"],"a":0,"ok":"Qoyil! 👏","no":"Shizogoniya xlorella, xlamidomonada va bezgak plazmodiysida uchraydi."}},{"board":{"title":"Kurtaklanish va sporalar","steps": h","steps":[{"k":"pic","pic":"fertil"}]}},{"who":"nur","text":"Afzalligi — ota va ona irsiy belgilari birlashadi. Avlod yashovchan boʻladi, oʻzgargan muhitga tez moslashadi. Evolyutsiyada bu juda muhim. Ikki xil retsept aralashtirilgan taom kabi: yangi mazali variant chiqadi."},{"who":"nur","text":"Jinsiy hujayralar — gametalar. Erkaklik gametasi — spermatozoid (urugʻ hujayra), urgʻochilik gametasi — tuxum hujayra."},{"ask":{"q":"Ali, jinsiy koʻpayishning jinssizdan afzalligi nima?","o":["Ota va ona belgilari birlashadi","Avlod ona nusxasi boʻladi","Bitta organizm qatnashadi"],"a":0,"ok":"Barakalla! 🎉","no":"Jinsiy koʻpayishda ikki ota-ona irsiy belgilari birlashadi."}},{"joke":true}]},{"title":"Spermatozoid va tuxum hujayra","items":[{"who":"nur","text":"Jinsiy hujayralar oʻlchami va shakli bilan farq qiladi. Spermatozoid tuxum hujayradan ancha kichik, lekin juda harakatchan."},{"who":"nur","text":"Sutemizuvchi spermatozoidi uzun ip shaklida va uch qismdan iborat: bosh, boʻyin, dum."},{"board":{"title":"Spermatozoid","steps":[{"k":"pic","pic":"sperm"}]}},{"who":"nur","text":"Boshida yadro bor, old tomonida sitoplazmaning zichlashgan qismi — akrosoma. Aynan u orqali spermatozoid tuxumga kiradi. Boʻyinda hujayra markazi va mitoxondriyalar. Dum xivchaga oʻxshaydi va harakatlantiradi."},{"who":"nur","text":"Spermatozoidga kurerni oʻxshatsak: yengil, tez, yoqilgʻisi (mitoxondriya) bor, yukida esa faqat irsiy axborot."},{"who":"nur","text":"Tuxum hujayra esa — katta ombor. Ular koʻpincha yumaloq, amyobasimon va harakatsiz. Asosiy farqi — juda kattaligi: sitoplazmada oqsilga boy oziq modda — sariqlik bor."},{"board":{"title":"Tuxum va spermatozoid","steps":[{"k":"pic","pic":"spermegg"}]}},{"who":"nur","text":"Tuxum qoʻyib koʻpayadigan umurtqalilarda — sudralib yuruvchilar va qushlarda — tuxum hujayra ancha yirik. Tovuq tuxumida sariqlik, embrion diski, oqsil, poʻchoq, havo kamerasi bor. Poʻchoq va qoʻshimcha qobiqlar embrionni noqulay sharoitdan himoya qiladi."},{"board":{"title":"Tovuq tuxumi","steps":[{"k":"pic","pic":"henegg"}]}},{"board":{"title":"Spermatozoid va tuxum","steps":[{"k":"table","head":["Belgi","Sperm","Tuxum"],"rows":[["Hajmi","kichik","yirik"],["Harakat","bor","yoʻq"],["Sariqlik","yoʻq","bor"],["Toʻplam","n","n"]],"w":[34,32,34]}]}},{"who":"nur","text":"Muhim: ikkalasida ham xromosomalar gaploid, yaʼni n. Tuxum hujayra rivojlanish uchun zarur hamma irsiy axborotni saqlaydi."},{"ask":{"q":"Ali, tuxum hujayraning asosiy farqi nima?","o":["Katta, sariqligi bor","Dumi bor","Juda harakatchan"],"a":0,"ok":"Qoyil! 👏","no":"Tuxum hujayra katta, sitoplazmasida sariqlik bor, harakatsiz."}},{"joke":true}]},{"title":"Gametogenez","items":[{"who":"nur","text":"Gametalar jinsiy bezlarda rivojlanadi: spermatozoidlar urugʻdonda, tuxum hujayra tuxumdonda. Spermatozoid rivojlanishi — spermatogenez, tuxum hujayraniki — ovogenez."},{"who":"nur","text":"Gametogenez toʻrt davrdan iborat. Fabrikaga oʻxshatamiz: koʻpaytirish, material yigʻish, ishlov berish, jilolash."},{"board":{"title":"Gametogenez","steps":[{"k":"pic","pic":"gametogen"}]}},{"who":"nur","text":"1-davr — koʻpayish: birlamchi jinsiy hujayralar mitoz bilan koʻpayib, soni ortadi. Spermatogenezda juda tez: balogʻatdan to qarilikkacha davom etadi. Ovogenezda tuban umurtqasizlarda butun umr davom etadi."},{"who":"nur","text":"2-davr — oʻsish: ayrim hujayralar kattalashadi, oziq toʻplaydi, DNK ikki hissa ortadi. Birlamchi spermatozoidlar tez kattalashmaydi, tuxum hujayralar esa bir necha yuz, hatto ming martagacha kattalashadi. Baliq, qushlarda tuxumning asosiy qismi — sariqlik: yogʻ, oqsil, uglevod zaxirasi."},{"who":"nur","text":"3-davr — yetilish: hujayralar meyoz bilan boʻlinib, gaploid toʻplamga ega boʻladi."},{"who":"nur","text":"4-davr — shakllanish: hujayralar maʼlum shakl va hajmga ega boʻladi. Tuxum hujayra maxsus parda (qobiq) bilan oʻraladi va urugʻlanishga tayyor boʻladi."},{"board":{"title":"Gametogenez davrlari","steps":[{"k":"table","head":["Davr","Nima boʻladi"],"rows":[["Koʻpayish","mitoz, soni ortadi"],["Oʻsish","kattalashadi, DNK ×2"],["Yetilish","meyoz, n toʻplam"],["Shakllanish","shakl va qobiq"]],"w":[34,66]}]}},{"ask":{"q":"Ali, gametogenezning qaysi davrida meyoz boradi?","o":["Yetilish","Koʻpayish","Shakllanish"],"a":0,"ok":"Barakalla! 🎉","no":"Yetilish davrida meyoz boradi va gaploid toʻplam hosil boʻladi."}},{"ask":{"q":"Ali, tuxum hujayra eng koʻp qaysi davrda kattalashadi?","o":["Oʻsish","Yetilish","Koʻpayish"],"a":0,"ok":"Qoyil! 👏","no":"Oʻsish davrida tuxum hujayra oziq toʻplab, yuz va minglab martagacha kattalashadi."}},{"joke":true}]},{"title":"Hayvonlarda urugʻlanish","items":[{"who":"nur","text":"Urugʻlanish — gaploid toʻplamli urgʻochi va erkak gametalarning bir-biriga qoʻshilishi. Urugʻlangan tuxum hujayra — zigota."},{"who":"nur","text":"Zigotada xromosomalar yana juft: har juftning bittasi otadan, ikkinchisi onadan. Demak, urugʻlanishda tur uchun xos diploid toʻplam tiklanadi: n + n = 2n."},{"who":"nur","text":"Spermatozoid tuxumga qanday kiradi? Qulf va kalit kabi: spermatozoid boshidagi fermentlar tuxum qobigʻini eritib, kichik teshik ochadi."},{"board":{"title":"Urugʻlanish bosqichlari","steps":[{"k":"pic","pic":"fertsteps"}]}},{"who":"nur","text":"Teshikdan spermatozoid yadrosi tuxum ichiga kiradi. Ikkala gametaning gaploid yadrolari qoʻshilib, umumiy diploid yadro hosil qiladi. Shundan keyin boʻlinish va rivojlanish boshlanadi."},{"who":"nur","text":"Koʻpincha bitta tuxumni faqat bitta spermatozoid urugʻlantiradi. Ayrim hayvonlarda tuxumga ikki yoki bir nechta spermatozoid kirishi mumkin, lekin urugʻlantirishda faqat bittasi qatnashadi, qolganlari nobud boʻladi."},{"who":"nur","text":"Urugʻlanish ikki xil: tashqi va ichki. Baliqlar, suvda hamda quruqlikda yashovchilarda urugʻlanish suv bilan bogʻliq: ular koʻpayish davrida juda koʻp tuxum va spermatozoidni suvga chiqaradi — bu tashqi urugʻlanish. Quruqlikda yashaydigan hayvonlarda ichki urugʻlanish."},{"board":{"title":"Tashqi va ichki","steps":[{"k":"pic","pic":"extint"}]}},{"board":{"title":"Urugʻlanish xillari","steps":[{"k":"table","head":["Xili","Misol"],"rows":[["Tashqi","baliq, baqa"],["Ichki","quruqlik hayvonlari"]],"w":[40,60]}]}},{"ask":{"q":"Ali, baliqlarda qanday urugʻlanish boradi?","o":["Tashqi","Ichki","Qoʻsh"],"a":0,"ok":"Barakalla! 🎉","no":"Baliqlar tuxum va spermatozoidni suvga chiqaradi — tashqi urugʻlanish."}},{"ask":{"q":"Ali, urugʻlanishda diploid toʻplam qanday tiklanadi?","o":["n + n = 2n","2n + 2n = 4n","n + 2n = 3n"],"a":0,"ok":"Qoyil! 👏","no":"Ikki gaploid gameta qoʻshilib, diploid zigota hosil qiladi."}},{"joke":true}]},{"title":"Oʻsimliklarda qoʻsh urugʻlanish","items":[{"who":"nur","text":"Endi gulli, yaʼni yopiq urugʻli oʻsimliklar. Ularda erkak gametalar chang donachasida yetiladi."},{"who":"nur","text":"Chang donachasi ikki hujayradan iborat: yirigi — vegetativ hujayra, maydasi — generativ hujayra."},{"who":"nur","text":"Vegetativ hujayra oʻsib uzun ingichka naycha hosil qiladi. Generativ hujayra shu naycha ichida ikkiga boʻlinib, ikkita spermiy beradi."},{"board":{"title":"Chang naychasi","steps":[{"k":"pic","pic":"pollen"}]}},{"who":"nur","text":"Chang naychalari urugʻchi tumshuqchasi va ustunchasi ichidan tuguncha tomon oʻsadi. Ular turli tezlikda oʻsadi — poygadek. Faqat bittasi boshqalardan oʻzib, tuguncha ichidagi urugʻkurtakka yetib boradi."},{"who":"nur","text":"Keyin qiziq voqea: ikkita spermiyning ikkalasi ham ishlaydi. Biri tuxum hujayra bilan qoʻshilib zigota hosil qiladi, undan murtak rivojlanadi. Ikkinchisi markaziy (diploid) hujayra bilan qoʻshiladi, yadrosi triploid, yaʼni 3n boʻladi. Undan endosperm rivojlanadi."},{"board":{"title":"Qoʻsh urugʻlanish","steps":[{"k":"pic","pic":"doublefert"}]}},{"who":"nur","text":"Endosperm — murtak uchun zaxira oziq. Sayohatga yoʻl xaltasi tayyorlagandek: murtak oʻsayotganda ovqatlanadi."},{"who":"nur","text":"Qoʻsh urugʻlanishni 1898-yilda akademik S. G. Navashin kashf etgan. Endospermning triploid tabiatini uning oʻgʻli M. S. Navashin 1915-yilda ochgan."},{"board":{"title":"Qoʻsh urugʻlanish","steps":[{"k":"table","head":["Qoʻshiladi","Hosil boʻladi"],"rows":[["spermiy + tuxum","zigota 2n → murtak"],["spermiy + markaziy","endosperm 3n → oziq"]],"w":[46,54]}]}},{"ask":{"q":"Ali, endosperm nima vazifa bajaradi?","o":["Murtak uchun zaxira oziq","Chang naychasini hosil qiladi","Tuxum hujayra boʻladi"],"a":0,"ok":"Barakalla! 🎉","no":"Triploid endosperm — murtak uchun zaxira oziq."}},{"ask":{"q":"Ali, endospermning xromosoma toʻplami qanday?","o":["Triploid","Gaploid","Diploid"],"a":0,"ok":"Qoyil! 👏","no":"Endosperm yadrosi triploid, 3n."}},{"joke":true}]},{"title":"Partenogenez va ontogenez","items":[{"who":"nur","text":"Baʼzan tuxum urugʻlanmaydi, lekin baribir rivojlanadi. Urugʻlanmagan tuxum hujayradan murtak rivojlanishi — partenogenez."},{"board":{"title":"Partenogenez","steps":[{"k":"pic","pic":"partheno"}]}},{"who":"nur","text":"Tabiiy partenogenez dafniya, erkak asalari va oʻsimlik shira bitlarida uchraydi, qisman qushlardan tustovuqda ham. Sunʼiy partenogenezda tuxumga mexanik yoki kimyoviy taʼsir beriladi."},{"who":"nur","text":"Masalan, baqa urugʻlanmagan tuxumiga nina bilan taʼsir qilinsa, undan yetuk organizm rivojlanishi mumkin, faqat hammasi urgʻochi boʻladi. Sunʼiy partenogenez tut ipak qurti, baliq, quyon, zamburugʻlarda ham olingan."},{"ask":{"q":"Ali, erkak asalari qanday rivojlanadi?","o":["Partenogenez bilan","Qoʻsh urugʻlanish bilan","Vegetativ yoʻl bilan"],"a":0,"ok":"Barakalla! 🎉","no":"Erkak asalari tabiiy partenogenez bilan rivojlanadi."}},{"who":"nur","text":"Endi umumiy tushuncha. Organizmning shaxsiy rivojlanishi — ontogenez. Bu soʻzni 1866-yilda E. Gekkel fanga kiritgan."},{"who":"nur","text":"Bir hujayralilarda ontogenez hosil boʻlishdan boshlanib, boʻlinish yoki nobud boʻlish bilan tugaydi. Koʻp hujayralilarda zigotadan boshlanib, tabiiy oʻlim bilan tugaydi."},{"board":{"title":"Ontogenez","steps":[{"k":"pic","pic":"ontoline"}]}},{"who":"nur","text":"Ontogenez ikki davrga boʻlinadi: embrional va postembrional. Embrional davr zigotadan boshlanib, tugʻilguncha yoki tuxum qobigʻidan chiqquncha davom etadi."},{"who":"nur","text":"Embrional rivojlanish uch tipga ajraladi: lichinkali (yassi chuvalchanglar, koʻp hasharotlar, baqalar), lichinkasiz (sudralib yuruvchilar, qushlar) va ona qornida rivojlanish (yuksak sutemizuvchilar, odam)."},{"board":{"title":"Ontogenez tiplari","steps":[{"k":"table","head":["Tip","Misol"],"rows":[["Lichinkali","baqa, hasharot"],["Lichinkasiz","qush, sudralib yuruvchi"],["Ona qornida","odam"]],"w":[36,64]}]}},{"ask":{"q":"Ali, ontogenez tushunchasini kim kiritgan?","o":["E. Gekkel","G. Shpeman","S. Navashin"],"a":0,"ok":"Qoyil! 👏","no":"Ontogenez tushunchasini 1866-yilda E. Gekkel kiritgan."}},{"joke":true}]},{"title":"Maydalanish va gastrulyatsiya","items":[{"who":"nur","text":"Embrional davr uch bosqichdan iborat: maydalanish, gastrulyatsiya va birlamchi organogenez. Birinchisidan boshlaymiz."},{"who":"nur","text":"Zigota bir hujayra. U bir necha daqiqadan keyin boʻlina boshlaydi: avval teng ikkita hujayra — blastomer. Mitoz ketma-ket takrorlanib, koʻp hujayrali organizm hosil boʻladi."},{"board":{"title":"Maydalanish","steps":[{"k":"pic","pic":"cleavage"}]}},{"who":"nur","text":"Birinchi boʻlinish meridian tekisligida (qutbdan qutbga, tik). Keyin har blastomer yana meridian tekisligida boʻlinadi — 4 ta. Navbatdagi boʻlinish ekvator tekisligida (yotiq) — 8 ta. Keyin meridian va ekvator navbatlashib, 16, 32, 64 ta va hokazo blastomer hosil boʻladi."},{"board":{"title":"Boʻlinish tekisliklari","steps":[{"k":"pic","pic":"planes"}]}},{"who":"nur","text":"Maydalanishda hujayralar oʻsmaydi, har boʻlinishdan keyin kichrayadi. Shuning uchun «maydalanish» deyiladi. Bitta katta nonni mayda boʻlaklarga boʻlgandek: non hajmi oʻsha, boʻlaklar kichik. Hujayralar zich taqalib turadi, mitoz juda tez oʻtadi."},{"who":"nur","text":"Maydalanish ko‘p hujayrali embrion — blastula bilan tugaydi. Blastula sharsimon, devori bir qavat hujayradan. Ichi suyuqlikka toʻla: bu birlamchi tana boʻshligʻi — blastosel. Ichi boʻsh futbol toʻpiga oʻxshaydi."},{"board":{"title":"Blastula","steps":[{"k":"pic","pic":"blastula"}]}},{"ask":{"q":"Ali, 3 ta ketma-ket boʻlinishdan keyin nechta blastomer boʻladi?","o":["8","6","16"],"a":0,"ok":"Barakalla! 🎉","no":"Har boʻlinishda soni ikki hissa ortadi: 2 × 2 × 2 = 8."}},{"ask":{"q":"Ali, blastula ichidagi boʻshliq nima deyiladi?","o":["Blastosel","Gastrula","Endosperm"],"a":0,"ok":"Qoyil! 👏","no":"Suyuqlikka toʻla birlamchi tana boʻshligʻi — blastosel."}},{"joke":true},{"who":"nur","text":"Ikkinchi bosqich — gastrulyatsiya. Blastula juda koʻp hujayradan iborat (lansetnikda 3000 ta). Gastrulada murtak ikki qavatli boʻladi: tashqi qavat — ektoderma, ichki qavat — entoderma."},{"who":"nur","text":"Lansetnikda gastrula blastula devorining ichkariga botib kirishidan hosil boʻladi. Yumshoq toʻpni barmoq bilan bosgandek: bir tomoni ichkariga botadi."},{"board":{"title":"Gastrulyatsiya","steps":[{"k":"pic","pic":"gastrula"}]}},{"who":"nur","text":"Koʻp hujayrali hayvonlarda (boʻshliqichlilardan tashqari) uchinchi qavat — mezoderma paydo boʻladi. U ektoderma va entoderma orasida joylashadi. Endi murtak uch qavatli: bular murtak varaqlari."},{"board":{"title":"Murtak varaqlari","steps":[{"k":"pic","pic":"layers3"}]}},{"who":"nur","text":"Gastrulyatsiyada hujayralar toʻplami aralashadi. Hujayralar boʻlinmaydi va oʻsmaydi, lekin ular dastlabki genetik axborotdan foydalana boshlaydi. Ixtisoslashish boshlanadi — hujayralar tuzilishi va vazifasi bilan farqlanadi."},{"who":"nur","text":"Ixtisoslashish — maktabdagi kasb tanlashga oʻxshaydi: bir xil hujayralardan teri, ichak, nerv, muskul hujayralari paydo boʻladi. Biokimyoviy jihatdan har hujayra oʻziga xos oqsil sintezlaydi: limfositlar antitana, muskul hujayralari esa qisqaruvchi miozin."},{"ask":{"q":"Ali, ektoderma murtakning qayerida joylashgan?","o":["Tashqi qavatda","Ichki qavatda","Oʻrta qavatda"],"a":0,"ok":"Barakalla! 🎉","no":"Ektoderma — tashqi qavat, entoderma — ichki, mezoderma — oʻrta."}},{"joke":true}]},{"title":"Murtak varaqlari, organogenez, induksiya","items":[{"who":"nur","text":"Murtak varaqlaridan nima rivojlanadi? Uch qavatli pirogdek: har qavat oʻz organlarini beradi."},{"who":"nur","text":"Ektodermadan: teri epiteliysi va uning hosilalari, nerv sistemasi, sezgi organlari, tishning emal qavati."},{"who":"nur","text":"Entodermadan: ichak epiteliysi, ovqat hazm qilish bezlari — jigar, oshqozon osti bezi, shuningdek oʻpka va jabra."},{"who":"nur","text":"Mezodermadan: biriktiruvchi toʻqimalar (togʻay, suyak, qon, limfa), muskul toʻqimalari, yurak-qon-tomir sistemasi, ayirish sistemasi, jinsiy organlar."},{"board":{"title":"Murtak varaqlari","steps":[{"k":"table","head":["Varaq","Nimaga aylanadi"],"rows":[["Ekto­derma","teri, nerv, sezgi"],["Mezo­derma","suyak, muskul, yurak"],["Ento­derma","ichak, jigar, oʻpka"]],"w":[34,66]}]}},{"who":"nur","text":"Har xil turdagi hayvonlarning murtak varaqlaridan bir xil toʻqima va organlar hosil boʻladi: ular gomolog. Bu hayvonot olami kelib chiqishi bir ekanini isbotlovchi dalillardan biri."},{"ask":{"q":"Ali, nerv sistemasi qaysi varaqdan rivojlanadi?","o":["Ektoderma","Entoderma","Mezoderma"],"a":0,"ok":"Qoyil! 👏","no":"Nerv sistemasi ektodermadan rivojlanadi."}},{"ask":{"q":"Ali, suyak va muskul qaysi varaqdan hosil boʻladi?","o":["Mezoderma","Ektoderma","Entoderma"],"a":0,"ok":"Barakalla! 🎉","no":"Suyak, togʻay, qon va muskullar mezodermadan hosil boʻladi."}},{"joke":true},{"who":"nur","text":"Uchinchi bosqich — birlamchi organogenez. Gastrulyatsiyadan keyin oʻzak organlar majmui hosil boʻladi: nerv nayi, xorda, ichak naychasi. Bu bosqich neyrula deb ham ataladi."},{"who":"nur","text":"Lansetnikda nerv nayi shunday hosil boʻladi: ektoderma embrionning orqa tomonida tarnov boʻlib ichkariga botadi, chetlari birikib naycha boʻladi va ektoderma ostiga tushadi. Ektodermaning qolgan qismidan teri epiteliysi paydo boʻladi. Qogʻozni naychaga oʻragandek."},{"board":{"title":"Nerv nayi hosil boʻlishi","steps":[{"k":"pic","pic":"neurula"}]}},{"who":"nur","text":"Xorda nerv nayining bevosita ostida, entodermaning yelka qismidan vujudga keladi."},{"who":"nur","text":"Embrion qismlari bir-biriga taʼsir qiladi: bitta kurtak ikkinchisining rivojlanishini boshqaradi. Bu embrional induksiya."},{"who":"nur","text":"Uni nemis olimi G. Shpeman 1920–30-yillarda baqalarda kashf etgan. Gastrulaning nerv sistemasi rivojlanadigan qismi boshqa baqa gastrulasining qorin ektodermasiga koʻchirilsa, oʻsha joyda qoʻshimcha nerv nayi va xorda, hatto qoʻshimcha homila rivojlanadi."},{"board":{"title":"Embrional induksiya","steps":[{"k":"pic","pic":"induction"}]}},{"who":"nur","text":"Koʻchirilgan qism tashkilotchi vazifasini bajaradi: qurilishda prorab ishchilarga qaysi devor qayerda turishini koʻrsatgandek."},{"ask":{"q":"Ali, embrional induksiyani kim kashf etgan?","o":["G. Shpeman","E. Gekkel","S. Navashin"],"a":0,"ok":"Qoyil! 👏","no":"Embrional induksiyani G. Shpeman baqalar ustida kashf etgan."}},{"who":"nur","text":"Darslikdagi masala 1: embrionda uch marta boʻlinishdan keyin blastomerlar soni nechta? Yechim: har boʻlinishda ikki hissa ortadi. 2 × 2 × 2 = 8 ta."},{"who":"nur","text":"Masala 2: blastomerlar 128 ta boʻlishi uchun nechta boʻlinish kerak? 128 = 2⁷, demak 7 marta. Darslikdagi tartib: 1-meridian, 2-meridian, 3-ekvator, keyin navbatlashadi (meridian, ekvator, meridian, ekvator). Jami 4 ta meridianal va 3 ta ekvatorial."},{"board":{"title":"Masala 2","steps":[{"k":"table","head":["Boʻlinish","Soni"],"rows":[["1","2"],["2","4"],["3","8"],["4","16"],["5","32"],["6","64"],["7","128"]],"w":[50,50]}]}},{"ask":{"q":"Ali, 128 ta blastomer uchun nechta boʻlinish kerak?","o":["7","8","6"],"a":0,"ok":"Barakalla! 🎉","no":"128 = 2⁷, demak 7 marta boʻlinish."}},{"joke":true}]}],"jokes":["Spermiy: «Men tezman!» Tuxum: «Men esa kattaman, xohlasang kelaverasan 😄»","Ali: «Ustoz, tuxum nega katta?» Ustoz: « er","q":"Rivojlanish bosqichlarini tartiblang.","items":["Zigota","Blastula","Gastrula","Nerv nayi"],"w":"Zigota → blastula → gastrula → nerv nayi."},{"t":"match","q":"Qismni organ bilan juftlang.","pairs":[["Ektoderma","nerv sistemasi"],["Entoderma","jigar"],["Mezoderma","suyak"],["Xorda","nerv nayi ostida"]],"w":"Har qismning oʻz oʻrni va organi bor."},{"t":"match","q":"Tushunchani maʼnosi bilan juftlang.","pairs":[["Zigota","urugʻlangan tuxum"],["Blastula","bir qavatli shar"],["Gastrula","ikki qavatli murtak"],["Blastosel","birlamchi tana boʻshligʻi"]],"w":"Har tushunchaning oʻz maʼnosi."},{"t":"match","q":"Tipni misol bilan juftlang.","pairs":[["Lichinkali","baqa"],["Lichinkasiz","qush"],["Ona qornida","odam"],["Partenogenez","dafniya"]],"w":"Tip va misol."},{"t":"match","q":"Olimni kashfiyot bilan juftlang.","pairs":[["S. G. Navashin","qoʻsh urugʻlanish"],["M. S. Navashin","triploid endosperm"],["E. Gekkel","ontogenez"],["G. Shpeman","embrional induksiya"]],"w":"Har olimning oʻz kashfiyoti."}]},"9-11":{"id":"9-11","grade":9,"no":11,"title":"Postembrional rivojlanish va biogenetik qonun","subtitle":"44–46-§ · Metamorfoz, gomeostaz, anabioz, biogenetik qonun","sticker":"🦋","stickerName":"Metamorfoz ustasi","sections":[{"title":"Postembrional rivojlanish","items":[{"who":"nur","text":"Ali, oldingi darsda embrional davrni koʻrdik. Endi tuxumdan chiqqan yoki tugʻilgan organizm nima qiladi?"},{"who":"ali","text":"Ustoz, oʻsadi, katta boʻladi-da."},{"who":"nur","text":"Toʻgʻri! Embrionning tuxumdan chiqishi yoki tugʻilishi bilan embrional davr tugaydi va postembrional rivojlanish davri boshlanadi."},{"who":"nur","text":"U ikki xil boʻladi: bevosita (toʻgʻri) va bilvosita (notoʻgʻri, metamorfozli)."},{"board":{"title":"Ikki xil rivojlanish","steps":[{"k":"pic","pic":"postemb"}]}},{"who":"nur","text":"Bevosita rivojlanishda tuxumdan chiqqan yoki tugʻilgan organizm kattasiga oʻxshaydi, faqat kichik. Bu — sudralib yuruvchilar, qushlar, sutemizuvchilarda. Telefonning kichik nusxasi kabi: hamma tugma joyida, faqat kichik. Postembrional davrda u faqat oʻsadi va jinsiy balogʻatga yetadi."},{"who":"nur","text":"Bilvosita rivojlanishda tuxumdan qurt, yaʼni lichinka chiqadi. U kattasidan tuzilishi bilan keskin farq qiladi. Lichinka oziqlanadi, oʻsadi, keyin uning organlari voyaga yetgan organizm organlariga almashadi. Bu — metamorfoz."},{"board":{"title":"Rivojlanish xillari","steps":[{"k":"table","head":["Xili","Misol"],"rows":[["Bevosita","qush, sutemizuvchi"],["Bilvosita","baqa, kapalak"]],"w":[40,60]}]}},{"ask":{"q":"Ali, bevosita rivojlanishda tugʻilgan organizm qanday boʻladi?","o":["Kattasiga oʻxshash, kichik","Kattasidan keskin farq qiladi","Lichinka boʻladi"],"a":0,"ok":"Barakalla! 🎉","no":"Bevosita rivojlanishda organizm kattasiga oʻxshaydi, faqat kichik."}},{"joke":true}]},{"title":"Assidiya va baqada metamorfoz","items":[{"who":"nur","text":"Birinchi misol — assidiya (xordalilar tipi, lichinkaxordalilar kenja tipi). Lichinkasi xordalilarning asosiy belgilarini oʻzida mujassam qilgan: xorda, nerv nayi, halqumida jabra yoriqlari."},{"who":"nur","text":"Lichinka suvda erkin suzib yuradi. Keyin suv tubidagi qattiqroq narsaga yopishib oladi va metamorfozga uchraydi: dumi, xordasi, muskullari yoʻqoladi. Nerv nayi hujayralarga boʻlinib, fagositlarni hosil qiladi. Faqat nerv tuguni uchun ayrim hujayralar qoladi."},{"board":{"title":"Assidiya","steps":[{"k":"pic","pic":"ascidia"}]}},{"who":"nur","text":"Voyaga yetgan assidiya xordalilarga umuman oʻxshamaydi. Lekin lichinkasi uning ajdodlari erkin yashagan xordalilar ekanini koʻrsatadi. Metamorfozning sababi — oʻtroq hayotga oʻtish. Mashinadan tushib, uy qurib oʻtirib qolgan odam kabi: kerak boʻlmagan «dvigatel» yoʻqoladi."},{"ask":{"q":"Ali, assidiya lichinkasida qaysi belgilar bor?","o":["Xorda, nerv nayi, jabra yoriqlari","Oyoq va oʻpka","Suyak va tish"],"a":0,"ok":"Qoyil! 👏","no":"Lichinkada xordalilarning asosiy belgilari bor: xorda, nerv nayi, jabra yoriqlari."}},{"who":"nur","text":"Ikkinchi misol — baqa. Amfibiyalarning lichinkasi — itbaliq. Unda jabra yoriqlari, yon chiziq organi, ikki kamerali yurak va bitta qon aylanish doirasi bor. Shuning uchun u baliqqa oʻxshaydi."},{"who":"nur","text":"Metamorfozda qalqonsimon bezning tiroksin gormoni taʼsirida itbaliqning dumi va yon chiziq organlari yoʻqoladi. Oʻpka va ikkita qon aylanish doirasi rivojlanadi."},{"board":{"title":"Baqa metamorfozi","steps":[{"k":"pic","pic":"frogmeta"}]}},{"board":{"title":"Itbaliq va baqa","steps":[{"k":"table","head":["Belgi","Itbaliq","Baqa"],"rows":[["Nafas","jabra","oʻpka"],["Yurak","2 kamera","3 kamera"],["Qon doirasi","1 ta","2 ta"],["Dum","bor","yoʻq"]],"w":[34,33,33]}]}},{"ask":{"q":"Ali, itbaliq qaysi gormon taʼsirida baqaga aylanadi?","o":["Tiroksin","Insulin","Adrenalin"],"a":0,"ok":"Barakalla! 🎉","no":"Qalqonsimon bez gormoni tiroksin metamorfozni boshqaradi."}},{"ask":{"q":"Ali, itbaliq nimasi bilan baliqqa oʻxshaydi?","o":["Jabra va bitta qon doirasi","Oʻpka va 2 qon doirasi","Oyoqlari"],"a":0,"ok":"Qoyil! 👏","no":"Itbaliqda jabra, yon chiziq, ikki kamerali yurak, bitta qon doirasi bor."}},{"joke":true}]},{"title":"Hasharotlar, ahamiyati, oʻsish","items":[{"who":"nur","text":"Uchinchi misol — hasharotlar. Qoʻngʻiz va kapalaklarning qurti tashqi tuzilishi, hayot tarzi va yashash muhiti bilan kattasidan keskin farq qiladi. Ularning ajdodi halqali chuvalchanglarga oʻxshaydi."},{"board":{"title":"Kapalak metamorfozi","steps":[{"k":"pic","pic":"butterfly"}]}},{"who":"nur","text":"Kapalakning rivojlanishi: tuxum → qurt → gʻumbak → kapalak. Qurt faqat yeydi va oʻsadi, gʻumbakda hamma organ qayta quriladi. Uy taʼmirdan oldin vaqtincha boshqa joyga koʻchib oʻtib, qayta qurilgandek."},{"who":"nur","text":"Metamorfoz — hayot tarzi va yashash muhitining almashinishi bilan bogʻliq."},{"who":"nur","text":"Bilvosita rivojlanishning ahamiyati: bitta turning lichinkasi va kattasi har xil sharoitda yashaydi, shuning uchun ular yashash joyi va oziq uchun raqobatlashmaydi. Qurt kapalak bilan bargdan, kapalak esa gul nektaridan oziqlanadi: bir stolda ikki kishi talashmaydi."},{"who":"nur","text":"Oʻtroq yoki parazit hayotga moslashgan organizmlarning qurtlari erkin harakat qiladi va turning keng tarqalishiga yordam beradi."},{"ask":{"q":"Ali, bilvosita rivojlanishning ahamiyati nimada?","o":["Lichinka va katta organizm raqobatlashmaydi","Hamma organizm bir xil boʻladi","Oʻsish toʻxtaydi"],"a":0,"ok":"Barakalla! 🎉","no":"Lichinka va kattasi turli sharoitda yashagani uchun raqobat boʻlmaydi."}},{"who":"nur","text":"Postembrional davr turli muddat davom etadi. Tut ipak qurtining qurtlik davri 20–24 kun, kapalagi esa 5–10 kun yashaydi. Baqaning lichinkasi — itbaliq 2–3 oyda baqaga aylanadi, baqa esa bir necha yil yashaydi."},{"board":{"title":"Davomiylik","steps":[{"k":"table","head":["Hayvon","Davr"],"rows":[["Ipak qurti","20–24 kun"],["Kapalak","5–10 kun"],["Itbaliq","2–3 oy"],["Baqa","bir necha yil"]],"w":[50,50]}]}},{"joke":true},{"who":"nur","text":"Postembrional davr oʻsish bilan birga boradi. Oʻsish butun umr davom etishi yoki maʼlum muddat bilan chegaralanishi mumkin."},{"who":"nur","text":"Butun umr davomida oʻsish oʻsimliklarda, tasmasimon chuvalchanglarda, ayrim molluskalar va baliqlarda kuzatiladi. Koʻpchilik hayvonlar jinsiy balogʻatga yetgach oʻsishdan toʻxtaydi. Odam 20–25 yoshda oʻsishdan toʻxtaydi."},{"ask":{"q":"Ali, odam necha yoshda oʻsishdan toʻxtaydi?","o":["20–25 yoshda","10–12 yoshda","40–45 yoshda"],"a":0,"ok":"Qoyil! 👏","no":"Odam 20–25 yoshda oʻsishdan toʻxtaydi."}},{"ask":{"q":"Ali, qaysi organizmlar butun umr oʻsadi?","o":["Oʻsimliklar, ayrim baliqlar","Qushlar","Sutemizuvchilar"],"a":0,"ok":"Barakalla! 🎉","no":"Oʻsimliklar, tasmasimon chuvalchanglar, ayrim molluskalar va baliqlar butun umr oʻsadi."}},{"joke":true}]},{"title":"Muhit omillarining taʼsiri","items":[{"who":"nur","text":"Tashqi muhit taʼsiri homila davrida ham, undan keyin ham seziladi. Ayniqsa, embrion muhit oʻzgarishiga juda taʼsirchan."},{"who":"nur","text":"Odam homilasi rivojlanishiga zarar beradiganlar: alkogol, tamaki tarkibidagi nikotin, giyohvand moddalar. Ular sogʻliqqa zarar qilibgina qolmay, jinsiy hujayralar xromosomalari va genlarida mutatsiyalarga sabab boʻlishi mumkin."},{"board":{"title":"Zararli omillar","steps":[{"k":"pic","pic":"harm"}]}},{"who":"nur","text":"Oʻzgargan hujayralardan hosil boʻlgan homilaning yashash qobiliyati susayadi, notoʻgʻri rivojlanadi, har xil nuqsonli bolalar tugʻiladi. Homilador ona isteʼmol qilgan hatto juda oz alkogol, nikotin, giyohvand modda ham homilaning jismoniy va ruhiy rivojlanishiga salbiy taʼsir qiladi. Binoning poydevoridagi kichik yoriq ham butun uyni egadi."},{"who":"nur","text":"Postembrional davrda ham abiotik omillar — harorat, yorugʻlik, namlik, kislorod, kimyoviy birikmalar — rivojlanishni jadallashtirishi yoki susaytirishi mumkin."},{"board":{"title":"Abiotik omillar","steps":[{"k":"table","head":["Omil","Taʼsir"],"rows":[["Harorat","tezlatadi, sekinlatadi"],["Yorugʻlik","rivojni boshqaradi"],["Namlik","rivojga taʼsir"],["Kislorod","rivojga taʼsir"]],"w":[34,66]}]}},{"ask":{"q":"Ali, homilaga zarar beradigan omil qaysi?","o":["Alkogol, nikotin, giyohvand modda","Toza havo","Toʻgʻri ovqatlanish"],"a":0,"ok":"Qoyil! 👏","no":"Alkogol, nikotin va giyohvand moddalar homila rivojiga zarar qiladi."}},{"who":"nur","text":"Hozir bolalar va oʻsmirlar jismoniy rivojlanishi 50–100 yil oldingiga nisbatan ancha jadallashgan. Bu hodisa — akseleratsiya (lotincha «jadallashish»)."},{"ask":{"q":"Ali, akseleratsiya nima?","o":["Jismoniy rivojlanishning jadallashishi","Rivojlanishning sekinlashishi","Anabioz holati"],"a":0,"ok":"Barakalla! 🎉","no":"Akseleratsiya — bolalar rivojlanishining oldingi avlodlarga nisbatan jadallashishi."}},{"joke":true}]},{"title":"Gomeostaz, regeneratsiya, anabioz","items":[{"who":"nur","text":"Tashqi muhit oʻzgarsa-da, tirik organizm oʻz tuzilishi va ichki muhitini doimiy saqlay oladi. Bu xususiyat — gomeostaz. Konditsioner kabi: tashqarida jazirama, xonada esa bir xil harorat."},{"board":{"title":"Gomeostaz","steps":[{"k":"pic","pic":"homeo"}]}},{"who":"nur","text":"Ichki muhitning doimiyligida organizmning barcha sistemalari birga qatnashadi. Natijada tana harorati, ionlar va gazlar tarkibi, qon bosimi, nafas va yurak urishi tezligi, moddalar almashinuvi doimiy saqlanadi."},{"who":"nur","text":"Gomeostazda regeneratsiya muhim: yashash muddati tugagan yoki shikastlangan hujayra, toʻqima, aʼzolarning qayta tiklanishi. Eskirgan gʻishtni almashtirib turish kabi."},{"board":{"title":"Regeneratsiya","steps":[{"k":"pic","pic":"regen"}]}},{"ask":{"q":"Ali, regeneratsiya nima?","o":["Shikastlangan hujayra va toʻqimalarning tiklanishi","Anabioz","Gastrulyatsiya"],"a":0,"ok":"Qoyil! 👏","no":"Regeneratsiya — hujayra, toʻqima, aʼzolarning qayta tiklanishi."}},{"who":"nur","text":"Baʼzan organizm hayot davom etishi qiyin sharoitga tushadi. Shunda u anabiozga oʻtadi: «ana» — yangi, «bios» — hayot. Moddalar almashinuvi juda sekinlashadi yoki vaqtincha deyarli toʻxtaydi."},{"board":{"title":"Anabioz","steps":[{"k":"pic","pic":"anabioz"}]}},{"who":"nur","text":"Anabioz holatiga misollar: mikroorganizmlar sporalari, oʻsimliklar urugʻlari, hayvonlar tuxumlari. Telefonni «uyqu rejimiga» qoʻygandek: zaryad deyarli sarflanmaydi."},{"board":{"title":"Uchta tushuncha","steps":[{"k":"table","head":["Tushuncha","Maʼnosi"],"rows":[["Gomeo­staz","ichki muhit doimiy"],["Regene­ratsiya","qayta tiklanish"],["Anabioz","hayot sekinlashadi"]],"w":[40,60]}]}},{"ask":{"q":"Ali, anabiozda organizmda nima boʻladi?","o":["Moddalar almashinuvi juda sekinlashadi","Tez oʻsadi","Ikkiga boʻlinadi"],"a":0,"ok":"Barakalla! 🎉","no":"Anabiozda moddalar almashinuvi juda sekinlashadi yoki deyarli toʻxtaydi."}},{"ask":{"q":"Ali, qaysi biri anabiozga misol?","o":["Oʻsimlik urugʻi","Yugurayotgan ot","Oʻsayotgan bola"],"a":0,"ok":"Qoyil! 👏","no":"Sporalar, urugʻlar va tuxumlar anabiozda boʻla oladi."}},{"joke":true}]},{"title":"Embrionlarning oʻxshashlik qonuni","items":[{"who":"nur","text":"Barcha koʻp hujayrali organizmlar bitta zigotadan rivojlanadi. Bir tipga mansub organizmlar murtagining rivojlanishi koʻp jihatdan oʻxshash."},{"who":"nur","text":"Barcha xordalilarning embrional davrida oʻq skelet — xorda shakllanadi, nerv nayi hosil boʻladi, halqumining oldingi qismida jabra yoriqlari paydo boʻladi."},{"who":"nur","text":"Umurtqalilarning dastlabki bosqichlari juda oʻxshash. Bu dalillar K. Ber tomonidan embrionlarning oʻxshashlik qonunida ilgari surilgan."},{"board":{"title":"Embrionlar oʻxshashligi","steps":[{"k":"pic","pic":"embsim"}]}},{"who":"nur","text":"Qonun: «Embrion dastlabki rivojlanish davrida tip uchun umumiy belgilari jihatidan oʻxshash boʻladi.» Turli guruh organizmlar murtagining oʻxshashligi ularning kelib chiqishi bir ekanini isbotlaydi. Bir xil ota-onadan tarqalgan oila shajarasi kabi."},{"who":"nur","text":"Keyinchalik embrional rivojlanishda avval sinf, oila, tur va oxirida shu individga xos belgilar rivojlanadi. Embrion rivojlanishida belgilarning ajralishi — embrional divergensiya."},{"board":{"title":"Divergensiya","steps":[{"k":"pic","pic":"diverg"}]}},{"board":{"title":"Belgilar ketma-ketligi","steps":[{"k":"table","head":["Tartib","Belgilar"],"rows":[["1","tip uchun umumiy"],["2","sinf belgilari"],["3","oila belgilari"],["4","tur va individ"]],"w":[28,72]}]}},{"ask":{"q":"Ali, embrionlarning oʻxshashlik qonunini kim ilgari surgan?","o":["K. Ber","G. Shpeman","E. Gekkel"],"a":0,"ok":"Barakalla! 🎉","no":"Embrionlar oʻxshashlik qonunini K. Ber ilgari surgan."}},{"ask":{"q":"Ali, embrional divergensiya nima?","o":["Belgilarning ajralishi","Belgilarning oʻxshashligi","Hujayralar qoʻshilishi"],"a":0,"ok":"Qoyil! 👏","no":"Embrion rivojlanishida belgilarning ajralishi — embrional divergensiya."}},{"joke":true}]},{"title":"Biogenetik qonun","items":[{"who":"nur","text":"Mutatsiya homila rivojining dastlabki davrida moddalar almashinuviga taʼsir qiluvchi genlarni oʻzgartirsa, bu juda xavfli. Xordaning boshlangʻich kurtagi nerv nayi hosil boʻlishiga taʼsir qiladi, u yoʻqolsa rivojlanish toʻxtaydi."},{"who":"nur","text":"Shuning uchun dastlabki bosqichdagi oʻzgarishlar odatda orqada qolishga yoki nobud boʻlishga olib keladi. Keyingi bosqichdagi oʻzgarishlar esa kam muhim belgilarga taʼsir qilib, foydali belgilarni beradi va tabiiy tanlanishda saralanadi. Uyning poydevorini oʻzgartirish xavfli, eshik rangini oʻzgartirish esa mumkin."},{"ask":{"q":"Ali, nega dastlabki bosqichdagi oʻzgarish xavfli?","o":["Rivojlanish toʻxtashi yoki nobud boʻlish mumkin","Foydali belgi chiqadi","Hech narsa oʻzgarmaydi"],"a":0,"ok":"Qoyil! 👏","no":"Dastlabki oʻzgarishlar odatda orqada qolish yoki nobud boʻlishga olib keladi."}},{"who":"nur","text":"Zamonaviy hayvonlar embrionida ajdodlarga oʻxshash belgilar paydo boʻladi. Organizm rivojida zigota bosqichini oʻtadi, yaʼni amyobasimon bosqichni takrorlaydi."},{"who":"nur","text":"Barcha umurtqalilarda, hatto yuksaklarida ham, avval xorda hosil boʻladi, keyin u umurtqa pogʻonasiga aylanadi. Ularning ajdodida xorda butun umr saqlangan. Qushlar, sutemizuvchilar va odam embrionida halqum atrofida jabra boʻladi."},{"who":"nur","text":"Odam embrionining dastlabki yuragi baliqniki kabi: bitta qorincha, bitta boʻlmacha, bitta qon aylanish doirasi. Tishsiz kitlar embrionida tish paydo boʻladi, lekin milkni yorib chiqmaydi, parchalanib soʻrilib ketadi."},{"board":{"title":"Takrorlanish","steps":[{"k":"pic","pic":"biogen"}]}},{"who":"nur","text":"Bu bogʻliqlikni nemis olimlari Myuller va Gekkel ilgari surgan: biogenetik qonun."},{"who":"nur","text":"Biogenetik qonun: har bir individ oʻzining individual rivojlanishida (ontogenez) oʻz turining tarixiy rivojlanishini (filogenez) qisqacha takrorlaydi. Ontogenez — filogenezning qisqa takrori. Uzun filmning qisqa treyleri kabi."},{"board":{"title":"Biogenetik qonun","steps":[{"k":"table","head":["Embrionda","Ajdod"],"rows":[["Zigota","amyobasimon"],["Xorda","xordali"],["Jabra","baliqsimo
