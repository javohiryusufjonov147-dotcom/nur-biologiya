/* ====== Test ====== */
function startTest(mode){
  clearTimeout(S.flowTimer);
  S.mode = mode;
  S.qs = shuffle(L.questions).slice(0,TEST_SIZE);
  S.qi = 0; S.errors = 0; S.correct = 0;
  S.jokeDeck = shuffle(L.jokes);
  startQ(); show("test");
}
function startQ(){
  var d = S.qs[S.qi], q = {done:false, ok:null, joke:nextJoke()};
  if(d.t==="choice"||d.t==="fill"||d.t==="image"){ q.order = shuffle(d.o.map(function(x,i){return i;})); q.pick = null; }
  if(d.t==="pick2"){ q.order = shuffle(d.o.map(function(x,i){return i;})); q.sel = []; }
  if(d.t==="order"){ q.pool = shuffle(d.items.map(function(t,i){ return {t:t,id:i}; })); q.ans = []; }
  if(d.t==="match"){ q.right = shuffle(d.pairs.map(function(p,i){ return {t:p[1],id:i}; })); q.sel = null; q.doneIds = []; q.mist = 0; q.flash = null; }
  S.q = q;
}
function optBtn(d,q,i,act,isRight,isPicked){
  var cls = "opt";
  if(q.done){ if(isRight) cls += " right"; else if(isPicked) cls += " wrong"; }
  else if(isPicked){ cls += " sel"; }
  return '<button class="'+cls+'" data-act="'+act+'" data-i="'+i+'"'+(q.done?" disabled":"")+'>'+esc(d.o[i])+'</button>';
}
function renderTest(){
  var d = S.qs[S.qi], q = S.q, total = S.qs.length, h = "", i;
  var right = (S.mode==="real"?"":"Mashq · ")+rep("❤️",Math.max(0,MAX_ERRORS-S.errors))+rep("🖤",Math.min(S.errors,MAX_ERRORS));
  h += '<div class="top"><button class="back" data-act="lesson" aria-label="Dars matniga">←</button><div class="bar"><i style="width:'+Math.round(S.qi/total*100)+'%"></i></div><div class="count">'+(S.qi+1)+'/'+total+'</div></div>';
  h += '<div class="soft" style="text-align:right;margin:-6px 0 8px"><span class="hearts">'+right+'</span></div>';
  if(d.t==="choice"){
    h += '<div class="q">'+esc(d.q)+'</div>';
    for(i=0;i<q.order.length;i++){ var oi=q.order[i]; h += optBtn(d,q,oi,"pick1",oi===d.a,q.pick===oi); }
  }
  if(d.t==="fill"){
    h += '<div class="q">Boʻsh joyni toʻldiring</div><div class="card" style="margin-bottom:12px">'+esc(d.q).replace("___","<b>_____</b>")+'</div>';
    for(i=0;i<q.order.length;i++){ var fi=q.order[i]; h += optBtn(d,q,fi,"pick1",fi===d.a,q.pick===fi); }
  }
  if(d.t==="image"){
    h += '<div class="emoji" role="img" aria-label="Rasm">'+d.e+'</div><div class="q">'+esc(d.q)+'</div>';
    for(i=0;i<q.order.length;i++){ var ii=q.order[i]; h += optBtn(d,q,ii,"pick1",ii===d.a,q.pick===ii); }
  }
  if(d.t==="pick2"){
    h += '<div class="q">'+esc(d.q)+'</div><div class="soft" style="margin-bottom:10px">2 tasini tanlang.</div>';
    for(i=0;i<q.order.length;i++){ var pi=q.order[i]; h += optBtn(d,q,pi,"tog",d.a.indexOf(pi)>-1,q.sel.indexOf(pi)>-1); }
    if(!q.done){ h += '<button class="btn" data-act="check2"'+(q.sel.length<2?" disabled":"")+'>Tekshirish</button>'; }
  }
  if(d.t==="order"){
    h += '<div class="q">'+esc(d.q)+'</div><div class="soft">Ketma-ket bosing. Xato tanlasangiz, joylashganini bosib olib tashlang.</div>';
    h += '<div class="slot'+(q.done&&!q.ok?" bad":"")+'" style="margin-top:10px">';
    if(!q.ans.length){ h += '<span class="soft">Javob shu yerda</span>'; }
    for(i=0;i<q.ans.length;i++){ h += '<button class="chip" data-act="odel" data-i="'+i+'"'+(q.done?" disabled":"")+'>'+(i+1)+'. '+esc(q.ans[i].t)+'</button>'; }
    h += '</div><div class="chips">';
    for(i=0;i<q.pool.length;i++){
      var used = q.ans.some(function(a){ return a.id===q.pool[i].id; });
      h += '<button class="chip" data-act="oadd" data-id="'+q.pool[i].id+'"'+((used||q.done)?" disabled":"")+'>'+esc(q.pool[i].t)+'</button>';
    }
    h += '</div>';
    if(!q.done){ h += '<button class="btn" data-act="ocheck"'+(q.ans.length<d.items.length?" disabled":"")+'>Tekshirish</button>'; }
    else if(!q.ok){ h += '<div class="soft">Toʻgʻri tartib: '+d.items.map(function(t,k){return (k+1)+". "+esc(t);}).join(" → ")+'</div>'; }
  }
  if(d.t==="match"){
    h += '<div class="q">'+esc(d.q)+'</div><div class="soft" style="margin-bottom:10px">Avval chapdan, keyin oʻngdan bosing.</div><div class="cols"><div>';
    for(i=0;i<d.pairs.length;i++){
      var c1 = "opt", dn = q.doneIds.indexOf(i)>-1;
      if(dn) c1 += " done"; else if(q.sel===i) c1 += " sel";
      h += '<button class="'+c1+'" data-act="mleft" data-i="'+i+'"'+(dn?" disabled":"")+'>'+esc(d.pairs[i][0])+'</button>';
    }
    h += '</div><div>';
    for(i=0;i<q.right.length;i++){
      var r = q.right[i], c2 = "opt", rd = q.doneIds.indexOf(r.id)>-1;
      if(rd) c2 += " done"; else if(q.flash===r.id) c2 += " flash";
      h += '<button class="'+c2+'" data-act="mright" data-id="'+r.id+'"'+(rd?" disabled":"")+'>'+esc(r.t)+'</button>';
    }
    h += '</div></div>';
  }
  if(q.done){
    if(!q.fbText){ q.fbText = q.ok ? pick(PRAISE) : pick(SCOLD); q.fbStk = q.ok ? pick(PRAISE_STK) : pick(SCOLD_STK); }
    h += '<div class="fb '+(q.ok?"good":"bad")+'" id="fb"><span class="big">'+q.fbStk+'</span> <span class="soft" style="color:var(--ink)">Nur ustoz:</span> '+esc(q.fbText)+'<p>'+esc(d.w)+'</p></div>';
    h += '<div class="fjoke">🧑‍🎓 Ali: '+esc(q.joke)+'</div>';
    var last = S.qi===S.qs.length-1, stop = S.errors>=MAX_ERRORS;
    h += '<div style="height:12px"></div><button class="btn" data-act="next">'+(stop?"Davom etish":last?"Natijani koʻrish":"Keyingisi")+'</button>';
  }
  app.innerHTML = h;
  if(q.done){ var fb=document.getElementById("fb"); if(fb && fb.scrollIntoView){ try{ fb.scrollIntoView({block:"nearest",behavior:"smooth"}); }catch(e){} } }
}
function finish(ok){ var q=S.q; q.done=true; q.ok=ok; if(ok){ S.correct++; } else { S.errors++; } renderTest(); }

/* ====== Natija ====== */
function renderFail(){
  app.innerHTML =
    '<div class="center" style="padding-top:26px"><div class="bigx">🎃</div><h1>5 ta xato!</h1>'+
    '<p><b>Nur ustoz:</b> Koʻp oʻqib keldim deysan, lekin oʻqimagani bilinadi. Darsga qaytamiz!</p>'+
    '<p class="soft">'+(S.mode==="real"?"Dars matnini yana bir bor diqqat bilan koʻrib chiqing. Taymer 5 daqiqadan qayta boshlanadi.":"Mashqda ham 5 ta xatoda toʻxtaymiz. Dars matnini qayta koʻrib chiqing.")+'</p></div>'+
    '<div style="height:14px"></div><button class="btn" data-act="'+(S.mode==="real"?"relearn":"lesson")+'">Dars matniga qaytish</button>';
}
function renderResult(){
  var h = "", pts = S.correct*POINTS_PER_RIGHT;
  if(S.mode==="real"){
    var p = lessonProg(), first = !p.passed, newStk = false;
    if(S.correct>p.best){ p.best = S.correct; }
    p.passed = true; S.prog[L.id] = p; save("nb_prog",S.prog);
    S.points += pts; save("nb_points",S.points);
    if(first){ newStk = true; S.stickers.push({id:L.id, e:L.sticker, name:L.stickerName}); save("nb_stickers",S.stickers); }
    h = '<div class="center" style="padding-top:26px"><div class="bigx">'+(S.errors===0?"🏆":"🎉")+'</div>'+
        '<h1>Dars oʻtildi!</h1><div class="score">'+S.correct+' / '+S.qs.length+'</div>'+
        '<p><b>Nur ustoz:</b> '+(S.errors===0?"Bitta ham xato yoʻq! Mana bu boshqa gap! 🔥":S.errors<=2?"Yaxshi! Kalla ishlayapti, davom et 💪":"Oʻtding, lekin tayyorgarlik yanada kuchli boʻlsin 😏")+'</p>'+
        '<p><b>⭐ +'+pts+' ball</b> reytingga qoʻshildi</p>'+
        (newStk ? '<div class="card" style="margin:14px auto;max-width:300px"><div class="bigx">'+L.sticker+'</div><b>Yangi stiker!</b><div class="soft">'+esc(L.stickerName)+'</div></div>' : '')+
        '</div><div style="height:14px"></div>'+
        (IDX.lessons[L.idx+1] && IDX.lessons[L.idx+1].file ? '<button class="btn" data-act="open" data-i="'+(L.idx+1)+'">Keyingi dars ▶</button><button class="btn ghost" data-act="home">Bosh sahifa</button>' : '<button class="btn" data-act="home">Bosh sahifa</button>')+
        '<button class="btn ghost" data-act="real_again">Testni qayta ishlash</button>'+
        '<button class="btn ghost" data-act="lesson">Dars matni</button>';
  } else {
    h = '<div class="center" style="padding-top:26px"><div class="bigx">💪</div><h1>Mashq tugadi</h1>'+
        '<div class="score">'+S.correct+' / '+S.qs.length+'</div><p class="soft">Mashqda ball berilmaydi. Xohlagancha qayta ishlashingiz mumkin.</p></div>'+
        '<div style="height:14px"></div><button class="btn" data-act="practice">Yana mashq qilish</button>'+
        '<button class="btn ghost" data-act="lesson">Dars matni</button>'+
        '<button class="btn ghost" data-act="home">Bosh sahifa</button>';
  }
  app.innerHTML = h;
}

/* ====== Ekranlar ====== */
function show(screen){
  if(screen!=="lesson") clearTimeout(S.flowTimer);
  S.screen = screen;
  if(screen==="home") renderHome();
  if(screen==="lesson") renderLesson();
  if(screen==="test") renderTest();
  if(screen==="fail") renderFail();
  if(screen==="result") renderResult();
  window.scrollTo(0,0);
}

/* ====== Bosishlar ====== */
app.addEventListener("click", function(e){
  var bd = e.target.closest ? e.target.closest("[data-board]") : null;
  if(bd){ // doskani qayta chizish
    var idx = Array.prototype.indexOf.call(document.querySelectorAll("[data-board]"), bd), n=-1, k;
    for(k=0;k<S.flow.length;k++){ if(S.flow[k].board){ n++; if(n===idx){ var nb=boardHtml(S.flow[k].board,false); bd.outerHTML=nb.html; break; } } }
    return;
  }
  var el = e.target.closest ? e.target.closest("[data-act],#tmWrap,#brand") : null;
  if(!el) return;
  if(el.id==="brand"){           // ustoz uchun: sarlavhani 5 marta bossa hamma darslar ochiladi
    var nw = Date.now();
    S.ttaps = (nw-S.ttapT<3000) ? S.ttaps+1 : 1; S.ttapT = nw;
    if(S.ttaps>=5){ S.allOpen = !S.allOpen; save("nb_allopen",S.allOpen); S.ttaps=0; renderHome(); }
    return;
  }
  if(el.id==="tmWrap"){ if(!NBP.teacher) return;          // ustoz uchun: 3 soniyada 5 marta bossa taymer tugaydi
    var now = Date.now();
    S.taps = (now-S.tapT<3000) ? S.taps+1 : 1; S.tapT = now;
    if(S.taps>=5){ S.left = 0; S.taps = 0; updateTimerUI(); }
    return;
  }
  var act = el.getAttribute("data-act"), d = S.qs[S.qi], q = S.q, i;
  if(act==="home") return nbExit();
  if(act==="open"){ return openLesson(+el.getAttribute("data-i")); }
  if(act==="lesson") return show("lesson");
  if(act==="replay"){ S.readAll = false; S.replay = true; return show("lesson"); }
  if(act==="skip") return revealAll();
  if(act==="say"){ return onSay(+el.getAttribute("data-k")); }
  if(act==="relearn"){ S.left = TIMER_SECONDS; S.readAll = true; coolSet(true); return show("lesson"); }
  if(act==="real"){ if(S.left>0) return; if(NBP.closed) return nbClosedMsg(); return startTest("real"); }
  if(act==="real_again"){ if(S.left>0) return show("lesson"); if(NBP.closed) return nbClosedMsg(); return startTest("real"); }
  if(act==="practice"){ if(coolOn() && S.left>0) return show("lesson"); return startTest("practice"); }
  if(act==="next"){
    if(S.errors>=MAX_ERRORS) return show("fail");
    if(S.qi>=S.qs.length-1) return show("result");
    S.qi++; startQ(); renderTest(); window.scrollTo(0,0); return;
  }
  if(!q || q.done) return;
  if(act==="pick1"){ i=+el.getAttribute("data-i"); q.pick=i; return finish(i===d.a); }
  if(act==="tog"){
    i=+el.getAttribute("data-i"); var at=q.sel.indexOf(i);
    if(at>-1){ q.sel.splice(at,1); } else if(q.sel.length<2){ q.sel.push(i); }
    return renderTest();
  }
  if(act==="check2"){ return finish(q.sel.length===2 && q.sel.every(function(x){ return d.a.indexOf(x)>-1; })); }
  if(act==="oadd"){ var id=+el.getAttribute("data-id"); q.ans.push(q.pool.filter(function(p){return p.id===id;})[0]); return renderTest(); }
  if(act==="odel"){ q.ans.splice(+el.getAttribute("data-i"),1); return renderTest(); }
  if(act==="ocheck"){ return finish(q.ans.every(function(a,k){ return a.id===k; })); }
  if(act==="mleft"){ q.sel=+el.getAttribute("data-i"); q.flash=null; return renderTest(); }
  if(act==="mright"){
    if(q.sel===null) return;
    var rid=+el.getAttribute("data-id");
    if(rid===q.sel){
      q.doneIds.push(rid); q.sel=null; q.flash=null;
      if(q.doneIds.length===d.pairs.length){ return finish(q.mist===0); }
      return renderTest();
    }
    q.mist++; q.flash=rid; renderTest();
    setTimeout(function(){ if(S.q===q && !q.done){ q.flash=null; renderTest(); } }, 600);
    return;
  }
});


/* ====== Nur biologiya sayti bilan ulash (ball, kirish, chiqish) ====== */
var NB = window.NB_DATA;
var NBG = NB.grade;
var NBP = { teacher:false, closed:false, tries:0, passedAny:false, ready:false };
var NBSB = supabase.createClient(NB.url, NB.key);
var nbAct = Date.now();
["pointerdown","touchstart","keydown","scroll","wheel"].forEach(function(ev){ addEventListener(ev,function(){ nbAct = Date.now(); },{passive:true,capture:true}); });
setInterval(function(){
  if(document.visibilityState!=="visible"||!NBP.ready) return;
  if(S.screen!=="lesson" && S.screen!=="test") return;      // faqat dars yoki test paytida
  if(Date.now()-nbAct>120000) return;                         // 2 daqiqa tegilmasa sanamaydi
  NBSB.rpc("add_usage",{p_seconds:30}).then(function(){},function(){});
},30000);
function nbExit(){ location.href = "index.html#darslar" + NBG; }
function nbMsg(title, text, btn){
  app.innerHTML = '<div class="center" style="padding-top:40px"><h1>'+title+'</h1><p class="soft">'+text+'</p></div><div style="height:14px"></div>'+
    (btn||'<button class="btn" data-nb="exit">Darslarga qaytish</button>');
}
function nbFactor(tries){ return Math.max(0, 1 - 0.1*tries); }
function nbNum(x){ return String(Math.round(Number(x||0)*10)/10).replace(".",","); }

/* test boshlanganda yuborilganlik belgisini tozalaymiz */
var _nbStart = startTest;
startTest = function(mode){ S.nbSent = false; return _nbStart(mode); };

/* haqiqiy test natijasini bazaga yuborish */
async function nbSubmit(failed){
  if(S.nbSent) return; S.nbSent = true;
  app.innerHTML = '<div class="center" style="padding-top:60px"><p class="soft">Natija saqlanmoqda…</p></div>';
  var r = await NBSB.rpc("submit_attempt", { p_grade:NBG, p_lesson:L.no, p_correct:S.correct, p_mistakes:S.errors });
  if(r.error){
    S.nbSent = false;
    var m = String(r.error.message||"");
    if(/yopilgan/i.test(m)){ NBP.closed = true; return nbMsg("Test yopilgan 🔒","Bu dars testi 10 marta ishlangan va yopilgan. Ustozga murojaat qiling."); }
    return nbMsg("Natija saqlanmadi","Internet yoki ulanishda muammo. Qayta urinib koʻring.<br><small>"+esc(m)+"</small>",
      '<button class="btn" data-nb="retry">Qayta yuborish</button><button class="btn ghost" data-nb="exit">Darslarga qaytish</button>');
  }
  var pts = Number(r.data||0);
  var first = !failed && !NBP.passedAny;
  var triesBefore = NBP.tries;
  NBP.tries++;
  if(!failed) NBP.passedAny = true;
  if(!NBP.passedAny && NBP.tries>=10) NBP.closed = true;
  if(failed){ coolSet(true); S.left = TIMER_SECONDS; return nbFailScreen(pts); }
  nbPassScreen(pts, first, triesBefore);
}
function nbFailScreen(){
  var left = 10 - NBP.tries;
  var fac = nbFactor(NBP.tries);
  var tail = NBP.closed
    ? '<p><b>Test yopildi 🔒</b> 10 ta urinish tugadi. Ustozga murojaat qiling.</p>'
    : '<p class="soft">Qolgan urinishlar: <b>'+left+'</b>. Keyingi urinishda har toʻgʻri javob <b>'+nbNum(fac)+'</b> ball.</p>';
  app.innerHTML =
    '<div class="center" style="padding-top:26px"><div class="bigx">🎃</div><h1>5 ta xato!</h1>'+
    '<p><b>Nur ustoz:</b> Koʻp oʻqib keldim deysan, lekin oʻqimagani bilinadi. Darsga qaytamiz!</p>'+
    '<p class="soft">Dars matnini yana bir bor diqqat bilan koʻrib chiqing. Taymer 5 daqiqadan qayta boshlanadi.</p>'+tail+'</div>'+
    '<div style="height:14px"></div>'+
    (NBP.closed ? '<button class="btn" data-nb="exit">Darslarga qaytish</button>' : '<button class="btn" data-act="relearn">Dars matniga qaytish</button><button class="btn ghost" data-nb="exit">Darslarga qaytish</button>');
}
function nbPassScreen(pts, first, triesBefore){
  var nxt = IDX.lessons[L.idx+1] && IDX.lessons[L.idx+1].file;
  var ballTxt = pts>0
    ? '<p><b>⭐ +'+nbNum(pts)+' ball</b> reytingga qoʻshildi <span class="soft">('+(triesBefore+1)+'-urinish, har toʻgʻri javob '+nbNum(nbFactor(triesBefore))+' ball)</span></p>'+
      (nbFactor(triesBefore+1)>0?'<p class="soft">Keyingi urinishda har toʻgʻri javob '+nbNum(nbFactor(triesBefore+1))+' ball boʻladi.</p>':'')
    : '<p class="soft">Bu urinishda ball qoʻshilmadi ('+(triesBefore+1)+'-urinish).</p>';
  app.innerHTML = '<div class="center" style="padding-top:26px"><div class="bigx">'+(S.errors===0?"🏆":"🎉")+'</div>'+
    '<h1>Dars oʻtildi!</h1><div class="score">'+S.correct+' / '+S.qs.length+'</div>'+
    '<p><b>Nur ustoz:</b> '+(S.errors===0?"Bitta ham xato yoʻq! Mana bu boshqa gap! 🔥":S.errors<=2?"Yaxshi! Kalla ishlayapti, davom et 💪":"Oʻtding, lekin tayyorgarlik yanada kuchli boʻlsin 😏")+'</p>'+
    ballTxt+
    (first ? '<div class="card" style="margin:14px auto;max-width:300px"><div class="bigx">'+L.sticker+'</div><b>Yangi stiker!</b><div class="soft">'+esc(L.stickerName)+'</div></div>' : '')+
    '</div><div style="height:14px"></div>'+
    (nxt ? '<button class="btn" data-act="open" data-i="'+(L.idx+1)+'">Keyingi dars ▶</button><button class="btn ghost" data-nb="exit">Darslarga qaytish</button>' : '<button class="btn" data-nb="exit">Darslarga qaytish</button>')+
    '<button class="btn ghost" data-act="real_again">Testni qayta ishlash</button>'+
    '<button class="btn ghost" data-act="lesson">Dars matni</button>';
}
function nbPractice(){
  app.innerHTML = '<div class="center" style="padding-top:26px"><div class="bigx">💪</div><h1>Mashq tugadi</h1>'+
    '<div class="score">'+S.correct+' / '+S.qs.length+'</div><p class="soft">Mashqda ball berilmaydi. Xohlagancha qayta ishlashingiz mumkin.</p></div>'+
    '<div style="height:14px"></div><button class="btn" data-act="practice">Yana mashq qilish</button>'+
    '<button class="btn ghost" data-act="lesson">Dars matni</button>'+
    '<button class="btn ghost" data-nb="exit">Darslarga qaytish</button>';
}
function nbPracticeFail(){
  app.innerHTML = '<div class="center" style="padding-top:26px"><div class="bigx">🎃</div><h1>5 ta xato!</h1>'+
    '<p><b>Nur ustoz:</b> Koʻp oʻqib keldim deysan, lekin oʻqimagani bilinadi. Darsga qaytamiz!</p>'+
    '<p class="soft">Mashqda ham 5 ta xatoda toʻxtaymiz. Dars matnini qayta koʻrib chiqing.</p></div>'+
    '<div style="height:14px"></div><button class="btn" data-act="lesson">Dars matniga qaytish</button>';
}
renderResult = function(){ if(S.mode==="real") return nbSubmit(false); return nbPractice(); };
renderFail   = function(){ if(S.mode==="real") return nbSubmit(true);  return nbPracticeFail(); };

function nbClosedMsg(){ nbMsg("Test yopilgan 🔒","Bu dars testi 10 marta ishlangan va yopilgan. Ustozga murojaat qiling.",
  '<button class="btn" data-act="lesson">Dars matniga qaytish</button><button class="btn ghost" data-nb="exit">Darslarga qaytish</button>'); }

app.addEventListener("click", function(e){
  var el = e.target.closest ? e.target.closest("[data-nb]") : null; if(!el) return;
  var a = el.getAttribute("data-nb");
  if(a==="exit") return nbExit();
  if(a==="retry"){ S.nbSent=false; return nbSubmit(S.errors>=MAX_ERRORS); }
});

/* ishga tushirish: kirgan oʻquvchi, dars hashdan olinadi */
(async function(){
  app.innerHTML = '<p class="soft">Yuklanmoqda…</p>';
  try{
    var ss = await NBSB.auth.getSession();
    var ses = ss.data && ss.data.session;
    if(!ses){ location.replace("index.html"); return; }
    var t = await NBSB.rpc("is_teacher"); NBP.teacher = (t.data===true);
    if(!NBP.teacher){
      var me = await NBSB.from("students").select("blocked,paid_until").eq("id",ses.user.id).maybeSingle();
      var md = me.data, td = new Date(Date.now()+5*3600e3).toISOString().slice(0,10);
      if(md && (md.blocked || (md.paid_until && md.paid_until < td))){ location.replace("index.html"); return; }
    }
    IDX = NB.index;
    var id = decodeURIComponent(location.hash.replace(/^#/,"")), i, found = -1;
    for(i=0;i<IDX.lessons.length;i++){ if(IDX.lessons[i].id===id){ found=i; break; } }
    if(found<0){ nbExit(); return; }
    var no = IDX.lessons[found].no;
    var at = await NBSB.from("attempts").select("passed").eq("grade",NBG).eq("lesson",no);
    var rows = at.data||[];
    NBP.tries = rows.length; NBP.passedAny = rows.some(function(r){ return r.passed; });
    NBP.closed = (!NBP.passedAny && NBP.tries>=10);
    NBP.ready = true;
    openLesson(found);
  }catch(err){
    nbMsg("Yuklab boʻlmadi","Internetni tekshirib, sahifani qayta yuklang.");
  }
})();
