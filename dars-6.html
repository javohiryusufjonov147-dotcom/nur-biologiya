<style>
:root{
  --bg:#0E1D1A; --bg2:#122622; --card:#16302B; --ink:#E6F3EE; --soft:#9DB8B0; --line:#2B4A43;
  --accent:#3CC389; --accent-ink:#06231A; --good:#4BD196; --goodbg:#17402F;
  --bad:#FF8B7B; --badbg:#4A2420; --pink:#E56BA6; --gold:#F5C451;
  --cw:#F4F1E8; --cy:#F7E27A; --cg:#A6EBB0; --cp:#F6A9CB; --cb:#A3D6F7;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding:16px 14px 48px}
h1{font-size:28px;line-height:1.15;margin:0 0 4px;font-weight:800}
h2{font-size:21px;margin:30px 0 10px;font-weight:800}
p{margin:0 0 10px}
.soft{color:var(--soft)}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:16px}
.btn{display:block;width:100%;min-height:54px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:800;font-size:17px;padding:12px 16px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn+.btn{margin-top:10px}
.btn:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top.sticky{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;margin-top:-8px}
.back{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;min-width:46px;height:46px;font:inherit;font-weight:800;font-size:20px;cursor:pointer}
.bar{flex:1;height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .3s}
.count{font-weight:800;min-width:48px;text-align:right}
.pill{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.done{border-color:var(--good);color:var(--good)}
.ttl{flex:1;min-width:0;font-weight:800;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:flex;gap:10px;margin:14px 0}
.stat{flex:1;text-align:center;padding:12px 8px}
.stat b{display:block;font-size:24px}
.lcard{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:18px;padding:16px;font:inherit;cursor:pointer;margin-bottom:12px}
.lcard .no{color:var(--accent);font-weight:800;font-size:14px;letter-spacing:.04em}
.lcard b.t{display:block;font-size:22px;margin:2px 0}
.lcard.off{opacity:.55;cursor:default}
.badge{display:inline-block;margin-top:8px;padding:4px 10px;border-radius:999px;background:var(--goodbg);color:var(--good);font-weight:800;font-size:14px}
.stickers{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.stk{width:64px;height:64px;border-radius:18px;background:var(--card);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:36px}

/* ---- suhbat (Telegram uslubi) ---- */
.msg{display:flex;gap:8px;align-items:flex-end;margin:10px 0;animation:pop .25s ease-out}
.msg.ali{flex-direction:row-reverse}
.av{flex:none;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:23px;border:1.5px solid var(--line);background:var(--card)}
.msg.nur .av{background:#1C4436}
.msg.ali .av{background:#1B3D4A}
.bub{max-width:80%;padding:10px 13px;border-radius:18px;background:var(--card);border:1.5px solid var(--line)}
.msg.nur .bub{border-bottom-left-radius:6px}
.msg.ali .bub{background:#1B3D4A;border-color:#2F6075;border-bottom-right-radius:6px}
.msg.joke .bub{background:#3A3417;border-color:#6B5E22}
.who{display:block;font-size:13px;font-weight:800;color:var(--accent);margin-bottom:2px}
.msg.ali .who{color:#8FD3F0}
.msg.joke .who{color:var(--gold)}
.typing{display:inline-flex;gap:4px;padding:4px 2px}
.typing i{width:8px;height:8px;border-radius:50%;background:var(--soft);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.status{font-size:14px;color:var(--soft);margin:8px 2px}
.sec{margin-top:24px;padding:10px 14px;border-radius:12px;background:var(--bg2);border-left:5px solid var(--accent);font-weight:800;font-size:19px;animation:pop .25s ease-out}
#reply{position:fixed;left:0;right:0;bottom:0;z-index:7;background:linear-gradient(to top,var(--bg) 80%,rgba(14,29,26,0));padding:18px 14px calc(14px + env(safe-area-inset-bottom,0px))}
#reply .in{max-width:560px;margin:0 auto}
#reply .lbl{font-size:13px;font-weight:800;color:#8FD3F0;margin:0 4px 6px}
.say{display:flex;align-items:center;gap:10px;width:100%;text-align:left;min-height:54px;margin-top:8px;background:#1B3D4A;color:var(--ink);border:2px solid #2F6075;border-radius:16px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer;animation:pop .2s ease-out}
.say:after{content:"➤";margin-left:auto;color:#8FD3F0}
.say.opt2{background:var(--card);border-color:var(--line)}
.say.opt2:after{content:""}
#chat{padding-bottom:12px}
.chatpad{height:190px}
.msg.nur.fb .bub{border-color:var(--good)}
.msg.nur.fbx .bub{border-color:var(--bad)}
.skip{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:6;box-shadow:0 4px 14px rgba(0,0,0,.5);font-size:15px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:10px 18px;font:inherit;font-weight:800;cursor:pointer}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* ---- bo'r doskasi ---- */
.cb{position:relative;margin:14px 0;padding:16px 14px 30px;border-radius:10px;cursor:pointer;
  background:
    radial-gradient(ellipse at 20% 15%,rgba(255,255,255,.07),transparent 45%),
    radial-gradient(ellipse at 80% 70%,rgba(255,255,255,.05),transparent 50%),
    radial-gradient(ellipse at 55% 40%,rgba(0,0,0,.18),transparent 60%),
    #22402F;
  border:11px solid #7A4E2B;
  box-shadow:inset 0 0 0 2px #5B381D,inset 0 0 30px rgba(0,0,0,.45),0 6px 0 #4C2F17;
  font-family:"Caveat","Comic Sans MS",cursive;color:var(--cw);animation:pop .25s ease-out}
.cb:after{content:"";position:absolute;left:12%;right:12%;bottom:6px;height:10px;border-radius:3px;background:#5B381D;
  box-shadow:inset 0 2px 0 #7A4E2B}
.cb .chalk{position:absolute;bottom:9px;width:22px;height:7px;border-radius:3px;z-index:1}
.cb .tt{font-size:30px;font-weight:700;color:var(--cy);text-align:center;line-height:1.1}
.cb .ul{display:block;width:62%;height:12px;margin:0 auto 8px}
.cb .txt{text-shadow:0 0 1px currentColor,0 0 6px rgba(255,255,255,.12)}
.cb .wd{font-size:30px;font-weight:700;text-align:center;line-height:1.15;margin:4px 0}
.cb .nt{font-size:25px;text-align:center;margin:8px 0 2px;line-height:1.2}
.cb .bg{text-align:center;margin:6px 0}
.cb .bg b{display:block;font-size:52px;line-height:1}
.cb .bg span{font-size:22px;color:var(--cw)}
.cb .row{font-size:23px;line-height:1.2;margin:7px 0}
.cb .row b{font-weight:700}
.cb .arrow{display:block;width:40px;height:44px;margin:0 auto}
.cb .hl{display:block;width:100%;height:14px;margin:6px 0}
.cb svg text{font-family:"Caveat",cursive;font-weight:700}
.cb .split{display:grid;grid-template-columns:minmax(0,1fr) 6px minmax(0,1fr);gap:8px;margin-top:6px;text-align:center}
.cb .split .h{font-size:21px;font-weight:700;line-height:1.1;overflow-wrap:break-word}
.cb .split .m{font-size:21px;line-height:1.15}
.cb .split .s{font-size:18px;line-height:1.15;opacity:.85}
.cb .vline{width:6px;height:100%}
.cb .tl{display:grid;grid-template-columns:28px 1fr;gap:4px 8px;position:relative}
.cb .tl .dot{width:28px;height:28px}
.cb .tl .ln{position:absolute;left:12px;top:14px;height:calc(100% - 40px);width:4px}
.cb .tl .r{font-size:22px;line-height:1.15;padding:2px 0 10px}
.cb .dd{display:grid;grid-template-columns:62px 1fr;gap:8px;align-items:center;margin:6px 0}
.cb .dd svg{width:62px;height:62px}
.cb .dd .r{font-size:22px;line-height:1.12}
.cb .dd .ex{opacity:.85;font-size:20px}
.c-w{color:var(--cw)}.c-y{color:var(--cy)}.c-g{color:var(--cg)}.c-p{color:var(--cp)}.c-b{color:var(--cb)}
.s-w{stroke:var(--cw)}.s-y{stroke:var(--cy)}.s-g{stroke:var(--cg)}.s-p{stroke:var(--cp)}.s-b{stroke:var(--cb)}
.f-w{fill:var(--cw)}.f-y{fill:var(--cy)}.f-g{fill:var(--cg)}.f-p{fill:var(--cp)}.f-b{fill:var(--cb)}
.cb svg path,.cb svg line,.cb svg circle,.cb svg ellipse{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
/* chizish animatsiyasi */
.cb .w{display:block;clip-path:inset(-12px 100% -12px -12px);animation:write var(--t) linear var(--d) forwards}
.cb .f{opacity:0;animation:fade var(--t) ease var(--d) forwards}
.cb .dp{stroke-dasharray:1 1;stroke-dashoffset:1;animation:draw var(--t) ease-in-out var(--d) forwards}
.cb.static .w{animation:none;clip-path:none}
.cb.static .f{animation:none;opacity:1}
.cb.static .dp{animation:none;stroke-dashoffset:0}
.cb .hint{position:absolute;right:10px;top:4px;font-family:"Nunito",sans-serif;font-size:12px;color:rgba(255,255,255,.35)}
@keyframes write{to{clip-path:inset(-12px -12px -12px -12px)}}
@keyframes fade{to{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}

/* ---- test ---- */
.q{font-size:20px;font-weight:800;line-height:1.3;margin:6px 0 14px}
.emoji{font-size:84px;text-align:center;line-height:1.1;margin:4px 0 10px}
.opt{display:block;width:100%;text-align:left;min-height:56px;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;font-weight:700;margin-bottom:10px;cursor:pointer}
.opt.sel{border-color:var(--pink);box-shadow:0 0 0 2px var(--pink) inset}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default}
.fb{margin-top:6px;padding:14px;border-radius:14px;font-weight:800}
.fb.good{background:var(--goodbg)}
.fb.bad{background:var(--badbg)}
.fb p{margin:6px 0 0;font-weight:500}
.fb .big{font-size:34px;line-height:1}
.fjoke{margin-top:10px;padding:12px 14px;border-radius:14px;background:#3A3417;border:1.5px solid #6B5E22;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.chip{min-height:46px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer;text-align:left}
.chip:disabled{opacity:.35}
.slot{min-height:60px;border:2px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.slot .chip{background:var(--goodbg);border-color:var(--good)}
.slot.bad .chip{background:var(--badbg);border-color:var(--bad)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cols .opt{margin:0 0 10px;font-size:15px;min-height:64px}
.cols .opt.done{border-color:var(--good);background:var(--goodbg);opacity:.75}
.cols .opt.flash{border-color:var(--bad);background:var(--badbg)}
.hearts{font-size:18px;letter-spacing:1px;white-space:nowrap}
.center{text-align:center}
.bigx{font-size:64px;line-height:1.1;margin:8px 0}
.score{font-size:52px;font-weight:800;line-height:1;margin:6px 0}
.note{font-size:14px;color:var(--soft);margin-top:14px}
@media (prefers-reduced-motion:reduce){.msg,.sec,.cb{animation:none}}
</style>
</head>

<script>
"use strict";

/* ====== Sozlamalar ====== */
var INDEX_URL = "data/6-index.json";
var TIMER_SECONDS = 300;      // 5 daqiqa
var TEST_SIZE = 15;           // har safar tasodifiy 15 ta savol
var MAX_ERRORS = 5;           // 5 ta xatoda test toʻxtaydi
var POINTS_PER_RIGHT = 10;

/* ====== Yordamchilar ====== */
function shuffle(a){ var r=a.slice(), i, j, t; for(i=r.length-1;i>0;i--){ j=Math.floor(Math.random()*(i+1)); t=r[i]; r[i]=r[j]; r[j]=t; } return r; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function rep(ch,n){ var s="",i; for(i=0;i<n;i++){ s+=ch; } return s; }
function load(key,def){ try{ var v=localStorage.getItem(key); return v===null?def:JSON.parse(v); }catch(e){ return def; } }
function save(key,val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }
function pad(n){ return (n<10?"0":"")+n; }
function fmt(sec){ return pad(Math.floor(sec/60))+":"+pad(sec%60); }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }

function anim(cls,d,t){ return ' class="'+cls+'" style="--d:'+d.toFixed(2)+'s;--t:'+t.toFixed(2)+'s"'; }
function wtime(s){ return clamp(0.25+String(s).length*0.028,0.4,2.2); }   // yozish tezligi
function P(d,col,clk,t){ // bitta chiziq (path)
  var h='<path pathLength="1" d="'+d+'"'+anim("dp s-"+col,clk.t,t)+'/>'; clk.t+=t*0.85; return h;
}
function C(cx,cy,r,col,clk,t){ return P("M"+(cx-r)+" "+cy+" a"+r+" "+r+" 0 1 0 "+(2*r)+" 0 a"+r+" "+r+" 0 1 0 "+(-2*r)+" 0",col,clk,t); }
function TX(x,y,s,col,clk,size,anchor){
  var h='<text x="'+x+'" y="'+y+'" font-size="'+(size||20)+'" text-anchor="'+(anchor||"middle")+'"'+anim("f f-"+col,clk.t,0.35)+' stroke="none">'+esc(s)+'</text>';
  clk.t+=0.3; return h;
}

function nurMsg(t,cls){ return '<div class="msg nur'+(cls?" "+cls:"")+'"><div class="av">👨‍🏫</div><div class="bub"><span class="who">Nur ustoz</span>'+esc(t)+'</div></div>'; }
function aliMsg(t,joke){ return '<div class="msg ali'+(joke?" joke":"")+'"><div class="av">🧑‍🎓</div><div class="bub"><span class="who">Ali (siz)'+(joke?" 😄":"")+'</span>'+esc(t)+'</div></div>'; }
function msgHtml(m){
  if(m.joke){ return aliMsg(m._t||nextJoke(),true); }
  if(m.ask){ return nurMsg(m.ask.q); }
  var ali = m.who==="ali";
  return ali ? aliMsg(m.text) : nurMsg(m.text);
}
function buildFlow(){
  var f=[], i, j;
  for(i=0;i<L.sections.length;i++){
    f.push({sec:(i+1)+". "+L.sections[i].title});
    for(j=0;j<L.sections[i].items.length;j++){ f.push(L.sections[i].items[j]); }
  }
  return f;
}

       '<p class="note">Taymer faqat shu sahifa ochiq turganda sanaydi. Testdan yiqilsangiz, taymer tugamaguncha test ham, mashq ham yopiq. Tugagach «Testga oʻtish» ochiladi. Testda 15 ta savol, 5 ta xato qilsangiz matnga qaytasiz.</p></div>';

  S.flow = buildFlow(); S.fi = 0;

  var seen = S.replay ? 0 : Math.min(load("nb_seen_"+L.id,0), S.flow.length); S.replay = false;

/* ====== Ustoz rejimi: dars toʻliq ochiq, boʻlimlarga oʻtish, savollar banki ====== */

app.addEventListener("click", function(e){
  if(!NBP.teacher) return;
  var t = e.target.closest ? e.target.closest("[data-tsec],[data-tq],[data-ttop],[data-tback]") : null; if(!t) return;
  if(t.hasAttribute("data-tsec")){ var s=document.getElementById("tsec"+t.getAttribute("data-tsec")); if(s){ try{ s.scrollIntoView({behavior:"smooth",block:"start"}); }catch(x){ s.scrollIntoView(); } } return; }
  if(t.hasAttribute("data-ttop")){ var n=document.getElementById("tnav"); if(n){ try{ n.scrollIntoView({behavior:"smooth",block:"start"}); }catch(x){ n.scrollIntoView(); } } return; }

});
function staticItem(it){
  if(it.sec) return '<div class="sec">'+esc(it.sec)+'</div>';
  if(it.board) return boardHtml(it.board,true).html;
  if(it.ask) return nurMsg(it.ask.q)+aliMsg(it.ask.o[it.ask.a])+nurMsg(it.ask.ok,"fb");
  return msgHtml(it);
}
function revealUpTo(n){            // oldin koʻrilgan qismini birdan chiqaramiz, qolgani davom etadi
  var chat=document.getElementById("chat"), h='', i;
  for(i=0;i<n;i++){ h+=staticItem(S.flow[i]); }
  if(chat){ chat.insertAdjacentHTML("beforeend",h); }
  S.fi=n;
}
function seenSave(n){ if(L && L.id && n>load("nb_seen_"+L.id,0)) save("nb_seen_"+L.id,n); }

function toBottom(){ setTimeout(function(){ try{ window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"}); }catch(e){ window.scrollTo(0,document.body.scrollHeight); } },30); }
function nearBottom(){ return (window.innerHeight+window.scrollY) >= document.body.scrollHeight-260; }
function appendNode(html){
  var chat=document.getElementById("chat"); if(!chat) return null;
  var follow=true;
  var box=document.createElement("div"); box.innerHTML=html; var el=box.firstChild;
  chat.appendChild(el);
  if(follow){ toBottom(); }
  return el;
}
function setStatus(html){ var st=document.getElementById("status"); if(st) st.innerHTML=html; }

function flowNext(){
  if(S.screen!=="lesson") return;
  seenSave(S.fi);
  if(S.fi>=S.flow.length){ finishFlow(); return; }
  if(document.visibilityState!=="visible"){ S.flowTimer=setTimeout(flowNext,500); return; }
  var it=S.flow[S.fi];
  if(it.sec){ appendNode('<div class="sec">'+esc(it.sec)+'</div>'); S.fi++; S.flowTimer=setTimeout(flowNext,500); return; }
  if(it.board){
    setStatus('<div class="status">✍️ Nur ustoz doskaga yozmoqda…</div>');
    S.flowTimer=setTimeout(function(){
      var b=boardHtml(it.board,false); setStatus(""); appendNode(b.html); S.fi++;
      S.flowTimer=setTimeout(flowNext, Math.round(b.dur*1000)+500);
    },500);
    return;
  }
  if(it.joke || it.who==="ali"){            // navbat Alida: oʻquvchi tugmani bosadi
    if(it.joke){ it._t = nextJoke(); }
    showReply([{t: it.joke ? it._t : it.text, k:-1}], it.joke ? "Ali boʻlib hazil qiling 😄" : "Siz — Alisiz. Bosib ayting:");
    return;
  }
  var txt = it.ask ? it.ask.q : it.text, wait = clamp(450+txt.length*14,700,1900);
  setStatus('<div class="msg nur"><div class="av">👨‍🏫</div><div class="bub"><span class="typing"><i></i><i></i><i></i></span></div></div>');
  S.flowTimer=setTimeout(function(){
    setStatus(""); appendNode(nurMsg(txt));
    if(it.ask){
      var o = shuffle(it.ask.o.map(function(t,i){ return {t:t,k:i}; }));
      showReply(o, "Ali oʻrnida javob bering:", true);
      return;
    }
    S.fi++; S.flowTimer=setTimeout(flowNext,350);
  }, wait);
}
function showReply(opts,label,isAsk){
  var r=document.getElementById("reply"), ri=document.getElementById("replyIn"), h='<div class="lbl">'+esc(label)+'</div>', i;
  if(!r) return;
  for(i=0;i<opts.length;i++){ h+='<button class="say'+(isAsk?" opt2":"")+'" data-act="say" data-k="'+opts[i].k+'">'+esc(opts[i].t)+'</button>'; }
  ri.innerHTML=h; r.style.display="block";
  toBottom();
}
function hideReply(){ var r=document.getElementById("reply"); if(r){ r.style.display="none"; } }
function onSay(k){
  var it=S.flow[S.fi]; if(!it) return;
  hideReply();
  if(it.ask){
    var ok = k===it.ask.a;
    appendNode(aliMsg(it.ask.o[k]));
    setStatus('<div class="msg nur"><div class="av">👨‍🏫</div><div class="bub"><span class="typing"><i></i><i></i><i></i></span></div></div>');
    S.flowTimer=setTimeout(function(){
      setStatus("");
      appendNode(nurMsg(ok ? it.ask.ok : pick(SCOLD)+" "+it.ask.no, ok?"fb":"fbx"));
      S.fi++; S.flowTimer=setTimeout(flowNext,700);
    },900);
    return;
  }
  appendNode(msgHtml(it)); S.fi++; S.flowTimer=setTimeout(flowNext,450);
}
function revealAll(){
  clearTimeout(S.flowTimer); setStatus("");
  var chat=document.getElementById("chat"), h='', i;
  for(i=S.fi;i<S.flow.length;i++){
    var it=S.flow[i];
    if(it.sec) h+='<div class="sec">'+esc(it.sec)+'</div>';
    else if(it.board) h+=boardHtml(it.board,true).html;
    else if(it.ask) h+=nurMsg(it.ask.q)+aliMsg(it.ask.o[it.ask.a])+nurMsg(it.ask.ok,"fb");
    else h+=msgHtml(it);
  }
  hideReply();
  if(chat){ chat.insertAdjacentHTML("beforeend",h); }
  S.fi=S.flow.length; finishFlow();
}
function finishFlow(){
  S.readAll=true; seenSave(S.flow.length);
  var eb=document.getElementById("endBox"), sk=document.getElementById("skip");
  if(eb) eb.style.display="block"; if(sk) sk.style.display="none";
  var pd=document.getElementById("pad"); if(pd) pd.style.height="0";
  updateTimerUI();
}

function updateTimerUI(){
  var tm = document.getElementById("tm"), btn = document.getElementById("goTest"), wrap = document.getElementById("tmWrap");
  if(tm){ tm.textContent = fmt(S.left); }
  if(S.left<=0 && wrap){ wrap.classList.add("done"); wrap.innerHTML = "✅ Tayyor"; }
  if(!btn) return;
  if(S.left<=0){ btn.disabled = false; btn.textContent = "Testga oʻtish"; }
  else { btn.disabled = true; btn.textContent = "🔒 Testga oʻtish · "+fmt(S.left); }
  var pb = document.getElementById("goPractice");
  if(pb){ var lk = coolOn() && S.left>0; pb.disabled = lk; pb.textContent = lk ? "🔒 Test mashqi · "+fmt(S.left) : "Test mashqini bajarish"; }
}
function coolOn(){ return !!(L && L.id && load("nb_cool_"+L.id,false)); }
function coolSet(v){ if(L && L.id) save("nb_cool_"+L.id, v); }
setInterval(function(){
  if(S.screen!=="lesson" || S.left<=0) return;
  if(document.visibilityState!=="visible") return;   // sahifada boʻlmasa sanamaydi
  S.left--; if(S.left<=0) coolSet(false); updateTimerUI();
}, 1000);

/* ====== Test ====== */
function startTest(mode){
  clearTimeout(S.flowTimer);
  S.mode = mode;
  S.qs = shuffle(L.questions).slice(0,TEST_SIZE);
  S.qi = 0; S.errors = 0; S.correct = 0;
  S.jokeDeck = shuffle(L.jokes);
  startQ(); show("test");
}
function startQ(){
  var d = S.qs[S.qi], q = {done:false, ok:null, joke:nextJoke()};
  if(d.t==="choice"||d.t==="fill"||d.t==="image"){ q.order = shuffle(d.o.map(function(x,i){return i;})); q.pick = null; }
  if(d.t==="pick2"){ q.order = shuffle(d.o.map(function(x,i){return i;})); q.sel = []; }
  if(d.t==="order"){ q.pool = shuffle(d.items.map(function(t,i){ return {t:t,id:i}; })); q.ans = []; }
  if(d.t==="match"){ q.right = shuffle(d.pairs.map(function(p,i){ return {t:p[1],id:i}; })); q.sel = null; q.doneIds = []; q.mist = 0; q.flash = null; }
  S.q = q;
}
function optBtn(d,q,i,act,isRight,isPicked){
  var cls = "opt";
  if(q.done){ if(isRight) cls += " right"; else if(isPicked) cls += " wrong"; }
  else if(isPicked){ cls += " sel"; }
  return '<button class="'+cls+'" data-act="'+act+'" data-i="'+i+'"'+(q.done?" disabled":"")+'>'+esc(d.o[i])+'</button>';
}
function renderTest(){
  var d = S.qs[S.qi], q = S.q, total = S.qs.length, h = "", i;
  var right = S.mode==="real" ? rep("❤️",MAX_ERRORS-S.errors)+rep("🖤",S.errors) : "Mashq";
  h += '<div class="top"><button class="back" data-act="lesson" aria-label="Dars matniga">←</button><div class="bar"><i style="width:'+Math.round(S.qi/total*100)+'%"></i></div><div class="count">'+(S.qi+1)+'/'+total+'</div></div>';
  h += '<div class="soft" style="text-align:right;margin:-6px 0 8px"><span class="hearts">'+right+'</span></div>';
  if(d.t==="choice"){
    h += '<div class="q">'+esc(d.q)+'</div>';
    for(i=0;i<q.order.length;i++){ var oi=q.order[i]; h += optBtn(d,q,oi,"pick1",oi===d.a,q.pick===oi); }
  }
  if(d.t==="fill"){
    h += '<div class="q">Boʻsh joyni toʻldiring</div><div class="card" style="margin-bottom:12px">'+esc(d.q).replace("___","<b>_____</b>")+'</div>';
    for(i=0;i<q.order.length;i++){ var fi=q.order[i]; h += optBtn(d,q,fi,"pick1",fi===d.a,q.pick===fi); }
  }
  if(d.t==="image"){
    h += '<div class="emoji" role="img" aria-label="Rasm">'+d.e+'</div><div class="q">'+esc(d.q)+'</div>';
    for(i=0;i<q.order.length;i++){ var ii=q.order[i]; h += optBtn(d,q,ii,"pick1",ii===d.a,q.pick===ii); }
  }
  if(d.t==="pick2"){
    h += '<div class="q">'+esc(d.q)+'</div><div class="soft" style="margin-bottom:10px">2 tasini tanlang.</div>';
    for(i=0;i<q.order.length;i++){ var pi=q.order[i]; h += optBtn(d,q,pi,"tog",d.a.indexOf(pi)>-1,q.sel.indexOf(pi)>-1); }
    if(!q.done){ h += '<button class="btn" data-act="check2"'+(q.sel.length<2?" disabled":"")+'>Tekshirish</button>'; }
  }
  if(d.t==="order"){
    h += '<div class="q">'+esc(d.q)+'</div><div class="soft">Ketma-ket bosing. Xato tanlasangiz, joylashganini bosib olib tashlang.</div>';
    h += '<div class="slot'+(q.done&&!q.ok?" bad":"")+'" style="margin-top:10px">';
    if(!q.ans.length){ h += '<span class="soft">Javob shu yerda</span>'; }
    for(i=0;i<q.ans.length;i++){ h += '<button class="chip" data-act="odel" data-i="'+i+'"'+(q.done?" disabled":"")+'>'+(i+1)+'. '+esc(q.ans[i].t)+'</button>'; }
    h += '</div><div class="chips">';
    for(i=0;i<q.pool.length;i++){
      var used = q.ans.some(function(a){ return a.id===q.pool[i].id; });
      h += '<button class="chip" data-act="oadd" data-id="'+q.pool[i].id+'"'+((used||q.done)?" disabled":"")+'>'+esc(q.pool[i].t)+'</button>';
    }
    h += '</div>';
    if(!q.done){ h += '<button class="btn" data-act="ocheck"'+(q.ans.length<d.items.length?" disabled":"")+'>Tekshirish</button>'; }
    else if(!q.ok){ h += '<div class="soft">Toʻgʻri tartib: '+d.items.map(function(t,k){return (k+1)+". "+esc(t);}).join(" → ")+'</div>'; }
  }
  if(d.t==="match"){
    h += '<div class="q">'+esc(d.q)+'</div><div class="soft" style="margin-bottom:10px">Avval chapdan, keyin oʻngdan bosing.</div><div class="cols"><div>';
    for(i=0;i<d.pairs.length;i++){
      var c1 = "opt", dn = q.doneIds.indexOf(i)>-1;
      if(dn) c1 += " done"; else if(q.sel===i) c1 += " sel";
      h += '<button class="'+c1+'" data-act="mleft" data-i="'+i+'"'+(dn?" disabled":"")+'>'+esc(d.pairs[i][0])+'</button>';
    }
    h += '</div><div>';
    for(i=0;i<q.right.length;i++){
      var r = q.right[i], c2 = "opt", rd = q.doneIds.indexOf(r.id)>-1;
      if(rd) c2 += " done"; else if(q.flash===r.id) c2 += " flash";
      h += '<button class="'+c2+'" data-act="mright" data-id="'+r.id+'"'+(rd?" disabled":"")+'>'+esc(r.t)+'</button>';
    }
    h += '</div></div>';
  }
  if(q.done){
    if(!q.fbText){ q.fbText = q.ok ? pick(PRAISE) : pick(SCOLD); q.fbStk = q.ok ? pick(PRAISE_STK) : pick(SCOLD_STK); }
    h += '<div class="fb '+(q.ok?"good":"bad")+'" id="fb"><span class="big">'+q.fbStk+'</span> <span class="soft" style="color:var(--ink)">Nur ustoz:</span> '+esc(q.fbText)+'<p>'+esc(d.w)+'</p></div>';
    h += '<div class="fjoke">🧑‍🎓 Ali: '+esc(q.joke)+'</div>';
    var last = S.qi===S.qs.length-1, stop = S.mode==="real" && S.errors>=MAX_ERRORS;
    h += '<div style="height:12px"></div><button class="btn" data-act="next">'+(stop?"Davom etish":last?"Natijani koʻrish":"Keyingisi")+'</button>';
  }
  app.innerHTML = h;
  if(q.done){ var fb=document.getElementById("fb"); if(fb && fb.scrollIntoView){ try{ fb.scrollIntoView({block:"nearest",behavior:"smooth"}); }catch(e){} } }
}
function finish(ok){ var q=S.q; q.done=true; q.ok=ok; if(ok){ S.correct++; } else { S.errors++; } renderTest(); }

/* ====== Natija ====== */
function renderFail(){
  app.innerHTML =
    '<div class="center" style="padding-top:26px"><div class="bigx">🎃</div><h1>5 ta xato!</h1>'+
    '<p><b>Nur ustoz:</b> Koʻp oʻqib keldim deysan, lekin oʻqimagani bilinadi. Darsga qaytamiz!</p>'+
    '<p class="soft">Dars matnini yana bir bor diqqat bilan koʻrib chiqing. Taymer 5 daqiqadan qayta boshlanadi.</p></div>'+
    '<div style="height:14px"></div><button class="btn" data-act="relearn">Dars matniga qaytish</button>';
}
function renderResult(){
  var h = "", pts = S.correct*POINTS_PER_RIGHT;
  if(S.mode==="real"){
    var p = lessonProg(), first = !p.passed, newStk = false;
    if(S.correct>p.best){ p.best = S.correct; }
    p.passed = true; S.prog[L.id] = p; save("nb_prog",S.prog);
    S.points += pts; save("nb_points",S.points);
    if(first){ newStk = true; S.stickers.push({id:L.id, e:L.sticker, name:L.stickerName}); save("nb_stickers",S.stickers); }
    h = '<div class="center" style="padding-top:26px"><div class="bigx">'+(S.errors===0?"🏆":"🎉")+'</div>'+
        '<h1>Dars oʻtildi!</h1><div class="score">'+S.correct+' / '+S.qs.length+'</div>'+
        '<p><b>Nur ustoz:</b> '+(S.errors===0?"Bitta ham xato yoʻq! Mana bu boshqa gap! 🔥":S.errors<=2?"Yaxshi! Kalla ishlayapti, davom et 💪":"Oʻtding, lekin tayyorgarlik yanada kuchli boʻlsin 😏")+'</p>'+
        '<p><b>⭐ +'+pts+' ball</b> reytingga qoʻshildi</p>'+
        (newStk ? '<div class="card" style="margin:14px auto;max-width:300px"><div class="bigx">'+L.sticker+'</div><b>Yangi stiker!</b><div class="soft">'+esc(L.stickerName)+'</div></div>' : '')+
        '</div><div style="height:14px"></div>'+
        (IDX.lessons[L.idx+1] && IDX.lessons[L.idx+1].file ? '<button class="btn" data-act="open" data-i="'+(L.idx+1)+'">Keyingi dars ▶</button><button class="btn ghost" data-act="home">Bosh sahifa</button>' : '<button class="btn" data-act="home">Bosh sahifa</button>')+
        '<button class="btn ghost" data-act="real_again">Testni qayta ishlash</button>'+
        '<button class="btn ghost" data-act="lesson">Dars matni</button>';
  } else {
    h = '<div class="center" style="padding-top:26px"><div class="bigx">💪</div><h1>Mashq tugadi</h1>'+
        '<div class="score">'+S.correct+' / '+S.qs.length+'</div><p class="soft">Mashqda ball berilmaydi. Xohlagancha qayta ishlashingiz mumkin.</p></div>'+
        '<div style="height:14px"></div><button class="btn" data-act="practice">Yana mashq qilish</button>'+
        '<button class="btn ghost" data-act="lesson">Dars matni</button>'+
        '<button class="btn ghost" data-act="home">Bosh sahifa</button>';
  }
  app.innerHTML = h;
}

/* ====== Ekranlar ====== */
function show(screen){
  if(screen!=="lesson") clearTimeout(S.flowTimer);
  S.screen = screen;
  if(screen==="home") renderHome();
  if(screen==="lesson") renderLesson();
  if(screen==="test") renderTest();
  if(screen==="fail") renderFail();
  if(screen==="result") renderResult();
  window.scrollTo(0,0);
}

/* ====== Bosishlar ====== */
app.addEventListener("click", function(e){
  var bd = e.target.closest ? e.target.closest("[data-board]") : null;
  if(bd){ // doskani qayta chizish
    var idx = Array.prototype.indexOf.call(document.querySelectorAll("[data-board]"), bd), n=-1, k;
    for(k=0;k<S.flow.length;k++){ if(S.flow[k].board){ n++; if(n===idx){ var nb=boardHtml(S.flow[k].board,false); bd.outerHTML=nb.html; break; } } }
    return;
  }
  var el = e.target.closest ? e.target.closest("[data-act],#tmWrap,#brand") : null;
  if(!el) return;
  if(el.id==="brand"){           // ustoz uchun: sarlavhani 5 marta bossa hamma darslar ochiladi
    var nw = Date.now();
    S.ttaps = (nw-S.ttapT<3000) ? S.ttaps+1 : 1; S.ttapT = nw;
    if(S.ttaps>=5){ S.allOpen = !S.allOpen; save("nb_allopen",S.allOpen); S.ttaps=0; renderHome(); }
    return;
  }
  if(el.id==="tmWrap"){ if(!NBP.teacher) return;          // ustoz uchun: 3 soniyada 5 marta bossa taymer tugaydi
    var now = Date.now();
    S.taps = (now-S.tapT<3000) ? S.taps+1 : 1; S.tapT = now;
    if(S.taps>=5){ S.left = 0; S.taps = 0; updateTimerUI(); }
    return;
  }
  var act = el.getAttribute("data-act"), d = S.qs[S.qi], q = S.q, i;
  if(act==="home") return nbExit();
  if(act==="open"){ return openLesson(+el.getAttribute("data-i")); }
  if(act==="lesson") return show("lesson");
  if(act==="replay"){ S.readAll = false; S.replay = true; return show("lesson"); }
  if(act==="skip") return revealAll();
  if(act==="say"){ return onSay(+el.getAttribute("data-k")); }
  if(act==="relearn"){ S.left = TIMER_SECONDS; S.readAll = true; coolSet(true); return show("lesson"); }
  if(act==="real"){ if(S.left>0) return; if(NBP.closed) return nbClosedMsg(); return startTest("real"); }
  if(act==="real_again"){ if(S.left>0) return show("lesson"); if(NBP.closed) return nbClosedMsg(); return startTest("real"); }
  if(act==="practice"){ if(coolOn() && S.left>0) return show("lesson"); return startTest("practice"); }
  if(act==="next"){
    if(S.mode==="real" && S.errors>=MAX_ERRORS) return show("fail");
    if(S.qi>=S.qs.length-1) return show("result");
    S.qi++; startQ(); renderTest(); window.scrollTo(0,0); return;
  }
  if(!q || q.done) return;
  if(act==="pick1"){ i=+el.getAttribute("data-i"); q.pick=i; return finish(i===d.a); }
  if(act==="tog"){
    i=+el.getAttribute("data-i"); var at=q.sel.indexOf(i);
    if(at>-1){ q.sel.splice(at,1); } else if(q.sel.length<2){ q.sel.push(i); }
    return renderTest();
  }
  if(act==="check2"){ return finish(q.sel.length===2 && q.sel.every(function(x){ return d.a.indexOf(x)>-1; })); }
  if(act==="oadd"){ var id=+el.getAttribute("data-id"); q.ans.push(q.pool.filter(function(p){return p.id===id;})[0]); return renderTest(); }
  if(act==="odel"){ q.ans.splice(+el.getAttribute("data-i"),1); return renderTest(); }
  if(act==="ocheck"){ return finish(q.ans.every(function(a,k){ return a.id===k; })); }
  if(act==="mleft"){ q.sel=+el.getAttribute("data-i"); q.flash=null; return renderTest(); }
  if(act==="mright"){
    if(q.sel===null) return;
    var rid=+el.getAttribute("data-id");
    if(rid===q.sel){
      q.doneIds.push(rid); q.sel=null; q.flash=null;
      if(q.doneIds.length===d.pairs.length){ return finish(q.mist===0); }
      return renderTest();
    }
    q.mist++; q.flash=rid; renderTest();
    setTimeout(function(){ if(S.q===q && !q.done){ q.flash=null; renderTest(); } }, 600);
    return;
  }
});


/* ====== Nur biologiya sayti bilan ulash (ball, kirish, chiqish) ====== */
var NB = window.NB_DATA;
var NBG = NB.grade;
var NBP = { teacher:false, closed:false, tries:0, passedAny:false, ready:false };
var NBSB = supabase.createClient(NB.url, NB.key);
var nbAct = Date.now();
["pointerdown","touchstart","keydown","scroll","wheel"].forEach(function(ev){ addEventListener(ev,function(){ nbAct = Date.now(); },{passive:true,capture:true}); });
setInterval(function(){
  if(document.visibilityState!=="visible"||!NBP.ready) return;
  if(S.screen!=="lesson" && S.screen!=="test") return;      // faqat dars yoki test paytida
  if(Date.now()-nbAct>120000) return;                         // 2 daqiqa tegilmasa sanamaydi
  NBSB.rpc("add_usage",{p_seconds:30}).then(function(){},function(){});
},30000);
function nbExit(){ location.href = "index.html#darslar" + NBG; }
function nbMsg(title, text, btn){
  app.innerHTML = '<div class="center" style="padding-top:40px"><h1>'+title+'</h1><p class="soft">'+text+'</p></div><div style="height:14px"></div>'+
    (btn||'<button class="btn" data-nb="exit">Darslarga qaytish</button>');
}
function nbFactor(tries){ return Math.max(0, 1 - 0.1*tries); }
function nbNum(x){ return String(Math.round(Number(x||0)*10)/10).replace(".",","); }

/* test boshlanganda yuborilganlik belgisini tozalaymiz */
var _nbStart = startTest;
startTest = function(mode){ S.nbSent = false; return _nbStart(mode); };

/* haqiqiy test natijasini bazaga yuborish */
async function nbSubmit(failed){
  if(S.nbSent) return; S.nbSent = true;
  app.innerHTML = '<div class="center" style="padding-top:60px"><p class="soft">Natija saqlanmoqda…</p></div>';
  var r = await NBSB.rpc("submit_attempt", { p_grade:NBG, p_lesson:L.no, p_correct:S.correct, p_mistakes:S.errors });
  if(r.error){
    S.nbSent = false;
    var m = String(r.error.message||"");
    if(/yopilgan/i.test(m)){ NBP.closed = true; return nbMsg("Test yopilgan 🔒","Bu dars testi 10 marta ishlangan va yopilgan. Ustozga murojaat qiling."); }
    return nbMsg("Natija saqlanmadi","Internet yoki ulanishda muammo. Qayta urinib koʻring.<br><small>"+esc(m)+"</small>",
      '<button class="btn" data-nb="retry">Qayta yuborish</button><button class="btn ghost" data-nb="exit">Darslarga qaytish</button>');
  }
  var pts = Number(r.data||0);
  var first = !failed && !NBP.passedAny;
  var triesBefore = NBP.tries;
  NBP.tries++;
  if(!failed) NBP.passedAny = true;
  if(!NBP.passedAny && NBP.tries>=10) NBP.closed = true;
  if(failed){ coolSet(true); S.left = TIMER_SECONDS; return nbFailScreen(pts); }
  nbPassScreen(pts, first, triesBefore);
}
function nbFailScreen(){
  var left = 10 - NBP.tries;
  var fac = nbFactor(NBP.tries);
  var tail = NBP.closed
    ? '<p><b>Test yopildi 🔒</b> 10 ta urinish tugadi. Ustozga murojaat qiling.</p>'
    : '<p class="soft">Qolgan urinishlar: <b>'+left+'</b>. Keyingi urinishda har toʻgʻri javob <b>'+nbNum(fac)+'</b> ball.</p>';
  app.innerHTML =
    '<div class="center" style="padding-top:26px"><div class="bigx">🎃</div><h1>5 ta xato!</h1>'+
    '<p><b>Nur ustoz:</b> Koʻp oʻqib keldim deysan, lekin oʻqimagani bilinadi. Darsga qaytamiz!</p>'+
    '<p class="soft">Dars matnini yana bir bor diqqat bilan koʻrib chiqing. Taymer 5 daqiqadan qayta boshlanadi.</p>'+tail+'</div>'+
    '<div style="height:14px"></div>'+
    (NBP.closed ? '<button class="btn" data-nb="exit">Darslarga qaytish</button>' : '<button class="btn" data-act="relearn">Dars matniga qaytish</button><button class="btn ghost" data-nb="exit">Darslarga qaytish</button>');
}
function nbPassScreen(pts, first, triesBefore){
  var nxt = IDX.lessons[L.idx+1] && IDX.lessons[L.idx+1].file;
  var ballTxt = pts>0
    ? '<p><b>⭐ +'+nbNum(pts)+' ball</b> reytingga qoʻshildi <span class="soft">('+(triesBefore+1)+'-urinish, har toʻgʻri javob '+nbNum(nbFactor(triesBefore))+' ball)</span></p>'+
      (nbFactor(triesBefore+1)>0?'<p class="soft">Keyingi urinishda har toʻgʻri javob '+nbNum(nbFactor(triesBefore+1))+' ball boʻladi.</p>':'')
    : '<p class="soft">Bu urinishda ball qoʻshilmadi ('+(triesBefore+1)+'-urinish).</p>';
  app.innerHTML = '<div class="center" style="padding-top:26px"><div class="bigx">'+(S.errors===0?"🏆":"🎉")+'</div>'+
    '<h1>Dars oʻtildi!</h1><div class="score">'+S.correct+' / '+S.qs.length+'</div>'+
    '<p><b>Nur ustoz:</b> '+(S.errors===0?"Bitta ham xato yoʻq! Mana bu boshqa gap! 🔥":S.errors<=2?"Yaxshi! Kalla ishlayapti, davom et 💪":"Oʻtding, lekin tayyorgarlik yanada kuchli boʻlsin 😏")+'</p>'+
    ballTxt+
    (first ? '<div class="card" style="margin:14px auto;max-width:300px"><div class="bigx">'+L.sticker+'</div><b>Yangi stiker!</b><div class="soft">'+esc(L.stickerName)+'</div></div>' : '')+
    '</div><div style="height:14px"></div>'+
    (nxt ? '<button class="btn" data-act="open" data-i="'+(L.idx+1)+'">Keyingi dars ▶</button><button class="btn ghost" data-nb="exit">Darslarga qaytish</button>' : '<button class="btn" data-nb="exit">Darslarga qaytish</button>')+
    '<button class="btn ghost" data-act="real_again">Testni qayta ishlash</button>'+
    '<button class="btn ghost" data-act="lesson">Dars matni</button>';
}
function nbPractice(){
  app.innerHTML = '<div class="center" style="padding-top:26px"><div class="bigx">💪</div><h1>Mashq tugadi</h1>'+
    '<div class="score">'+S.correct+' / '+S.qs.length+'</div><p class="soft">Mashqda ball berilmaydi. Xohlagancha qayta ishlashingiz mumkin.</p></div>'+
    '<div style="height:14px"></div><button class="btn" data-act="practice">Yana mashq qilish</button>'+
    '<button class="btn ghost" data-act="lesson">Dars matni</button>'+
    '<button class="btn ghost" data-nb="exit">Darslarga qaytish</button>';
}
function nbPracticeFail(){
  app.innerHTML = '<div class="center" style="padding-top:26px"><div class="bigx">🎃</div><h1>5 ta xato!</h1>'+
    '<p><b>Nur ustoz:</b> Koʻp oʻqib keldim deysan, lekin oʻqimagani bilinadi. Darsga qaytamiz!</p>'+
    '<p class="soft">Mashqda ham 5 ta xatoda toʻxtaymiz. Dars matnini qayta koʻrib chiqing.</p></div>'+
    '<div style="height:14px"></div><button class="btn" data-act="lesson">Dars matniga qaytish</button>';
}
renderResult = function(){ if(S.mode==="real") return nbSubmit(false); return nbPractice(); };
renderFail   = function(){ if(S.mode==="real") return nbSubmit(true);  return nbPracticeFail(); };

function nbClosedMsg(){ nbMsg("Test yopilgan 🔒","Bu dars testi 10 marta ishlangan va yopilgan. Ustozga murojaat qiling.",
  '<button class="btn" data-act="lesson">Dars matniga qaytish</button><button class="btn ghost" data-nb="exit">Darslarga qaytish</button>'); }

app.addEventListener("click", function(e){
  var el = e.target.closest ? e.target.closest("[data-nb]") : null; if(!el) return;
  var a = el.getAttribute("data-nb");
  if(a==="exit") return nbExit();
  if(a==="retry"){ S.nbSent=false; return nbSubmit(S.errors>=MAX_ERRORS); }
});

/* ishga tushirish: kirgan oʻquvchi, dars hashdan olinadi */
(async function(){
  app.innerHTML = '<p class="soft">Yuklanmoqda…</p>';
  try{
    var ss = await NBSB.auth.getSession();
    var ses = ss.data && ss.data.session;
    if(!ses){ location.replace("index.html"); return; }
    var t = await NBSB.rpc("is_teacher"); NBP.teacher = (t.data===true);
    if(!NBP.teacher){
      var me = await NBSB.from("students").select("blocked,paid_until").eq("id",ses.user.id).maybeSingle();
      var md = me.data, td = new Date(Date.now()+5*3600e3).toISOString().slice(0,10);
      if(md && (md.blocked || (md.paid_until && md.paid_until < td))){ location.replace("index.html"); return; }
    }
    IDX = NB.index;
    var id = decodeURIComponent(location.hash.replace(/^#/,"")), i, found = -1;
    for(i=0;i<IDX.lessons.length;i++){ if(IDX.lessons[i].id===id){ found=i; break; } }
    if(found<0){ nbExit(); return; }
    var no = IDX.lessons[found].no;
    var at = await NBSB.from("attempts").select("passed").eq("grade",NBG).eq("lesson",no);
    var rows = at.data||[];
    NBP.tries = rows.length; NBP.passedAny = rows.some(function(r){ return r.passed; });
    NBP.closed = (!NBP.passedAny && NBP.tries>=10);
    NBP.ready = true;
    openLesson(found);
  }catch(err){
    nbMsg("Yuklab boʻlmadi","Internetni tekshirib, sahifani qayta yuklang.");
  }
})();
